<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" /><title>浏览记录</title
  ><link rel="stylesheet" href="popup.css" />
  <body>
    <h1>浏览记录</h1>
    <label><input id="recording" type="checkbox" />记录新访问</label>
    <p id="status" role="status">读取状态…</p>
    <p>今日已确认访问：<strong id="count">0</strong></p>
    <p>待发送观察：<strong id="pending">0</strong></p>
    <button id="retry" type="button">重试保存</button>
    <p class="note">
      时间、标题和脱敏网址仅保存在本机。首次使用需安装本机接收器；未连接时先暂存。暂停不删除已记录内容。
    </p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
