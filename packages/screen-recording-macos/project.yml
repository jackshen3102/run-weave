name: ScreenJournal
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  ScreenJournal:
    type: application
    platform: macOS
    sources:
      - Sources/ScreenJournalApp
      - Sources/ScreenJournalCore
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: ThirdPartyLicenses
        type: folder
        buildPhase: resources
    postBuildScripts:
      - name: Bundle app usage tools
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AppUsageTools"
          mkdir -p "$destination"
          /usr/bin/rsync -a --delete --exclude='__pycache__' --exclude='*.pyc' --exclude='.gitignore' "$SRCROOT/tools/app-usage/" "$destination/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runweave.screen-journal
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenJournal.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScreenJournalInspect:
    type: tool
    platform: macOS
    sources:
      - Sources/ScreenJournalCore
      - Sources/ScreenJournalInspect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runweave.screen-journal.inspect
        GENERATE_INFOPLIST_FILE: YES
  ScreenJournalFixture:
    type: tool
    platform: macOS
    sources:
      - Sources/ScreenJournalCore
      - tools/make-validation-fixture.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ScreenJournalReadVerify:
    type: tool
    platform: macOS
    sources:
      - Sources/ScreenJournalCore
      - tools/verify-read-service.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ScreenJournalAnalysisVerify:
    type: tool
    platform: macOS
    sources:
      - Sources/ScreenJournalCore
      - tools/verify-analysis.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ScreenJournal:
    build:
      targets:
        ScreenJournal: all
        ScreenJournalInspect: all
  ScreenJournalFixture:
    build:
      targets:
        ScreenJournalFixture: all
  ScreenJournalReadVerify:
    build:
      targets:
        ScreenJournalReadVerify: all
  ScreenJournalAnalysisVerify:
    build:
      targets:
        ScreenJournalAnalysisVerify: all
