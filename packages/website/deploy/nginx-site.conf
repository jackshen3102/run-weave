server {
    listen 80;
    server_name runweave.jackshen310.cn;
    location /.well-known/acme-challenge/ { root /var/www/runweave-website-acme; }
    location / { return 301 https://runweave.jackshen310.cn$request_uri; }
}

server {
    listen 443 ssl;
    server_name runweave.jackshen310.cn;
    ssl_certificate /etc/letsencrypt/live/runweave.jackshen310.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runweave.jackshen310.cn/privkey.pem;
    access_log /var/log/nginx/runweave-website.access.log;
    error_log /var/log/nginx/runweave-website.error.log;
    include /etc/nginx/snippets/runweave-website.conf;
}
