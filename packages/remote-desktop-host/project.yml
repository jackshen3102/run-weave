name: RunweaveRemoteHost
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RunweaveRemoteDesktopProtocol:
    path: ../remote-desktop-protocol
targets:
  RunweaveRemoteHost:
    type: application
    platform: macOS
    sources:
      - path: Sources/RunweaveRemoteHost
      - path: Resources/icons/AppIcon.icns
        buildPhase: resources
      - path: ThirdPartyLicenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: RunweaveRemoteDesktopProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.runweave.remote-host
        PRODUCT_NAME: RemoteDesk
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Host.entitlements
schemes:
  RunweaveRemoteHost:
    build:
      targets:
        RunweaveRemoteHost: all
