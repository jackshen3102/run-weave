name: Release standalone NPM server
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      scope:
        description: Packages to release (auto selects only new package versions)
        type: choice
        options: [auto, all, server, cli]
        default: auto
      pty_spike_only:
        description: Verify independent Windows ConPTY lifetime only (never publish)
        type: boolean
        default: false
      windows_only:
        description: Verify Windows only (never publish)
        type: boolean
        default: false
      publish:
        description: Publish verified packages to npm
        type: boolean
        default: false
      channel:
        description: npm distribution channel
        type: choice
        options: [next, latest]
        default: next
      resume_run_id:
        description: Resume registry verification and promotion of an already-published immutable candidate
        type: string
        default: ""
      resume_attempt:
        description: Candidate attempt with successful packaging, validation and publish jobs
        type: string
        default: "1"
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-server-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      server: ${{ steps.plan.outputs.server }}
      full_regression: ${{ steps.plan.outputs.full_regression }}
      matrix: ${{ steps.plan.outputs.matrix }}
      registry_matrix: ${{ steps.plan.outputs.registry_matrix }}
      resume: ${{ steps.resume.outputs.validated || 'false' }}
      source_ref: ${{ steps.resume.outputs.source_ref || github.sha }}
      source_run_id: ${{ steps.resume.outputs.source_run_id || github.run_id }}
      receipt: ${{ steps.resume.outputs.receipt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Validate published candidate recovery provenance
        id: resume
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' }}
        uses: actions/github-script@v7
        env:
          CANDIDATE_RUN_ID: ${{ inputs.resume_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.resume_attempt }}
        with:
          script: |
            const runId = process.env.CANDIDATE_RUN_ID;
            const attempt = process.env.CANDIDATE_ATTEMPT;
            if (!/^[1-9]\d{0,15}$/.test(runId) || !/^[1-9]\d{0,3}$/.test(attempt)) throw new Error('Invalid candidate run or attempt');
            const repository = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...repository, run_id: Number(runId) });
            if (run.status !== 'completed' || run.event !== 'push' || !/^\.github\/workflows\/server-release\.yml(?:@.*)?$/.test(run.path) || run.head_repository.full_name !== `${repository.owner}/${repository.repo}` || !/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Candidate must be a completed release-tag run from this repository');
            const { serverTargets } = await import(require('node:url').pathToFileURL(require('node:path').resolve('scripts/release/server-targets.mjs')).href);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, { ...repository, run_id: Number(runId), attempt_number: Number(attempt), per_page: 100 });
            for (const name of [...serverTargets.map(row => `package (${row.runner}, ${row.target})`), 'validate', 'publish']) {
              if (!jobs.some(job => job.name === name && job.conclusion === 'success')) throw new Error(`Candidate attempt did not pass ${name}`);
            }
            const readFile = require('node:fs').readFileSync;
            const versions = {};
            for (const component of ['server', 'cli']) {
              const path = `packages/runweave-${component}/package.json`;
              const { data: file } = await github.rest.repos.getContent({ ...repository, path, ref: run.head_sha });
              const candidate = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
              versions[component] = candidate.version;
              if (candidate.version !== JSON.parse(readFile(path, 'utf8')).version) throw new Error(`Current ${component} version differs from candidate`);
              if (component === 'server' && run.head_branch !== `server-v${candidate.version}`) throw new Error('Candidate tag and Server version differ');
            }
            const publish = jobs.find(job => job.name === 'publish' && job.conclusion === 'success');
            const { data: rawLog } = await github.rest.actions.downloadJobLogsForWorkflowRun({ ...repository, job_id: publish.id });
            const log = (typeof rawLog === 'string' ? rawLog : Buffer.from(rawLog).toString('utf8')).replace(/^\d{4}-\d{2}-\d{2}T\S+ /gm, '');
            const start = log.lastIndexOf('{\n  "revision":');
            const end = log.indexOf('\n}', start);
            if (start < 0 || end < 0) throw new Error('Published receipt is missing from the successful job log');
            const receipt = JSON.parse(log.slice(start, end + 2));
            const expected = new Map([['@runweave/server', versions.server], ['@runweave/cli', versions.cli], ...serverTargets.map(row => [`@runweave/server-${row.target}`, versions.server])]);
            if (receipt.revision !== run.head_sha || receipt.scope !== 'all' || receipt.packages.length !== expected.size) throw new Error('Published digest manifest does not match candidate');
            for (const pkg of receipt.packages) {
              if (expected.get(pkg.name) !== pkg.version || !/^sha512-[A-Za-z0-9+/]{86}==$/.test(pkg.integrity)) throw new Error('Published package identity or digest is invalid');
              expected.delete(pkg.name);
            }
            if (expected.size) throw new Error('Published receipt is incomplete');
            // The digest manifest is logged before upload; job success proves publication finished.
            receipt.publicationEvidence = { runId: Number(runId), attempt: Number(attempt), jobId: publish.id, conclusion: publish.conclusion };
            core.setOutput('validated', 'true');
            core.setOutput('source_ref', run.head_sha);
            core.setOutput('source_run_id', runId);
            core.setOutput('receipt', JSON.stringify(receipt));
      - name: Select release packages and regression coverage
        id: plan
        env:
          RELEASE_REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_WINDOWS_ONLY: ${{ inputs.windows_only }}
          RELEASE_PTY_SPIKE_ONLY: ${{ inputs.pty_spike_only }}
          RELEASE_RESUME_PUBLISHED: ${{ steps.resume.outputs.validated }}
        run: node scripts/release/server-release-plan.mjs
  package:
    needs: plan
    if: ${{ needs.plan.outputs.resume != 'true' }}
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - name: Check target and release tag
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) throw new Error('Wrong native target');
          const version = JSON.parse(readFileSync('packages/runweave-server/package.json')).version;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `server-v${version}`) throw new Error('Tag and Server version differ');
          JS
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Compile patched Windows PTY native ownership
        if: ${{ runner.os == 'Windows' }}
        run: node scripts/release/windows-native-pty.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ runner.os == 'Windows' }}
        with:
          name: windows-pty-native-${{ matrix.target }}
          path: .runtime-artifacts/windows-pty/native/
          if-no-files-found: error
      - name: Find immutable candidate from an earlier attempt
        if: ${{ !inputs.pty_spike_only }}
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: npm-server-${{ matrix.target }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.ARTIFACT_NAME and .expired == false) | .id')
            if [ -n "$artifact_id" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v4
        if: steps.candidate.outputs.reuse == 'true'
        with:
          name: npm-server-${{ matrix.target }}
          path: .runtime-artifacts/server
      - name: Build distributable
        if: ${{ needs.plan.outputs.server == 'true' && !inputs.pty_spike_only && steps.candidate.outputs.reuse != 'true' }}
        run: pnpm server:build
      - name: Build independent CLI distributable
        if: ${{ needs.plan.outputs.scope == 'cli' && steps.candidate.outputs.reuse != 'true' }}
        run: |
          node scripts/release/build-cli.mjs --out=.runtime-artifacts/server/cli-package
          node .runtime-artifacts/server/cli-package/dist/index.js --version
      - name: Pack immutable candidates
        if: ${{ !inputs.pty_spike_only && steps.candidate.outputs.reuse != 'true' }}
        shell: bash
        env:
          SERVER_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RELEASE_SCOPE" = cli ]; then
            release_packages=(cli-package)
          else
            release_packages=(cli-package "$SERVER_TARGET" package)
          fi
          for package in "${release_packages[@]}"; do
            (cd ".runtime-artifacts/server/$package" && npm pack --pack-destination ..)
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.pty_spike_only && steps.candidate.outputs.reuse != 'true' }}
        with:
          name: npm-server-${{ matrix.target }}
          path: .runtime-artifacts/server/*.tgz
          if-no-files-found: error
      - name: Restore exact candidate bytes for verification
        if: ${{ !inputs.pty_spike_only }}
        run: node scripts/release/restore-server-artifacts.mjs --target=${{ matrix.target }}
      - name: Verify independent Windows PTY Host
        if: ${{ runner.os == 'Windows' && needs.plan.outputs.full_regression == 'true' }}
        timeout-minutes: 5
        run: |
          node scripts/verify/server/pty-host-spike.mjs
          node scripts/verify/server/pty-host.mjs
      - name: Verify exact CLI Browser control protocol and credential boundaries
        if: ${{ matrix.target == 'linux-x64' && !inputs.pty_spike_only }}
        run: node scripts/verify/browser-control/verify.mjs --cli-entry=.runtime-artifacts/server/cli-package/dist/index.js
      - name: Verify installed tarballs and self-update
        if: ${{ needs.plan.outputs.server == 'true' && runner.os != 'Windows' && (needs.plan.outputs.full_regression == 'true' || matrix.target == 'linux-x64' || matrix.target == 'darwin-arm64') }}
        run: pnpm server:verify-installed
      - name: Verify remaining Unix native installation
        if: ${{ needs.plan.outputs.server == 'true' && runner.os != 'Windows' && needs.plan.outputs.full_regression != 'true' && matrix.target != 'linux-x64' && matrix.target != 'darwin-arm64' }}
        run: node scripts/verify/server/registry.mjs --local --smoke
      - name: Verify Linux glibc 2.31 installation and login
        if: ${{ needs.plan.outputs.server == 'true' && runner.os == 'Linux' }}
        run: |
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
            node:22.23.2-bullseye \
            sh -eu -c 'apt-get update -qq && apt-get install -y --no-install-recommends tmux && node scripts/verify/server/registry.mjs --local --smoke'
      - name: Verify published Linux Server 0.1.3 upgrade and task migration
        if: ${{ needs.plan.outputs.server == 'true' && needs.plan.outputs.full_regression == 'true' && matrix.target == 'linux-x64' }}
        run: node scripts/verify/server/registry.mjs --local --upgrade-from=0.1.3
      - name: Verify Windows installation, login and PowerShell terminal
        if: ${{ runner.os == 'Windows' && !inputs.pty_spike_only }}
        timeout-minutes: 10
        run: node scripts/verify/server/registry.mjs --local ${{ needs.plan.outputs.full_regression != 'true' && '--smoke' || '' }}
      - name: Verify Windows explicit v4 to v5 task migration
        if: ${{ runner.os == 'Windows' && needs.plan.outputs.full_regression == 'true' && !inputs.pty_spike_only }}
        timeout-minutes: 3
        run: pnpm scheduled-tasks:verify-runtime --case projectMigration
  verify-windows-cli:
    needs: [plan, package]
    if: ${{ needs.plan.outputs.scope == 'cli' && !inputs.windows_only && !inputs.pty_spike_only }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@v4
        with:
          name: npm-server-linux-x64
          path: release-artifacts
      - name: Verify candidate CLI with existing Windows Server and old terminal identities
        timeout-minutes: 10
        shell: pwsh
        run: |
          $version = (Get-Content packages/runweave-cli/package.json -Raw | ConvertFrom-Json).version
          $candidate = (Resolve-Path "release-artifacts/runweave-cli-$version.tgz").Path
          node scripts/verify/server/registry.mjs "--cli-tarball=$candidate"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  validate:
    if: ${{ always() && needs.plan.result == 'success' && (needs.package.result == 'success' || needs.plan.outputs.resume == 'true') && !inputs.windows_only && !inputs.pty_spike_only }}
    needs: [plan, package]
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.resume != 'true' }}
        with:
          pattern: npm-server-*
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
      - name: Restore exact published bytes from the successful CI receipt
        if: ${{ needs.plan.outputs.resume == 'true' }}
        env:
          PUBLISHED_RECEIPT: ${{ needs.plan.outputs.receipt }}
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { serverTargets } from './scripts/release/server-targets.mjs';
          const receipt = JSON.parse(process.env.PUBLISHED_RECEIPT);
          if (receipt.revision !== execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() || receipt.publicationEvidence?.conclusion !== 'success' || receipt.scope !== 'all') throw new Error('Recovery source differs from completed publication evidence');
          const versions = Object.fromEntries(['server', 'cli'].map(name => [name, JSON.parse(readFileSync(`packages/runweave-${name}/package.json`, 'utf8')).version]));
          const expected = new Map([['@runweave/server', versions.server], ['@runweave/cli', versions.cli], ...serverTargets.map(row => [`@runweave/server-${row.target}`, versions.server])]);
          if (receipt.packages.length !== expected.size) throw new Error('Incomplete published receipt');
          const bytes = new Map();
          for (const pkg of receipt.packages) {
            if (expected.get(pkg.name) !== pkg.version) throw new Error('Unexpected published package');
            expected.delete(pkg.name);
            const metadata = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`, { signal: AbortSignal.timeout(30000) });
            if (!metadata.ok) throw new Error(`Registry metadata failed: ${pkg.name} (${metadata.status})`);
            const info = await metadata.json();
            if (info.name !== pkg.name || info.version !== pkg.version || info.dist.integrity !== pkg.integrity || new URL(info.dist.tarball).origin !== 'https://registry.npmjs.org') throw new Error(`Registry identity or digest differs: ${pkg.name}`);
            const response = await fetch(info.dist.tarball, { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error(`Registry tarball failed: ${pkg.name} (${response.status})`);
            const data = Buffer.from(await response.arrayBuffer());
            if (`sha512-${createHash('sha512').update(data).digest('base64')}` !== pkg.integrity) throw new Error(`Published bytes differ: ${pkg.name}`);
            bytes.set(pkg.name, { file: `${pkg.name.replace('@', '').replace('/', '-')}-${pkg.version}.tgz`, data });
          }
          if (expected.size) throw new Error('Missing published package');
          for (const { target } of serverTargets) {
            const directory = `release-artifacts/npm-server-${target}`;
            mkdirSync(directory, { recursive: true });
            for (const name of ['@runweave/server', '@runweave/cli', `@runweave/server-${target}`]) {
              const pkg = bytes.get(name);
              writeFileSync(`${directory}/${pkg.file}`, pkg.data, { flag: 'wx' });
            }
          }
          console.log(`Restored ${bytes.size} immutable packages at ${receipt.revision}`);
          JS
      - name: Validate complete release without publishing credentials
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts --check
      - uses: actions/upload-artifact@v4
        if: ${{ needs.plan.outputs.resume == 'true' }}
        with:
          name: npm-recovered-candidates
          path: release-artifacts
          if-no-files-found: error
  publish:
    needs: [plan, validate, verify-windows-cli]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.resume != 'true' && needs.validate.result == 'success' && (needs.plan.outputs.scope != 'cli' || needs.verify-windows-cli.result == 'success') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install OIDC-capable npm
        run: npm install -g npm@12.2.1 --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.resume != 'true' }}
        with:
          pattern: npm-server-*
          path: release-artifacts
      - name: Publish with trusted identity and verify registry
        env:
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-receipt
          overwrite: true
          path: release-artifacts/release-receipt.json
          if-no-files-found: ignore
  verify-registry:
    needs: [plan, validate, publish]
    if: ${{ always() && needs.plan.result == 'success' && needs.validate.result == 'success' && (needs.publish.result == 'success' || needs.plan.outputs.resume == 'true') && (github.event_name == 'push' || inputs.publish) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.registry_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install public packages and verify native runtime and login
        timeout-minutes: 10
        run: node scripts/verify/server/registry.mjs --smoke
  promote:
    needs: [plan, verify-registry]
    if: ${{ always() && needs.plan.result == 'success' && needs.verify-registry.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - run: npm install -g npm@12.2.1 --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.resume != 'true' }}
        with:
          pattern: npm-server-*
          path: release-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.source_run_id }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.plan.outputs.resume == 'true' }}
        with:
          name: npm-recovered-candidates
          path: release-artifacts
      - name: Promote verified packages to requested channel
        env:
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts --promote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-final-receipt
          overwrite: true
          path: release-artifacts/release-receipt.json
          if-no-files-found: ignore
