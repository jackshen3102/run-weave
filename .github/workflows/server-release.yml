name: Release standalone NPM server
on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      scope:
        description: Packages to release (auto selects only new package versions)
        type: choice
        options: [auto, all, server, cli]
        default: auto
      pty_spike_only:
        description: Verify independent Windows ConPTY lifetime only (never publish)
        type: boolean
        default: false
      windows_only:
        description: Verify Windows only (never publish)
        type: boolean
        default: false
      publish:
        description: Publish verified packages to npm
        type: boolean
        default: false
      channel:
        description: npm distribution channel
        type: choice
        options: [next, latest]
        default: next
permissions:
  contents: read
concurrency:
  group: npm-server-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      server: ${{ steps.plan.outputs.server }}
      full_regression: ${{ steps.plan.outputs.full_regression }}
      matrix: ${{ steps.plan.outputs.matrix }}
      registry_matrix: ${{ steps.plan.outputs.registry_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Select release packages and regression coverage
        id: plan
        env:
          RELEASE_REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          RELEASE_WINDOWS_ONLY: ${{ inputs.windows_only }}
          RELEASE_PTY_SPIKE_ONLY: ${{ inputs.pty_spike_only }}
        run: node scripts/release/server-release-plan.mjs
  package:
    needs: plan
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm
      - name: Check target and release tag
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) throw new Error('Wrong native target');
          const version = JSON.parse(readFileSync('packages/runweave-server/package.json')).version;
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `server-v${version}`) throw new Error('Tag and Server version differ');
          JS
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build distributable
        if: ${{ needs.plan.outputs.server == 'true' && !inputs.pty_spike_only }}
        run: pnpm server:build
      - name: Build independent CLI distributable
        if: needs.plan.outputs.scope == 'cli'
        run: |
          node scripts/release/build-cli.mjs --out=.runtime-artifacts/server/cli-package
          node .runtime-artifacts/server/cli-package/dist/index.js --version
      - name: Verify independent Windows PTY Host
        if: ${{ runner.os == 'Windows' && needs.plan.outputs.full_regression == 'true' }}
        timeout-minutes: 3
        run: |
          node scripts/verify/server/pty-host-spike.mjs
          node scripts/verify/server/pty-host.mjs
      - name: Verify installed tarballs and self-update
        if: ${{ needs.plan.outputs.server == 'true' && runner.os != 'Windows' && (needs.plan.outputs.full_regression == 'true' || matrix.target == 'linux-x64' || matrix.target == 'darwin-arm64') }}
        run: pnpm server:verify-installed
      - name: Verify remaining Unix native installation
        if: ${{ needs.plan.outputs.server == 'true' && runner.os != 'Windows' && needs.plan.outputs.full_regression != 'true' && matrix.target != 'linux-x64' && matrix.target != 'darwin-arm64' }}
        run: node scripts/verify/server/registry.mjs --local --smoke
      - name: Verify published Linux Server 0.1.3 upgrade and task migration
        if: ${{ needs.plan.outputs.server == 'true' && needs.plan.outputs.full_regression == 'true' && matrix.target == 'linux-x64' }}
        run: node scripts/verify/server/registry.mjs --local --upgrade-from=0.1.3
      - name: Verify Windows installation, login and PowerShell terminal
        if: ${{ runner.os == 'Windows' && !inputs.pty_spike_only }}
        timeout-minutes: 10
        run: node scripts/verify/server/registry.mjs --local ${{ needs.plan.outputs.full_regression != 'true' && '--smoke' || '' }}
      - name: Verify Windows explicit v4 to v5 task migration
        if: ${{ runner.os == 'Windows' && needs.plan.outputs.full_regression == 'true' && !inputs.pty_spike_only }}
        timeout-minutes: 3
        run: pnpm scheduled-tasks:verify-runtime --case projectMigration
      - name: Pack verified packages
        if: ${{ !inputs.pty_spike_only }}
        shell: bash
        env:
          SERVER_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RELEASE_SCOPE" = cli ]; then
            release_packages=(cli-package)
          else
            release_packages=(cli-package "$SERVER_TARGET" package)
          fi
          for package in "${release_packages[@]}"; do
            (cd ".runtime-artifacts/server/$package" && npm pack --pack-destination ..)
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.pty_spike_only }}
        with:
          name: npm-server-${{ matrix.target }}
          path: .runtime-artifacts/server/*.tgz
          if-no-files-found: error
  validate:
    if: ${{ !inputs.windows_only && !inputs.pty_spike_only }}
    needs: [plan, package]
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-server-*
          path: release-artifacts
      - name: Validate complete release without publishing credentials
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts --check
  publish:
    needs: [plan, validate]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install OIDC-capable npm
        run: npm install -g npm@12.2.1 --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-server-*
          path: release-artifacts
      - name: Publish with trusted identity and verify registry
        env:
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-receipt
          overwrite: true
          path: release-artifacts/release-receipt.json
          if-no-files-found: ignore
  verify-registry:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.registry_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install public packages and verify native runtime and login
        timeout-minutes: 10
        run: node scripts/verify/server/registry.mjs --smoke
  promote:
    needs: [plan, verify-registry]
    runs-on: ubuntu-24.04
    environment: npm-release
    env:
      RELEASE_SCOPE: ${{ needs.plan.outputs.scope }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - run: npm install -g npm@12.2.1 --registry=https://registry.npmjs.org/
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-server-*
          path: release-artifacts
      - name: Promote verified packages to requested channel
        env:
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'latest' || inputs.channel }}
        run: node scripts/release/publish-server.mjs --artifacts=release-artifacts --promote
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-final-receipt
          overwrite: true
          path: release-artifacts/release-receipt.json
          if-no-files-found: ignore
