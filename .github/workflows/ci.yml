name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Context Budget
        env:
          HAS_BUDGET_INCREASE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'context-budget-increase') }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$HAS_BUDGET_INCREASE_LABEL" = "true" ]; then
              node ./scripts/quality/context-budget.mjs --compare-git-ref HEAD^1 --allow-increase
            else
              node ./scripts/quality/context-budget.mjs --compare-git-ref HEAD^1
            fi
          else
            pnpm context:budget
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build website preview
        run: pnpm --filter @runweave/website build
