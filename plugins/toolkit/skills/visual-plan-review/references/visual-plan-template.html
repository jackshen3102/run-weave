<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="runweave-visual-plan" content="1"><title>方案评审示例</title>
<style>body{margin:0;background:#f4f5f7;color:#18202e;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:40px 24px}nav{display:flex;flex-wrap:wrap;gap:12px 24px}a{color:#3058b5}section{padding:24px 0;border-bottom:1px solid #ccd2dc}button{padding:10px 18px;border:0;border-radius:8px;background:#244ca3;color:white}.view{padding:24px;background:white;border:1px solid #ccd2dc;border-radius:12px}small{color:#576175}*{box-sizing:border-box}body{overflow-wrap:anywhere}main{min-width:0}h1{font-size:clamp(26px,5vw,32px)}.wide{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:680px;width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border:1px solid #ccd4df}.flow p{min-width:180px}@media(max-width:480px){main{padding:24px 16px}.view{padding:16px}}

<body><main><header id="goal"><small>拟议方案 · 内容需按真实需求替换</small><h1>让用户理解并决定一项改动</h1><p>用一句话写清问题、目标和关键取舍。</p></header><nav><a href="#decision">关键决策</a><a href="#interaction">交互视图</a><a href="#verification">验证依据</a></nav>
<section id="decision"><h2>关键决策</h2><p>按实际源码补充现有入口、拟改路径及边界；无界面变化时删除交互视图。</p></section>
<section id="interaction"><h2>交互视图</h2><p>以下为本地行为 mock，不证明产品已实现。</p><div class="view"><h3 id="item-title">待确认事项</h3><button id="confirm" type="button">确认选择</button><p id="status" role="status">尚未确认</p></div></section>
<section id="verification"><h2>如何验证</h2><p>列出可核查的源码事实、拟议行为与真实验收入口。未知项明确说明。</p></section><p><a href="#goal">返回顶部</a></p></main><script>document.getElementById('confirm').addEventListener('click',function(){document.getElementById('status').textContent='已确认选择';});</script></body></html>
