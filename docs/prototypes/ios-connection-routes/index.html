<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Runweave · 连接线路</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0c;--surface:#1b1c20;--line:#303136;--muted:#96989f;--text:#f4f4f6;--blue:#6aa9ff;--green:#70dba1;--red:#ff827d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:#202226;color:var(--text);font-size:15px;line-height:1.45}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;background:transparent;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.38;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}button svg{pointer-events:none}
    .phone{width:402px;min-height:874px;margin:38px auto;background:var(--bg);border:7px solid #111216;border-radius:53px;box-shadow:0 0 0 1px #4b4d52,0 28px 100px #0008;overflow:hidden;position:relative}.statusbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:4px 27px 0;font-size:15px;font-weight:650;position:relative}.island{position:absolute;width:112px;height:29px;border-radius:30px;background:#000;top:10px;left:50%;transform:translateX(-50%)}.status-icons{display:flex;gap:6px;align-items:center}.status-icons svg{width:17px;height:17px}.battery{width:23px;height:11px;border:1px solid #93949a;border-radius:3px;padding:2px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:3px;height:4px;width:2px;background:#93949a}.battery span{display:block;width:82%;height:100%;background:var(--text);border-radius:1px}
    nav{height:48px;padding:0 12px;display:flex;justify-content:space-between;align-items:center}nav button{display:flex;align-items:center;gap:2px;color:var(--blue);min-height:44px;padding:0 2px;font-size:16px}nav button svg{width:20px}nav span{font-weight:600;font-size:16px}.content{padding:8px 20px 38px;min-height:732px}h1{font-size:29px;letter-spacing:-.9px;margin:3px 0 22px;font-weight:700}h2{font-size:14px;font-weight:400;margin:0;color:var(--muted)}.section-title{display:flex;align-items:center;justify-content:space-between;margin:23px 4px 9px}.section-title button{font-size:14px;color:var(--blue);padding:5px 0}.device{display:flex;align-items:center;gap:14px}.device-icon{width:47px;height:47px;border-radius:13px;background:#2b2c32;display:grid;place-items:center}.device-icon svg{width:29px;height:29px}.device strong{display:block;font-size:18px;letter-spacing:-.3px}.device small{color:var(--muted);font-size:12px}.card{background:var(--surface);border-radius:15px;overflow:hidden}.connection-card{padding:18px}.live-line{display:flex;align-items:center;gap:7px;margin-top:19px;font-size:13px;color:var(--green)}.live-line.offline{color:var(--red)}.live-line.checking{color:var(--blue)}.dot{width:6px;height:6px;background:currentColor;border-radius:50%}.live-line.checking .dot{animation:pulse .8s infinite alternate}.current-line{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:5px}.current-line strong{font-size:21px;font-weight:600;letter-spacing:-.4px}.latency{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.route-url{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.reconnect{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;color:var(--blue);height:46px;margin-top:15px;border-top:1px solid var(--line);padding-top:13px;font-size:14px}.reconnect svg{width:16px;height:16px}.segmented{display:flex;background:#24252a;border-radius:10px;padding:3px;gap:3px}.segmented button{flex:1;border-radius:8px;min-height:35px;font-size:14px;color:#acadb4}.segmented button.selected{background:#54565f;color:white;box-shadow:0 2px 5px #0003;font-weight:600}.footnote{margin:9px 5px 0;color:var(--muted);font-size:12px;line-height:1.65}.route{position:relative;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:14px 13px;gap:10px;min-height:94px}.route:last-of-type{border-bottom:0}.route.active{background:#202a35}.route.dragging{opacity:.45}.route-icon{width:32px;height:36px;display:grid;place-items:center;color:#a8abb4}.route-icon svg{width:21px;height:21px}.route-info{min-width:0;flex:1}.route-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500}.priority{font-size:10px;background:#ffffff0e;color:var(--muted);width:17px;height:17px;display:grid;place-items:center;border-radius:5px;font-weight:400}.route-meta{font-size:11px;margin-top:6px;color:var(--muted)}.route-meta.good{color:var(--green)}.route-meta.bad{color:var(--red)}.route-meta.blue{color:var(--blue)}.route-select{width:32px;height:44px;display:grid;place-items:center;color:var(--blue);padding:0}.radio{width:21px;height:21px;border:1.5px solid #686a72;border-radius:50%}.radio.checked{background:var(--blue);border-color:var(--blue);color:#0b1728;display:grid;place-items:center}.radio svg{width:14px;height:14px;stroke-width:2.5}.more{color:#8c8e97}.more svg{width:18px}.add-route{width:100%;height:49px;color:var(--blue);display:flex;align-items:center;gap:10px;padding:0 17px;border-top:1px solid var(--line);font-size:14px}.add-route svg{width:18px;height:18px}.homebar{width:124px;height:5px;background:#f5f5f7;border-radius:10px;position:absolute;bottom:9px;left:50%;transform:translateX(-50%)}.sort-buttons{display:flex;align-items:center;gap:0}.sort-buttons button{width:30px;height:36px;color:var(--blue);padding:4px}.sort-buttons svg{width:17px;height:17px}.grip{cursor:grab;touch-action:none;color:var(--muted);padding:4px;width:22px;display:grid;place-items:center}.grip svg{width:18px}.notice{margin:10px 4px 0;color:var(--red);font-size:12px}.manager-row{display:flex;align-items:center;gap:12px;padding:17px;width:100%;text-align:left}.manager-row .route-info strong{font-size:16px}.manager-row small{display:block;color:var(--muted);margin-top:5px;font-size:12px}.chevron{color:#72757d;width:18px}
    dialog{position:fixed;inset:auto auto max(16px,calc(100dvh - 905px)) 50%;transform:translateX(-50%);margin:0;width:min(388px,100vw);max-width:none;max-height:90%;background:#17181c;border:0;border-radius:24px 24px 0 0;color:var(--text);padding:0 20px 36px;box-shadow:0 -15px 60px #0008}dialog::backdrop{background:#0008}.sheet-grip{height:5px;width:34px;background:#52545c;border-radius:8px;margin:9px auto 8px}.sheet-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;height:44px}.sheet-nav button{font-size:15px;color:var(--blue);min-height:44px}.sheet-nav strong{font-size:16px}.fields{background:#25262b;border-radius:12px;overflow:hidden}.field{padding:13px 15px;border-bottom:1px solid #383940;display:block}.field:last-child{border-bottom:0}.field span{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}.field input{width:100%;background:transparent;border:0;color:var(--text);padding:0;border-radius:1px;min-height:26px}.field input::placeholder{color:#777a84}.sheet-note{font-size:12px;color:var(--muted);line-height:1.7;margin:13px 4px}.danger-button{width:100%;height:46px;border-radius:11px;background:#292125;color:var(--red);margin-top:12px}.form-error{font-size:13px;color:var(--red);min-height:20px;margin:10px 4px}.sheet-button{width:100%;background:var(--blue);color:#0c1829;min-height:44px;border-radius:10px;font-weight:600}.route-action{width:100%;min-height:46px;background:#292a30;border-radius:10px;margin-top:8px;color:var(--blue)}
    @keyframes pulse{to{opacity:.2}}@media(max-width:480px){body{background:var(--bg)}.phone{width:100%;min-height:100dvh;margin:0;border:0;border-radius:0;box-shadow:none}.content{min-height:calc(100dvh - 100px)}.island{display:none}.statusbar{height:44px;padding-top:0}.homebar{position:fixed;bottom:7px}dialog{position:fixed;bottom:0;width:100%}}
  </style>
</head>
<body>
  <main class="phone" id="phone">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><div class="island"></div><div class="status-icons"><svg viewBox="0 0 24 24"><path d="M3 17v3m5-7v7m5-11v11m5-16v16" stroke-width="3"/></svg><svg viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-8 4a3 3 0 0 1 4 0"/><circle cx="12" cy="20" r=".5"/></svg><div class="battery"><span></span></div></div></div>
    <div id="app"></div><div class="homebar" aria-hidden="true"></div><dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
