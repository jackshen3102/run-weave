, {"id": "phone-record", "kind": "text", "path": "assets/0011-phone-record.json", "label": "手机接入协议记录（无真机）", "origin": {"surface": "自有 Backend HTTP 协议验证 · dvs-691339", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/mobile-protocol.json"}, "text": "{\n  \"environment\": \"dvs-691339\",\n  \"preApprovalExchange\": 202,\n  \"otherOwnerRead\": 404,\n  \"parallelExchangeSessionId\": \"22830e83-c59e-4828-9307-50548a0d1b46\",\n  \"sameSession\": true,\n  \"completed\": \"completed\",\n  \"completedExchange\": 202,\n  \"cancelledExchange\": 409,\n  \"expiredClaim\": 410,\n  \"physicalPhone\": false\n}\n"}, {"id": "coverage-source", "kind": "text", "path": "assets/0012-coverage-source.md", "label": "逐分区功能保留与覆盖原文", "origin": {"surface": "源码核对及实际操作记录", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/README.md"}, "text": "# 桌面全局设置实现核对\n\n2026-10-12，wt-1 的实际实现与临时验收记录；这不是独立原型的模拟结果，也不表示所有领域用例都已通过。长期边界见[全局设置](../../../frontend/docs/global-settings.md)，原型历史清单见[逐页功能保留清单](../../prototypes/global-settings/feature-preservation.md)。\n\n## 本次实现\n\n10 个页面、18 个功能分区均接入现有组件、服务和存储。页面组合放在 `frontend/src/features/settings/pages/`，导航、目标身份及草稿保护分别管理；没有复制原型的假数据和业务状态机。\n\n全局搜索为零。右上角 6 个快捷入口继续使用原 24×24 图标、提示和原交互，“阅读会话”也保留。终端历史、Team 运行、业务页面和 Browser 配置保持原作用域。\n\n## 逐分区保留结果\n\n“源码复用”表示字段、操作、权限和异常分支继续来自原组件，不表示该行的每个状态已经在真实外部环境执行。\n\n| 页面／分区 | 实际内容和 owner | 本轮真实验证及范围 |\n| --- | --- | --- |\n| 外观 | 原 next-themes 和 sidecar store；本台 | 深浅／系统主题、10 工具显隐、排序、最后一项保护（不把依赖终端的 Agent Team 计入保障）、恢复原偏好；真实桌面 |\n| 桌面通知 | 原通知存储键和宿主通知能力；本台 | 与监控页共用偏好，双向修改读回；不伪造系统通知授权成功 |\n| 快捷键 | 原生菜单对应的 18 项只读说明；本台 | 页面可达；File/Edit/View/Window 原位；未增加快捷键编辑 |\n| 连接管理／连接 | ConnectionPage/useConnections；本台 | 添加自有 B、设置选中 B、工作区仍 A；系统连接只读和重连继续源码复用 |\n| 连接管理／SSH 与转发 | 原 TunnelDrawer/HostForm 及共享校验；本台 | 实际保存主机、端口、路径、Backend 入口；revision 冲突保留输入；隐藏 Browser 对象完整保留；已清理测试主机。实际 SSH 连接未执行 |\n| 连接管理／远程接入 | HostForm 内原中转与 RemoteDesk 内容；本台 | 中转表单字段观察；身份准备、证书指纹检查、复制／检测等源码复用；未启动实际中转或远控 |\n| 随记账户 | 原 SuijiConnection/account store；按环境 | 正式／开发切换、草稿继续／放弃；原登录恢复／修改／退出／401／重试分支复用；未使用真实账户登录 |\n| 登录／密码 | 原 ChangePasswordForm 和 auth API；所选电脑 | 原当前／新密码，增加确认，中文主题控件可达；403／401／成功重新登录源码复用；未提交密码修改 |\n| 登录／手机 | 原 useMobileLogin/MobileLoginDialog；所选电脑 | 真实 QR 创建、HTTP claim、设备名、拒绝、离开取消；自有 Backend 协议另验证批准、并发同会话、完成清除凭据、取消及 180 秒过期。没有真机扫码证据 |\n| 资源监控与提醒 | 原 ResourceSettings/controller；所选电脑，本台通知独立 | 提醒开关真实保存／读回／恢复，权限配置不变；本机管理远端控制权限、revision 与部分成功源码复用 |\n| 高级配置／字段 | 原 ConfigurationPanel/service/field states；所选电脑 | 元数据核对 28 字段、5 领域、6 敏感字段；真实保存、消费者采用状态、冲突留稿、重读和空值默认恢复；不扩大允许列表 |\n| 高级配置／默认模型 | 原动态目录／模型 API；所选电脑 | 四角色整组保存与读回、取消不写入、目录搜索、保存中全控件锁定；没有启动付费 Agent Run；既有快照合同不变 |\n| 电脑状态／运行状态 | 原 RuntimeStatusPanel/Provider；所选电脑 | 实际节点健康、失败原因、能力和版本构建；原刷新／复制／展开和导航继续复用 |\n| 电脑状态／系统资源 | 原 SystemMonitorPage/process rows；所选电脑 | 实际 CPU／RAM／电池／进程和排序控件可达；PID 身份、保护原因、结束／强制确认／权限撤销源码复用；未终止用户进程 |\n| 电脑状态／开发资源 | 原 DevResourcesPage/resource list；所选电脑 | 实际池容量／归属／筛选／明细可达；expectedOwnershipVersion、幂等键、释放／停止并释放及未知结果源码复用；未释放其他任务资源 |\n| 电脑状态／Codex 额度 | 原 CodexQuotaProvider；所选电脑 | 真实查询返回额度与重置时间，手动刷新入口；未知／陈旧／失败保留最近成功／401 分支复用 |\n| 电脑状态／日志 | 原 DiagnosticLogEntry/controller；本台 Web＋所选 Backend | 真实开始、结束并保存本台 Backend、返回路径、正文及下载控件；读取中可离开，提交中保护；未向第三方上传 |\n| 本台桌面诊断 | 原 DesktopConfigurationStatus 与窄 bridge；始终本台 | 切 B 仍显示本台身份；真实导出产生诊断包，原生成功提示；重载确认取消。没有宣称实际重启通过 |\n\n## 验证证据\n\n[verification.json](verification.json) 包含结果和边界。新增 DGS-001 至 DGS-007 的 7 项 required 均已在 Electron 候选构建 `dvs-79dc43`（Beta pool-04）执行通过：全窗 20 次页面／尺寸检查、原快捷交互、工作区保活、A/B 隔离、草稿保护、路由恢复和原生 Browser 输入命中。A/B 使用另一个自有 `dvs-691339`（Beta pool-03）；手机 UI 和随记草稿的先前证据来自同一实现过程中的 `dvs-5ba2e1`。没有将旧原型断言算入这些结果。最后补充了「终端条件工具不能计入最后一项保障」的保护，重新构建并在 `dvs-46bbe7`（pool-04）确认实际加载的 bundle 含该条件，重跑 20 次布局检查和该保护／偏好恢复。\n\nBrowser 原生合成窗口观察：设置中的原生点击不会命中测试网页（计数 0）；返回后原 Profile、Tab、URL、偏好和驻留 Tab 数保持，原生点击计数变为 1。见[协议与原生记录](native-browser.json)。\n\n前端构建与 lint、Shared/Electron 类型检查、Electron lint、架构检查通过；循环依赖、违规跨层依赖和超过 600 行文件均为 0。两个 YAML 格式、文档检查、diff 空白检查另在收尾记录。未新增单元测试。\n\n真实 Electron DEV 截图：[最终全屏设置](native-final-settings.png)、[Browser 避让过程](native-settings.png)、[默认模型](final-models.png)、[恢复工作区](native-browser-restored.png)、[浅色主题](final-light.png)、[SSH 冲突](ssh-conflict.png)、[日志保存](final-logs.png)、[开发资源](final-dev-resources.png)。截图不是对应领域全部状态通过的替代证明。\n\n## 尚未执行的领域验收\n\n实际 SSH／中转／RemoteDesk 链路、真实 iPhone 扫码、随记真实账户恢复／登录／退出、密码修改提交、真实进程结束与资源释放，以及已有各领域测试计划的全部 required 矩阵仍未执行。最小依赖分别是执行者可用的 SSH 目标与端口、可用且解锁的 iPhone、测试账户，以及明确属于验收的可处置资源。这些缺口不以保留旧入口或源码复用冒充通过。\n\n未更新 Stable、安装 iOS、创建提交或 PR。已停止成功启动的自有 Session；启动失败的 `dvs-400807` 仍为 stale，CLI 因 Beta 所有权信息不完整拒绝 stop／cleanup-stale。其原自有 App Server PID 已不在运行；没有强制停止恢复后的 pool-02 窗口、删除 lease 或处理其他任务资源。本轮 Dev Session 生命周期清理见[verification.json](verification.json)中的 cleanup。\n"}, {"id": "configuration-summary", "kind": "text", "path": "assets/0013-configuration-summary.txt", "label": "配置、隔离和草稿保护摘要", "origin": {"surface": "原始记录摘要；本次整理未重新执行产品验收", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/verification.json targetedDomainVerification.configuration / saveAndAuthGuards / requiredNavigationCases DGS-004, DGS-005"}, "text": "服务配置：28 个可编辑字段、6 个敏感字段。\n配置领域：services.snapshotPublisher, services.pushSender, services.feishu, scheduledTasks, voice。\n真实保存：revision 11 → 12；消费者 appliedRevision = 12。\n并发修改：UI 冲突提示保留草稿；重读后恢复默认，revision = 14。\n\n目标隔离（DGS-004）：A 的延迟响应不替换 B，重载仅请求 B；工作区和本台诊断仍属于 A。\n草稿保护（DGS-005）：切页面、切电脑、返回均有继续/放弃选择；放弃后 Backend revision 与 digest 不变。\n保存中：模型控件禁用，离开导航被拦截。\n认证：服务配置请求 401 时，所选电脑显示登录入口；工作区 A 不受影响。\n\n范围：没有逐个写入全部 28 字段；没有提交密码修改。\n"}, {"id": "phone-summary", "kind": "text", "path": "assets/0014-phone-summary.txt", "label": "手机接入 UI 与协议摘要", "origin": {"surface": "原始记录摘要；本次整理未重新执行产品验收", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/verification.json targetedDomainVerification.mobileUI / mobileProtocol"}, "text": "真实手机接入 UI（dvs-79dc43）：\n创建二维码 → HTTP claim 200 → 显示测试设备名 → 拒绝 → exchange 409。\n重新生成后离开页面，请求状态为 cancelled。\n\n自有 Backend 协议（dvs-691339）：\n批准前 exchange 202，不返回凭据。\n其他 owner 查询 404。\n批准后并发 exchange 获得同一 session。\n完成后状态 completed，再次 exchange 202，不再返回凭据。\n取消后 exchange 409。\n正常等待 180 秒后，过期 claim 410。\n\n这些是桌面 UI 与 HTTP 协议证据。\n尚无 iPhone 真机扫码、手机 UI 登录及跨端网络证据。\n"}, {"id": "coverage-summary", "kind": "text", "path": "assets/0015-coverage-summary.txt", "label": "全部 18 分区的保留与验证范围", "origin": {"surface": "原始记录摘要；本次整理未重新执行产品验收", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/verification.json README.md 逐分区保留结果"}, "text": "10 页 / 18 分区的逐项记录\n\n01. 外观\n    归属：原 next-themes 和 sidecar store；本台\n    覆盖：深浅／系统主题、10 工具显隐、排序、最后一项保护（不把依赖终端的 Agent Team 计入保障）、恢复原偏好；真实桌面\n\n02. 桌面通知\n    归属：原通知存储键和宿主通知能力；本台\n    覆盖：与监控页共用偏好，双向修改读回；不伪造系统通知授权成功\n\n03. 快捷键\n    归属：原生菜单对应的 18 项只读说明；本台\n    覆盖：页面可达；File/Edit/View/Window 原位；未增加快捷键编辑\n\n04. 连接管理／连接\n    归属：ConnectionPage/useConnections；本台\n    覆盖：添加自有 B、设置选中 B、工作区仍 A；系统连接只读和重连继续源码复用\n\n05. 连接管理／SSH 与转发\n    归属：原 TunnelDrawer/HostForm 及共享校验；本台\n    覆盖：实际保存主机、端口、路径、Backend 入口；revision 冲突保留输入；隐藏 Browser 对象完整保留；已清理测试主机。实际 SSH 连接未执行\n\n06. 连接管理／远程接入\n    归属：HostForm 内原中转与 RemoteDesk 内容；本台\n    覆盖：中转表单字段观察；身份准备、证书指纹检查、复制／检测等源码复用；未启动实际中转或远控\n\n07. 随记账户\n    归属：原 SuijiConnection/account store；按环境\n    覆盖：正式／开发切换、草稿继续／放弃；原登录恢复／修改／退出／401／重试分支复用；未使用真实账户登录\n\n08. 登录／密码\n    归属：原 ChangePasswordForm 和 auth API；所选电脑\n    覆盖：原当前／新密码，增加确认，中文主题控件可达；403／401／成功重新登录源码复用；未提交密码修改\n\n09. 登录／手机\n    归属：原 useMobileLogin/MobileLoginDialog；所选电脑\n    覆盖：真实 QR 创建、HTTP claim、设备名、拒绝、离开取消；自有 Backend 协议另验证批准、并发同会话、完成清除凭据、取消及 180 秒过期。没有真机扫码证据\n\n10. 资源监控与提醒\n    归属：原 ResourceSettings/controller；所选电脑，本台通知独立\n    覆盖：提醒开关真实保存／读回／恢复，权限配置不变；本机管理远端控制权限、revision 与部分成功源码复用\n\n11. 高级配置／字段\n    归属：原 ConfigurationPanel/service/field states；所选电脑\n    覆盖：元数据核对 28 字段、5 领域、6 敏感字段；真实保存、消费者采用状态、冲突留稿、重读和空值默认恢复；不扩大允许列表\n\n12. 高级配置／默认模型\n    归属：原动态目录／模型 API；所选电脑\n    覆盖：四角色整组保存与读回、取消不写入、目录搜索、保存中全控件锁定；没有启动付费 Agent Run；既有快照合同不变\n\n13. 电脑状态／运行状态\n    归属：原 RuntimeStatusPanel/Provider；所选电脑\n    覆盖：实际节点健康、失败原因、能力和版本构建；原刷新／复制／展开和导航继续复用\n\n14. 电脑状态／系统资源\n    归属：原 SystemMonitorPage/process rows；所选电脑\n    覆盖：实际 CPU／RAM／电池／进程和排序控件可达；PID 身份、保护原因、结束／强制确认／权限撤销源码复用；未终止用户进程\n\n15. 电脑状态／开发资源\n    归属：原 DevResourcesPage/resource list；所选电脑\n    覆盖：实际池容量／归属／筛选／明细可达；expectedOwnershipVersion、幂等键、释放／停止并释放及未知结果源码复用；未释放其他任务资源\n\n16. 电脑状态／Codex 额度\n    归属：原 CodexQuotaProvider；所选电脑\n    覆盖：真实查询返回额度与重置时间，手动刷新入口；未知／陈旧／失败保留最近成功／401 分支复用\n\n17. 电脑状态／日志\n    归属：原 DiagnosticLogEntry/controller；本台 Web＋所选 Backend\n    覆盖：真实开始、结束并保存本台 Backend、返回路径、正文及下载控件；读取中可离开，提交中保护；未向第三方上传\n\n18. 本台桌面诊断\n    归属：原 DesktopConfigurationStatus 与窄 bridge；始终本台\n    覆盖：切 B 仍显示本台身份；真实导出产生诊断包，原生成功提示；重载确认取消。没有宣称实际重启通过\n\n“源码复用”不表示所有字段、权限与异常分支已完成真实环境验证。\n"}, {"id": "result-summary", "kind": "text", "path": "assets/0016-result-summary.txt", "label": "通过项、缺口与环境边界", "origin": {"surface": "原始记录摘要；本次整理未重新执行产品验收", "capturedAt": null, "sourceRef": "docs/review/desktop-global-settings/verification.json requiredNavigationCases / checks / notExecuted / cleanup / appearanceFollowupLayout"}, "text": "新增导航验收 DGS-001 至 DGS-007：7 项执行通过，0 项失败。\n001 全窗布局：10 页 × 2 尺寸；最后修改后重跑 20 次，无侧栏搜索和横向溢出。\n002 快捷入口：6 个 24×24 原图标及原交互；保留“阅读会话”。\n003 工作区保活：同一终端 DOM、会话、未发送输入；后台输出持续。\n004 目标隔离：所选电脑 B 与工作区 A 独立，迟到响应被隔离。\n005 草稿保护：切页、切电脑、返回保护；放弃不写入。\n006 路由恢复：直接访问、刷新、未知页回退、前进后退、返回终端。\n007 原生 Browser：设置页点击计数 0；返回后计数 1；原 Profile / Tab / URL / 偏好保留。\n\n构建、lint、Shared/Electron 类型检查、架构检查、测试计划格式、文档和 diff 空白检查已通过。\n\n尚未执行：\n实际 SSH / 中转 / RemoteDesk；真实 iPhone 扫码；真实随记账户登录退出；\n密码修改提交；真实进程结束及资源释放；所有已有领域计划的完整 required 矩阵。\n\n环境边界：本地 Electron Beta 的未提交候选工作树；不是 Stable 发布或 iOS 安装验收。\n成功启动的自有 Session 已停止；启动失败的 dvs-400807 仍 stale，所有权校验拒绝清理，未强杀恢复的池窗口。\n\n本报告由 2026-10-12 的本次任务记录整理；不是新的操作录像或实时服务状态。\n"}], "pages": [{"id": "full-screen", "type": "single", "title": "设置页已占满应用内容区", "description": "最终候选构建显示左侧分类、左上返回工作区和右侧独立内容。10 页在两种尺寸下均检查全窗覆盖，侧栏没有搜索框。原生标题栏保留。", "evidenceState": "observed", "items": [{"assetId": "full-window", "label": "最终原生窗口 · Beta 0.241.0", "alt": "最终原生窗口 · Beta 0.241.0"}], "sourceIds": ["verification"], "lookAt": "左上返回、左侧 10 个分类，以及内容区边缘。"}, {"id"
