<style>

x;border-radius:11px;margin-bottom:14px}.notice p{font-size:12px;color:#d9c6a8;line-height:1.5;margin:5px 0 0}.notice strong{font-size:14px}.notice .text-button{min-height:30px;font-size:12px;color:var(--warn);padding:0}.permission{background:#18242d;border-color:#314658}.permission p{color:#aec5d4}.list-row{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:15px 13px;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.app-icon{width:37px;height:37px;border-radius:9px;display:grid;place-items:center;font-size:17px;font-weight:700;flex-shrink:0}.app-info{min-width:0;flex:1}.app-title{font-size:15px;font-weight:600;overflow-wrap:anywhere}.app-meta{font-size:11px;color:var(--muted);line-height:1.7;margin-top:4px}.score{text-align:right;min-width:55px;font-size:20px;font-variant-numeric:tabular-nums}.score .caption{font-size:10px}.chevron{color:#798594}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin:12px 4px}.process{padding:15px;border-bottom:1px solid var(--line)}.process:last-child{border:0}.process .app-title{font-size:14px}.process .flex{align-items:flex-start}.process-action{font-size:13px;border:1px solid #784951;background:#38232a;border-radius:8px;color:var(--danger);padding:0 12px;min-height:36px;white-space:nowrap}.pill{font-size:11px;border-radius:5px;background:#2a3441;color:#b9c5d3;padding:5px 7px}.success{color:#81d9a2;font-size:12px}.danger{color:var(--danger)}.setting{padding:15px;display:flex;gap:12px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.switch{appearance:none;width:46px;height:28px;border-radius:20px;flex-shrink:0;background:#434a53;position:relative;cursor:pointer}.switch:before{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;border-radius:50%;background:white}.switch:checked{background:#52b6ca}.switch:checked:before{transform:translateX(18px)}.wide{width:100%;min-height:46px;border-radius:10px;background:var(--accent);color:#10242c;font-weight:600}.secondary{background:#303843;color:var(--text)}.menu{position:absolute;right:13px;top:96px;width:204px;z-index:4;box-shadow:0 12px 40px #0008}.menu button{display:block;width:100%;padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}.menu button:last-child{border:0}.search{border:1px solid var(--line);border-radius:10px;background:#202630;color:var(--text);padding:12px;width:100%;margin:14px 0}.project-row{padding:15px;font-size:14px;border-bottom:1px solid var(--line)}.project-row strong{display:block;margin-bottom:6px}.project-row:last-child{border:0}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.dialog{width:100%;max-width:350px;background:#252b35;border:1px solid #45505d;border-radius:17px;overflow:hidden;box-shadow:0 20px 80px #0008}.dialog-body{padding:24px 21px 20px}.dialog h2{font-size:18px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.7;color:#c5ced9;margin:9px 0}.dialog .identity{background:#1b2028;border-radius:8px;padding:12px;font-size:12px;line-height:1.7}.dialog-buttons{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #45505d}.dialog-buttons button{min-height:50px;border-right:1px solid #45505d;color:var(--accent);font-weight:600}.dialog-buttons button:last-child{border:0}.dialog-buttons button.danger{color:var(--danger)}.toast{margin:12px 0;font-size:12px;color:#81d9a2;line-height:1.6}.empty{text-align:center;padding:32px 20px;color:var(--muted);line-height:1.7}.desktop#app{max-width:1050px;min-height:100vh}.desktop .statusbar{display:none}.desktop .content{max-width:780px;margin:auto;padding:32px}.desktop .nav{grid-template-columns:120px 1fr 120px}.desktop .dialog{max-width:450px}.desktop .setting{padding:18px}.desktop h2{font-size:20px}body:has(.desktop){background:#11151c}@media(min-width:600px){#app:not(.desktop){margin:26px auto;min-height:844px;border:1px solid #344050;border-radius:26px;overflow:hidden;box-shadow:0 25px 90px #0005}.nav{top:0}}
