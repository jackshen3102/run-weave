kground:#1a2739;border-radius:6px}.actions{margin-left:auto;display:flex;gap:8px}.tabs{height:36px;border-bottom:1px solid #293447;display:flex;color:#8a98ae}.tab{padding:9px 22px}.tab.active{color:#d9e6f7;border-bottom:2px solid #45b8cf}.workspace{display:grid;grid-template-columns:1.1fr 1fr;height:calc(100vh - 109px)}.terminal{padding:29px 25px;font:13px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;border-right:1px solid #293447;color:#bac4d3}.terminal .path{color:#84b88c}.terminal .faint{color:#566378}.prompt{border:1px solid #31415a;border-radius:7px;padding:12px;margin-top:36px;color:#8898ad}.preview{background:#0e1521}.preview-tabs{padding:13px 20px;border-bottom:1px solid #293447;color:#7f8da3;word-spacing:15px}.preview-tabs strong{color:#d6e3f3}.address{border:1px solid #2c394d;margin:14px;border-radius:7px;padding:9px;color:#8797ad;font-size:12px}.empty-preview{display:grid;place-items:center;height:55%;color:#536076}.menu{position:absolute;right:12px;top:72px;width:238px;padding:6px;background:#212832;border:1px solid #3a424d;border-radius:9px;box-shadow:0 16px 48px #0007;z-index:10}.menu button{display:flex;align-items:center;gap:13px;width:100%;padding:10px;text-align:left}.menu hr{border:0;border-top:1px solid #38404c;margin:5px}.menu .badge{font-size:10px;color:#9aa9bc;margin-left:auto}.scrim{position:fixed;inset:33px 0 0;background:#0005;z-index:19}.drawer{position:fixed;right:0;top:33px;bottom:0;width:min(610px,100vw);background:#181f29;border-left:1px solid #3b4450;box-shadow:-15px 0 65px #0005;z-index:20;display:flex;flex-direction:column}.drawer-head{padding:24px 25px 19px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;color:#8a9bad;margin-bottom:9px;letter-spacing:1px}.drawer-body{padding:22px 25px;overflow:auto;flex:1}.intro{margin-bottom:20px}.intro p{font-size:12px;margin-top:6px;color:var(--muted)}.host{border:1px solid #35404d;border-radius:9px;background:#1c2530;margin-bottom:15px;overflow:hidden}.host-head{padding:17px;disp rder-radius:50%;background:#70baa5;margin-top:4px}.form{display:grid;gap:19px}.form label{display:grid;gap:8px;font-size:12px;color:#b8c6d7}.form label.check{display:flex;align-items:center;gap:8px}.hint{font-size:11px;color:var(--muted);line-height:1.7}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:5px}.notice{padding:11px 12px;background:#31272c;border:1px solid #5e424c;color:#f6b4b4;border-radius:6px;font-size:12px;line-height:1.7;margin-top:10px}.delete-bar{margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}.empty{padding:50px 20px;text-align:center;line-height:2;color:var(--muted)}.toast{position:fixed;bottom:24px;left:24px;background:#24323d;border:1px solid #44606d;padding:13px 18px;border-radius:8px;box-shadow:0 8px 30px #0005;z-index:30;max-width:480px}.toast button{color:#9adeeb;margin-left:15px}.field-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.workspace{grid-template-columns:1fr}.preview{display:none}.project.secondary{display:none}.drawer-head{padding:20px}.drawer-body{padding:20px}.drawer{top:0}.port-route{font-size:11px}}
