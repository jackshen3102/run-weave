<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>工作记录 · 随记</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #edf0ef;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .launcher {
        position: fixed;
        right: 24px;
        top: 20px;
        background: #fff;
        border: 1px solid #dfe5e2;
        border-radius: 9px;
        padding: 10px 18px;
        color: #087b60;
      }
      .backdrop {
        position: fixed;
        inset: 0;
        background: #00000030;
        border: 0;
        width: 100%;
        height: 100%;
        padding: 0;
      }
      .drawer {
        position: fixed;
        inset: 0 0 0 auto;
        width: 480px;
        max-width: 100%;
        height: 100dvh;
        background: #f3f6f5;
        border-left: 1px solid #dfe5e2;
        box-shadow: -12px 0 42px #142b2020;
      }
      .drawer iframe {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
        background: #f3f6f5;
      }
      body[data-open="true"] .launcher {
        visibility: hidden;
      }
      body[data-open="false"] .backdrop {
        display: none;
      }
      body[data-open="false"] .drawer {
        visibility: hidden;
        pointer-events: none;
      }
      @media (max-width: 680px) {
        .drawer {
          width: 100%;
          border: 0;
          box-shadow: none;
        }
        .backdrop,
        .launcher {
          display: none;
        }
      }
    </style>
  </head>
  <body data-open="true">
    <button class="launcher" id="open-suiji">随记</button>
    <button
      class="backdrop"
      id="drawer-backdrop"
      aria-label="关闭随记抽屉"
      tabindex="-1"
    ></button>
    <section
      class="drawer"
      id="suiji-drawer"
      role="dialog"
      aria-modal="true"
      aria-label="随记抽屉"
    >
      <iframe id="suiji-content" title="随记内容"></iframe>
    </section>
    <script>
      const frame = document.querySelector("#suiji-content");
      const drawer = document.querySelector("#suiji-drawer");
      const desktop = window.matchMedia("(min-width:681px)");
      function hostState() {
        frame.contentWindow?.postMessage(
          { type: "suiji-prototype-host", desktop: desktop.matches },
          "*",
        );
      }
      function setOpen(open) {
        document.body.dataset.open = String(open);
        frame.inert = !open;
        drawer.setAttribute("aria-hidden", String(!open));
        if (open) frame.focus();
        else document.querySelector("#open-suiji").focus();
      }
      frame.addEventListener("load", hostState);
      frame.src = "content.html" + window.location.search;
      document
        .querySelector("#open-suiji")
        .addEventListener("click", () => setOpen(true));
      document
        .querySelector("#drawer-backdrop")
        .addEventListener("click", () => setOpen(false));
      window.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && desktop.matches) setOpen(false);
      });
      window.addEventListener("message", (event) => {
        if (
          event.source === frame.contentWindow &&
          event.data?.type === "suiji-prototype-close" &&
          desktop.matches
        )
          setOpen(false);
      });
      desktop.addEventListener("change", () => {
        if (!desktop.matches) setOpen(true);
        hostState();
      });
    </script>
  </body>
</html>
