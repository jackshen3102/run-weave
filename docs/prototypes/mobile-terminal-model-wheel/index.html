<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runweave · 当前手机终端模型切换</title>
<style>
:root{color-scheme:dark;--bg:#080b0d;--sheet:#101417;--card:#20282c;--line:#3e4a4f;--text:#f1f3f4;--muted:#949ca2;--accent:#a5d9c9;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}body{margin:0;background:#202428;color:var(--text)}button,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}.phone{position:relative;width:min(100vw,430px);height:100dvh;min-height:780px;margin:auto;overflow:hidden;background:#050708}.status{height:55px;padding:17px 25px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.terminal-behind{padding:8px 18px;color:#778087;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.48}.terminal-behind p{margin:0 0 12px}.backdrop{position:absolute;inset:0;background:#0007}.composer-sheet{position:absolute;inset:70px 0 0;background:var(--sheet);border-radius:38px 38px 0 0;box-shadow:0 -10px 35px #0008;padding:0 17px}.handle{width:38px;height:5px;margin:9px auto 10px;border-radius:4px;background:#5a5d65}.sheet-head{height:58px;display:grid;grid-template-columns:86px 1fr 86px;align-items:center}.close{justify-self:start;height:44px;padding:0 18px;border:1px solid #353b40;border-radius:24px;font-size:16px}.sheet-head h1{margin:0;text-align:center;font-size:18px}.context{height:56px;padding-top:13px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.composer{position:relative;border:1px solid rgba(165,217,201,.72);border-radius:18px;background:var(--card);padding:10px 9px 7px;box-shadow:0 0 0 1px rgba(165,217,201,.05)}textarea{display:block;width:100%;height:118px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;line-height:1.55;padding:2px 7px}textarea::placeholder{color:#89949a}.actions{height:48px;display:flex;align-items:center;gap:2px}.tool{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#9ba3a8;font-size:23px}.tool.small{font-size:19px}.setting-trigger{height:38px;min-width:0;max-width:154px;padding:0 8px;display:flex;align-items:center;gap:5px;border-radius:10px;color:#d7dcde;font-size:11px}.setting-trigger:hover,.setting-trigger[aria-expanded=true]{background:#2b363a}.setting-trigger .spark{color:var(--accent);font-size:12px}.setting-trigger .summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.spacer{flex:1}.send{width:44px;height:44px;border-radius:13px;background:var(--accent);color:#10241e;font-size:27px}.settings-panel{display:none;margin:2px 0 7px;padding:6px;border:1px solid #48555b;border-radius:13px;background:#242c30}.settings-panel.visible{display:block}.panel-head{height:42px;display:flex;align-items:center;gap:8px;padding:0 5px 0 3px}.panel-back{width:36px;height:36px;border-radius:9px;color:#bbc3c7;font-size:22px}.panel-back:hover{background:#313c41}.panel-title{flex:1;font-size:13px;font-weight:650}.panel-current{max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:10px}.model-list{max-height:230px;overflow:auto}.model-row{width:100%;min-height:46px;padding:6px 10px;display:flex;align-items:center;gap:10px;border-radius:10px;text-align:left}.reasoning-options{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px}.reasoning-option{min-height:42px;border:1px solid #465258;border-radius:10px;color:#bcc4c8;font-size:12px}.reasoning-option.selected{border-color:var(--accent);background:rgba(165,217,201,.12);color:var(--text)}.model-row:hover,.model-row:focus-visible{background:#313c41;outline:none}.model-row.selected{background:rgba(165,217,201,.1)}.provider{width:27px;height:27px;display:grid;place-items:center;border:1px solid #59656a;border-radius:8px;color:#c5cbce;font-size:11px;font-weight:700}.copy{min-width:0;flex:1}.copy strong{display:block;font-size:13px;font-weight:600}.copy small{display:block;margin-top:2px;color:var(--muted);font-size:10px}.check{width:18px;color:var(--accent);font-size:16px}.keyboard{position:absolute;left:0;right:0;bottom:0;height:318px;padding:47px 6px 18px;background:#1b1d20;border-radius:30px 30px 0 0}.suggestion{position:absolute;top:15px;left:18px;color:#d8dadd;font-size:16px}.keyrow{display:flex;justify-content:center;gap:6px;margin-bottom:9px}.key{height:46px;min-width:36px;flex:1;display:grid;place-items:center;border-radius:6px;background:#44474b;box-shadow:0 1px #070809;font-size:21px}.keyrow.indent{padding:0 21px}.key.wide{flex:1.35;font-size:15px}.key.space{flex:4}.home{position:absolute;bottom:7px;left:50%;width:125px;height:5px;transform:translateX(-50%);border-radius:4px;background:#e9eaeb}@media(min-width:431px){.phone{height:900px;margin:20px auto;border:1px solid #41474b;border-radius:42px;box-shadow:0 25px 80px #0008}.composer-sheet{border-radius:38px}.keyboard{border-radius:30px 30px 42px 42px}}@media(max-height:820px){.composer-sheet{inset:48px 0 0}.context{height:45px}.composer textarea{height:82px}.keyboard{height:285px}.composer-sheet{padding-bottom:285px}}
</style>
</head>
<body><main class="phone">
<div class="status"><span>9:41</span><span>▮▮▮　Wi‑Fi　▰</span></div>
<section class="terminal-behind"><p>Codex / browser-viewer</p><p>Ready for your next instruction</p></section>
<div class="backdrop"></div>
<section class="composer-sheet" aria-label="输入终端">
<div class="handle"></div><header class="sheet-head"><button class="close">关闭</button><h1>输入终端</h1><span></span></header>
<div class="context">MacBook Pro · browser-viewer · Codex</div>
<div class="composer">
<textarea aria-label="命令草稿" placeholder="输入命令或告诉 Agent 要做什么…"></textarea>
<section id="modelPanel" class="settings-panel visible" aria-label="选择模型"><div class="panel-head"><button class="panel-back" data-close-panel aria-label="关闭模型设置">‹</button><strong class="panel-title">选择模型</strong><span id="modelCurrent" class="panel-current"></span></div><div id="modelList" class="model-list" role="menu"></div></section><section id="reasoningPanel" class="settings-panel" aria-label="选择推理强度"><div class="panel-head"><button id="reasoningBack" class="panel-back" aria-label="返回选择模型">‹</button><strong class="panel-title">选择推理强度</strong><span id="reasoningModel" class="panel-current"></span></div><div id="reasoningList" class="reasoning-options"></div></section>
<div class="actions"><button class="tool" aria-label="添加图片">＋</button><button id="modelSettingsTrigger" class="setting-trigger" aria-expanded="true" aria-controls="modelPanel reasoningPanel"><span class="spark">✦</span><span id="activeSettings" class="summary">GPT-6-Sol · 高</span><span>⌃</span></button><button class="tool small" aria-label="一键回复">☷</button><button class="tool small" aria-label="快捷键">⌨</button><span class="spacer"></span><button class="tool" aria-label="语音输入">♩</button><button class="send" aria-label="发送">↑</button></div>
</div>
</section>
<section class="keyboard" aria-hidden="true"><span class="suggestion">°</span><div class="keyrow"><span class="key">q</span><span class="key">w</span><span class="key">e</span><span class="key">r</span><span class="key">t</span><span class="key">y</span><span class="key">u</span><span class="key">i</span><span class="key">o</span><span class="key">p</span></div><div class="keyrow indent"><span class="key">a</span><span class="key">s</span><span class="key">d</span><span class="key">f</span><span class="key">g</span><span class="key">h</span><span class="key">j</span><span class="key">k</span><span class="key">l</span></div><div class="keyrow"><span class="key wide">⇧</span><span class="key">z</span><span class="key">x</span><span class="key">c</span><span class="key">v</span><span class="key">b</span><span class="key">n</span><span class="key">m</span><span class="key wide">⌫</span></div><div class="keyrow"><span class="key wide">123</span><span class="key wide">☺</span><span class="key space">空格</span><span class="key wide">换行</span></div></section><div class="home"></div>
</main><script type="module" src="./app.js"></script></body></html>
