<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>开发资源 · Runweave</title>
<style>
:root{color-scheme:dark;--bg:#0b1019;--rail:#080c13;--surface:#111824;--hover:#182232;--line:#222d3e;--text:#e3eaf5;--muted:#94a3b8;--dim:#68788e;--blue:#72b7ff;--green:#58d6ac;--amber:#f3ba66;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:13px}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button:disabled{cursor:default;opacity:.5}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.muted{color:var(--muted)}.dim{color:var(--dim)}
.topbar{height:46px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line);background:#0c121d}.brand{display:flex;align-items:center;gap:9px;width:211px;font-weight:650;font-size:14px;letter-spacing:.3px}.brand-mark{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#192b42;color:#8fc6ff}.project{display:flex;gap:9px;align-items:center;font-size:12px}.top-right{margin-left:auto;color:var(--muted);display:flex;gap:8px;align-items:center}.online-dot,.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 46px)}.sidebar{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--rail);padding:17px 12px 12px;gap:16px}.rail-title{padding:0 10px;display:flex;justify-content:space-between;font-size:10px;font-weight:600;letter-spacing:1.6px;color:var(--dim)}.worktrees{display:grid;gap:5px}.worktree{padding:10px;border:1px solid transparent;border-radius:6px;display:flex;gap:9px;align-items:center;color:var(--muted)}.worktree:first-child{background:#111927;border-color:#1e2a3a;color:var(--text)}.worktree svg{width:14px;height:14px;color:var(--dim)}.worktree-name{display:flex;flex-direction:column;gap:4px}.worktree .mono{font-size:10px;color:var(--dim)}.rail-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.nav-item{width:100%;border:1px solid #254361;background:#142638;border-radius:6px;text-align:left;padding:11px 12px;display:flex;align-items:center;gap:10px;color:#96c9ff;font-weight:550}.nav-item svg{width:17px;height:17px}
.main{min-width:0;padding:34px 40px 30px;max-width:1440px;width:100%;margin:auto}.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}.eyebrow{color:var(--dim);font-size:11px;margin-bottom:8px}h1{font-size:25px;font-weight:650;letter-spacing:.2px;line-height:1.2;margin:0 0 10px}.connection{color:var(--muted);display:flex;gap:7px;align-items:center;font-size:12px}.tools{display:flex;align-items:center;gap:14px}.updated{font-size:11px;color:var(--dim);margin-bottom:10px;text-align:right}.tool-buttons{display:flex;gap:9px;align-items:center}.auto{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);white-space:nowrap}.toggle{border:0;border-radius:12px;background:#234f43;width:27px;height:16px;padding:2px;display:flex;align-items:center;justify-content:flex-end}.toggle[aria-checked="false"]{background:#293243;justify-content:flex-start}.toggle span{background:#70d5b1;width:12px;height:12px;border-radius:50%}.toggle[aria-checked="false"] span{background:#94a3b8}.refresh{display:flex;align-items:center;gap:7px;background:#182332;border:1px solid #304158;padding:8px 11px;border-radius:6px;font-size:12px}.refresh svg{width:14px;height:14px}.refresh:hover{background:#203047}
.overview{display:grid;grid-template-columns:1fr 1fr .8fr;gap:14px;margin-bottom:26px}.metric{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:18px 20px}.metric-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.metric-head svg{width:16px;height:16px}.metric-number{display:flex;align-items:baseline;gap:5px;margin:16px 0 12px}.metric-number strong{font-size:31px;font-weight:600;letter-spacing:-.8px}.metric-number span{color:var(--dim);font-size:17px}.metric-number small{margin-left:6px;color:var(--muted);font-size:11px}.segments{display:flex;gap:5px;margin:12px 0}.segment{height:4px;border-radius:3px;background:#263345;flex:1}.segment.busy{background:var(--blue)}.segment.blocked{background:var(--amber)}.metric-caption{display:flex;align-items:center;gap:16px;font-size:11px;color:var(--muted)}.metric-caption span{display:flex;align-items:center;gap:5px}.status-dot.busy{background:var(--blue)}.status-dot.blocked{background:var(--amber)}.status-dot.free{background:#61758d}.metric.attention{background:#181a20;border-color:#453929}.attention .metric-head,.attention .metric-number strong{color:var(--amber)}.attention .metric-number{margin-bottom:8px}.attention-note{font-size:11px;color:#b2a291;line-height:1.7}.attention-link{border:0;background:transparent;color:var(--amber);padding:10px 0 0;display:flex;gap:5px;align-items:center;font-size:11px}.attention-link svg{width:12px;height:12px}
.list-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.list-toolbar p{margin:0;font-size:12px;color:var(--muted)}.filters{display:flex;gap:4px;background:#0d1420;padding:3px;border:1px solid var(--line);border-radius:6px}.filter{border:0;border-radius:4px;background:transparent;color:var(--muted);padding:6px 11px;font-size:11px}.filter.active{background:#233247;color:var(--text)}
.resource-group{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden;margin-bottom:20px}.group-header{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}.group-icon{height:30px;width:30px;background:#1c293b;border-radius:6px;display:grid;place-items:center;color:var(--blue)}.group-icon svg{width:17px;height:17px}.group-title{font-weight:550;font-size:13px}.group-note{margin-top:4px;color:var(--dim);font-size:10px}.group-count{margin-left:auto;color:var(--muted);font-size:11px}.group-count strong{color:var(--text);font-weight:550}.rows{overflow-x:auto}.table-head,.resource-summary{display:grid;grid-template-columns:minmax(150px,1.1fr) 86px minmax(175px,1.5fr) 77px 102px 28px;gap:14px;align-items:center;min-width:735px;padding:0 18px}.table-head{height:31px;color:var(--dim);font-size:10px;background:#0d1521}.resource-row{border-top:1px solid #1d2838}.resource-summary{list-style:none;min-height:66px;cursor:pointer}.resource-summary::-webkit-details-marker{display:none}.resource-summary:hover{background:#172131}.resource-row[open] .resource-summary{background:#182334}.resource-name{font-size:12px;display:flex;flex-direction:column;gap:5px}.resource-name small{font-size:10px;color:var(--dim)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;width:fit-content;border-radius:4px;font-size:10px;background:#1a2b40;color:#9dc9fa;white-space:nowrap}.badge.free{background:#202b36;color:#9bafc0}.badge.blocked{background:#3b2d1b;color:#f1bd76}.task-name{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.worktree-path{margin-top:5px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell{font-size:11px;color:var(--muted)}.chevron{display:flex;justify-content:end;color:var(--dim)}.chevron svg{width:14px;height:14px;transition:transform .15s}.resource-row[open] .chevron svg{transform:rotate(90deg)}.resource-details{padding:17px 20px 20px;margin:0;background:#0e1724;min-width:735px;border-top:1px solid #243346}.reason{display:flex;align-items:center;gap:8px;background:#292216;border:1px solid #514029;padding:10px 12px;border-radius:5px;color:#e4b572;font-size:11px;margin-bottom:16px}.reason svg{width:15px;height:15px}.detail-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:30px}.detail-label{font-size:10px;color:var(--dim);margin:0 0 9px}.facts{display:grid;gap:9px;font-size:11px}.fact{display:grid;grid-template-columns:74px 1fr;gap:8px}.fact span:first-child{color:var(--dim)}.fact .mono{font-size:10px;overflow-wrap:anywhere;color:var(--muted)}.process-list{display:grid;gap:8px}.process-line{display:grid;grid-template-columns:1.2fr .6fr 1.2fr;gap:10px;font-size:11px}.process-line span:not(:first-child){color:var(--muted)}.process-line.header{font-size:10px;color:var(--dim)}.process-line.header span{color:var(--dim)}.detail-status{font-size:11px;color:var(--muted);line-height:1.6}.empty{padding:27px;text-align:center;color:var(--dim);font-size:12px}.error{padding:16px;border:1px solid #644d2d;color:var(--amber);background:#231e18;border-radius:7px;margin-bottom:20px}.footer{font-size:10px;color:var(--dim);display:flex;justify-content:space-between}.footer span{display:flex;gap:6px;align-items:center}.footer svg{width:12px;height:12px}
@media(min-width:1500px){.main{padding-top:42px}}@media(max-width:1100px){.shell{grid-template-columns:190px minmax(0,1fr)}.brand{width:165px}.main{padding:28px 24px}.metric{padding:15px}.metric-caption{gap:9px}.overview{grid-template-columns:1fr 1fr .8fr;gap:10px}}@media(max-width:820px){.shell{grid-template-columns:54px minmax(0,1fr)}.sidebar{padding:14px 7px}.rail-title,.worktrees,.nav-item span{display:none}.nav-item{padding:9px}.brand{width:auto}.project{margin-left:15px}.main{padding:24px 18px}.overview{grid-template-columns:1fr 1fr}.attention{grid-column:1/-1}.attention .metric-number{display:inline-flex;margin:8px 10px 0 0}.attention-note{display:inline}.attention-link{float:right}.page-header{align-items:start;flex-wrap:wrap}.tools{margin-left:auto}.list-toolbar{gap:10px;flex-wrap:wrap}.footer{gap:14px;flex-wrap:wrap}}@media(max-width:480px){.main{padding:22px 12px}.metric{padding:12px}.metric-caption{flex-wrap:wrap}.top-right{font-size:10px}.project{display:none}.tools{width:100%;justify-content:end}.page-header{margin-bottom:18px}.metric-number strong{font-size:26px}.metric-number small{font-size:10px}.filters{width:100%;justify-content:space-between}.filter{padding:6px 7px}.attention-link{float:none}.updated{text-align:left}.attention-note{display:block}.group-header{padding:13px}}
</style>
</head>
<body><div id="app" aria-busy="true"></div><script type="module" src="./app.js"></script></body>
</html>
