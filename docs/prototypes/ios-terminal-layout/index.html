<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runweave · Terminal</title>
<style>
:root{color-scheme:dark;--bg:#101316;--panel:#191d21;--line:#2c3237;--text:#e4e8e9;--muted:#959fa5;--accent:#a5d9c9; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}*{box-sizing:border-box}body{margin:0;background:#24292e;color:var(--text)}button,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer;background:none;min-height:44px}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.35;cursor:default}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.app{height:100dvh;max-width:430px;margin:auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}.statusbar{height:54px;flex:none;padding:17px 25px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.statusbar span:last-child{font-size:12px;letter-spacing:3px}.topbar{height:62px;flex:none;display:flex;align-items:center;padding:0 10px;gap:4px}.icon{width:44px;flex:none;border-radius:13px}.heading{flex:1;min-width:0;padding-left:4px}.heading strong{font-size:17px;font-weight:620;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.heading small{font-size:11px;color:var(--muted);display:block;margin-top:5px}.online{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:5px}.tabs{display:flex;margin:0 16px;border-bottom:1px solid var(--line);height:44px;flex:none;gap:25px}.tabs button{font-size:13px;color:var(--muted);padding:0 2px;position:relative}.tabs button.active{color:var(--text)}.tabs button.active:after{content:"";position:absolute;height:2px;background:var(--accent);bottom:-1px;left:0;right:0;border-radius:2px}.badge{font-size:10px;background:#30373b;border-radius:5px;padding:2px 5px;margin-left:5px}.terminal{flex:1;min-height:0;overflow:auto;padding:20px 17px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.65;color:#cfd6d8;white-space:pre-wrap;overflow-wrap:anywhere}.dim{color:#7e8b93}.accent{color:var(--accent)}.amber{color:#dac49b}.terminal p{margin:0 0 15px}.terminal .rule{border-top:1px solid #30373b;margin:18px 0}.cursor{display:inline-block;height:14px;width:7px;background:#cfd6d8;vertical-align:middle}.dock{padding:8px 12px 10px;background:#14181b;border-top:1px solid var(--line);flex:none}.keys{display:none;gap:5px;margin:0 0 8px}.tools .keys{display:flex}.keys button{height:44px;min-width:0;flex:1;border:1px solid #30383d;border-radius:9px;background:#20262a;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#bdc7cb}.keys button:first-child{color:#dcbdb7}.composer{border:1px solid #414d52;background:#20272b;border-radius:16px;padding:10px 9px 6px}.composer textarea{display:block;resize:none;width:100%;height:43px;max-height:110px;background:none;border:0;color:var(--text);font-size:15px;line-height:1.5;padding:2px 4px;outline:none}.composer textarea::placeholder{color:#8c999f}.composer-actions{display:flex;align-items:center;gap:2px}.composer-actions .mode{margin-left:3px;color:var(--muted);font-size:11px;flex:1}.send{background:var(--accent);color:#15372c;border-radius:13px;width:44px;min-height:40px}.home{height:23px;flex:none;background:#14181b;display:flex;justify-content:center;align-items:center}.home:after{content:"";height:4px;width:125px;border-radius:3px;background:#e2e5e6}.keyboard{display:none;flex:none;height:270px;background:#303438;padding:10px 5px 16px}.keyboard.visible{display:block}.keyrow{display:flex;justify-content:center;gap:6px;margin-bottom:10px}.keyrow span{flex:1;max-width:38px;text-align:center;padding:9px 0;background:#555a60;box-shadow:0 1px 0 #101214;border-radius:5px;font-size:18px}.keyrow:last-child span{max-width:none;font-size:13px}.keyrow .space{flex:4}.focus .tabs{display:none}.focus .dock{background:var(--bg);border-top:0;padding-top:0}.focus .keys{display:none}.focus.tools .keys{display:flex}.focus .composer{display:flex;align-items:center;padding:5px;border-radius:20px}.focus .composer textarea{height:42px;padding:10px 6px;font-size:14px}.focus .composer-actions .media,.focus .mode{display:none}.focus .composer-actions{flex:none}.focus .terminal{padding-top:12px}.focus .home{background:var(--bg)}.tool-toggle{display:block;color:var(--muted)}.tool-toggle[aria-expanded="true"]{color:var(--accent);background:#2c4039}.focus .topbar{border-bottom:1px solid var(--line);margin-bottom:8px}.panel{padding:18px;flex:1;overflow:auto;min-height:0}.file{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);font-size:13px}.file small{display:block;color:var(--muted);margin-top:5px}.file .count{margin-left:auto;font:11px monospace;color:var(--accent)}.sheet-backdrop{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:10}.sheet{background:#242a2e;width:100%;border-radius:25px 25px 0 0;padding:12px 20px 30px;max-height:75%;overflow:auto}.handle{width:34px;height:4px;border-radius:3px;background:#667178;margin:0 auto 17px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h2{font-size:18px}.sheet button.row{display:flex;width:100%;align-items:center;gap:13px;border-bottom:1px solid #394248;padding:13px 0;text-align:left;font-size:15px}.sheet .destructive{color:#e7a39c}.sheet p{font-size:13px;line-height:1.6;color:#a9b6bd}.sheet textarea{background:#11181b;color:#e4e8e9;width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:12px}.toast{position:absolute;bottom:220px;left:50%;transform:translateX(-50%);background:#33423d;padding:10px 17px;border-radius:20px;font-size:12px;white-space:nowrap;z-index:12}.offline{color:#e1bc8b;font-size:12px;padding:10px 17px;background:#332b22}.hidden{display:none!important}.running-status{font:11px ui-monospace,monospace;color:#a9b8be;padding:12px 0}.review-helper{display:none}@media(min-width:600px){.app{margin:24px auto;height:852px;border:1px solid #434a4e;border-radius:40px;box-shadow:0 24px 80px #0005}}@media(max-height:550px){.statusbar,.home{display:none}.topbar{height:48px}.tabs{height:38px}.dock{padding:5px 12px}.keys{margin:0}.composer{display:flex;padding:3px 8px;align-items:center}.composer textarea{height:42px}.composer-actions{flex:none}.mode{display:none}.keyboard.visible{display:none}}
.app.dock .composer{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:4px;padding:6px 10px 4px}.app.dock .composer textarea{height:36px;min-width:0;padding:7px 4px;overflow:hidden;white-space:nowrap}.app.dock .composer-actions{gap:2px}.app.dock:not(.editing) .tool-toggle,.app.dock:not(.editing) .keys{display:none}.app.dock.editing .composer{grid-template-columns:44px minmax(0,1fr)}.app.dock.editing .composer textarea{grid-row:1;grid-column:1/-1;height:60px;white-space:pre-wrap;overflow:auto}.app.dock.editing .attachment{grid-row:2;grid-column:1}.app.dock.editing .composer-actions{grid-row:2;grid-column:2}.app.dock .mode{display:none}.app.dock.editing .mode{display:block;flex:1;font-size:0}.app.dock .send{height:44px}
</style>
</head><body><main id="app" class="app"></main><script type="module" src="app.js"></script></body></html>
