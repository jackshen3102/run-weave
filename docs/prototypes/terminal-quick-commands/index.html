<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Runweave · 终端快捷指令</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          sans-serif;
        --bg: #101316;
        --panel: #20272b;
        --accent: #a5d9c9;
        --text: #f0f2f3;
        --muted: #8d999e;
        --line: #ffffff18;
        --danger: #f29999;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #080b0d;
        color: var(--text);
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
        min-height: 44px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      #app {
        max-width: 430px;
        height: min(932px, 100dvh);
        min-height: 600px;
        margin: 24px auto;
        position: relative;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid #ffffff15;
        border-radius: 34px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 24px 90px #0009;
      }
      .statusbar {
        height: 46px;
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 27px 0;
        font-size: 15px;
        font-weight: 600;
      }
      .signals {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .signals svg {
        width: 17px;
        height: 17px;
      }
      .battery {
        width: 22px;
        height: 11px;
        border: 1px solid #ffffffaa;
        border-radius: 3px;
        padding: 1.5px;
        position: relative;
      }
      .battery:after {
        content: "";
        position: absolute;
        right: -3px;
        top: 3px;
        height: 4px;
        width: 2px;
        background: #ffffff77;
      }
      .battery i {
        display: block;
        background: var(--text);
        height: 100%;
        width: 85%;
        border-radius: 1px;
      }
      .header {
        height: 74px;
        padding: 0 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-shrink: 0;
      }
      .circle {
        border: 1px solid var(--line);
        width: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #ccd2d5;
        flex-shrink: 0;
      }
      .heading {
        min-width: 0;
        flex: 1;
      }
      .heading strong {
        display: block;
        font-size: 18px;
        font-weight: 600;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .connection {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        height: 6px;
        width: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
        flex-shrink: 0;
      }
      .tabs {
        display: flex;
        gap: 21px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .tabs button {
        font-size: 15px;
        color: var(--muted);
        position: relative;
        padding: 0 0 10px;
        min-height: 46px;
        white-space: nowrap;
      }
      .tabs button.active {
        font-weight: 600;
        color: var(--text);
      }
      .tabs button.active:after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--accent);
      }
      .count {
        font-size: 11px;
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--panel);
        margin-left: 4px;
      }
      .content {
        overflow: auto;
        flex: 1;
        scrollbar-width: none;
        padding-bottom: 28px;
        min-height: 0;
      }
      .content::-webkit-scrollbar {
        display: none;
      }
      .section {
        padding: 13px 16px 0;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 44px;
      }
      .section-title h2 {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .section-title h2 span {
        font-size: 13px;
        color: var(--muted);
        font-weight: 400;
        margin-left: 6px;
      }
      .text-button {
        color: var(--accent);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0;
      }
      .text-button svg {
        width: 14px;
        height: 14px;
      }
      .run-list {
        border-radius: 14px;
        background: var(--panel);
        padding: 0 13px;
      }
      .run-row {
        width: 100%;
        padding: 13px 0;
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
        min-height: 72px;
      }
      .run-row + .run-row {
        border-top: 1px solid var(--line);
      }
      .run-symbol {
        height: 27px;
        width: 27px;
        border-radius: 9px;
        background: #a5d9c912;
        color: var(--accent);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .run-symbol svg {
        width: 16px;
        height: 16px;
      }
      .run-symbol.queued {
        color: #e8c990;
        background: #e8c99013;
      }
      .run-symbol.failed {
        color: var(--danger);
      }
      .run-info {
        flex: 1;
        min-width: 0;
      }
      .run-top {
        display: flex;
        justify-content: space-between;
        gap: 7px;
        align-items: center;
      }
      .run-top strong {
        font-size: 14px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .run-status {
        font-size: 11px;
        color: var(--accent);
        white-space: nowrap;
      }
      .run-project {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chevron {
        width: 13px;
        height: 13px;
        color: #69767c;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 16px 0;
      }
      .actions {
        display: flex;
        gap: 5px;
      }
      .icon-button {
        width: 38px;
        color: var(--accent);
        display: grid;
        place-items: center;
      }
      .context {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        margin: 0 0 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .context svg {
        width: 14px;
        height: 14px;
      }
      .context span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .command-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 24px;
        align-items: center;
        gap: 6px;
        background: var(--panel);
        border: 1px solid #ffffff06;
        border-radius: 12px;
        padding: 8px 10px 8px 12px;
        margin-bottom: 8px;
      }
      .command-main {
        min-width: 0;
        text-align: left;
        padding: 0;
        min-height: 44px;
      }
      .command-main strong {
        display: block;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .preview {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 11px;
        line-height: 1.5;
        color: #9ca8ad;
        margin-top: 3px;
        white-space: nowrap;
      }
      .command-card > .command-menu {
        width: 24px;
        min-height: 44px;
        color: var(--muted);
        padding: 0;
      }
      .command-card .command-actions {
        gap: 5px;
        margin: 0;
      }
      .command-card .command-actions button {
        flex: none;
        min-height: 44px;
        padding: 0;
        background: none;
        border: 0;
      }
      .command-card .command-actions button span {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        min-height: 30px;
        min-width: 60px;
        padding: 0 7px;
        border-radius: 7px;
        font-size: 12px;
      }
      .command-card .command-actions .primary span {
        background: var(--accent);
      }
      .command-card .command-actions .secondary span {
        border: 1px solid #a5d9c93d;
        background: #a5d9c906;
      }
      .command-card .command-actions svg {
        width: 13px;
        height: 13px;
      }
      .command-card .order-controls {
        grid-column: 1 / -1;
      }
      .command-actions {
        display: flex;
        gap: 9px;
        margin-top: 4px;
      }
      .command-actions button {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 9px;
        min-height: 44px;
        font-size: 13px;
        font-weight: 500;
      }
      .command-actions svg {
        width: 16px;
        height: 16px;
      }
      .primary {
        background: var(--accent);
        color: #142720;
      }
      .secondary {
        color: var(--accent);
        border: 1px solid #a5d9c93d;
        background: #a5d9c906;
      }
      .order-controls {
        display: flex;
        align-items: center;
        gap: 2px;
        padding-top: 6px;
        color: var(--accent);
      }
      .order-controls button {
        flex: 1;
        font-size: 12px;
      }
      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 15px 3px;
        line-height: 1.6;
      }
      .home-indicator {
        height: 22px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
        background: var(--bg);
      }
      .home-indicator:after {
        content: "";
        width: 125px;
        height: 5px;
        background: #e2e6e8;
        border-radius: 4px;
      }
      .subnav {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        flex-shrink: 0;
      }
      .subnav strong {
        font-size: 16px;
      }
      .subnav button {
        color: var(--accent);
        font-size: 14px;
        min-width: 62px;
        text-align: left;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .subnav .spacer {
        width: 62px;
      }
      .detail-content {
        padding: 19px 16px 30px;
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .detail-title {
        font-size: 23px;
        font-weight: 600;
        margin: 0 0 9px;
      }
      .detail-context {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 20px;
        line-height: 1.7;
      }
      .detail-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel);
        padding: 14px;
        border-radius: 12px;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .detail-meta span {
        color: var(--accent);
      }
      .detail-meta small {
        color: var(--muted);
        font-size: 12px;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        margin: 20px 0 10px;
      }
      .log {
        border: 1px solid var(--line);
        background: #151b1e;
        border-radius: 12px;
        padding: 14px;
        color: #c3cdd0;
        font:
          12px/1.85 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .detail-content details {
        margin: 22px 0;
        color: var(--muted);
        font-size: 12px;
      }
      .detail-content summary {
        cursor: pointer;
        min-height: 44px;
        line-height: 44px;
      }
      .detail-content details p {
        line-height: 1.8;
        white-space: pre-wrap;
      }
      .stop {
        color: var(--danger);
        width: 100%;
        border: 1px solid #f2999935;
        border-radius: 10px;
        margin-top: 10px;
        font-size: 14px;
      }
      .results-heading {
        color: var(--muted);
        font-size: 12px;
        margin: 25px 0 9px;
      }
      .terminal-content {
        padding: 20px 16px;
        overflow: auto;
        flex: 1;
        min-height: 0;
        font:
          13px/1.8 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .terminal-content p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .terminal-content .prompt {
        color: var(--accent);
      }
      .terminal-footer {
        padding: 9px 16px 13px;
        color: var(--muted);
        font-size: 12px;
      }
      .composer {
        background: var(--panel);
        border: 1px solid #a5d9c955;
        border-radius: 16px;
        padding: 14px;
        margin: 0 12px 10px;
      }
      .composer textarea {
        background: none;
        border: 0;
        color: var(--text);
        width: 100%;
        resize: vertical;
        min-height: 92px;
        outline: none;
        font-size: 15px;
        line-height: 1.6;
      }
      .composer-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        color: var(--muted);
      }
      .composer-footer button {
        height: 44px;
        width: 44px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #142720;
      }
      .overlay {
        position: absolute;
        inset: 0;
        background: #0009;
        z-index: 10;
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        background: #252d31;
        width: 100%;
        padding: 8px 16px 22px;
        border-radius: 22px 22px 0 0;
        max-height: 87%;
        overflow: auto;
        border-top: 1px solid #ffffff20;
      }
      .grabber {
        width: 34px;
        height: 4px;
        background: #627077;
        border-radius: 5px;
        margin: 0 auto 12px;
      }
      .sheet-title {
        padding: 5px 0 14px;
        font-size: 15px;
        font-weight: 600;
      }
      .menu-item {
        width: 100%;
        min-height: 52px;
        border-top: 1px solid var(--line);
        text-align: left;
        display: flex;
        align-items: center;
        gap: 11px;
        font-size: 15px;
      }
      .menu-item svg {
        color: var(--muted);
      }
      .danger {
        color: var(--danger);
      }
      .cancel {
        display: block;
        width: 100%;
        margin-top: 12px;
        background: #ffffff07;
        border-radius: 10px;
        color: var(--accent);
      }
      .full-text {
        white-space: pre-wrap;
        font-size: 14px;
        line-height: 1.8;
        color: #c0cbd0;
        max-height: 260px;
        overflow: auto;
        padding: 0 0 12px;
      }
      .field {
        display: block;
        margin: 12px 0;
        font-size: 12px;
        color: var(--muted);
      }
      .field input,
      .field textarea {
        display: block;
        width: 100%;
        margin-top: 7px;
        background: #161d20;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 12px;
        font-size: 14px;
      }
      .field textarea {
        height: 160px;
        line-height: 1.7;
        resize: vertical;
      }
      .sheet-footer {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .sheet-footer button {
        flex: 1;
        border-radius: 10px;
      }
      .toast {
        position: absolute;
        bottom: 34px;
        left: 16px;
        right: 16px;
        z-index: 20;
        background: #33453e;
        border: 1px solid #a5d9c944;
        color: #e2f2eb;
        border-radius: 12px;
        padding: 13px 15px;
        font-size: 13px;
        box-shadow: 0 8px 25px #0005;
        pointer-events: none;
      }
      @media (max-width: 480px) {
        #app {
          height: 100dvh;
          min-height: 0;
          width: 100%;
          margin: 0;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }
        .statusbar {
          height: 43px;
        }
        .header {
          height: 70px;
        }
        .tabs {
          gap: 20px;
        }
        .section {
          padding-top: 10px;
        }
      }
      @media (max-width: 350px) {
        .tabs {
          gap: 15px;
        }
        .tabs button {
          font-size: 14px;
        }
        .command-actions button {
          font-size: 12px;
          gap: 4px;
        }
        .heading strong {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
