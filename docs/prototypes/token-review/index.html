<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>执行优化 · Runweave</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brandmark">rw</span> Runweave</div>
        <div class="workspace">
          <span class="project-icon">⌘</span>
          <div>
            <strong id="project-name">browser-viewer</strong
            ><small>项目与关联 worktree</small>
          </div>
        </div>
        <p class="nav-label">观察与分析</p>
        <div class="nav-active"><span>◈</span> 执行优化</div>
        <button id="runs-button" class="nav-secondary">◷ 分析运行</button>
        <div class="sidebar-bottom">
          <span class="dot"></span> 本地日志 <span class="small">Codex</span>
        </div>
      </aside>
      <main>
        <header class="page-header">
          <div>
            <p class="eyebrow">项目洞察</p>
            <h1>执行优化</h1>
            <p id="scope" class="subtle">正在读取报告…</p>
          </div>
        </header>
        <nav id="dimensions" class="dimension-tabs" aria-label="优化方向"></nav>
        <section
          id="monitor"
          class="monitor"
          aria-label="最近分析结果"
        ></section>
        <section id="metrics" class="metrics" aria-label="疑点概览"></section>
        <div class="section-heading">
          <h2>优化记录 <span id="record-count"></span></h2>
          <button id="runs-inline" class="text-button">分析运行 ↗</button>
        </div>
        <nav id="statuses" class="status-tabs" aria-label="处理状态"></nav>
        <div class="review-layout">
          <section class="records-panel" aria-label="执行记录">
            <div class="filters">
              <label class="search"
                >⌕
                <input
                  id="search"
                  placeholder="搜索疑点或关联任务"
                  aria-label="搜索疑点或关联任务" /></label
              ><select id="category" aria-label="原因类别"></select>
              <select id="sort" aria-label="排序">
                <option value="recent">最近发现</option>
                <option value="impact">观测值从高到低</option>
              </select>
            </div>
            <div class="list-heading">
              <span>疑点 / 关联执行</span
              ><span id="value-heading">观测耗时</span>
            </div>
            <div id="records" class="records"></div>
          </section>
          <aside id="detail" class="detail" aria-label="疑点详情"></aside>
        </div>
        <footer id="coverage" class="coverage"></footer>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="action-dialog" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" class="icon-button" aria-label="关闭">
          ×
        </button>
      </div>
      <form id="action-form">
        <div id="dialog-body"></div>
        <div class="dialog-footer">
          <button type="button" id="cancel-dialog" class="button">取消</button
          ><button id="confirm-action" class="button dark" type="submit">
            确认
          </button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
