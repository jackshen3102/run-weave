version: 1
name: 个人工作流评测首轮实验
description: 冻结真实历史派生场景，比较同模型的基线与通用交付约束；记录所有模型判定偏差，不把决策重放当产品端到端验收。
cases:
  - id: RWPE-001
    name: 计划评审不提前实施
    required: true
    description: 依据独立保存的判定标准核对 计划评审不提前实施；两组结果及偏差均须如实保留，不要求受测模型所有样本通过。
    preconditions:
      - 本轮dataset、指令和评分规则已经冻结并记录SHA256。
      - 两组均使用同一模型、推理档位和独立会话，输入仅含当前及之前的事实。
    steps:
      - 在隔离目录分别运行基线和改进组，保存原始输出、耗时及退出状态。
      - 依据冻结标准逐项判定，确认未返回或格式错误保持执行失败，不计作通过；保存两组结果及实际差异。
