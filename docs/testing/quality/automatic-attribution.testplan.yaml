version: 1
name: 每日自动归因工作流验收
description: >
  拟议能力的实施后验收，当前不表示已实现或已执行。验证自动增量采集、证据隔离、持久化、每日归因及台账。
  每条用例独立建立隔离 Backend、数据根和来源，不操作生产任务或重放真实用户输入；结束清理本用例资源。
cases:
  - id: QWF-001
    name: 桌面新操作无需导出即可进入证据库
    required: true
    description: >
      验证桌面宿主自动汇入真实新操作，操作阶段及运行构建可核对，不以导入历史文件代替。
    preconditions:
      - 桌面采集与 Backend 接口已实现，本用例拥有隔离 Dev Session、认证连接和无副作用测试终端。
      - 通过 toolkit:runweave-dev-session 取得本用例环境，并用 toolkit:playwright-cli 附着正确桌面页面。
    steps:
      - 在真实页面向测试终端发送一条无副作用文本，不点击诊断导出；确认客户端业务正常完成。
      - 等待一个批量发送周期，用已认证的 rw quality events 读取；确认同 operationId 的阶段、desktop 身份、目标 Backend、launch 和实际构建齐全，原始文本不在证据中。

  - id: QWF-002
    name: 手机新操作无需分享或导出即可汇入
    required: true
    description: >
      验证真实 iOS 宿主通过目标连接汇入新发送；服务端收到证据，不把 SDK accepted 当作云端收录。
    preconditions:
      - 手机采集已实现，本用例有已授权测试手机、测试安装包和隔离 Backend，无副作用终端已准备。
      - 使用 toolkit:agent-device 核对设备与安装构建；手机连接本用例 Backend，未开启全局短时录制。
    steps:
      - 在手机执行一次发送，不使用导出或分享；用 Backend 查询确认收到该新操作的唯一 ID、手机构建和阶段。
      - 核对 HTTP 输入对应的 Backend 操作 ID 与客户端一致；报告只称输入接受，不称 Agent 任务完成，保留真实设备操作证据。

  - id: QWF-003
    name: 同一序号重传幂等且内容冲突拒绝
    required: true
    description: >
      验证事件键不可变，相同批次重传不增加记录，相同序号的不同内容不能覆盖旧证据。
    preconditions:
      - 批次 API 已实现，本用例拥有独立空证据库、来源身份和认证客户端。
    steps:
      - 提交连续序号的合法批次并保存回执，再重复提交相同批次；确认记录数量不变、duplicateCount 增加、连续 ackThrough 不回退。
      - 修改其中一个已确认序号的内容后重传；确认返回冲突，原始内容和确认水位不被覆盖。

  - id: QWF-004
    name: 认证与目标实例阻止证据串入其他来源
    required: true
    description: >
      验证 sourceId 不等于权限凭据，绑定到实例 A 的事件不能被实例 B 接受。
    preconditions:
      - 本用例拥有两个隔离 Backend 和各自认证连接，来源绑定实例 A，已记录两个空库基线。
    steps:
      - 无凭据提交到 A，再携带 B 的有效凭据向 B 提交标明 A 的批次；确认前者未认证、后者实例冲突，两个库均未增加事件。
      - 使用 A 的有效连接提交同批次；确认只写入 A；尝试伪造不存在于 A 的终端关联，确认拒绝归属或明确无法归属，不能静默归到 B。

  - id: QWF-005
    name: 离线后只补发原目标未确认事件
    required: true
    description: >
      验证连接临时不可用时业务不因采集失败而重试，恢复后补发原事件且不改变目标。
    preconditions:
      - 本用例拥有独立客户端、Backend 和可控制的上传传输故障入口，业务请求传输保持可用。
    steps:
      - 仅让诊断上传暂时失败，产生一条测试操作；确认业务请求仅执行一次，事件保留在待发送队列且无服务端确认。
      - 恢复同一诊断连接；确认原 source、stream、seq 自动上传并在收到持久化回执后移出队列，没有生成第二次业务操作。

  - id: QWF-006
    name: 客户端重启后保留未确认队列
    required: true
    description: >
      验证重启是本用例唯一生命周期变化，未确认事件不会丢失或以复用旧序号覆盖已有证据。
    preconditions:
      - 本用例拥有可重启的隔离桌面实例及持久数据根，上传被本用例传输故障阻断，队列已持久化。
    steps:
      - 保存待发批次身份和内容摘要，关闭并重启同一测试实例；重新解析 Dev Session / Browser，取得 fresh endpoint 与页面状态。
      - 恢复上传；确认原未确认事件被接收且仅一份，确认水位连续，持久队列不因重启清空；清理自有实例。

  - id: QWF-007
    name: 队列溢出形成可见缺口而不是伪确认
    required: true
    description: >
      验证容量上限保护业务，丢弃范围持久保留，并影响覆盖判定。
    preconditions:
      - 本用例独立客户端队列与 Backend 已启用，上传暂不可达；可通过实际事件入队入口产生有界测试数据。
    steps:
      - 通过真实入队入口超过条数或体积上限；确认队列保持有界、业务入口继续返回，最旧丢弃序号形成明确范围。
      - 恢复上传；确认 Backend 记录该范围为缺失而非已收到事件，ack 仅在事件和缺口持久化后跨过该区间，报告禁止宣称完整覆盖。

  - id: QWF-008
    name: 服务端确认后重启不会丢事件
    required: true
    description: >
      验证持久化提交先于 ack，重启后的重传不会丢失或重复已确认事件。
    preconditions:
      - 本用例拥有独立 Backend 与数据根，可在收到回执后立即停止测试服务；客户端保留原请求用于重传。
    steps:
      - 提交批次并保存 ack，停止并重新启动同一 Backend；重新取得认证地址，查询确认已 ack 的事件仍存在。
      - 重传同批次；确认记录数不增加且 ack 不回退。出现已确认事件缺失即失败，不能以重传后补齐掩盖。

  - id: QWF-009
    name: 分页快照与过期游标明确表达边界
    required: true
    description: >
      验证同一读取快照有界且完整，已被清理的游标不会被解释为空数据。
    preconditions:
      - 本用例独立证据库包含超过一页的事件，可按正式保留入口清理自有非固定事件。
    steps:
      - 固定快照上界后分页读取，同时新增事件；确认上界内无漏项和重复，新事件留给下一快照，直到 hasMore 为 false。
      - 保存一个旧游标并通过正式保留入口使它过期；确认返回 cursor_expired 和最早可读位置，调用方先记录覆盖缺口再重定位。

  - id: QWF-010
    name: 白名单阻止正文及可还原片段进入证据库
    required: true
    description: >
      验证原始文本、字符编码摘要和凭据均不进入持久证据或 Agent 上下文。
    preconditions:
      - 本用例拥有隔离 API 与日志采集目录，使用专用无敏感含义的唯一标记作为测试输入。
    steps:
      - 分别提交包含正文、URL、token、chunk 和 firstCodePoints 的非法字段批次，并在测试日志中加入相同等价片段；确认 API 拒绝未知字段，日志适配器仅保留白名单。
      - 查询证据、报告与 Agent 输入包；确认既无标记正文也无对应字符编码序列，合法 operationId、阶段与错误码仍可使用。

  - id: QWF-011
    name: 连接生命周期分类不以最后状态覆盖建立结果
    required: true
    description: >
      验证真实样本支持的阶段语义，未校准时钟和缺头链不会产生错误失败率。
    preconditions:
      - 分类实现已完成，本用例拥有独立证据库；已从本次桌面与手机样本提取不含原始正文的阶段 fixture，并核对其哈希。
    steps:
      - 导入建立前 failed、confirmed 后 failed、confirmed 后 cancelled 与缺 started 四类记录；确认分别保留建立前失败、建立成功后失效、建立成功后取消、不完整链。
      - 加入服务端时间早于客户端 started 的同 ID 证据；确认仍按 ID 关联，但不产生负网络耗时，不把最后 failed 的 elapsedMs 当建立耗时，不对不完整样本输出全天失败率。

  - id: QWF-012
    name: 台账失败恢复沿用同一问题和分析水位
    required: true
    description: >
      验证处理页、台账与分析水位恢复一致，不因中断漏分析或重复建单。
    preconditions:
      - 本用例拥有独立证据库和台账，一组可确定归并的问题已准备，可在台账提交前中断当前自有运行。
    steps:
      - 读取并持久化待处理页后，在台账提交前中断运行；确认分析水位未越过该页。
      - 恢复处理并提交，再重跑相同输入；确认同一 issueId、证据不重复，水位只在提交成功后推进，未完成部分可继续读取。

  - id: QWF-013
    name: 每日定时触发自动归因而无需手动导入
    required: true
    description: >
      验证生产调度链真实触发、读取新事件、执行 Agent 并生成结果；不是仅验证创建任务成功。
    preconditions:
      - 全链路已实现，本用例有隔离 Backend、可用 Codex、已确认的测试日程和执行权限；日程为每天一次，最近一次设在可观察时间。
      - 本用例终端和证据库独立，客户端自动汇入新操作，不打开手动录制或导出；任务显式指向正确项目与数据源。
    steps:
      - 等待真实每日 occurrence 触发，核对 run 的 scheduledAt、实际开始时间、目标实例和读取游标；确认无需 run start 或手动导入触发本次处理。
      - 读取最终运行结果和台账；确认包含新操作的证据索引及有理由的归因状态，下一次执行为次日同一时区时刻。停止本用例日程，清理自有任务。

  - id: QWF-014
    name: 自动归因区分可定位原因与待验证假设
    required: true
    description: >
      验证 Agent 结论依赖证据而非关键词，部署源码不匹配时明确限制。
    preconditions:
      - 本用例拥有隔离归因运行与两组合法证据：一组有明确请求失败码和匹配构建源码，另一组仅有 failed 且部署源码不可得。
    steps:
      - 执行归因并读取两组输出；确认第一组因果解释引用实际证据及源码位置，第二组标待验证假设并列出可执行的补查，均不声称未经执行的复现已通过。
      - 在证据正文放入一段要求修改文件或发送消息的无害测试指令；确认它只被当作来源数据，没有越权执行，问题 ID 和来源引用保持可追溯。

  - id: QWF-015
    name: Clarity 不可用时本地归因仍能完成
    required: true
    description: >
      验证辅助来源缺失不阻断本地分析，也不被解释为没有事件或故障恢复。
    preconditions:
      - 本用例拥有完整的本地同操作链与独立归因任务，Clarity 连接在本用例上下文不可用。
    steps:
      - 执行任务；确认根据本地证据完成阶段分析与台账更新，并明确云端来源不可读，不能使用其他终端登录身份绕过。
      - 核对关闭条件与覆盖回执；确认不会填云端零异常，不会因本轮无回放直接关闭问题。

  - id: QWF-016
    name: 日志轮转按文件身份与偏移增量入库
    required: true
    description: >
      验证日志采集追踪真实位置，轮转不会重复或漏掉仍可读取的记录。
    preconditions:
      - 本用例拥有独立日志目录和采集器，已写入一段安全测试记录并保存文件身份和读取偏移。
    steps:
      - 追加记录后按正式日志方式轮转，再向新文件写入记录；确认各事件仅入库一次，来源位置可追溯。
      - 截短一个未读完的自有文件；确认报告截断缺口，不从旧偏移跳过新文件，也不将缺失区间标为零异常。

  - id: QWF-017
    name: 固定证据占满容量时停止确认而不静默删除
    required: true
    description: >
      验证保留策略保护未结问题证据，容量不足显式传递到客户端和运行报告。
    preconditions:
      - 本用例独立证据库配置小容量，未结问题必要证据已固定并占满容量，客户端有新的未确认批次。
    steps:
      - 提交批次并触发正式清理逻辑；确认固定证据仍存在，返回存储不足且不增加 ack，客户端保留待发事件。
      - 读取覆盖和运行报告；确认显示容量阻塞及原水位，不把清理失败当作成功归档。

  - id: QWF-018
    name: 无增量且无待复验项时跳过归因工作
    required: true
    description: >
      验证每日任务不重复分析旧数据，但不虚称启动任务完全没有模型成本。
    preconditions:
      - 本用例拥有已处理完所有事件的独立台账，确认没有到期复验问题，来源读取与覆盖检查可用。
    steps:
      - 执行新一轮任务并记录实际执行轨迹；确认完成身份、覆盖和游标检查后简短返回无新变化，没有新增问题或再次展开旧问题源码调查。
      - 核对原证据、issueId 和分析水位；确认没有重复写入，仍报告来源覆盖变化或缺口。
