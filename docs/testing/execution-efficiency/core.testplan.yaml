version: 1
name: 执行效率计量与处理闭环
description: >
  执行效率生产合同验收用例，对应 frontend/docs/execution-efficiency.md。
  只使用各用例自己创建的隔离数据根、项目和运行，不读取或变更安装态业务库。
  格式通过不代表行为通过；真实模型与浏览器用例不能用模拟响应替代。
cases:
  - id: EFF-001
    name: Token 区间可复算且不重复累计
    required: true
    description: 计数差值、缓存和共享区间遵守采样边界，未知不是零。
    preconditions:
      - 对应采集实现可运行；本用例持有独立日志目录和已登记测试仓库，执行后只清理本用例资源。
      - 已从原型 mock-state.json 取得十二段原始计数作为固定输入，并准备重复点、回退、缺失缓存和并行工具共用采样窗口的独立输入。
    steps:
      - 通过生产采集器读取十二段输入；核对输入 689270、缓存输入 672896、非缓存输入 16374、输出 906，来源边界与输入一致。
      - 分别读取异常边界输入；确认重复点不增加用量，回退跨段不求差，缺失缓存导致非缓存值未知，共享窗口只计一次且不归为单个工具独占消耗。
      - 核对序列化结果；确认推理输出没有再次加进输出，未知金额没有变成零元，模型切换的模糊边界没有套用单一模型价格。
  - id: EFF-002
    name: 耗时保持测量和运行条件边界
    required: true
    description: 内部计时、调用区间和并行区间不能混为可节省时间。
    preconditions:
      - 对应采集实现可运行；本用例拥有隔离日志目录和测试仓库。
      - 输入含内部 elapsed 53.544 秒及 shellReady、另一条件复用耗时 10.379 秒、两段各 20 秒但重叠 10 秒的调用，以及缺失返回的调用。
    steps:
      - 读取构建输入；确认使用内部 53.544 秒而非外层工具时间，保留单样本及运行条件，不产生 p95 或与 10.379 秒相减的节省率。
      - 读取并行输入；确认时间并集为 30 秒而不是 40 秒，缺失返回的调用显示未知，人工等待未被擅自扣除。
  - id: EFF-003
    name: 只有量化影响与行为证据齐备才入列
    required: true
    description: 大任务、报错和少量重复本身不能产生正式候选，模型提交不能绕过计量校验。
    preconditions:
      - 本用例独立建立隔离 Backend 和仓库，固定初版筛选策略。
      - 输入分别含正常大任务、三次合计 2 秒的小开销、仅一般代码建议，以及三次重复传入上下文且非缓存输入 10000 的可测量候选。
      - 已建立本用例所属的关联任务和可提交分析，用受控输入验证规则，不将本用例作为真实模型验收。
    steps:
      - 采集全部输入；确认前三类不进入正式列表，只影响覆盖或筛除摘要；第四类进入待分析材料。
      - 对第四类提交引用合法观测的行为解释和不确定性；确认生成 Token 方向候选，并保留观察值不等于浪费的边界。
      - 用新受控分析提交伪造数值或不存在的证据 ID；确认请求拒绝且没有新增记录。对合法但判定正常的证据提交排除结论；确认相同证据版本下次不再送模型。
  - id: EFF-004
    name: 增量检查点在重启后不漏不重
    required: true
    description: 采集事务和检查点同时提交，半行、归档移动及中断不会产生重复观测。
    preconditions:
      - 本用例独立启动可注入事务提交前中断的隔离 Backend，持有临时数据库与日志目录的全部生命周期。
      - 初始日志包含一个完整轮次和一个未结束轮次，保存来源文件和初始记录数。
    steps:
      - 完成首次采集，随后追加一条半行；再次采集，确认已有观测不重复，半行不被消费成完整事件。
      - 补齐半行和轮次结束，在事务提交前中断本用例 Backend；重启同一数据根并重新取得 fresh endpoint，再次采集，确认新增观测仅一次且检查点与观测同时存在。
      - 将本用例日志移动到受信归档目录，再模拟同一 session 文件被截断并重建；确认稳定事件不重复，新代次重建基线且不跨回退计数求差。
  - id: EFF-005
    name: 记录身份按方向和明确问题分离
    required: true
    description: 同规则、同名称不自动合并，明确同问题追加证据不改变人工状态。
    preconditions:
      - 本用例独立隔离 Backend 中已通过合法结果提交建立两个名称相同但来源不同的 Token 候选及一个耗时候选。
      - 其中一个 Token 候选已由本用例人工操作设为 deferred，持有其当前 ID 与 revision。
    steps:
      - 查询列表与详情；确认三个记录身份独立，两个方向各自计数。
      - 向 deferred 记录显式追加同方向新证据；确认只追加证据与历史，状态保持 deferred，页面提示有新证据。
      - 将耗时观测提交给该 Token 记录；确认拒绝跨方向追加，没有改变任一记录状态或测量。
  - id: EFF-006
    name: 完成必须显式确认
    required: true
    description: 完成操作需要处理结果、验证记录和显式确认，刷新后保持。
    preconditions:
      - 本用例独立隔离 Backend 有一条待处理记录，认证客户端持有当前 revision。
      - 本用例浏览器已进入该记录真实页面，使用 $toolkit:playwright-cli 操作。
    steps:
      - 打开完成操作但不填写验证结果或不勾选确认；确认不能提交完成，直接构造缺字段请求也被 API 拒绝。
      - 填写处理结果、验证证据并明确确认；确认状态变为 resolved，刷新后保持。
  - id: EFF-007
    name: 分析提交中断不自动重放或发布半成品
    required: true
    description: 运行 owner 和事务提交保护模型结果，重启不能把未知执行当作成功。
    preconditions:
      - 本用例拥有独立 Backend、数据根、关联任务和受控运行，可在分析结果事务提交前中断。
      - 已采集候选并保存 analysis ID、证据版本和幂等键，初始没有正式 Finding。
    steps:
      - 在提交结果事务完成前中断本用例 Backend；重启同一数据根并重新取得 endpoint，核对关联运行的真实中断状态。
      - 确认没有半成品 Finding，没有第二次 provider 启动，没有伪造成功；已采集观测仍在，同一证据显示需要人工重试。
      - 用旧运行身份提交迟到结果；确认 owner 冲突被拒绝。执行新的明确重试运行后提交有效结果，再用同键重试；确认只生成一组记录，同键不同正文返回 409。
  - id: EFF-008
    name: 鉴权和项目边界限制日志与结果访问
    required: true
    description: 客户端不能通过路径或证据 ID 读取其他项目资料，也不能伪造定时运行身份。
    preconditions:
      - 本用例独立 Backend 登记测试项目甲乙，各有独立日志、候选与运行；另有受信目录外的无敏感测试文件及指向它的符号链接。
      - 持有本用例的合法认证和甲项目运行身份；不使用真实凭据作为 fixture 内容。
    steps:
      - 未认证访问 API；确认 401 且没有内容或执行副作用。
      - 在甲项目提交乙的证据 ID、其他任务 run ID 或客户端任意日志路径；确认拒绝且甲乙记录均不变。
      - 扫描越界符号链接，并读取含测试凭据标记的合法片段；确认越界内容不可读，合法片段在持久化、分析材料及 API 响应中均已脱敏。
  - id: EFF-009
    name: 真实定时分析能够提交并回收自身用量
    required: true
    description: 复用现有真实 Codex 运行完成结构化写回，自身用量不递归成为候选。
    preconditions:
      - 对应 CLI 和 Backend 已构建，本用例持有独立 Dev Session、可用真实 Codex、隔离项目与测试任务，不触碰用户任务。
      - 本用例输入具有合法可测量候选，任务提示语使用已实现 collect 和 submit 命令，权限足以访问该隔离 Backend。
    steps:
      - 通过现有任务入口人工启动一次真实运行；核对 collect 的 analysis ID、submit 的真实响应、任务 outcome 和退出状态，不用预设模型输出替代。
      - 等待该运行真实结束，再读效率状态；将自身输入、缓存和输出与对应真实 thread 日志独立复算，确认缺字段显示未知而非零。
      - 再次采集同项目，确认该分析 thread 通过运行关联被排除出普通候选，不因自身大用量产生递归分析记录。
  - id: EFF-010
    name: 没有新证据时结束且仍计分析成本
    required: true
    description: 空跑不深读旧证据，不伪造零 Token 或新增优化收益。
    preconditions:
      - 本用例独立真实 Codex 任务及隔离 Backend 可运行，输入证据均已产生已分析决策且没有待补充问题。
      - 记录启动前的候选数、证据请求和真实日志位置，本用例结束清理自身任务和资源。
    steps:
      - 人工启动关联任务；确认 collect 返回无新材料，Agent 提交空结果并结束，没有全量重读或额外证据抓取。
      - 核对本次运行历史；确认新增候选数为零，扫描覆盖与真实分析 Token 分别记录，没有显示零成本或虚构节省。
  - id: EFF-011
    name: 补充问题由关联任务处理且有输入上限
    required: true
    description: 人工新问题可以触发有限分析，无关旧材料不会重新全部送给模型。
    preconditions:
      - 本用例独立真实任务和 Backend 中有一条已处理候选、一个未回答问题及多于三个待分析候选，各自证据累计超过 24000 字符。
      - 已知本用例初始状态与剩余候选数，真实 Codex 可用。
    steps:
      - 启动一次关联任务；检查实际 collect 响应与模型收到的材料，确认问题优先、最多三个候选、总证据不超过 24000 字符且每片段不超过 1800 字符。
      - 等待真实提交；确认问题得到带证据的回答或明确不足说明，原人工状态未改变，其余材料保留 backlog，没有在本轮循环启动模型扫完。
  - id: EFF-012
    name: 页面只展示候选并隔离 Backend 连接
    required: true
    description: 两方向列表、空态和来源显示真实数据，切换连接不泄漏旧详情。
    preconditions:
      - 本用例持有两个独立隔离 Backend 及可切换连接的真实页面；甲有两方向候选和正常执行覆盖，乙没有任务或候选。
      - 浏览器操作使用 $toolkit:playwright-cli，不用静态 HTML 或截图代替交互。
    steps:
      - 在甲查看两个方向和详情；确认正常执行不出现在列表，Token 缓存拆分、耗时边界及处理状态各自独立，来源回跳至正确任务运行。
      - 在甲详情请求尚未完成时切换乙；确认旧结果不回填，乙显示尚未关联任务和无记录，不显示甲的测量或历史。
      - 在 390px 宽度操作方向切换、证据展开和人工处理弹窗；确认信息与操作可达、页面无横向溢出，不出现独立调度或导入导出控件。
  - id: EFF-013
    name: 存储故障不会伪装正常空列表
    required: true
    description: 存储不可用明确降级，其他已有能力继续可用且不删除数据库。
    preconditions:
      - 本用例独立准备一个持有不支持数据库版本的新版隔离 Backend，其中有可核对的已有定时任务。
      - 数据库路径与内容摘要已保存，浏览器使用 $toolkit:playwright-cli。
    steps:
      - 连接该环境查看效率页；确认提示存储不可用，不将错误解释成零候选或成功分析。
      - 查询既有定时任务及数据库内容摘要；确认既有能力可用，没有因新能力初始化失败删除库重建或改写任务配置。
  - id: EFF-014
    name: 并发人工处理不会覆盖较新的结论
    required: true
    description: revision 和幂等键保护同一记录的人工处理历史。
    preconditions:
      - 本用例独立隔离 Backend 有一条待处理记录，两个认证客户端读取同一 revision。
      - 两个真实页面通过 $toolkit:playwright-cli 操作，客户端乙持有未提交的处理草稿。
    steps:
      - 客户端甲提交暂不处理说明，并重复发送同一幂等请求；确认状态为 deferred 且仅新增一个事件。
      - 客户端乙以旧 revision 提交另一状态；确认 409，保留草稿，不覆盖 deferred，也不自动使用新 revision 重试。
