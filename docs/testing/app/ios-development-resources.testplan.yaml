version: 1
name: 原生 iOS 开发资源验收
description: >
  通过 toolkit:agent-device 从正式首页验证当前电脑资源、仅手动刷新和显式释放。
  使用本例独占的 Backend、模拟器 lease 或可控制响应的隔离转发服务，禁止释放其他任务的资源。
  桌面和 Backend 生命周期的完整矩阵沿用 platform/development-resources.testplan.yaml。
cases:
  - id: IOSRES-001
    name: 首页入口展示当前电脑资源
    required: true
    description: >
      正式首页菜单只有一行开发资源，进入后两类资源数量、占用归属与真实快照一致，详情默认折叠。
    preconditions:
      - 已构建安装当前源码，原生 App 已登录本例隔离 Backend 并停留首页。
      - 本例 Backend 可以提供快照，已记录五个桌面物理槽位及两个受管理模拟器的状态。
    steps:
      - 使用 toolkit:agent-device 打开首页更多菜单；确认开发资源位于 Mac 桌面和耗电监控之间。
      - 进入开发资源；确认电脑名称与当前连接一致，概览使用快照计数，未知数据不展示为零。
      - 切换桌面和模拟器并查看占用卡片；确认任务、工作树、设备状态与同次快照一致，展开后显示真实进程或路径。
      - 返回首页；确认未创建新终端或改变之前的终端选择。
  - id: IOSRES-002
    name: 资源读取由进入和手动刷新触发
    required: true
    description: >
      同一资源页生命周期内没有五秒轮询；筛选、展开、切换分组及前台恢复不增加资源 GET。
    preconditions:
      - 当前源码已安装并登录隔离 Backend，页面尚未进入，资源 GET 可独立计数。
    steps:
      - 使用 toolkit:agent-device 进入开发资源；确认资源 GET 只增加一次并显示观察时间。
      - 等待至少六秒，切换分组、筛选和展开详情；确认资源 GET 不增加。
      - 将 App 置于后台再恢复前台；确认资源 GET 不增加，已有快照保留。
      - 点击右上角刷新；确认资源 GET 增加一次，返回新观察时间，分组和筛选保留。
  - id: IOSRES-003
    name: 取消释放不发送写请求
    required: true
    description: >
      底部确认明确展示资源和中断影响，取消只关闭弹层，任务、进程和 lease 保持原状。
    preconditions:
      - 当前原生资源页连接本例隔离 Backend，存在本例自己拥有且允许释放的模拟器 lease。
      - 已记录目标 owner、lease 和设备状态，释放 POST 可独立计数。
    steps:
      - 使用 toolkit:agent-device 点击目标的停止并释放；确认弹层显示电脑、资源、任务、工作树和中断说明，取消按钮可访问。
      - 点击取消；确认回到资源页，释放 POST 没有增加，目标 owner、lease 和设备状态保持不变。
  - id: IOSRES-004
    name: 明确确认只释放本例目标
    required: true
    description: >
      确认只提交一次带当前占用摘要的请求，成功后读取一次结果；目标设备关机并解除 lease，控制页面仍可用。
    preconditions:
      - 本例拥有独立控制 Backend 和原生 UI 模拟器，另一个受管理模拟器由本例独占且归属可核验。
      - 当前源码资源页显示目标允许释放，释放 POST 和资源 GET 可独立计数。
    steps:
      - 使用 toolkit:agent-device 打开目标确认弹层并确认；确认仅增加一次释放 POST，处理中禁止再次释放及刷新。
      - 等待本次响应和后续一次读取；若返回进行中，等待实际清理完成，再手动刷新一次，不自动轮询或重发；确认最终目标空闲、计数更新，实际设备为 Shutdown 且 lease 已解除。
      - 确认控制 Backend、原生 UI 设备和其他任务的归属没有被改变；等待至少六秒，确认没有自动重发或持续轮询。
      - 清理本例控制连接、自动化、模拟器租约和 Backend；不删除其他连接或业务数据。
  - id: IOSRES-005
    name: 读取失败保留快照并要求手动恢复
    required: true
    description: >
      接口缺失或读取失败不把既有占用改成空闲，也不允许基于过期数据释放；服务恢复后仅手动刷新恢复操作能力。
    preconditions:
      - 当前源码已登录本例隔离服务，资源页已有可核验快照。
      - 本例隔离转发服务可以只对资源 GET 返回 404 或 503，其他健康和认证接口保持可用。
    steps:
      - 令资源 GET 返回 404，使用 toolkit:agent-device 手动刷新；确认保留快照、提示更新电脑端，释放不可操作。
      - 改为 503 并手动刷新；确认仍保留占用和错误提示，没有自动重试。
      - 恢复真实响应并等待至少六秒；确认页面不会自行读取；点击刷新后才恢复数据与操作能力。
