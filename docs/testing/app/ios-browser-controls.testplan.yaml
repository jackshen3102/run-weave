version: 1
name: iOS 浏览器悬浮控件与系统分享
description: >
  验证共享浏览器在 Runweave 与随记两个宿主中的悬浮操作、系统分享和阅读连续性。
  使用 $toolkit:agent-device 在当前源码构建的原生 App 中操作，记录宿主、构建、设备、控件树和截图。
  每例独立建立受控网页和来源，分享只使用系统复制或取消，不向他人发送；只清理本例资源。
cases:
  - id: BROWSERCONTROL-001
    name: 悬浮工具栏不遮住网页末尾操作
    required: true
    description: 顶部域名与返回目的地清晰，底部操作可点击，网页末尾内容能够滚到悬浮控件上方。
    preconditions:
      - 当前源码构建的 Runweave 和随记各有独占模拟器或设备，已通过各自正式链接入口打开受控长网页。
      - 页面末尾有可提交但无外部副作用的输入框和按钮，页面显示点击结果及加载次数。
    steps:
      - 分别使用 $toolkit:agent-device 检查两个宿主；确认顶部显示真实域名、返回目的地与更多，底部显示后退和分享、刷新、外部打开两个悬浮操作区，点击区域不小于 44pt。
      - 滚到页面末尾并操作末尾按钮；确认按钮可滚至工具栏上方，页面显示本次点击结果，工具栏未截获点击。
      - 聚焦末尾输入框并输入唯一文本；确认软件键盘出现后返回和工具栏仍可操作，收起键盘不清空输入。
  - id: BROWSERCONTROL-002
    name: 系统分享使用当前地址并保留网页现场
    required: true
    description: 分享弹出系统面板，复制内容等于点击时的当前完整地址，关闭分享不刷新或清空网页。
    preconditions:
      - 两个候选宿主分别已从正式入口打开受控 HTTP(S) 页面，页面能导航到带唯一 query 和 fragment 的目标页。
      - 目标页已填写唯一未提交表单并滚动，页面有请求计数，本机有用于核对剪贴板的专用文本区。
    steps:
      - 分别使用 $toolkit:agent-device 导航到目标页，点击底部分享；确认出现系统活动面板，预览地址是当前页而非首次入口地址。
      - 取消分享；确认原表单、滚动位置和请求计数保持，没有网页导航、业务写入或自动发送。
      - 再次分享并选择系统复制；在专用文本区核对 URL 的路径、query 和 fragment 完整，未附加宿主认证或表单内容。
  - id: BROWSERCONTROL-003
    name: 悬浮导航与网页历史一致
    required: true
    description: 后退和按历史出现的前进只操作网页历史，刷新仍可用，收起不等于关闭。
    preconditions:
      - 两个候选宿主分别从正式入口打开受控页面 A，A 有到页面 B 的普通链接，B 显示可核对的加载次数。
    steps:
      - 分别使用 $toolkit:agent-device 检查 A 无前进历史时不显示前进，点击进入 B 后再点后退；确认显示 A，前进按钮出现。
      - 点击前进并刷新；确认回到 B 且加载次数增加一次，更多菜单的完整地址对应 B。
      - 点返回目的地并从宿主恢复网页；确认仍为 B，加载次数不增加；再从更多菜单选择关闭并取消，确认仍保留 B。
  - id: BROWSERCONTROL-004
    name: 深浅主题和辅助功能设置下控件仍清晰可用
    required: true
    description: 主题、减少透明度和增强对比度改变控件外观，不改变导航与操作可达性。
    preconditions:
      - 两个候选宿主分别在独占设备打开同一受控长网页，已记录系统外观、透明度、对比度和字号原设置。
      - 本例允许临时调整这些设置，网页已有可核对的未提交表单。
    steps:
      - 使用 $toolkit:agent-device 分别检查深色和浅色；确认文字与图标有清晰对比，域名可读，更多菜单和分享按钮可用。
      - 开启减少透明度或增强对比度；确认悬浮控件变为实色背景，网页内容不透过控件影响识别。
      - 使用最大辅助功能字号；确认返回、域名、更多和底部按钮没有互相覆盖，恢复全部原设置并核对表单保持。
  - id: BROWSERCONTROL-005
    name: 来源失效时关闭旧分享面板
    required: true
    description: 旧页面所属来源失效后，分享面板不能继续附着在新的业务来源上。
    preconditions:
      - 独占候选 Runweave 已从本例专用终端打开受控网页并弹出系统分享面板。
      - 本例可通过真实 Backend 删除该专用终端，且另有不受影响的专用终端供检查；不操作用户终端。
    steps:
      - 使用真实 Backend 删除分享页所属的专用终端，并用 $toolkit:agent-device 重新观察 App；确认旧网页及分享面板被关闭。
      - 打开另一专用终端并主动打开其网页；确认没有旧分享面板或旧地址自动重现，来源和当前域名对应新终端。
