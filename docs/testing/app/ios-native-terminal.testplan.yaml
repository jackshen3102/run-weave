version: 1
name: iOS 原生终端技术门禁
description: >
  验证 packages/app-ios 的 SwiftTerm 终端与真实 Backend、tmux 和现有协议兼容。
  本文件是验收合同，实际执行状态单独记录于 packages/app-ios/docs/validation-status.md。原生 UI 使用 Simulator 或真机操作取证；
  每例自行创建专用 fixture 并只清理自己拥有的资源。

cases:
  - id: IOSTERM-001
    name: 原生应用可独立构建安装启动
    required: true
    description: >
      仅依赖原生包、Xcode 与 Swift 依赖即可构建和安装，不需要 React、Capacitor、pnpm 依赖或前端服务器。
    preconditions:
      - 当前有可用 Xcode、Metal Toolchain 与已安装 simulator destination，使用独占的测试模拟器。
      - 本例干净原生包没有已生成的 Web 产物，Backend 由本例另行提供或连接管理暂不添加服务器。
    steps:
      - 在原生包运行 node scripts/ios.mjs doctor，再用该 UDID 执行 build；确认 BUILD SUCCEEDED 与包内 .build/ios 产物。
      - 运行 node scripts/ios.mjs run --simulator 对应 UDID；确认启动 com.runweave.app.native 的正式入口，保存 PID 与 UI 证据。
      - 确认构建和启动均未启动 Web 服务器，也未依赖其他客户端源码；安装身份与工程声明一致。

  - id: IOSTERM-002
    name: tmux attach 实时流可驱动原生终端
    required: true
    description: >
      从 Backend ticket 和 terminal WS 到 SwiftTerm 的真实链路保留 ANSI、光标和交互能力。
    preconditions:
      - 原生验证 App 已登录专用 Backend，自建一个明确 runtimeKind 为 tmux 的测试终端。
      - 会话运行可控 shell 与已安装的全屏 TUI，当前只有原生客户端拥有输入和 resize 权限。
    steps:
      - 打开该终端，记录 ticket 成功、connected、snapshot 和 output 的时间与字节计数；确认原生画面显示当前会话。
      - 在专用会话输出带颜色和光标定位的已知 marker，再打开全屏 TUI并退出；确认颜色、光标和 shell 恢复正确，没有显示原始 ESC 文本。
      - 发送一个唯一无副作用命令；通过后端及显示确认实际执行一次，链路未改为轮询 capture-pane。

  - id: IOSTERM-003
    name: 视口变化与远端行列数保持一致
    required: true
    description: >
      同一原生终端在旋转与键盘布局变化后使用有效行列数重排，不产生永久重影或零尺寸请求。
    preconditions:
      - 原生 App 已打开自己创建的 tmux fixture，显示已知长行和可重复重绘的 TUI。
      - 已记录当前 rows、cols、字体和像素尺寸，没有其他客户端向该会话 resize。
    steps:
      - 展开和收起键盘，再在横竖屏间切换；每次等待布局稳定后记录原生尺寸、WS resize 和远端 stty size。
      - 确认稳定后的行列数一致，未发送零或负数，连续相同布局没有持续重复 resize。
      - 恢复初始尺寸；确认长行与 TUI 没有永久重复、丢行或光标错位，保存前后画面与尺寸记录。

  - id: IOSTERM-004
    name: Unicode 与分包控制序列保持正确
    required: true
    description: >
      原生 renderer 能按顺序消费已知分包流，中文、emoji 和跨包 ANSI 不被替换或当成普通字符。
    preconditions:
      - Debug TerminalProbe 已提供无敏感固定 fixture，含中文、组合字符、emoji、颜色和跨消息 ANSI 序列。
      - 已固定 fixture 内容、分包边界、字体、行列与预期字符和光标位置。
    steps:
      - 在真实原生 TerminalProbe 播放该 fixture，记录接收与消费顺序以及最终画面。
      - 确认没有替换字符、丢字或半截 ANSI 字面量，已知字符及光标落点正确。
      - 对照固定 fixture 的预期字符与光标位置；明确记录 emoji、组合字符的列宽，区分字体外观与语义错误。

  - id: IOSTERM-005
    name: tmux 历史滚动能正确回到实时输出
    required: true
    description: >
      原生触摸滚动与 tmux copy mode 保持协调，返回底部后新输入不会滞留在历史模式。
    preconditions:
      - 真机原生 App 已打开专用 tmux 会话，至少输出 5000 行带行号内容。
      - 已记录初始模式和最后行号，终端有明确的回到底部入口。
    steps:
      - 向上滚动查看历史并停留；确认新输出不会强制抢回底部，手势不误发送命令或弹出键盘。
      - 点击回到底部；确认需要时发送 tmux_exit_copy_mode，画面返回最新行并继续更新。
      - 使用 Composer 发送唯一 marker；确认回到正常交互且没有留在 tmux copy mode。

  - id: IOSTERM-006
    name: 网络断开后的 TUI 恢复不依赖完整输出尾部
    required: true
    description: >
      断线重连后恢复当前 TUI 和后续交互，不把截断的近期输出当成已证明完整的屏幕状态。
    preconditions:
      - 原生 App 已连接专用 tmux TUI，初始化屏幕后累计输出超过 64×1024 字符。
      - 已准备只中断该测试客户端网络的方式，Backend 和 tmux 在整个用例中保持存活。
    steps:
      - 记录断线前画面和后端状态，切断该客户端网络，继续在后端驱动 TUI 局部更新。
      - 恢复网络并等待重新获取 ticket、snapshot 与 output；确认恢复为后端当前画面，光标与颜色正确。
      - 执行一次无副作用交互并确认成功；若仅靠重新打开或清屏才能恢复，判为失败并定位 snapshot 合同。

  - id: IOSTERM-007
    name: 真机锁屏返回后恢复同一个会话
    required: true
    description: >
      iOS 挂起与恢复不会创建新远端会话、重放输入或保持无法继续交互的旧画面。
    preconditions:
      - 真机已安装原生 App，已登录并连接专用 tmux 会话；后端保持运行。
      - 已记录会话 ID、输入计数、renderer 类型，且可在后端产生带行号更新。
    steps:
      - 锁屏至少两分钟，在后端继续产生更新；解锁并回到 App，重新取得当前 UI 状态。
      - 确认 App 重新检测连接并收敛到同一 session 的最新画面，无永久黑屏或重复会话。
      - 确认锁屏前已执行命令没有补发，新的交互可执行；记录恢复耗时与 scene/socket 事件。

  - id: IOSTERM-008
    name: App 进程重新启动不会破坏远端会话
    required: true
    description: >
      终止并重启原生 App 后可重新打开原会话，原生内存销毁不等于远端 tmux 被终止。
    preconditions:
      - 原生 App 已独立登录并打开专用 tmux 会话，远端运行持续更新的无副作用程序。
      - 已记录该会话 ID，执行者只拥有原生 App 进程而非用户其他进程的控制权。
    steps:
      - 终止原生 App 进程，确认远端会话继续存在并更新。
      - 重新启动原生 App，重新取得 PID 和 UI，打开原会话；确认凭据和连接仍可用。
      - 确认当前画面恢复且可继续输入，不自动创建替代 session、不重放旧命令。

  - id: IOSTERM-009
    name: Metal 渲染路径真实可用且降级明确
    required: true
    description: >
      同一真机上的 renderer 选择反映真实初始化结果，不把普通渲染或黑屏误报为 Metal 成功。
    preconditions:
      - 真机 Debug 验证入口可显式选择 SwiftTerm 普通或 Metal 渲染，并展示实际 renderer 状态。
      - 已准备固定 ANSI fixture 和一次仅限该验证入口的 Metal 初始化失败注入。
    steps:
      - 开启 Metal 播放 fixture，记录实际 renderer 状态及画面，确认真实启用且字符、光标可见。
      - 在新的本用例视图实例中注入初始化失败，确认显示明确失败并切到已验证普通 renderer 或停止显示错误，不伪报 Metal。
      - 保存两种结果与决策；若选定普通 renderer 作为默认值，仍需独立通过持续输出性能门禁。

  - id: IOSTERM-010
    name: 持续输出满足原生渲染性能预算
    required: true
    description: >
      在真实设备、固定负载下按计划的预设阈值验证消费延迟、队列和内存，模拟器帧率不作为结论。
    preconditions:
      - 已有真机 Profile 构建，使用 Release 优化并开启内部计量，选定 renderer 且有 Instruments 或等价记录。
      - 已固定设备、字体、行列、5000 行 scrollback 和无敏感输出 fixture，记录本轮构建与测量边界。
    steps:
      - 向实际终端视图送入每秒 256 KiB 的 ASCII 加 ANSI 流持续 60 秒；记录接收到显示提交的 p95、队列峰值和结束排空时间。
      - 确认 p95 不超过 100 ms、结束后两秒内排空且 1 MiB 队列不溢出；任何缺字、停滞或崩溃均失败。
      - 延续同一负载生命周期到十分钟，确认第十分钟相对预热后第二分钟内存增幅不超过百分之二十；记录绝对 RSS、峰值及完整负载结束标记。
      - 在同一运行中记录本地输入 UI 反馈 p95 不超过 100 ms，端到端 PTY 回显单独计量，不把网络延迟算作渲染性能。

  - id: IOSTERM-011
    name: 原生客户端退出只释放自己的连接
    required: true
    description: >
      两个独立客户端观察同一远端 session 时，关闭原生视图不得结束会话或断开另一个客户端。
    preconditions:
      - 专用 Backend 有一个测试 tmux session，另一个测试客户端已经连接并独占输入和 resize。
      - 原生验证入口支持本用例只读观察、不发送 resize，双方均为测试资源。
    steps:
      - 原生只读附着并接收输出；通过另一个测试客户端产生 marker，确认双方收到同一会话更新。
      - 关闭原生终端视图；确认其 socket 和订阅已释放，另一个测试客户端仍在线且可继续产生输出。
      - 确认后端 session 未被删除、tmux 未退出，原生释放后无继续写入或 resize 回调。

  - id: IOSTERM-012
    name: 协议未知扩展与已知字段错误可区分
    required: true
    description: >
      原生协议消费能容忍可忽略扩展，对已知消息结构错误明确失败，不崩溃或无限重连。
    preconditions:
      - 专用协议 fixture 能向真实原生 SessionController 提供无敏感合法消息、未知消息和已知消息的错误字段。
      - 已记录所用 shared 合同 commit 与 Swift DTO 映射。
    steps:
      - 发送合法消息并附加未知可选字段及一种未知事件；确认已有状态继续显示，未知事件仅留下脱敏记录。
      - 发送缺失必需 data 的 output；确认显示明确协议错误，不将空数据当成功，也不产生失控重连。
      - 核对错误关联到当前 connection、session 和 generation，旧实例消息不能改变新实例状态。

  - id: IOSTERM-013
    name: 声明的最低 iOS 版本能实际运行
    required: true
    description: >
      App host 声明的最低系统支持必须有该版本实际运行证据，最新模拟器编译成功不能替代。
    preconditions:
      - 已读取 App host 的 IPHONEOS_DEPLOYMENT_TARGET，并有可运行该版本的专用设备或兼容 simulator。
      - 已有对应签名或模拟器构建条件、专用 Backend 与 tmux 会话。
    steps:
      - 在最低版本环境安装并启动原生 App，记录 OS、构建与依赖锁定版本。
      - 登录并打开专用终端，确认导航与实际终端交互无不可用 API 崩溃。
      - 无法获得该版本运行环境时记录 blocked；不得用提高 deployment target 或仅执行 build 将本例改为 pass。

  - id: IOSTERM-014
    name: 原生终端保留普通 PTY 会话兼容性
    required: true
    description: >
      新客户端能消费现有 runtimeKind 为 pty 的会话，不将所有会话硬编码为 tmux。
    preconditions:
      - 专用 Backend 已创建 runtimeKind 为 pty 的独立测试会话，原生 App 已认证。
    steps:
      - 打开该会话并确认 connected 中的 runtimeKind 为 pty，输出与 raw 输入形成真实闭环。
      - 退出该测试 shell，确认原生 App 收敛到 exited，不调用 tmux 专属 copy mode 操作。
      - 确认释放客户端资源不触碰其他测试会话。

  - id: IOSTERM-015
    name: tmux 自动设备响应不会污染用户命令
    required: true
    description: >
      tmux attach 输出引发的 renderer 自动响应不能通过 pane 输入接口进入 shell，
      用户键盘和快捷键仍可输入，普通 PTY 保留终端查询响应能力。
    preconditions:
      - 原生 App 打开本例独占的真实 tmux shell，已记录初始进程与空输入行。
      - 可向本例 shell 输出设备属性、版本和窗口尺寸查询，并记录终端输入和 pane 文本。
    steps:
      - 由本例程序输出查询，等待 renderer 消费；确认 shell 输入行没有自动设备响应，后台未收到对应 pane input。
      - 显式输入唯一无副作用命令并发送，再操作快捷键；确认命令原文执行一次，没有被版本号或尺寸响应拼接。
      - 在独立普通 PTY 查询环境重放设备查询；确认收到合法终端响应，未将 tmux 专用抑制错误应用于普通 PTY。
