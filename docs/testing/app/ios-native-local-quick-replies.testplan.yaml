version: 1
name: iOS 纯本地快捷回复验收
description: >
  目标功能的实施后验收计划，当前不表示功能已实现或已通过。
  验证个人长文本回复只保存在手机、跨终端和电脑可用，选择只填入草稿，显式发送且不收录服务端快捷历史。
  原生 UI 通过 packages/app-ios/README.md 规定的 Xcode、devicectl 与既有 XCUITest 执行器取证，保存控件树和 xcresult；
  Playwright 或构建通过不能代替原生行为。每例独立建立自有 fixture，不依赖上一例的条目、登录或终端。
  仅使用本轮独占 Backend、测试账号、终端与无副作用文本消费者；结束后只清理本例资源，禁止修改个人数据。
cases:
  - id: IOSREPLY-001
    name: 手动管理保留完整长文本并可搜索排序
    required: true
    description: >
      验证本地库 CRUD、搜索和手动顺序是同一条目集合的确定性管理行为，正文和技能名称不被解析或截断。
    preconditions:
      - 候选 App 安装在本轮独占设备容器，回复库可正常读写。
      - 已准备三条包含中文、多行、美元符号技能名称的无敏感段落和可核对的原文。
    steps:
      - 从连接管理页进入快捷回复，逐条新增回复；确认列表显示标题和摘要，全文页内容与原文一致。
      - 分别搜索标题片段和正文中的技能名称；确认只出现匹配条目，清空搜索后原顺序不变。
      - 修改一条标题和正文并保存，再取消另一次编辑；确认仅保存的修改生效。
      - 在无搜索时手动调序，退出再打开列表；确认顺序保持，搜索状态下不能重排。
      - 取消一次删除，再确认删除；确认取消保留条目、确认只移除目标条目，其他正文和顺序不变。
  - id: IOSREPLY-002
    name: 保存校验拒绝空值和越界且不截断
    required: true
    description: >
      验证标题、正文与条目数量的明确边界，拒绝非法新增时原有数据不变，空标题按规则生成。
    preconditions:
      - 本轮独占 App 容器中可准备符合正式文件格式的容量 fixture，并在启动前完成准备。
      - 已准备空白正文、80 与 81 个 Swift Character 标题、恰好 65536 与 65537 UTF-8 字节正文。
    steps:
      - 从新增页尝试保存空白正文；确认无法成功保存且库未新增条目。
      - 使用空标题和合法多行正文保存；确认标题为首条非空行的前 40 个 Character，正文前后空白保持。
      - 分别提交边界内与边界外标题、正文；确认边界内成功，越界明确提示且编辑内容不丢失、不被截断。
      - 在本例容量为 499 条的合法 fixture 上通过 UI 新增一条，再尝试新增；确认第 500 条成功、第 501 条被拒绝，已有条目仍可编辑。
  - id: IOSREPLY-003
    name: 从输入草稿保存只复制文字
    required: true
    description: >
      验证保存为快捷回复不发送、不清空草稿，不把图片或远端附件路径复制到库。
    preconditions:
      - 候选 App 已打开本例专用终端，输入框有两行文字及一张已上传的无敏感图片。
      - 可读取本例 Backend 输入请求与本地回复文件，已记录草稿及附件状态。
    steps:
      - 点击保存为快捷回复，修改标题并保存；确认新条目正文只包含文字草稿，不含附件内容或自动拼装路径。
      - 返回输入面板；确认原草稿与图片仍在，Backend 没有新 input 请求。
      - 再进入保存页并取消；确认库无新增且草稿不变；清空文字保留图片时确认保存入口禁用。
  - id: IOSREPLY-004
    name: 选择回复只填入且保护已有草稿
    required: true
    description: >
      验证空草稿填入与非空草稿追加、替换、取消的语义，所有选择均不向终端发送，附件不受影响。
    preconditions:
      - 候选 App 已打开本例终端和输入面板，本地库有一条正文已知的多行回复。
      - 可读取本例 input 与 WS raw 输入数量，准备一张无敏感测试附件。
    steps:
      - 在空文字草稿中选择回复；确认返回编辑器并聚焦，文字原样填入且没有 input 或 raw 输入。
      - 将文字改为本例唯一草稿并添加附件，选择回复后取消；确认文字和附件不变。
      - 再选回复并追加；确认结果为原草稿、一个换行和完整正文，附件保留。
      - 再选回复并替换；确认仅文字替换、附件保留，整个过程无输入请求，库原文不变。
  - id: IOSREPLY-005
    name: 显式发送投递当前编辑快照且禁止快捷历史
    required: true
    description: >
      验证快捷回复经编辑后只有点击发送才投递一次，发送携带禁止收录策略，服务端完整快捷库没有新增或修改。
    preconditions:
      - 候选 App 连接支持 recordQuickInput 的独占 Backend，并打开本例只接收文本的安全终端。
      - 本地回复含唯一标记、多行文字和技能名称，不命中现有敏感过滤规则；Backend 快捷库已保存完整前置快照。
      - 可捕获本例 HTTP 请求及终端实际收到的内容；不依赖分页列表判断未收录。
    steps:
      - 填入回复并临时修改正文；确认界面显示当前电脑和终端上下文，点击发送前远端没有收到内容。
      - 点击发送；确认唯一请求携带 recordQuickInput 为 false，并取得匹配 operationId 和 terminalSessionId 的接受确认。
      - 核对终端收到的正文符合既有发送整理规则且只有一次；确认输入面板关闭、已发送草稿清空、本地模板未被临时编辑改写。
      - 对比服务端完整快捷库文件前后快照；确认没有新增、更新、使用次数变化，不能用敏感过滤或项目筛选作为未收录证据。
  - id: IOSREPLY-006
    name: 跨项目与终端共用个人回复库
    required: true
    description: >
      验证同一 Backend 内终端和项目不是回复库的分区，切换后修改同一条目可在其他终端看到。
    preconditions:
      - 候选 App 已登录本例 Backend，具备不同项目下的两个独占终端。
      - 已通过管理页创建本例唯一回复并记录条目 ID、正文和顺序。
    steps:
      - 分别打开两个终端的回复库；确认唯一回复在两处可见且内容、顺序一致。
      - 在第二个终端编辑该回复，再返回第一个终端；确认显示同一条目的新内容而非生成终端副本。
      - 删除本例第二个终端后从管理页查看；确认回复仍存在，其他终端草稿未被填入或发送。
  - id: IOSREPLY-007
    name: 切换不同电脑仍使用同一本地库
    required: true
    description: >
      验证个人回复不随 Backend 身份变化，两个电脑的服务端快捷库都不参与加载和管理。
    preconditions:
      - 候选 App 已配置本轮两个可达独占 Backend，分别具有测试账号与安全终端。
      - 已在 App 创建唯一回复；可观察两端请求及各自快捷库前置快照。
    steps:
      - 在电脑 A 的终端打开回复库，再切换电脑 B 并打开其终端回复库；确认同一回复存在。
      - 在 B 编辑正文并手动排序，返回 A 查看；确认编辑与顺序保持。
      - 核对两个 Backend；确认期间没有调用 quick-inputs 读写接口，服务端快捷库快照未变化。
  - id: IOSREPLY-008
    name: 注销不会清理个人回复
    required: true
    description: >
      验证注销的草稿与认证清理边界不影响 App 级个人回复库。
    preconditions:
      - 候选 App 登录本例测试账号，存在本例终端草稿和通过 UI 保存的唯一回复。
      - 已记录回复全文和顺序，测试账号允许重新登录。
    steps:
      - 主动注销当前账号；从连接管理页进入回复库，确认唯一回复仍可查看和编辑。
      - 重新登录测试账号；确认回复保持注销后编辑的内容，所属终端旧草稿按原有注销规则已清理。
  - id: IOSREPLY-009
    name: 删除连接不会清理个人回复
    required: true
    description: >
      验证删除 Backend 配置不删除手机个人数据，最后一个连接删除后仍可管理回复。
    preconditions:
      - 独占 App 容器只有本例可删除连接，并有通过 UI 创建的唯一回复。
      - 删除连接不会影响其他用户，已记录正文和排序。
    steps:
      - 删除本例连接并返回无连接页面；通过连接管理入口打开回复库。
      - 确认原回复正文和顺序完整，新增、编辑仍可成功且不要求登录 Backend。
  - id: IOSREPLY-010
    name: App 冷启动恢复回复和排序
    required: true
    description: >
      验证成功保存的本地库跨进程恢复，不依赖内存缓存或远端拉取。
    preconditions:
      - 候选 App 独占容器可正常读写；本例通过 UI 新建两条回复并手动调序，所有保存已确认成功。
      - 已取得关闭前的条目全文、顺序和本地文件快照。
    steps:
      - 终止候选 App 进程，重新启动正式入口并重新取得新进程的控件树与 UI 引用。
      - 从管理入口打开回复库；确认两条回复及顺序与关闭前一致，没有 Backend 列表请求。
      - 检查独立存储目录的文件保护属性和排除备份属性；确认已设置设备文件保护且不进入系统备份。
  - id: IOSREPLY-011
    name: 离线可管理但不会排队补发
    required: true
    description: >
      验证离线不阻止本地管理，离线选择不产生可在重连后自动执行的输入队列。
    preconditions:
      - 候选 App 已打开本例终端，随后可切断本例 Backend 网络并恢复。
      - 本地库已有唯一回复，能核对网络恢复后的真实输入次数。
    steps:
      - 切断 Backend 网络，在管理入口新增并编辑一条回复；确认成功且无网络错误阻塞保存。
      - 在仍可访问的终端输入面板选择回复；确认只形成草稿，发送受离线限制。
      - 恢复网络并等待连接稳定；确认远端没有收到自动补发，草稿与本地回复仍在。
  - id: IOSREPLY-012
    name: 本地写失败不显示成功或丢失旧数据
    required: true
    description: >
      验证正式存储路径的实际 I/O 失败不提交内存假成功，解除失败后可由用户明确重试。
    preconditions:
      - 本轮独占 Simulator 容器已有合法回复文件和前置副本，候选 App 已加载该库。
      - 可仅对本例归档目录制造可恢复的真实不可写条件，不替换业务 store 为 mock。
    steps:
      - 制造不可写条件后编辑条目并保存；确认出现明确失败，编辑内容仍在，列表与磁盘仍保持旧值。
      - 分别尝试新增、删除和调序；确认均不显示成功、不丢失已存条目，磁盘前置数据保持。
      - 恢复写入条件，由用户重试保存；确认仅本次明确重试生效，恢复本例目录权限。
  - id: IOSREPLY-013
    name: 损坏或未知版本归档不会被空库覆盖
    required: true
    description: >
      验证归档不可读时失败关闭并保留原字节，已损坏与未知版本都不能当作首次空库。
    preconditions:
      - 本轮独占 Simulator 容器和候选 App 可重启，已有合法归档副本可恢复。
      - 可在进程停止时分别准备损坏 JSON 和高于候选支持版本的归档，记录各文件摘要。
    steps:
      - 停止 App 并放入损坏归档，启动后重新获取控件树；进入回复库，确认显示读取错误且不允许覆盖保存。
      - 核对文件摘要仍与损坏前置文件一致；在同一容器重复未知版本分支，确认同样保留文件并阻止覆盖。
      - 停止 App、恢复本例合法副本并重新启动获取新 UI 引用；确认原条目恢复可见，没有静默重置。
  - id: IOSREPLY-014
    name: 冷启动草稿保留禁止收录标记
    required: true
    description: >
      验证快捷回复填入并编辑后的草稿在进程重启后仍携带历史禁止策略，不能因只恢复文字而泄漏到快捷库。
    preconditions:
      - 候选 App 已登录支持新协议的独占 Backend，存在本例安全终端及唯一回复。
      - 能读取草稿归档、输入请求和完整服务端快捷库快照。
    steps:
      - 填入回复、追加手打文字后关闭输入面板，等待文字和隐私标记成功归档，记录未发送草稿与服务端前置快照。
      - 终止并重新启动 App，重新获取 UI 引用并进入相同终端；确认完整草稿恢复。
      - 点击发送；确认请求仍携带 recordQuickInput 为 false，正文送达一次且服务端快捷库快照未变化。
  - id: IOSREPLY-015
    name: 普通输入默认行为与隐私标记清理兼容
    required: true
    description: >
      验证可选协议只影响带策略的输入，省略字段及显式 true 仍收录，非法类型执行前拒绝；用户清空文字后新草稿恢复普通策略。
    preconditions:
      - 本例独占新 Backend 和真实文本终端可核对请求、接收内容及快捷库；测试文本均有不同唯一标记且不命中敏感过滤。
      - 候选 App 已登录该 Backend，本地存在一条快捷回复。
    steps:
      - 通过真实 HTTP 输入入口分别发送省略 recordQuickInput 和显式 true 的合法请求；确认接受并各自收录，原有权限校验没有被绕过。
      - 用非 boolean 值提交同入口；确认校验拒绝、终端未收到该唯一内容且快捷库未新增。
      - 在手机填入快捷回复后将文字彻底清空，再手打新的唯一正文并发送；确认请求省略策略字段并按原行为收录。
      - 对新的普通草稿仅执行保存为快捷回复，再发送该草稿；确认保存动作本身不改变其默认历史策略。
  - id: IOSREPLY-016
    name: 旧 Backend 拒绝策略时不降级发送
    required: true
    description: >
      验证当前 strict-schema 旧 Backend 不支持 recordQuickInput 时明确失败，不移除字段、改走 raw 或自动重试。
    preconditions:
      - 本例运行真实未增加 recordQuickInput 的旧 Backend，已确认其 strict schema 在实际输入前拒绝未知字段。
      - 候选 App 已连接该 Backend 的独占安全终端，库内有不命中敏感过滤的唯一回复。
      - 能核对 HTTP、WS 输入、终端接收内容及服务端快捷库前置快照。
    steps:
      - 选择回复并点击发送；确认错误可见，草稿和输入面板保留，没有显示发送成功。
      - 等待并关闭再打开面板；确认没有移除策略后的新请求、raw 绕行或自动重试，终端没有收到正文。
      - 核对服务端完整快捷库没有变化，原库条目与手机回复保持不变。
  - id: IOSREPLY-017
    name: 发送未确认保留草稿且不自动重发
    required: true
    description: >
      验证请求已可能接受但响应丢失时不宣称失败即未执行，不清理草稿或隐私标记，不自行重试。
    preconditions:
      - 候选 App 连接本例支持新协议的独占 Backend 和安全文本消费者。
      - 可在请求被真实 Backend 接受后仅丢弃本例响应，保留请求次数与接收内容证据。
    steps:
      - 填入唯一回复并发送，丢弃接受响应；确认 App 显示结果未确认提示、输入面板与草稿保留。
      - 恢复网络并等待连接稳定；确认没有自动新请求，Backend 最多接受本次一次，快捷库没有收录。
      - 关闭再打开输入面板并核对草稿归档；确认正文和禁止收录标记仍存在，不以再次发送作为本例恢复步骤。
  - id: IOSREPLY-018
    name: 迟到操作不能改写新目标或新草稿
    required: true
    description: >
      验证选择和发送的异步操作受目标身份隔离，旧终端确认不能清理新目标草稿。
    preconditions:
      - 本例独占 App 和 Backend 存在两个安全终端，可延迟本例发送的真实响应。
      - 已准备唯一快捷回复，既有原生执行器可配合实际导航和允许的草稿编辑，不伪造业务成功响应。
    steps:
      - 在终端 A 打开回复库后通过允许的导航切换至 B；确认 A 的选择上下文失效或关闭，不能把迟到填入应用到 B。
      - 在 A 发出带策略的请求并延迟响应，通过正式连接导航切换至 B，保留 B 的已有草稿，再释放 A 的真实响应。
      - 确认旧确认不清除 B 的草稿和标记；返回 A 时不得将 A 的迟到成功反馈归属给 B。
      - 核对请求中的 terminalSessionId 始终为原目标，B 没有收到 A 的文字；清理本例延迟机制。
  - id: IOSREPLY-019
    name: 回复导航不破坏终端尺寸和媒体生命周期
    required: true
    description: >
      验证回复库作为输入面板内部导航，不重挂终端、不引发额外 resize，媒体忙时不允许销毁录音或转写视图。
    preconditions:
      - 候选 App 打开本例独占真实 tmux 终端，已记录 rows、cols、WS resize 数量和远端 stty size。
      - 设备可使用软件键盘与麦克风，回复库已有多行条目。
    steps:
      - 在设备方向不变时打开输入面板、回复列表、编辑页，返回并填入，再关闭面板；确认终端仍挂载、尺寸与 stty size 不变且无额外 resize。
      - 确认长正文可滚动查看，搜索、新增、返回、填入及发送入口可达，不与特殊按键入口混淆。
      - 开始录音或转写后尝试进入回复库；确认入口受忙状态限制且媒体操作不中断，完成或取消后恢复进入能力。
  - id: IOSREPLY-020
    name: 正常覆盖升级保留个人回复和草稿
    required: true
    description: >
      验证同 Bundle ID 的同协议覆盖安装不丢个人库、排序、草稿隐私标记或附件。
    preconditions:
      - 本例独占设备安装支持本地回复的候选 App，可通过正式 UI 创建回复、排序及带图片附件的草稿。
      - 第二个同协议候选构建可按既有工具覆盖安装，不卸载、不清除容器或更换 Bundle ID。
    steps:
      - 在首个候选中创建本例回复并调序，将其填入草稿并添加图片，确认文字与隐私标记成功归档，记录回复与草稿快照。
      - 停止候选并覆盖安装第二个同协议构建，重新启动并取得 fresh UI 引用；确认个人回复、排序、草稿及标记完整，附件保留。
