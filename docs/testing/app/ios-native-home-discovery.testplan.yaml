version: 1
name: iOS 首页终端关注、搜索与重命名验收
description: >
  验证 iOS 首页保留项目分组，并通过未读与执行态临时上浮、服务端置顶、搜索结果自动展开和终端别名改善查找。
  这是候选功能的验收合同，未执行不代表行为通过。每例独立建立本轮拥有的临时项目、终端和认证上下文，
  不依赖其他 case 遗留状态，不向用户工作终端输入。原生行为通过 Simulator 或既有真机 XCUITest 实际操作；
  API 与存储结果通过同一隔离 Backend 取证。故障注入和重启只作用于本例拥有的进程。
cases:
  - id: IOSHOME-001
    name: 置顶入口共享同一个终端状态
    required: true
    description: >
      右滑和长按可置顶或取消，顶部与原项目内状态一致，置顶不改变项目归属、计数或会话身份。
    preconditions:
      - 候选 iOS App 已连接本例隔离 Backend，两个专用项目各有一个未置顶的空闲终端。
    steps:
      - 从首页进入，确认没有空的关注区；右滑第一个终端，点击置顶，确认关注区出现该终端和项目名，原项目行仍在并带置顶标识，项目计数不变。
      - 长按第二个项目的终端并置顶，确认顶部可直接区分两个项目，普通项目组顺序不变；后置顶的终端在前。
      - 从关注区取消第一个终端的置顶，确认顶部移除、原项目标识消失；从原项目长按取消第二个终端，确认空关注区隐藏。
      - 再次置顶并通过顶部和原项目入口分别打开同一终端，确认服务端 session ID 一致；保留截图、可用控件树和 overview 响应作为证据。
  - id: IOSHOME-002
    name: 显式置顶写入幂等且不改变运行态
    required: true
    description: >
      服务端生成并保存置顶时间，同值重复请求不改变时间，取消再置顶产生新时间；置顶操作不触发输入或排序副作用。
    preconditions:
      - 本例有隔离 Backend、有效认证和两个归属本例的空闲 shell，已记录其会话身份、活动时间、普通排序及输出基线。
    steps:
      - 通过真实 PATCH 接口依次将两个终端 pinned 设为 true，读取响应和 overview，确认均返回服务端 ISO 8601 时间且后一次较新。
      - 重复提交已置顶终端的 pinned true，确认 pinnedAt 不变；提交 false 两次，确认两次都为未置顶；再提交 true，确认得到新时间。
      - 核对会话列表、输出与活动时间，确认只有置顶元数据变化，没有新增命令、进程重启、项目重排或会话身份变化。
  - id: IOSHOME-003
    name: 置顶与别名在 Backend 重启后保留
    required: true
    description: >
      新元数据持久化不依赖 iOS 内存，旧记录缺少字段时兼容读取；由同一 fixture 完成重启前后取证。
    preconditions:
      - 本例独占一个可安全重启的 Backend 与数据目录，目录内有基线版本创建且不含 pinnedAt 的专用会话。
      - 本例执行者持有该进程的启动与停止记录，可重新解析端口和认证；不使用共享开发 Backend。
    steps:
      - 用候选 Backend 读取该旧记录，确认仍能列出终端且未置顶；设置一个终端置顶并修改别名，记录 API 与落盘字段。
      - 停止并重新启动本例 Backend，重新取得实际 endpoint 与认证，通过新请求读取 overview，确认别名和置顶时间原值保留，旧未修改终端仍未置顶。
      - 核对原有会话标识及记录仍在，没有因新增字段丢弃项目或终端。
  - id: IOSHOME-004
    name: 连接切换隔离服务端元数据与迟到响应
    required: true
    description: >
      同 Backend 的独立客户端读取相同记录，不同 Backend 的列表互不污染；切换后旧连接的响应不得覆盖当前列表。
    preconditions:
      - 本例拥有两个隔离 Backend A 和 B，各自包含易区分的专用项目，iOS 已配置两条连接。
      - 本例有只作用于 A 的请求延迟控制，可暂缓 overview 响应后放行，不记录认证内容。
    steps:
      - 在 A 上置顶并改名一个终端，用独立认证客户端重新读取 A，确认得到相同元数据。
      - 暂缓一次 A 的 overview 响应，在原生 UI 切换到 B 并加载列表，然后放行 A 的响应，确认 B 不出现 A 的置顶、别名或项目。
      - 切回 A 并刷新，确认重新读到 A 的服务端置顶和别名；B 的数据保持不变。
  - id: IOSHOME-005
    name: 搜索展开命中结果并精确恢复普通展开状态
    required: true
    description: >
      搜索不要求先展开项目，命中规则保持兼容；清空查询不污染普通展开集合，包括用户全部收起的情况。
    preconditions:
      - 候选原生首页连接本例 fixture，至少有六个专用项目；第六个项目有唯一名称的终端及一个置顶终端。
      - 已记录哪些项目展开、哪些项目收起，并拥有不会匹配任何数据的唯一查询词。
    steps:
      - 保持第六个项目收起，搜索其终端唯一名称，确认匹配终端直接可见且可点开，清空后原展开状态恢复。
      - 分别搜索项目名和终端摘要或目录中的唯一词，确认仍按现有字段匹配；搜索期间关注区只显示命中的条目。
      - 手动收起全部项目，再搜索并清空；确认不会重新展开前四个项目。仅含空白的查询同样视作已清空。
      - 输入无匹配查询，确认显示没有匹配结果；清空后所有原项目恢复，不被误判为没有项目。
  - id: IOSHOME-006
    name: 重命名保存、取消与恢复默认名称一致
    required: true
    description: >
      别名编辑只改变显示名称，两个首页位置与终端标题一致，取消保留原名，清空恢复服务端自动标题。
    preconditions:
      - 候选原生首页有本例专用置顶终端，已记录原始自动标题和 pinnedAt；该终端有一份本轮未发送草稿。
    steps:
      - 长按原项目行选择重命名，输入有首尾空白的中文名称后保存，确认首尾空白被去除，置顶行和原项目行都显示新名。
      - 用新名搜索并打开该终端，确认终端标题一致，原草稿完整且没有新增远端输入；确认 pinnedAt 未变化。
      - 从关注区再次编辑名称后取消，刷新后确认名称未变；再次进入编辑并保存空白名称，确认恢复 overview 提供的自动标题。
  - id: IOSHOME-007
    name: 元数据校验失败不会产生部分修改
    required: true
    description: >
      服务端拒绝非法置顶值和超限名称，原生端遵循同一长度限制，错误不会覆盖已有合法元数据。
    preconditions:
      - 本例有隔离 Backend、有效认证及一个已设置合法别名和置顶的专用终端；候选 App 连接同一环境。
    steps:
      - 通过真实 API 分别提交非布尔 pinned、客户端指定 pinnedAt 和超过 80 UTF-16 code units 的 alias，确认返回 400，随后读取仍为原值。
      - 在原生重命名界面输入超限文本，确认保存被阻止或显示明确校验错误且编辑文本保留；改成包含 emoji 且恰好 80 UTF-16 code units 的合法文本，确认能保存并原样读取。
      - 对不存在的本例随机 session ID 发起修改，确认返回 404，没有创建额外记录。
  - id: IOSHOME-008
    name: 写入或刷新失败不伪造保存结果
    required: true
    description: >
      未提交成功时保留旧状态，已成功但刷新失败时明确区分结果；重试不会重复置顶或改变时间。
    preconditions:
      - 本例拥有隔离 Backend、原生客户端和可恢复的存储写入及 overview 请求故障控制，仅影响本例终端。
      - 本例已记录旧别名与置顶状态，可通过恢复后的真实 API 核对是否提交。
    steps:
      - 使本例存储写入失败，尝试置顶与改名，确认 API 非 2xx、两处列表保留旧状态，改名文本可重试；恢复写入后读取仍为旧值。
      - 仅使修改成功之后的 overview 刷新失败，确认提示已保存但刷新失败，而不是声称修改失败或自动重发；恢复读取并主动刷新，确认显示实际已提交的新值。
      - 查看离线状态下的行操作，确认服务端修改禁用，不排队保存本地置顶；恢复连接后仍以服务端结果为准。
  - id: IOSHOME-009
    name: 终端元数据修改保持既有鉴权边界
    required: true
    description: >
      置顶和别名沿用受保护终端 API，无凭据请求不能写入，认证失败不会被当成本地成功。
    preconditions:
      - 本例隔离 Backend 启用认证，拥有一个专用终端及有效读取凭据，可以发送不带凭据的独立请求。
    steps:
      - 不带认证分别请求 overview 和终端 PATCH，确认均被现有鉴权拒绝，没有返回成功元数据。
      - 用有效凭据重新读取该终端，确认置顶和别名未被前述请求改变；正常认证请求仍可执行显式修改。
  - id: IOSHOME-010
    name: 删除已置顶会话后没有悬空入口
    required: true
    description: >
      删除仍走现有明确确认流程，成功后顶部与原项目同时移除，不因置顶而复制或残留会话。
    preconditions:
      - 候选 App 有本例明确可删除的专用置顶终端，其他项目中另有一个用于核对的本例终端。
    steps:
      - 长按置顶终端选择删除并取消确认，确认两个位置都保留该终端。
      - 再次删除并明确确认，等待刷新，确认顶部与原项目行均消失、原项目计数正确，API 返回会话不存在。
      - 确认用于核对的其他终端仍存在且可打开，清空关注区后不保留空白占位。
  - id: IOSHOME-011
    name: 首页快捷入口进入真实终端且保持输入能力
    required: true
    description: >
      从新置顶或搜索入口进入的是原生终端和真实 shell，列表改造不破坏已经落地的输入区交互。
    preconditions:
      - 本例隔离 Backend 有一个候选 App 可打开的专用空闲 shell，其临时目录允许写入本轮证据文件。
    steps:
      - 在首页给专用终端命名并置顶，从关注区入口进入，确认正确项目、标题、完整终端视口和右下角输入入口。
      - 打开覆盖式输入面板，发送本轮唯一打印命令并追加到临时证据文件；确认面板关闭、真实终端回显、草稿清空且证据文件仅出现一次标记。
      - 返回首页通过名称搜索再次进入，确认仍是同一 session ID，并保留前述输出和右下角输入入口。
  - id: IOSHOME-012
    name: 未读完成临时进入关注区并在确认后退出
    required: true
    description: >
      未手动置顶的终端收到新完成版本后立即上浮，成功打开或标记已读后自动退出关注区，且不写入置顶元数据。
    preconditions:
      - 候选 iOS App 在线连接本例隔离 Backend，拥有两个未置顶、无未读完成的专用空闲终端。
    steps:
      - 让第一个终端产生本轮唯一完成版本；确认它出现在关注区最前方，显示未读标识，并仍保留在原项目分组中。
      - 从关注区打开该终端并返回首页；确认已读确认成功后它退出关注区，原项目行仍存在，overview 中 pinnedAt 仍为空。
      - 让第二个终端产生新完成版本，通过长按菜单标记已读；确认它同样退出关注区且服务端已读版本等于本轮完成版本。
  - id: IOSHOME-013
    name: 在线执行态临时进入关注区并随状态退出
    required: true
    description: >
      未手动置顶的终端在启动中或执行中自动上浮，进入空闲或退出后自动下沉，项目内原顺序和置顶元数据不变。
    preconditions:
      - 候选 iOS App 在线连接本例隔离 Backend，拥有两个未置顶、无未读完成的专用空闲终端，并可控制其中一个终端的 Agent 状态迁移。
    steps:
      - 使目标终端进入 agent_starting；确认它立即出现在关注区并显示启动中，原项目内位置和项目计数不变。
      - 使同一终端进入 agent_running；确认它继续留在关注区并显示正在执行，overview 中 pinnedAt 仍为空。
      - 使同一终端进入 agent_idle；确认它自动退出关注区但仍保留在原项目分组，另一个终端顺序未改变。
  - id: IOSHOME-014
    name: 多种关注原因按优先级去重切换
    required: true
    description: >
      关注区按未读、执行态、手动置顶排序；同一终端同时满足多种原因时只显示一次，并随原因消失降级而非错误移除。
    preconditions:
      - 候选 iOS App 在线连接本例隔离 Backend，拥有未读终端、执行中终端、手动置顶终端，以及同时未读、执行中并手动置顶的重叠终端。
    steps:
      - 打开首页；确认未读终端位于仅执行终端之前，仅执行终端位于仅置顶终端之前，重叠终端在关注区只出现一次且保留图钉标识。
      - 确认重叠终端的未读版本；确认它仍以执行态留在关注区且只显示一次。
      - 使重叠终端进入空闲；确认它仍因手动置顶留在关注区，取消置顶后才退出，原项目分组和 session ID 始终不变。
  - id: IOSHOME-015
    name: 离线状态不使用缓存执行态临时上浮
    required: true
    description: >
      Backend 离线时保留可恢复的列表，但不能把缓存执行态当作实时事实；手动置顶和未读完成仍按持久状态显示。
    preconditions:
      - 候选 iOS App 在线连接本例可安全停止和恢复的隔离 Backend，关注区内分别有仅执行、仅未读和仅手动置顶的专用终端。
    steps:
      - 确认在线时三个终端均在关注区，且仅执行终端显示正在执行。
      - 停止本例 Backend 并等待 App 显示离线提示；确认列表缓存仍可见，但仅执行终端退出关注区，未读与手动置顶终端仍保留。
      - 恢复 Backend 并刷新；若权威状态仍为执行中，确认该终端重新进入关注区；若已空闲，确认它保持在原项目分组且不被错误上浮。
