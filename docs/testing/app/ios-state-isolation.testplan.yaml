version: 1
name: iOS 状态传播与渲染隔离
description: >
  验证终端数据变化仅通知实际消费者，覆盖页面不持续承担无关重绘，同时合法的当前状态和生命周期变化仍及时生效。
  使用本例拥有的模拟器、Backend 测试记录和 Profile 级测量；不向用户终端发送输入，不使用录像帧间隔判定性能。
cases:
  - id: IOSISOLATION-001
    name: 无关终端摘要不重建阅读和文档内容
    required: true
    description: >
      打开某终端的阅读、完整 Markdown 报告及其浏览器后，其他终端的摘要更新不替换阅读 hosting root，
      也不触发被覆盖文档的无关内容更新。
    preconditions:
      - 已通过共享设备池取得本例模拟器，安装记录可核对 Profile 构建身份。
      - 专用测试记录 A 具备可读取的会话和完整 Markdown 报告，B 为本例拥有的另一条记录。
      - 可记录 hosting root 替换、内容更新和主线程调度延迟，测量不修改认证或网站数据。
    steps:
      - 使用 toolkit:agent-device 从 A 的会话阅读打开完整报告，再打开其链接；确认层级、正文及前台对象身份。
      - 在 20 秒内每秒向客户端测试状态源提供 4 次 B 的不同摘要；确认最新数据已接收，A 的 hosting root 替换和被覆盖正文的无关内容更新均为 0。
      - 保存实际调度延迟、调用栈、发布数量和源码身份；若仍有超过 100 毫秒的宿主阻塞，定位并记录，不能仅以通知计数通过。
  - id: IOSISOLATION-002
    name: 单行更新不使其他首页行更新
    required: true
    description: >
      首页中只有实际变化的记录及受影响的汇总更新，其他行保留稳定身份。
    preconditions:
      - 本例模拟器中首页至少显示三条专用终端记录，可以记录各行内容更新和记录身份。
      - 本例测试数据源可以只改变其中一条的摘要，不改变所属项目、关注成员或排序。
    steps:
      - 记录三行的身份和内容，然后更新一条摘要；确认该行显示新摘要，其余两行没有内容更新且身份保持。
      - 重复投递相同值；确认不产生新的内容通知。
  - id: IOSISOLATION-003
    name: 影响搜索成员的变化仍更新列表
    required: true
    description: >
      行级隔离不阻断标题、路径或摘要变化对当前搜索结果成员的影响。
    preconditions:
      - 本例首页有两条专用记录，当前搜索词只匹配其中一条。
      - 可修改另一条记录的摘要，并可恢复原内容。
    steps:
      - 使另一条摘要包含当前搜索词；确认它进入结果且显示新摘要。
      - 移除该词；确认它退出结果，其余匹配行保留正确内容。
  - id: IOSISOLATION-004
    name: 当前终端状态仍实时更新
    required: true
    description: >
      限定订阅后，当前终端的标题、命令状态和可用操作仍随真实状态变化更新。
    preconditions:
      - 已打开本例拥有的专用终端，可以通过专用测试数据源改变该终端状态。
    steps:
      - 改变当前终端的标题及命令执行状态；确认标题、状态和停止或发送入口与新状态一致。
      - 重复相同状态；确认没有无意义的重复内容通知。
  - id: IOSISOLATION-005
    name: 其他终端完成只更新独立待接管提示
    required: true
    description: >
      其他终端完成时待接管数量及时变化，但当前终端主体和输入器不被重建。
    preconditions:
      - 本例有两个专用终端，A 的输入器已打开并有未发送草稿，B 尚无未读完成。
      - 可记录 A 的编辑器身份、选区及主体更新，B 的完成来源属于本例。
    steps:
      - 产生 B 的一次未读完成；确认待接管数量变化，A 的编辑器身份、选区、草稿和主体保持。
      - 确认 B 的完成仍可正常接管，未因隔离而丢失或提前确认。
  - id: IOSISOLATION-006
    name: 草稿编辑仅更新所属终端
    required: true
    description: >
      A 的文字和禁止收录标记变化只通知 A 的编辑器及所属提示，不改变 B 的草稿或预览。
    preconditions:
      - 本例同一电脑有专用终端 A 和 B，分别保存可识别的未发送草稿。
      - 已准备各自草稿状态通知的记录方式。
    steps:
      - 使用 toolkit:agent-device 编辑 A 并改变其禁止收录标记；确认 A 立即更新，B 没有收到草稿内容通知。
      - 返回并打开 B；确认原草稿和标记保持，A 的改动按原归档合同保存。
  - id: IOSISOLATION-007
    name: 旧发送确认不清理新草稿
    required: true
    description: >
      草稿状态迁移到独立 owner 后仍按 revision 处理确认，迟到响应不删除后续编辑。
    preconditions:
      - 本例专用终端允许提交测试输入，并可延迟该次输入的确认响应。
    steps:
      - 提交本例草稿并保留其确认，然后在同一终端输入新的草稿。
      - 释放旧确认；确认新草稿和标记保持，只有旧快照的确认状态被处理。
  - id: IOSISOLATION-008
    name: 覆盖期间保留数据返回时同步
    required: true
    description: >
      页面被覆盖时不消费无关展示更新，但数据源持续更新，返回后显示最新状态而不是冻结旧数据。
    preconditions:
      - 本例模拟器已打开专用终端 A 上方的阅读或文件覆盖层，能够独立更新 A 的可识别状态。
    steps:
      - 在覆盖层可见时更新 A 的状态；确认底层数据已接收，覆盖层的位置和内容保持。
      - 关闭覆盖层返回 A；确认一次同步到最新状态，终端 surface 身份和已接受视口保持。
  - id: IOSISOLATION-009
    name: 连接切换仍使旧预览失效
    required: true
    description: >
      窄订阅不隐藏连接或路由失效，旧浏览器和迟到响应不能污染新电脑。
    preconditions:
      - 本例有两个专用 Backend A 和 B，均可登录且内容可区分。
      - A 的阅读及文件浏览器已打开，并可延迟 A 的一次只读响应。
    steps:
      - 切换到 B；确认旧来源被失效，界面显示 B 的数据。
      - 释放 A 的迟到响应；确认 B 的状态不变，旧链接动作不能使用新来源执行。
  - id: IOSISOLATION-010
    name: 已删除的当前终端及时退出
    required: true
    description: >
      当前记录删除仍在正确路由上生效，不因隔离保留失效的操作入口。
    preconditions:
      - 本例模拟器打开一个允许删除的专用终端，该终端没有用户数据或未发送草稿。
    steps:
      - 通过本例管理入口删除该终端；确认客户端退出其失效路由，不能继续发送输入。
      - 确认其他专用终端和连接保持。
  - id: IOSISOLATION-011
    name: 原始输出流保持隔离和连续
    required: true
    description: >
      专用终端的持续输出保持内容和顺序正确，不触发无关页面的状态广播或正文重建。
    preconditions:
      - 本例拥有可产生带序号输出的专用终端，当前没有用户正在操作其输入。
      - 可以记录输出序号、对应状态通知和同一客户端的主线程响应。
    steps:
      - 在该专用终端持续输出带序号内容并打开其覆盖层；确认客户端继续接收，不丢序、不重复提交输入。
      - 返回终端；确认内容和视口连续，无关阅读或文件正文没有随每段输出重建。
  - id: IOSISOLATION-012
    name: 正文首次和重复滚动无宿主重建风暴
    required: true
    description: >
      实际文章正文加载后，首次及重复滚动均不再伴随隐藏 Markdown 树的持续重建；不同缓存条件分别记录。
    preconditions:
      - 本例模拟器已登录目标网站，可以从真实会话和完整原报告打开目标文章正文。
      - 已记录源码、构建、报告字节和滚动手势，前后版本使用同一设备且测量期间没有并行编译。
    steps:
      - 使用 toolkit:agent-device 建立真实层级，确认正文标题和内容；执行固定首次滚动并保存真实主线程测量和调用栈。
      - 按同样操作重复三轮暖态滚动；确认没有隐藏正文重建风暴，并逐轮报告长停顿，不用平均值掩盖单次长停顿。
      - 返回文档再回到网页；确认位置、链接及正文可用，缓存状态与测量结果如实标注。
  - id: IOSISOLATION-013
    name: 项目级联删除使当前终端及输入覆盖层退出
    required: true
    description: >
      project_deleted 的精确终端清单也使所属路由失效，不能只处理单终端删除事件，
      或依据离线、进程退出、暂时缺失的 overview 猜测终端已删除。
    preconditions:
      - 本例独立项目含允许删除的专用终端 A，A 没有未发送草稿或用户数据。
      - 模拟器已打开 A 的输入面板，另有未删除项目中的终端可只读核对。
    steps:
      - 通过本例 Backend 管理入口删除整个项目，确认响应成功且项目删除事件的终端清单包含 A。
      - 确认客户端退出 A 的失效路由，输入面板和键盘关闭，不再存在可对 A 输入的旧界面。
      - 只读核对未删除项目中的终端仍存在；保留删除前后 UI、构建身份与原始结果。
