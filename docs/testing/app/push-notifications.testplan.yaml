version: 1
name: 通用推送服务
description: >
  验证统一 APNs 网关的显式类别订阅和请求合同；每例使用独立状态、凭据与 APNs 记录器，不向真实手机发送。
cases:
  - id: PUSH-001
    name: 电量与其他业务共用显式类别订阅
    required: true
    description: >
      网关统一处理通知类别与正文，只有明确订阅的类别可投递；缺失类别列表不能隐式订阅电量。
    preconditions:
      - 本例使用隔离网关及有效 host 凭据，两个目标分别订阅 battery.low 和 task.completed，APNs 边界记录请求。
    steps:
      - 注册时省略 categories，确认返回 400 且没有创建订阅。
      - 向统一通知接口提交两类合法通知，确认各自目标收到请求中的标题正文，均返回 notificationId 和投递状态。
      - 给仅订阅 battery.low 的目标提交 task.completed，确认返回 403 且没有 APNs 请求。
  - id: PUSH-002
    name: 发送接口仅接受统一通知合同
    required: true
    description: >
      所有业务共用统一发送入口与严格字段校验，电量专用接口不存在，无效请求不会外发。
    preconditions:
      - 本例隔离网关具有有效发送凭据和已注册的 battery.low 订阅，APNs 记录器可确认外发次数。
    steps:
      - 向 /v1/notifications 提交合法的事件 ID、类别、标题正文和发生时间，确认接受请求并返回稳定 notificationId。
      - 对本例新事件额外提供 token、URL 或 topic，确认返回 400 且没有外发。
      - 提供空标题或正文，确认返回 400；提供超过最终 UTF-8 负载上限的正文，确认返回 413 且没有外发。
      - 请求旧电量发送和轮次结束路径，确认返回 404 且没有存储或 APNs 变更。
  - id: PUSH-003
    name: 单一通知类别不能独占目标共享额度
    required: true
    description: >
      同 host、安装和环境的总额度仍为每分钟最多四次尝试，单一类别最多三次；
      其他类别可使用剩余额度，别名、重试或网关重启不能绕过限制。
    preconditions:
      - 使用隔离 HTTPS 网关、真实 SQLite 和记录式 APNs 边界，同一目标通过独立订阅分别启用 terminal.reply、battery.low 和 task.completed，并有同类别地址别名。
      - 可以在本例独占存储副本中重启网关，并构造缺少 category 的旧投递记录及已退出限流窗口的时间戳，不修改正式数据。
    steps:
      - 在同一分钟向目标提交三条不同的 terminal.reply，确认均受理；第四条同类请求及经地址别名提交的同类新事件均返回 429，没有新增 APNs 请求。
      - 重放已受理事件，确认返回原结果且不占新额度；随后提交 battery.low，确认受理并进入 APNs 边界；再提交 task.completed，确认因四次总额度耗尽而返回 429。以另一份目标重复该组合，结果一致。
      - 在同类别三次额度已用完时重启独立存储副本，确认原类别仍被限流、旧事件重放不外发，而另一个类别仍能使用第四次额度。
      - 向另一安装目标提交通知，确认独立受理；让原目标同类别的一条请求需要重试，确认重试同样受单类别和总额度约束，不会抢占留给其他类别的额度。
      - 对三条缺少 category 的旧记录提交不同类别请求，确认保守拒绝，不从当前订阅列表猜测归属；将本例旧记录移出限流窗口后，确认新请求恢复受理。
      - 保存 HTTP 状态、存储和 APNs 边界计数，关闭自有网关与存储；明确本例不证明真实手机送达，也不提供特定类别的优先级保证。
