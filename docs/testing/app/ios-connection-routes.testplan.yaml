version: 1
name: iPhone 多线路选择与会话恢复验收
description: >
  验证 2026-10-08 多线路计划的目标行为，用例定义验收合同，执行结果见 iOS 验收状态。
  每例自行建立独占 Backend、iOS 客户端和受控线路，不依赖上例。
  原生 UI 使用 toolkit:agent-device；注入只影响本例线路，不修改用户真实网络或停用共享服务。
  代理故障结果与真机实网切换分别取证，不以 HTML 原型代替原生通过。
cases:
  - id: IOSROUTES-001
    name: 自动按优先级使用第一个可信可用线路
    required: true
    description: 验证选择顺序、单条超时预算以及成功后停止尝试。
    preconditions:
      - 本例已登录独占 Backend，并配置指向该实例的三条线路 A、B、C，顺序为 A、B、C。
      - A 可受控超时，B 和 C 可用；可记录探测开始时间与受保护请求计数。
    steps:
      - 使 A 超时并在原生线路页选择自动、点击重新选择；确认先检测 A，再检测 B，进度名称与序号对应。
      - 确认 B 在 A 探测的 2.5 秒预算及可解释调度开销后开始，B 验证成功后显示当前使用 B，未为本轮继续探测 C。
      - 确认只有 B 承接业务请求，未并行竞速选择更快但优先级更低的 C。
  - id: IOSROUTES-002
    name: 高优先级恢复后保持当前可用线路
    required: true
    description: 验证恢复可达性本身不抢切，只有主动重选才回到高优先级。
    preconditions:
      - 本例电脑有 A、B 两条已信任线路，A 优先；A 起初不可达，原生 App 正通过 B 使用终端。
      - 可恢复 A 而不改变 B，已记录 B socket 与当前 terminal ID。
    steps:
      - 恢复 A 并保持 B 正常，触发一次系统网络路径通知；确认验证 B 后继续使用 B，终端不因 A 恢复而重建。
      - 从线路页点击重新选择；确认重新从 A 开始，最终使用 A 且仍是同一电脑。
  - id: IOSROUTES-003
    name: 手动固定失败不回退其他线路
    required: true
    description: 验证固定选择是持续约束而非优先尝试提示。
    preconditions:
      - 本例电脑有可用 B 和可阻断 A，原生 App 已登录，能观测两条线路请求。
    steps:
      - 手动固定 A 后阻断 A，点击重新连接；确认仅尝试 A，显示固定线路无法连接，B 没有候选探测或业务访问。
      - 恢复等待期间确认不会自动使用 B；切回自动选择后才允许选择 B。
  - id: IOSROUTES-004
    name: 线路增删改与排序按电脑独立保存
    required: true
    description: 验证配置操作不影响另一电脑，排序与名称编辑不打断当前连接。
    preconditions:
      - 本例独占 iOS 客户端有电脑 P 和 Q；P 当前线路 B 正常，P 至少有三个候选。
      - 可在同一 App 进程内重新打开连接管理，不需要重启 fixture。
    steps:
      - 给 P 添加带合法路径前缀的新 URL；确认追加末尾，同电脑重复 URL 被拒绝，非 HTTP(S)、userinfo、query 和 fragment 输入被拒绝且旧配置保留。
      - 通过原生拖动和可访问的上移操作调整顺序，再修改名称；确认 B 不中断，返回再进入时顺序和名称一致。
      - 删除非当前线路并确认；确认只移除该项，Q 配置、登录和当前 B 不变。
  - id: IOSROUTES-005
    name: 删除固定线路后不隐式指定其他地址
    required: true
    description: 验证删除固定项清空选择，删除最后一项不删除电脑和草稿。
    preconditions:
      - 本例电脑已有两个线路、稳定登录与未发送草稿，手动固定第一条。
    steps:
      - 删除固定线路并确认；确认连接断开，显示请选择线路，另一条未被自动固定或访问。
      - 删除剩余线路；确认保留电脑与添加入口，凭据及草稿仍存在，没有远端删除请求。
  - id: IOSROUTES-006
    name: 同电脑切路保留终端与草稿
    required: true
    description: 验证替换传输不等于切换电脑或创建新终端。
    preconditions:
      - 本例独占 Backend 有两条可独立阻断且均可信的线路，原生 App 已打开同一测试终端。
      - 终端持续输出有序计数；输入框有唯一文本、禁止收录标记和未发送图片草稿。
    steps:
      - 阻断当前线路，使自动模式选择备用；确认页面仍是同一终端，SwiftTerm 内容保持可读且新输出恢复，无重复拼接或另建终端。
      - 确认文本、标记与图片草稿完整；服务端没有收到草稿、Stop 或自动补发的写入。
      - 手动发送本例 marker；确认新线路只投递一次并收到结果。
  - id: IOSROUTES-007
    name: 全部离线期间保留内容并有界恢复
    required: true
    description: 验证离线不冒充登出且不存在多个并行选路循环。
    preconditions:
      - 本例已登录并加载项目与终端，可同时阻断两条已信任线路；可读取脱敏探测时序。
    steps:
      - 阻断全部线路；确认保留登录、已读内容和草稿，显示各线路原因，写操作不可用。
      - 观察后续轮次间隔为 5、15、30 秒后保持 30 秒，同一电脑最多一轮选路，没有健康探测和 socket 重试叠加风暴。
      - 恢复一个线路；确认下一次选路恢复读写，不补发离线期间的操作。
  - id: IOSROUTES-008
    name: 后台停止选路并在前台恢复
    required: true
    description: 验证前后台生命周期控制恢复工作，不以系统网络状态直接判定在线。
    preconditions:
      - 本例电脑两条线路均可控制，原生 App 处于离线待重试；请求计数可独立观测。
    steps:
      - 将 App 切到后台并等待超过 30 秒；确认没有新选路轮次，旧探测结果不能将后台页面标为在线。
      - 恢复线路并将 App 带回前台；确认经过真实身份与认证检查后恢复，而非仅收到 NWPath 就宣布成功。
  - id: IOSROUTES-009
    name: 迟到探测不能覆盖新固定选择
    required: true
    description: 验证 selectionRevision 拒绝旧请求，不出现界面选择与实际传输不一致。
    preconditions:
      - 本例线路 A 和 B 均可信，可延迟 A 的探测响应；当前无在途业务写入。
    steps:
      - 发起自动选择并扣住 A 响应，再手动固定 B；确认 B 成为当前线路。
      - 释放 A 的旧成功和旧错误回调；确认固定项、当前线路、登录、页面内容均保持 B，A 无新业务请求。
  - id: IOSROUTES-010
    name: 替换当前地址先验证目标再恢复写入
    required: true
    description: 验证编辑 URL 使旧传输失效，未保存的配置不参与访问。
    preconditions:
      - 本例原生 App 手动固定 A，存在可替代的可信地址 B，且能观测 A 与 B 请求。
    steps:
      - 在表单把 A 地址改为 B 后取消；确认实际访问仍为 A，B 没有收到探测或认证。
      - 再次编辑并保存；确认旧传输失效，B 先完成无凭据证明再接收认证，电脑、终端路由和草稿未清空。
  - id: IOSROUTES-011
    name: 冷启动恢复模式并按其规则选路
    required: true
    description: 验证持久化恢复不以最后成功线路覆盖用户优先级和固定选择。
    preconditions:
      - 本例独占 App 与 Backend，可终止并重启本例 App；有 A 优先于 B 的两条可信线路。
    steps:
      - 自动模式通过 B 连接后恢复 A，关闭并启动本例 App，重新取得 UI 引用；确认从 A 开始选择。
      - 在同一 fixture 内手动固定 B 后再关闭启动本例 App，重新取得 UI 引用；确认仍固定 B，只尝试 B。
  - id: IOSROUTES-012
    name: 真机跨网络后仍访问同一电脑
    required: true
    description: 验证实际 Wi-Fi 路径与已有受信任 Devbox 隧道下的身份和会话连续性。
    preconditions:
      - 已授权使用指定测试 iPhone，该设备可切换一个真实局域网与一个可访问既有 Devbox 隧道的外部网络。
      - 同一独占 Backend 有本例已配置的 LAN 和隧道线路，二者均已绑定身份；本例不负责创建隧道。
    steps:
      - 真机通过 LAN 打开测试终端并留下草稿，记录设备、安装版本、电脑身份和 terminal ID。
      - 将真机切到外部网络，确认自动通过隧道恢复同一身份与终端，草稿不变；采集真实 UI 与对应请求证据。
      - 若指定设备、网络或隧道不可用，记录该例阻塞，不用模拟器或代理故障注入代替通过。
