version: 1
name: iOS 草稿隐私元数据兼容验收
description: >
  验证本地快捷回复引入的草稿隐私元数据在旧格式迁移和异步发送确认时不丢失或错误清理。
  这是待实现目标的测试合同，不表示已经通过。原生操作按 packages/app-ios/README.md 使用既有 XCUITest 执行器，
  保存 xcresult 与控件树；每例独立使用专用设备容器、测试账号和真实 Backend，不依赖其他用例。
cases:
  - id: IOSDRAFTPRIVACY-001
    name: 旧字典归档升级后保留文字和附件
    required: true
    description: >
      验证旧草稿字典可读取，未使用快捷回复时默认不禁止历史，后续写入新版格式不丢失其他终端草稿或图片。
    preconditions:
      - 本例独占设备安装未增加草稿隐私元数据的旧 App，已通过正式 UI 为两个测试终端保存文字，其中一个有图片附件。
      - 已记录旧字典文字和附件归档，候选 App 可按相同 Bundle ID 覆盖安装，禁止卸载或清空容器。
    steps:
      - 停止旧 App，覆盖安装候选后重新启动并取得新控件树；进入两个原终端，确认各自文字和附件完整。
      - 在其中一个终端修改普通文字并关闭面板，等待成功归档；确认新版文字文件包含两个终端原有内容，隐私标记默认 false，附件文件不丢失。
      - 在该终端填入本例通过 UI 创建的快捷回复并再次归档；确认只对该终端设置禁止收录标记，另一终端的文字、附件和策略保持不变。
  - id: IOSDRAFTPRIVACY-002
    name: 旧发送确认不清除同文的新编辑
    required: true
    description: >
      验证发送确认按草稿版本而非仅字符串相等清理，用户在发送期间重新建立的同文草稿与隐私标记必须保留。
    preconditions:
      - 候选 App 连接支持新协议的本例独占 Backend，终端为无副作用文本消费者，输入编辑器在发送期间保持可编辑。
      - 可仅延迟本例真实输入接受响应，能读取草稿版本、归档和请求次数，不伪造成功响应或替换业务方法。
      - 本例通过 UI 创建并填入唯一快捷回复，已记录原正文。
    steps:
      - 点击发送并延迟真实接受响应；在编辑器将正文改为其他非空文字，再改回与已发送快照完全相同的原正文。
      - 释放真实响应；确认发送成功没有清除新版本的同文草稿，关闭或重开输入面板仍可看到它。
      - 核对新草稿禁止收录标记仍为 true、归档保留该文字，Backend 只收到原先一次请求且快捷库未收录。
