version: 1
name: iOS 终端图片附件验收
description: >
  在原生 Simulator 或真机照片选择器与隔离 Backend、真实 shell 上验证附件草稿。
  使用本轮专用图片、终端和请求记录，不向工作终端发送。每例重置专用终端草稿与故障注入。
  请求日志不包含认证凭据；上传路径含空格和单引号。图片上传本身不构成终端输入。
cases:
  - id: IOSIMAGE-001
    name: 图片预览随文字一次发送
    required: true
    description: 选图后在输入框顶部展示缩略图，文字保持原样，发送时才转换为正确引用的路径。
    preconditions:
      - 已进入专用终端，已有可记录实参的命令草稿，照片库有两张无敏感测试图片。
    steps:
      - 添加两张图片，确认上传完成且文字框没有路径；打开并关闭图片预览，确认草稿保留。
      - 取消一次新的照片选择，确认没有新增上传或终端输入。
      - 显式发送，确认只有一次 input，实参顺序与缩略图一致，每个路径都是一个实参且文件内容匹配；成功后清空本次文字和图片。
  - id: IOSIMAGE-002
    name: 上传失败和移除不丢失草稿
    required: true
    description: 上传中或失败时不能发送，失败可重试，移除后的迟到响应不能重新添加附件。
    preconditions:
      - 专用终端有文字草稿，隔离代理可对图片上传注入失败或延迟返回。
    steps:
      - 注入上传失败并添加图片，确认显示失败及重试，文字不变且发送禁用；解除故障后重试成功。
      - 移除已上传图片，再延迟另一张图片的响应；确认上传进度和发送禁用，移除后恢复发送能力。
      - 放行迟到响应，确认图片不再出现、文字不变，全程没有 terminal input。
  - id: IOSIMAGE-003
    name: 仅图片发送与输入失败恢复
    required: true
    description: 无文字时图片也可发送，输入失败保留附件，不自动重发。
    preconditions:
      - 专用终端没有文字草稿，隔离代理可在转发 input 前返回明确失败。
    steps:
      - 添加图片并等待上传，确认发送可用；注入 input 失败后点击发送，确认附件保留且不会自动重发。
      - 解除故障后显式重发，确认 payload 仅为正确引用的图片路径，成功后附件移除。
  - id: IOSIMAGE-004
    name: 附件按终端和连接隔离
    required: true
    description: 导航保留同一终端草稿，其他终端和连接不能看到或收到附件。
    preconditions:
      - 同一隔离 Backend 有两个专用终端，另有可切换的专用连接条目。
    steps:
      - 在第一个终端添加图片和文字，返回首页并打开第二个终端，确认没有前一个终端的草稿。
      - 回到第一个终端，确认文字与图片仍在；切换连接再返回，确认旧连接草稿已清空且没有终端输入。
  - id: IOSIMAGE-005
    name: 发送中新增内容独立保留
    required: true
    description: 输入确认只移除本次发送快照，发送期间新写文字和新加图片属于下一条草稿。
    preconditions:
      - 专用终端有文字及已上传图片，代理可延迟真实 input 的确认响应。
    steps:
      - 延迟 input 确认后点击发送，在等待时修改文字并添加另一张图片。
      - 放行确认，确认已发送图片移除，新文字和新图片保留；服务端只有原始快照的一次 input，未包含新增内容。
