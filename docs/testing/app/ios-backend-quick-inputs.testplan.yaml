version: 1
name: iOS Backend 快捷指令与后台运行验收
description: >
  新版功能的验收合同，具体通过情况以实际模拟器及 Backend 证据为准。验证手机快捷指令只以当前已登录 Backend
  中 projectId 为 null 的 pinned 列表为权威数据，终端文件之后的 Tab 提供直接发送、后台运行和菜单插入，旧本机归档不再读取或导入，并可启动既有后台运行。
  各例使用独占测试 Backend、连接、项目、终端和设备容器，按 toolkit:agent-device 操作原生 UI；
  构建、静态检查和原型截图不能替代原生行为或真实 Backend 证据。
cases:
  - id: IOSQUICK-001
    name: 全局已保存列表分页不漏项
    required: true
    description: >
      验证手机读取全局 pinned 手动顺序的所有分页；recent 和项目绑定项不进入列表，页面不提供搜索。
    preconditions:
      - 独占新 Backend 已登录，准备 101 条内容可辨认的全局 pinned 项、1 条 recent 项、1 条项目绑定 pinned 项和安全终端。
      - 测试者可读取 Backend 完整快捷库核对条目 ID。
    steps:
      - 用 toolkit:agent-device 打开文件后的快捷指令 Tab 并滚动至第 101 条；确认所有全局 pinned 项可到达且顺序与 Backend 一致。
      - 确认页面无搜索框，recent 和项目绑定项不可见；点击末条标题确认可查看完整正文。
  - id: IOSQUICK-002
    name: 手机增改删作用于同一 Backend 条目
    required: true
    description: >
      验证新增、标题和正文编辑、取消/确认删除都修改当前 Backend 的全局 pinned 集合，不生成本机副本。
    preconditions:
      - 独占手机已登录新 Backend，当前快捷库没有本例唯一标记，能读取服务端完整记录。
    steps:
      - 用 toolkit:agent-device 新增含唯一标记及多行正文的回复；确认 Backend 增加一条全局 pinned 项，全文未截断。
      - 编辑该项标题与正文后保存；确认 Backend 同一 ID 更新。再开始一次编辑并取消；确认已保存内容不变。
      - 取消删除后确认条目仍在；再次确认删除，确认只隐藏目标 ID，其他条目不变。
  - id: IOSQUICK-003
    name: 手机手动排序跨页面保持
    required: true
    description: >
      验证管理排序后的 Backend 手动顺序在快捷指令 Tab、设置页快捷指令库和重新进入页面时一致。
    preconditions:
      - 独占 Backend 有四条顺序和正文可辨认的全局 pinned 项及一条项目绑定 pinned 项，手机已登录并打开安全终端。
    steps:
      - 用 toolkit:agent-device 在快捷指令 Tab 打开指令管理、管理排序，将第四条全局项移到首位；确认 Backend 全局顺序已更新，项目绑定项未被移动。
      - 返回 Tab、离开再进入，并在“设置 → 快捷指令”打开快捷指令库；确认三处显示同一保存顺序，输入面板没有旧版前三条指令栏。
  - id: IOSQUICK-004
    name: 菜单插入仅追加草稿
    required: true
    description: >
      验证菜单插入在已有文字末尾追加完整正文并打开输入框，保留附件，不向终端发送或启动后台运行。
    preconditions:
      - 独占新 Backend 有全局 pinned 多行指令与安全终端，手机草稿已有可辨认文字和测试附件。
      - 可核对终端输入请求和 ScheduledRun 前置快照。
    steps:
      - 用 toolkit:agent-device 打开快捷指令 Tab，在目标卡片菜单选择插入输入框；确认返回终端并打开输入框，原草稿末尾换行追加完整正文，附件保持。
      - 核对 Backend 无 input 或 run 请求；关闭重开输入框后仍保留同一草稿。
  - id: IOSQUICK-005
    name: 插入后的显式发送不收录快捷历史
    required: true
    description: >
      验证用户明确发送已插入的回复时继续携带禁止快捷历史策略，不因改用 Backend 模板而泄漏到 recent。
    preconditions:
      - 独占新 Backend 有一条全局 pinned 回复和安全文本终端，能核对 input 请求及完整 recent 集合。
    steps:
      - 用 toolkit:agent-device 在卡片菜单选择插入输入框并在草稿尾部追加文字，确认发送前终端没有收到内容。
      - 用户明确点击发送；核对唯一 input 请求携带 recordQuickInput 为 false，终端仅收到一次正文，Backend recent 集合没有新增该内容。
  - id: IOSQUICK-006
    name: 连接切换隔离迟到列表和运行响应
    required: true
    description: >
      验证 Backend A 的迟到响应不能改写 B 的快捷指令、草稿或运行状态；切回时重读 A。
    preconditions:
      - 手机保存两个独占且已登录的新 Backend A、B；各有同名项目但不同全局 pinned 项和运行。
      - 可延迟 A 的真实列表及运行查询响应。
    steps:
      - 用 toolkit:agent-device 在 A 打开快捷指令并刷新，延迟 A 响应后切到 B；确认 B 指令列表和全局任务看板只显示 B 的记录。
      - 放行 A 的迟到响应；确认 B 列表、草稿、运行状态和导航未被 A 改写。
      - 切回 A；确认重新读取 A 的条目及运行，B 的同名项目内容没有混入。
  - id: IOSQUICK-007
    name: 离线不回退本机库或补发写入
    required: true
    description: >
      验证新 Backend 断线后显示离线状态，旧本机回复不会成为可见列表，恢复连接也不会自动补发写入或运行。
    preconditions:
      - 独占手机容器有一条旧本机回复和一个已登录新 Backend，可切断并恢复该连接。
      - 可核对 Backend 快捷库与快捷运行的前后记录。
    steps:
      - 用 toolkit:agent-device 切断 Backend 网络后打开快捷指令；确认显示离线原因，旧本机回复未出现在指令列表或看板，新增、编辑和后台运行不可提交。
      - 恢复网络；确认列表重新从 Backend 读取，服务端没有自动新增条目或运行。
  - id: IOSQUICK-008
    name: 旧 Backend 明确要求升级
    required: true
    description: >
      验证旧 Backend 缺少手动顺序合同时，新手机不把部分响应或旧本机库当成完整列表。
    preconditions:
      - 独占手机有旧本机回复，并已登录一台不支持新版手动顺序合同的真实旧 Backend。
    steps:
      - 用 toolkit:agent-device 打开快捷指令；确认显示需要更新电脑的明确提示，不出现旧本机回复或旧 Backend 的部分列表。
      - 尝试新增或后台运行；确认无法提交且旧 Backend 无相关写入。
  - id: IOSQUICK-009
    name: 旧归档不再导入
    required: true
    description: >
      验证升级后手机不读取或上传旧本机文字，不显示导入入口，原归档文件保持原样。
    preconditions:
      - 独占手机容器用旧版 App 正式保存两条合法本机回复并记录归档哈希；随后同 Bundle ID 覆盖安装候选版。
      - 手机已登录独占新 Backend A，能检查完整快捷库前后快照。
    steps:
      - 用 toolkit:agent-device 在 A 打开快捷指令，确认只见 A 的 pinned 项，没有旧记录或导入入口；核对 A 未收到旧正文。
      - 重启 App 并核对旧文件哈希；确认原文件未删除或改写，Backend 仍未收到旧正文。
  - id: IOSQUICK-010
    name: 所有全局快捷指令可在实际 worktree 后台运行
    required: true
    description: >
      验证所有已保存的全局快捷指令均出现后台入口，不受正文前缀和输入模式限制；运行使用当前实际 worktree，原终端与草稿不受影响。
    preconditions:
      - 独占 Backend 配置有效后台模型和权限；有获准测试的父项目及其 worktree。
      - 手机当前终端在该 worktree，Backend 有正文不含特定技能前缀的 line、prompt_paste 和 codex_slash_command 全局 pinned 指令，以及项目绑定 pinned 指令，原终端含草稿。
    steps:
      - 用 toolkit:agent-device 打开快捷指令，确认三种模式的全局项均提供后台运行入口；项目绑定指令连列表都不出现。点击其中一条安全指令一次并记录 runId。
      - 核对同一 runId 从 queued 到终态，来源 quickInputId 与执行目录为当前实际 worktree；原终端没有收到输入，草稿保持。
  - id: IOSQUICK-011
    name: 后台请求未知结果不重复执行
    required: true
    description: >
      验证 Backend 接受运行后响应丢失时，手机沿用同一幂等键确认原 run，provider 不执行第二次。
    preconditions:
      - 独占 Backend 的真实快捷运行接口可在创建 run 后只丢弃本例响应，provider 执行次数可核对。
      - 手机当前有合格 pinned 指令、实际项目和有效后台配置。
    steps:
      - 用 toolkit:agent-device 点击一次后台运行，丢弃首次成功响应；确认 UI 显示结果待确认且未用新幂等键自动提交。
      - 恢复响应并通过同一操作查询或重试；确认只关联原 runId，Backend 只有一条 run 和一次 provider 执行。
  - id: IOSQUICK-012
    name: 重启 App 后仍可查看同一运行
    required: true
    description: >
      验证关闭页面与重启 App 不取消后台任务；重启后从 Backend 持久记录恢复同一 runId，已有输出可继续读取。
    preconditions:
      - 独占 Backend 有持续输出的真实快捷运行，手机已记录其 runId，Backend 可保持运行。
      - 候选 App 可终止并重启，本例独占同一设备与连接。
    steps:
      - 用 toolkit:agent-device 在运行中离开快捷指令 Tab，终止并重启 App，重新取得新进程控件树与 UI 引用。
      - 回到同一连接的快捷指令 Tab，从看板或全部任务打开原 runId；确认状态与输出继续读取，Backend 没有新 run 或停止请求。
  - id: IOSQUICK-013
    name: 过期编辑不覆盖别端正文
    required: true
    description: >
      验证旧 updatedAt 的手机编辑得到冲突且保留编辑稿，Backend 保留先提交的内容。
    preconditions:
      - 独占 Backend 有一条 pinned 项，手机与另一已登录客户端同时读取相同初始版本。
    steps:
      - 手机用 toolkit:agent-device 打开编辑并修改正文，另一客户端先保存同一条目。
      - 手机提交旧版本；确认显示 409 对应的冲突提示且编辑稿仍在，Backend 正文保持另一客户端已提交内容。
  - id: IOSQUICK-014
    name: 过期排序不覆盖别端顺序
    required: true
    description: >
      验证旧 orderVersion 的移动请求得到冲突，手机刷新现有顺序且不覆盖先提交的排序。
    preconditions:
      - 独占 Backend 有三条 pinned 项，手机与另一已登录客户端同时读取相同手动顺序版本。
    steps:
      - 手机用 toolkit:agent-device 进入排序状态，另一客户端先移动一条并确认 Backend 顺序已更新。
      - 手机按旧 orderVersion 提交移动；确认显示排序冲突、刷新当前顺序，Backend 保留另一客户端先提交的顺序。
  - id: IOSQUICK-015
    name: 同一 Backend 切换项目仍使用同一全局列表
    required: true
    description: >
      验证手机快捷指令只由 Backend 身份决定，不随当前项目变化；项目绑定项在任一项目均不进入手机列表。
    preconditions:
      - 独占新 Backend 有两个不同项目及各自终端、一条全局 pinned 项和分别绑定两项目的 pinned 项。
      - 手机已登录该 Backend，能读取服务端完整快捷库。
    steps:
      - 用 toolkit:agent-device 从项目 A 的终端打开快捷指令，记录全局项 ID、正文和顺序；确认 A、B 的项目绑定项均不显示。
      - 切到项目 B 的终端及无项目上下文的“设置 → 快捷指令”页面；确认仍只显示同一全局项，正文和顺序不变。
      - 在“设置 → 快捷指令”页面编辑该全局项并返回两个项目；确认两处都显示同一 ID 的新正文，项目绑定项均未变化。
  - id: IOSQUICK-016
    name: 一键发送保留已有草稿与附件
    required: true
    description: >
      验证卡片发送直接提交完整正文到当前终端，仅发送一次，不清除草稿与附件或新增快捷历史。
    preconditions:
      - 独占 Backend 有安全终端和可核对输出的全局指令；手机该终端已有可辨认文本草稿和附件。
      - 可核对终端 input 请求和 recent 集合，已保存前置快照。
    steps:
      - 用 toolkit:agent-device 在快捷指令 Tab 点目标卡片发送；确认收到确认后返回终端，终端输出与本条指令一致。
      - 打开输入框确认原草稿和附件完整保留；核对唯一 input 请求携带 recordQuickInput 为 false，目标 terminalSessionId 正确且 recent 集合没有新增该正文。
  - id: IOSQUICK-017
    name: 跨项目看板只在首页显示三条
    required: true
    description: >
      验证当前电脑所有项目的活动快捷运行按 runId 展示，首页最多三条，全部列表保留每次独立运行和项目/worktree 标签。
    preconditions:
      - 独占 Backend 有两个项目和安全终端，共四条持续运行的快捷任务，其中至少两条来自相同指令但实际项目不同。
      - 测试者可读取四条 runId、executionProjectId 和来源快照，手机已登录该 Backend。
    steps:
      - 用 toolkit:agent-device 在一个项目终端打开快捷指令 Tab；确认看板计数四条、只显示三行，且显示另一个项目的任务和正确项目/worktree。
      - 打开查看全部；确认四条活动 run 均存在且未按指令或终端合并，来源标签与 Backend 快照一致。
      - 切到另一个项目终端；确认仍显示同一组全局任务，而卡片查看状态按当前实际项目匹配。
  - id: IOSQUICK-018
    name: 停止后详情保留真实终态
    required: true
    description: >
      验证详情停止一次运行后仅作用于目标 runId，等待 Backend 的真实停止状态，并保持该详情可读。
    preconditions:
      - 独占 Backend 有两条活动快捷运行，目标运行已产生足以滚动的日志；手机打开全部任务列表。
      - 可读取目标和另一个 run 的前后状态，所有测试任务均可停止。
    steps:
      - 用 toolkit:agent-device 从全部任务打开目标详情；确认输出区可独立滚动，执行配置与 Backend 快照一致。
      - 点击停止本次运行并确认；核对仅目标 runId 收到一次停止请求，UI 最终状态与 Backend 一致，停止按钮消失且详情没有自动退出。
      - 关闭详情，确认目标移到近期结果，另一个运行仍活动；清理本例自建任务。
  - id: IOSQUICK-019
    name: 受阻及异常任务优先高亮而不归入近期结果
    required: true
    description: >
      验证执行状态与需处理状态独立：受阻、失败及 waiting 记录出现在顶部并高亮，最多三行，停止入口仍只针对活动任务。
    preconditions:
      - 独占 Backend 有 outcome blocked、outcome failed、旧版 status failed、waiting、running、completed succeeded 和 cancelled 的快捷运行记录，包含其他项目的记录。
      - 可按 runId 读取状态并保存前后快照；异常任务记录比运行中记录更早。
    steps:
      - 用 toolkit:agent-device 打开快捷指令 Tab；确认四条需处理记录优先于运行中记录、看板计数五条、仅三行、需处理数四，受阻显示橙色警示、原因和正确项目/worktree。
      - 打开全部，确认需处理及运行中记录均在顶部组，近期结果只有成功及已停止的记录，两个分组没有重复 runId。
      - 打开受阻详情，确认完整原因与输出可读且没有停止按钮；打开运行中详情确认仍提供停止入口。
      - 将同一运行中 runId 更新为 outcome blocked 后等待轮询；确认它进入需处理组并高亮，不进入近期结果；将同一记录更新为 completed succeeded 后确认它退出看板且只在近期结果显示。
