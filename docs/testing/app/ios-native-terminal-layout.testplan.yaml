version: 1
name: iOS 原生终端悬浮输入验收
description: >
  验证终端保持全尺寸显示，用户通过右下角入口打开覆盖式输入面板，键盘与输入面板不改变底层终端视口。
  产品行为通过原生模拟器或真机连接真实 Backend 执行；每例使用独立创建或明确归属本轮的测试终端，
  不向用户已有工作会话输入。
cases:
  - id: IOSLAYOUT-001
    name: 终端默认只显示悬浮输入入口
    required: true
    description: >
      进入终端后没有常驻输入区，终端占用可用内容高度，右下角输入入口和回到底部按钮互不遮挡。
    preconditions:
      - 本轮构建已安装，候选 App 已登录可达的真实 Backend。
      - 已通过首页创建或打开本轮专用空闲终端。
    steps:
      - 进入终端；确认底部没有常驻文本框，右下角显示可访问的输入按钮，终端内容延伸到页面底部。
      - 向上滚动终端；确认回到底部按钮显示在输入按钮上方，两者都可点击且不遮挡当前输出。
      - 返回终端底部；确认回到底部按钮消失，输入按钮保持可见。
  - id: IOSLAYOUT-002
    name: 输入面板与键盘不改变终端视口
    required: true
    description: >
      系统输入面板覆盖在终端上方；打开面板、显示或收起键盘以及关闭面板均不改变底层终端行列数，
      不发送额外 PTY resize。
    preconditions:
      - 候选 App 已打开本轮独占的真实 tmux 终端，软件键盘可用。
      - 已记录初始终端 rows、cols、视图尺寸、WS resize 数量和远端 stty size。
    steps:
      - 点击右下角输入按钮；确认系统输入面板从底部覆盖终端并自动聚焦大文本区，底层终端仍保持挂载。
      - 依次收起和重新显示软件键盘，再关闭输入面板；记录每个稳定状态的视图尺寸、WS resize 和 stty size。
      - 确认全过程没有新增 resize，rows、cols 与初始值一致，终端内容没有重排、闪动、重复行或滚动位置跳变。
  - id: IOSLAYOUT-003
    name: 隐藏草稿通过入口状态恢复
    required: true
    description: >
      关闭输入面板不会丢失当前终端的文字或图片草稿，有草稿时入口明确提示，重新打开后恢复原内容。
    preconditions:
      - 候选 App 已打开本轮专用空闲终端，当前终端没有草稿。
      - 系统照片选择器有一张本例无敏感图片。
    steps:
      - 打开输入面板，输入两行唯一草稿并添加图片，等待缩略图出现后关闭面板；确认没有终端输入请求。
      - 确认右下角输入入口显示未发送草稿提示；切换到文件和变更页签再返回终端，提示仍存在。
      - 重新打开输入面板；确认文字、换行、图片顺序完整恢复，移除全部内容后关闭面板并确认入口提示消失。
  - id: IOSLAYOUT-004
    name: 发送成功关闭面板且只执行一次
    required: true
    description: >
      成功发送当前快照后输入面板自动关闭，草稿清空，真实 shell 只执行一次完整内容。
    preconditions:
      - 候选 App 已打开本轮专用 shell，Backend 和临时证据文件可核对输入次数。
    steps:
      - 打开输入面板，输入带唯一标记的无副作用打印命令并写入本轮临时证据文件。
      - 点击发送；确认输入面板关闭、键盘收起，终端显示真实回显且入口没有草稿提示。
      - 通过 Backend 请求记录和证据文件确认完整命令只接收并执行一次，终端视口未因关闭面板改变。
  - id: IOSLAYOUT-005
    name: 发送失败保持面板与草稿
    required: true
    description: >
      输入结果未确认或服务返回失败时不关闭输入面板、不清空文字和附件，也不自动重试。
    preconditions:
      - 候选 App 已打开本轮专用终端，Backend 可仅对本例输入注入响应丢失或明确失败。
    steps:
      - 打开输入面板并填写唯一草稿，触发一次失败输入；确认面板保持打开并显示可读错误。
      - 确认文字与附件仍在，Backend 没有收到自动重试请求；恢复服务后由用户再次点击发送。
      - 确认第二次成功后面板关闭、草稿清空，后端记录与本例注入语义一致。
  - id: IOSLAYOUT-006
    name: 快捷键保持原始输入与草稿隔离
    required: true
    description: >
      输入面板中的快捷键开关不改变软件键盘和草稿，原始方向键、Enter 与 Ctrl-C 继续直达终端。
    preconditions:
      - 候选 App 已打开本轮专用 shell，已有无副作用命令历史。
    steps:
      - 打开输入面板并保留唯一草稿；展开再收起快捷键，确认草稿、光标和软件键盘状态不变。
      - 展开快捷键并点击向上与 Enter；确认执行 shell 历史命令，未发送草稿保持不变。
      - 在本轮 shell 启动短时 sleep，再点击 Ctrl-C；确认进程被中断，草稿未被发送或清空。
  - id: IOSLAYOUT-007
    name: 执行中始终提供一键停止
    required: true
    description: >
      Agent 执行期间终端页面在输入入口旁显示独立停止按钮，不要求先打开输入面板；停止失败可见且按钮可重试。
    preconditions:
      - 候选 App 已打开本轮专用终端，能够启动可安全中断的长任务。
    steps:
      - 启动长任务并关闭输入面板；确认右下角出现独立红色停止按钮，输入入口仍可使用。
      - 点击停止；确认只发送一次 interrupt，请求期间显示停止中状态，权威状态结束后停止按钮消失。
      - 再次启动任务并注入停止失败；确认页面显示错误且任务仍为执行态时停止按钮恢复可用。
  - id: IOSLAYOUT-008
    name: 录音与转写期间阻止误关闭
    required: true
    description: >
      录音、权限请求和转写期间不能通过下滑或关闭按钮意外销毁媒体状态，完成或取消后恢复关闭能力。
    preconditions:
      - 真机或支持麦克风输入的 Simulator 已打开输入面板，麦克风权限可控制。
    steps:
      - 开始录音；尝试下滑输入面板并点击关闭，确认面板保持打开且录音继续，取消录音后可正常关闭。
      - 重新录音并结束转写；在转写完成前重复关闭操作，确认面板保持打开且只产生一次转写请求。
      - 等待转写文字追加到草稿；确认关闭能力恢复，关闭再打开后转写文本仍完整保留且没有自动发送。
  - id: IOSLAYOUT-009
    name: 横竖屏保持输入可达与真实尺寸变化
    required: true
    description: >
      设备旋转产生的真实终端视口变化仍发送有效 resize，输入面板在横竖屏均可编辑且不丢草稿。
    preconditions:
      - 候选 App 已打开本轮独占的真实 tmux 终端，设备允许旋转。
    steps:
      - 在输入面板保留两行草稿后关闭，旋转到横屏；确认终端发送新的正数 rows、cols 并与 stty size 一致。
      - 横屏打开输入面板；确认编辑区、媒体、快捷键和发送入口均可达，草稿内容完整。
      - 关闭面板并旋转回竖屏；确认仅真实旋转触发有效 resize，草稿与终端画面均可恢复。
  - id: IOSLAYOUT-010
    name: iOS 15 使用兼容系统输入面板
    required: true
    description: >
      最低支持系统不依赖 iOS 16 高度档位 API，仍可通过系统 Sheet 完成输入、关闭和草稿恢复。
    preconditions:
      - 候选 App 已安装到 iOS 15 兼容设备或 Simulator，并打开本轮专用空闲终端。
    steps:
      - 点击右下角输入入口；确认系统 Sheet 正常展示，编辑器自动聚焦且所有操作可达。
      - 输入唯一草稿并关闭再打开；确认草稿恢复且底层终端没有因键盘显示新增 resize。
      - 发送无副作用命令；确认 Sheet 关闭、命令执行一次且 App 没有可用性崩溃。
