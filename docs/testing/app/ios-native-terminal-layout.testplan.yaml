version: 1
name: iOS 原生终端方案 A 交互验收
description: >
  验证原生终端操作台的布局、快捷键显示状态和真实输入闭环。
  原型基准使用 $toolkit:playwright-cli 查看，产品行为通过原生模拟器或真机连接真实 Backend 执行。
  每例使用独立创建或明确归属本轮的测试终端，不向用户已有工作会话输入。
cases:
  - id: IOSLAYOUT-001
    name: 原生终端初始布局符合方案 A
    required: true
    description: >
      进入终端时显示会话和连接信息、终端变更文件页签、有提示的草稿区，快捷键默认收起。
    preconditions:
      - 本轮构建已安装，候选 App 已登录可达的真实 Backend。
      - 已通过首页创建或打开本轮专用空闲终端。
    steps:
      - 使用 $toolkit:playwright-cli 打开方案 A 原型，确认采用快捷键默认收起的版本。
      - 通过原生 UI 返回首页并重新进入专用终端；确认快捷键开关与六个原始按键均未展示；聚焦后才出现开关。
      - 确认草稿提示、图片、录音和发送入口可辨认，空草稿发送禁用；保存原生视图与控件树。
  - id: IOSLAYOUT-002
    name: 快捷键开关保持草稿与键盘状态
    required: true
    description: >
      快捷键展开收起只改变按键区域，不清空草稿、不主动切换软件键盘、不丢失草稿输入焦点。
    preconditions:
      - 候选 App 已打开本轮专用空闲终端，快捷键收起。
      - 模拟器软件键盘已启用或使用真机。
    steps:
      - 未编辑时确认快捷键开关隐藏；聚焦草稿后确认开关出现而六个按键默认隐藏。
      - 输入不发送的唯一草稿并展示软件键盘；展开再收起快捷键，确认草稿内容和输入光标仍在，软件键盘保持显示。
      - 继续输入后确认追加到原草稿；点击收起键盘，确认键盘关闭而草稿保留。
  - id: IOSLAYOUT-003
    name: 草稿发送经过真实后端并返回输出
    required: true
    description: >
      草稿经现有输入 API 写入专用 shell，回显来自真实进程；接受后清空草稿，按键显示状态不改变发送语义。
    preconditions:
      - 候选 App 已打开本轮专用 shell 终端，可通过后端或文件系统核对执行结果。
    steps:
      - 在快捷键收起时通过草稿输入带唯一标记的无副作用打印命令，并写入本轮临时证据文件。
      - 点击发送；确认真实终端输出唯一标记且草稿清空，通过本轮证据文件核对命令只执行一次。
      - 展开快捷键并发送第二个唯一标记；确认回显和证据文件同样一致。
  - id: IOSLAYOUT-004
    name: 展开的原始按键保持控制序列与草稿隔离
    required: true
    description: >
      原始方向键和 Enter 可操作专用 shell 历史，Ctrl-C 可中断本轮程序，不把未发送草稿当作终端输入。
    preconditions:
      - 候选 App 已打开本轮专用 shell，已有本轮无副作用打印命令历史。
    steps:
      - 输入保留草稿并展开快捷键，点击向上与 Enter；确认执行 shell 历史命令，草稿不变。
      - 在本轮专用 shell 启动短时 sleep 程序，再点击 Ctrl-C；确认进程被中断并恢复提示符。
  - id: IOSLAYOUT-005
    name: 页签切换和图片取消不破坏草稿
    required: true
    description: >
      查看文件与变更后返回终端，草稿保留；取消系统图片选择也不提交或清空草稿。
    preconditions:
      - 候选 App 已打开本轮专用终端，该项目目录有本轮创建的可见文件。
    steps:
      - 输入不发送的唯一草稿，切换文件页签并确认项目文件可见，再切换变更并返回终端；确认草稿原文仍在。
      - 点击添加图片打开系统选择器并取消；确认草稿保留且专用终端没有新增执行结果。
  - id: IOSLAYOUT-006
    name: 横屏与竖屏切换保留操作可达性
    required: true
    description: >
      横屏后仍可阅读终端、编辑草稿并展开收起快捷键，旋转不清空草稿。
    preconditions:
      - 候选 App 已打开本轮专用终端，设备允许旋转且软件键盘已收起。
    steps:
      - 输入保留草稿并收起键盘，旋转到横屏；确认终端和输入区均可见，聚焦后快捷键开关可操作。
      - 展开和收起快捷键后旋转回竖屏；确认草稿原文仍在并保存两种方向证据。
  - id: IOSLAYOUT-007
    name: 草稿输入区只在聚焦时展开
    required: true
    description: >
      输入区初始为紧凑单行，聚焦后展开为多行文本及下方操作栏；失焦后收起但保留完整草稿和发送能力。
    preconditions:
      - 已安装本轮构建并打开本轮专用空闲 shell 终端。
    steps:
      - 重新进入终端，确认未聚焦时左侧为加号、中间单行输入、右侧为语音与发送，快捷键开关和按键条均隐藏。
      - 点击草稿输入框，确认文本区变高且操作按钮移到下方，快捷键开关出现；输入两行唯一草稿后展开并收起快捷键，确认文本和光标仍保留。
      - 点击收起键盘，确认输入区恢复单行；重新点击输入框，确认两行草稿完整恢复，没有重复或丢字。
      - 替换为本轮唯一打印命令并发送，确认真实 shell 回显标记且草稿清空，收起键盘后仍为紧凑单行。
