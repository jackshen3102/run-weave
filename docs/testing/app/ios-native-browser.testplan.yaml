version: 1
name: iOS 内置浏览器与终端任务连续性
description: >
  验证待实现的单页公网浏览器通过正式原生终端进入，并在网页和来源终端之间保持任务连续性。
  本计划为目标合同，不代表当前实现已支持。每例独立建立专用终端和手机可达的受控 HTTPS 页面，
  使用 README 规定的既有 XCUITest 执行器操作原生 UI，保存 xcresult、截图、控件树及必要的脱敏网络记录。
  配套网页如需预检使用 $toolkit:playwright-cli，不能用外部浏览器或注入 App 状态替代 WKWebView 验收。
  不操作用户工作终端；缺设备、fixture 或执行器时记录 blocked。各例结束清理本例资源，不依赖前例状态。
cases:
  - id: IOSBROWSE-001
    name: 普通终端 URL 有可靠的内置打开入口
    required: true
    description: >
      一个完整普通 HTTP(S) URL 可从原生链接或选区菜单打开，自然软折行不破坏点击目标，真实多链接选区不猜测打开。
    preconditions:
      - 候选 App 已登录真实 Backend，存在本例专用空闲 PTY 终端和原生执行器。
      - 受控 HTTPS 长文档可从手机访问，链接含合法百分号编码、query 和 fragment，长度足以在终端自动折行。
    steps:
      - 在专用终端用真实 shell 输出短 URL 和自动折行的长 URL，不使用 OSC 8；保存输出文本和画面。
      - 通过已实现的链接激活或完整选区菜单逐一内置打开；确认都在 App 内显示目标文档，站点实际收到的 query 和页面 fragment 与原目标一致。
      - 输出相邻独立 URL；确认逐个点击仍各自打开，不合并为一个目标。
      - 选择同时含两个 URL 的文本；确认不能把整个选区当单个链接打开，原文仍可复制，且没有向终端发送所选 URL。
  - id: IOSBROWSE-002
    name: OSC 8 使用真实目标而非显示文字
    required: true
    description: >
      OSC 8 链接按实际 href 导航，用户在菜单中可以识别真实目标，展示标签不能冒充目的域名。
    preconditions:
      - 候选 App 已打开本例专用真实 tmux 终端。
      - 受控 HTTPS 页面可达，shell 能输出展示文本为另一域名但目标为受控地址的 OSC 8 链接。
    steps:
      - 输出本例 OSC 8 链接并长按查看链接菜单；确认仅增加带真实目标域名的“内置打开”和“链接”两项；点击“链接”可查看完整目标地址并复制，原生选区文本复制仍可用。
      - 将同一 OSC 8 链接排版为两行或三行，分别点击标签和各续行；确认打开相同完整目标，query 与 fragment 不截断。
      - 在 tmux 历史中滚动后返回该链接，再冷启动 App 重连同一画面；确认每次仍打开相同完整目标。
      - 执行内置打开；确认仍在 App 内，更多菜单中的域名与实际目标及站点请求一致，而不是展示标签中的域名。
  - id: IOSBROWSE-003
    name: 链接入口不抢占终端滚动和选择
    required: true
    description: >
      在含链接的终端输出上进行滚动和文本选择，不会误开网页或改变既有 tmux 滚动语义。
    preconditions:
      - 候选 App 已打开本例专用 tmux 终端，输出足够多的带链接历史行，鼠标上报策略保持产品默认。
      - 已记录本例操作开始前的原生画面和终端输入记录。
    steps:
      - 从链接区域开始纵向滚动并反向滚回；确认仍是终端滚动，不呈现网页，远端没有收到导航键或 URL 输入。
      - 长按选择普通文本并调整选区、复制；确认选区可操作，复制内容等于所选文本，网页未打开。
      - 执行左侧系统返回手势的短距离取消；确认回到当前终端状态，没有新增网页或意外退出。
  - id: IOSBROWSE-004
    name: 网页历史与真实地址保持一致
    required: true
    description: >
      网页后退、前进、刷新和同文档导航只作用于网页历史，更多菜单的域名和完整地址始终反映当前真实 URL。
    preconditions:
      - 候选 App 已从本例终端打开受控 HTTPS 页面 A，A 可链接至 B、B 有锚点并可重定向至另一受控域名。
      - 网站提供无敏感的请求计数，供确认刷新实际发生。
    steps:
      - 在 A 确认后退不可用；点击进入 B，再后退和前进，确认依次显示 A、B，没有返回首页或关闭终端。
      - 在 B 点击锚点，再访问跨域重定向链接；确认完整地址中的 fragment 和最终更多菜单域名分别跟随真实导航，不使用标题伪装域名。
      - 点击刷新；确认发生一次用户刷新请求，加载完成后导航工具仍可用。
  - id: IOSBROWSE-005
    name: 收起和恢复保留网页与终端现场
    required: true
    description: >
      回终端与恢复复用同一个存活网页，保留滚动和未提交表单，并不清除原终端阅读位置和草稿。
    preconditions:
      - 本例专用终端已有未发送文字草稿和可识别的历史阅读位置，Backend 可记录连接与输入。
      - 已从该终端打开带长文档、未提交表单和加载计数的受控 HTTPS 页面，页面已滚动并填写唯一文本。
    steps:
      - 点击回终端；确认回到来源终端的原阅读位置，输入草稿未变，toolbar 出现网页恢复入口，输入和停止控件未被遮挡。
      - 点击恢复入口；确认网页滚动位置和未提交文本保留，加载计数不增加。
      - 重复收起和恢复两次；确认没有因为这些动作新增终端连接、输入请求或清空草稿。
  - id: IOSBROWSE-006
    name: 再开当前完整 URL 只恢复现有网页
    required: true
    description: >
      同一来源终端再次打开当前完整 URL，不创建新页、不刷新、不清表单。
    preconditions:
      - 本例终端中存在受控页面完整 URL；对应网页已打开、填入唯一未提交文本并收起。
      - 页面显示当前加载次数，URL 的 query 和 fragment 与终端中的目标完全相同。
    steps:
      - 从终端再次内置打开该完整 URL；确认直接恢复原页面，没有替换确认。
      - 检查未提交文本和加载次数；确认文本不变、没有新加载，页面没有增加第二个会话。
  - id: IOSBROWSE-007
    name: 不同 URL 替换先确认并清空旧历史
    required: true
    description: >
      从终端打开另一目标需要明确确认；取消保留旧页，确认后单会话被替换且不能后退到旧任务。
    preconditions:
      - 本例终端已有受控页面 A 的存活收起会话，A 带未提交文本和历史。
      - 同一终端已输出受控目标 B，B 与 A 可以只在 query 上不同，以证明不会误去重。
    steps:
      - 内置打开 B；确认提示替换和未提交内容风险，先取消，再恢复 A，确认表单与历史仍在。
      - 再从终端打开 B 并确认替换；确认显示 B，后退不能进入 A，只有一份网页恢复入口。
  - id: IOSBROWSE-008
    name: 关闭网页与收起语义不同
    required: true
    description: >
      关闭确认取消时保留页面，确认后释放网页并移除恢复入口，而不是隐藏旧页。
    preconditions:
      - 候选 App 已从本例终端打开带未提交表单的受控页面，终端有独立未发送草稿。
    steps:
      - 选择关闭网页再取消确认；确认网页和未提交表单仍在。
      - 再次选择关闭并确认；确认返回终端，网页恢复入口消失，终端草稿保持。
      - 重新打开原 URL；确认发生新页面加载且不恢复旧表单，不能通过后退恢复已关闭会话。
  - id: IOSBROWSE-009
    name: 网页键盘和呈现不改变终端尺寸
    required: true
    description: >
      在设备方向不变时，浏览器打开、网页键盘显示或隐藏、收起和恢复均不改变底层终端 rows/cols。
    preconditions:
      - 真机候选 App 已打开本例真实 tmux 终端，软件键盘可用，设备固定竖屏。
      - 已记录终端视图尺寸、rows/cols、WS resize 数量及远端 stty size，受控网页有输入框。
    steps:
      - 打开网页，聚焦输入框，收起并重新显示键盘，再回终端和恢复网页；逐个稳定状态保存原生画面和尺寸记录。
      - 核对新增 WS resize 为 0，远端 stty size 与初始值相同；终端没有重排、闪动或丢失草稿。
  - id: IOSBROWSE-010
    name: 外部打开遵守系统默认浏览器并可返回原任务
    required: true
    description: >
      用户主动外部打开当前 HTTP(S) 地址后，系统浏览器接收正确 URL，回到 App 仍可恢复旧内置页面。
    preconditions:
      - 授权真机已记录系统默认浏览器，测试不修改用户设置。
      - 候选 App 从本例终端打开了带唯一 query 的受控页面，并填写未提交文本。
    steps:
      - 从网页右上角“更多”选择在默认浏览器打开；确认系统配置的浏览器被打开且站点收到正确目标 URL，没有自动传递内置表单或登录 Cookie。
      - 通过系统切换回 Runweave；确认显示来源终端且网页恢复入口仍在，恢复后原内置表单保留。
  - id: IOSBROWSE-011
    name: 链接弹窗展示实际地址且取消不改变会话
    required: true
    description: >
      链接弹窗展示并复制当前实际 URL，不包含宿主认证或页面正文；取消不复制、不导航或关闭网页。
    preconditions:
      - 候选 App 已从本例终端打开完成重定向的受控页面，当前地址含无敏感的 query 和 fragment。
      - 本机有可读取剪贴板的测试文本区，剪贴板已写入本例无敏感标记。
    steps:
      - 从网页右上角“更多”点击“链接”，核对弹窗完整地址后取消；确认剪贴板标记未改变，网页未导航、未关闭，表单和阅读位置保持。
      - 再次打开“链接”并点击“复制链接”；在测试文本区核对它等于最终当前 URL，query 和 fragment 未丢失，未附加 Runweave 凭据。
  - id: IOSBROWSE-012
    name: 导航错误可恢复且不把取消或子资源失败当整页错误
    required: true
    description: >
      主文档网络错误有真实可操作错误状态；正常导航取消和子资源失败不会留下覆盖新页的旧错误。
    preconditions:
      - 本例独占受控 HTTPS 站点可让一个主页面暂时不可达、另一个页面仅图片失败，并可提供延迟页面。
      - 候选 App 已从本例终端打开该站点，执行者只控制本例站点网络状态。
    steps:
      - 导航到暂时不可达的主页面；确认显示宿主加载错误及重试按钮，更多菜单仍可查看和复制失败目标或外部打开；恢复站点后点重试并确认成功。
      - 导航至只有图片失败的页面；确认正文仍显示，没有整页错误覆盖。
      - 发起延迟导航后立即用正常页面替换导航；确认正常页面成功后迟到的取消事件不覆盖新标题、地址或错误状态。
  - id: IOSBROWSE-013
    name: 浏览器不抢占原生输入与媒体呈现
    required: true
    description: >
      有未完成的原生 Sheet 或媒体操作时，浏览器不强行覆盖，也不在操作完成后自动弹出排队旧链接。
    preconditions:
      - 候选 App 已在本例终端建立收起的网页，并准备一份未发送文字草稿。
      - 真机或可操作媒体选择器的 Simulator 可通过既有执行器打开输入 Sheet 和照片选择器。
    steps:
      - 打开 Composer 并编辑草稿，再打开系统照片选择器；确认底层网页入口不可穿透点击，媒体 Sheet 不被浏览器顶替。
      - 取消照片选择并关闭 Composer；确认草稿保留，不自动出现浏览器。
      - 主动点击网页入口后确认才恢复页面；记录原生呈现过程中没有重复 modal 警告或终端输入。
  - id: IOSBROWSE-014
    name: 普通后台往返不主动销毁网页
    required: true
    description: >
      在系统未回收进程的普通后台往返中保留网页现场，终端只按既有前后台策略恢复，不补发输入。
    preconditions:
      - 本例候选 App 在授权设备打开受控网页，已有未提交文本和加载计数，终端有独立草稿。
      - 本例不会终止 App 或 WebContent 进程，Backend 可记录前后台连接与输入。
    steps:
      - 把 App 切至后台约十秒后返回，重新获取原生控件树；确认网页表单与加载计数保持。
      - 回终端检查草稿及后端输入记录；确认草稿不变，没有排队重发的输入，连接按既有策略恢复。
      - 若系统实际回收进程，将本例标为环境阻塞并另按回收用例取证，不把重载宣称为本例通过。
  - id: IOSBROWSE-015
    name: 离开来源终端即清理该网页会话
    required: true
    description: >
      首版不跨终端保留页面，用户返回首页或打开另一终端后不会看到前一终端网页恢复入口。
    preconditions:
      - 候选 App 同一 Backend 有本例专用终端 A 和 B，A 已建立收起的网页会话。
      - A 和 B 各有可识别且不应发送的独立草稿。
    steps:
      - 从 A 返回首页并打开 B；确认 B 没有 A 的网页入口或网页内容，B 草稿未改变。
      - 再打开 A；确认没有恢复已释放的网页，A 草稿仍按既有合同保留。
  - id: IOSBROWSE-016
    name: 连接切换使旧网页和迟到回调失效
    required: true
    description: >
      切换电脑连接后，旧页面的延迟导航和事件不能在新连接重新显示网页、错误或发起外部打开。
    preconditions:
      - 候选 App 有本例两个独立测试连接 A 和 B，各自有专用终端。
      - A 的受控页面能延迟返回并在返回后尝试导航，B 的页面有明显不同标题。
    steps:
      - 在 A 发起延迟网页导航后收起，切换到连接 B 并打开 B 的专用终端及网页。
      - 释放 A 的延迟响应并等待超过延迟窗口；确认当前仍是 B 的域名、标题和页面，没有旧错误、旧恢复入口或外部 App 被打开。
      - 核对连接记录，确认旧页面没有借用 B 的身份请求 Backend。
  - id: IOSBROWSE-017
    name: App 冷启动不恢复网页运行时
    required: true
    description: >
      同一次进程终止实验中，网页和表单不会在冷启动自动恢复，原有连接与草稿不被浏览器清理。
    preconditions:
      - 独占候选安装已登录测试连接，专用终端草稿已通过既有流程持久化。
      - 网页已打开并有未提交表单，本例有权限终止自己的 App 进程。
    steps:
      - 保存终止前网页与终端草稿证据，真实终止候选 App，再启动并重新获取进程与原生控件树。
      - 从正式首页进入原终端；确认无网页恢复入口、无自动网站请求，连接与草稿仍在。
      - 显式打开同一 URL；确认是新页面，不声称恢复旧表单。
  - id: IOSBROWSE-018
    name: WebContent 回收后明确提示并由用户重载
    required: true
    description: >
      真实 WebKit 内容进程被回收时，App 不假称保留表单，也不无限自动刷新；来源终端仍可返回。
    preconditions:
      - 独占 Simulator 中候选 App 已打开带未提交表单的受控页面。
      - 执行者能准确定位本例 WKWebView 所属 WebContent 进程并只终止它，不影响其他 App，也不调用 delegate 伪造事件。
    steps:
      - 保存页面与进程归属证据后结束该 WebContent 进程，重新读取原生控件树。
      - 确认显示页面被系统回收及未提交内容可能丢失的提示，没有自动重复导航；回终端仍可使用原会话。
      - 恢复网页并点击重新加载；确认新页面成功，未提交文本丢失被明确说明而不是宣称已恢复。
  - id: IOSBROWSE-019
    name: 连续替换关闭不会累积旧网页实例
    required: true
    description: >
      单会话限制在重复使用后仍成立，已关闭网页可释放，旧页面不继续执行请求或控制 UI。
    preconditions:
      - 独占候选 App 和专用终端可供本例持续操作，受控页面有唯一编号及周期请求。
      - 本例可通过 Xcode 内存图或 Instruments 观察 live WKWebView 和 delegate 引用，而非仅看进程数。
    steps:
      - 依次打开、收起、恢复、确认替换和确认关闭受控页面，连续完成十轮；每轮记录独立页面编号。
      - 在稳定打开状态核对至多一个被 BrowserSession 持有的 live WKWebView；关闭后确认该会话释放，旧编号不再发周期请求或更新 UI。
      - 核对实例和强引用没有逐轮累积；系统共享 WebKit 进程继续存在不单独判失败，保存内存图和请求记录。
