version: 1
name: 现有终端任务的手机结构化问答
description: >
  验收合同：验证手机回答既有 Codex 任务的真实问题，原执行者继续运行；
  不创建独立规划任务，不从历史摘要猜题，不改变原任务权限。格式校验不代表业务验收通过。首版仅显式 Unix remote 运行方式支持；完整矩阵尚须取证。
cases:
  - id: TQ-001
    name: 第二客户端回答后原执行者继续
    required: true
    description: >
      证明既有终端的活动请求可通过原执行服务交付第二客户端，答案使原任务继续而非另建任务。
    preconditions:
      - 已准备本轮独占的 Runweave 测试终端，能记录 terminal、panel、tmux pane、TUI PID 和执行服务身份。
      - 本机 Codex 已登录，测试需求包含真实用户决策，可观测脱敏协议方法与关联 ID。
    steps:
      - 用平时的终端启动入口发送该需求，取得真实结构化问题并记录 thread、turn、item 与请求 ID；不另起只读规划进程。
      - 第二客户端连接同一执行服务并加入该活动线程，确认收到原问题且没有 thread/start、turn/start、thread/fork 或配置覆盖。
      - 从第二客户端回答一次，确认原请求收到 JSON-RPC result 和 serverRequest/resolved，原任务使用该答案继续输出，执行者及 thread、turn 没有替换。
      - 断开第二客户端，确认原终端仍可继续操作，没有取消任务、关闭共享服务或自动拒绝其他审批；结束后只清理本轮自有测试资源。

  - id: TQ-002
    name: 手机在原终端入口完成真实问题回答
    required: true
    description: >
      手机表单只展示当前原任务的真实问题，明确提交后等待协议确认，原任务接收答案并继续。
    preconditions:
      - 候选 iOS App 已通过 agent-device 连接本轮测试设备，并登录专用 Backend。
      - 自有终端使用已验证的可连接执行服务，正在等待真实结构化问题；可核对原任务与协议证据。
    steps:
      - 使用 agent-device 打开该原终端的回复辅助，确认问题、选项和全部关联 ID 对应原活动请求，没有 Home 独立会话创建流程。
      - 选择选项并编辑自由回答，确认选项点击仅修改草稿；点击提交后先显示待确认，确认请求解决后显示问题已处理，不断言手机答案在并发中获胜。
      - 核对原任务收到所填答案并继续，终端未被注入正文或 Enter，没有将答案新增为排队提示；保存真实设备界面证据并清理自有测试资源。

  - id: TQ-003
    name: 回答不能跨终端面板或线程
    required: true
    description: >
      目标变更后旧问题不再可提交，草稿不能影响另一个任务。
    preconditions:
      - 测试设备已登录专用 Backend，准备两个归属明确且各有真实问题的 Codex 任务。
      - 可观测目标 ID，并切换自己的 panel 或 thread。
    steps:
      - 使用 agent-device 为两个任务填写不同答案草稿，切换目标确认分别保留且不自动发送。
      - 在旧问题页保持未提交草稿，改变原目标的 panel 或 thread；提交旧关联载荷应返回 409，不能写入另一任务。
      - 确认新目标的问题草稿与回答仍只属于新目标；清理本轮自有测试资源。

  - id: TQ-004
    name: 切换 Backend 后迟到结果不能污染新连接
    required: true
    description: >
      切换连接会清除旧问题上下文，迟到 HTTP 结果不能恢复旧列表、选择或答案。
    preconditions:
      - 测试设备有两个自有 Backend 连接，各自有归属明确的 Codex 测试任务。
      - 能延迟第一个连接的问题 HTTP 响应，且能独立核对两个任务的协议写入。
    steps:
      - 使用 agent-device 在第一个连接打开问题页并保留草稿，让该连接的刷新响应延迟返回。
      - 切换至第二个连接后放行旧响应，确认新连接的问题列表、选择和草稿不被旧结果更新，旧页面已关闭或不可提交。
      - 确认两个任务均没有收到旧答案或额外输入，清理本轮自有测试资源。

  - id: TQ-005
    name: 同一活动问题只能有效回答一次
    required: true
    description: >
      HTTP 重试和电脑手机并发回答不能造成重复答案，已被原终端解决的问题不可继续提交。
    preconditions:
      - 自有原任务有真实待答问题，手机与电脑均可回答，可控制测试 HTTP 响应丢失。
    steps:
      - 手机提交后丢弃该 HTTP 响应，使用同一 operationId 和完全相同答案重试；确认最多一次协议写入，草稿保留至结果可判断。
      - 用同一 operationId 改变答案，确认 409 且无额外写入。
      - 让原任务在同一测试生命周期产生下一条真实问题，电脑先回答，手机再提交旧问题；确认旧问题已失效且未作为新问题的答案，不把请求解决事件误标为手机答案获胜或原任务成功；清理自有测试资源。

  - id: TQ-006
    name: 运行方式不支持时保留原终端操作
    required: true
    description: >
      不支持结构化接入时不启动替代任务或改变权限，普通终端输入仍可使用。
    preconditions:
      - 自有测试终端使用不支持结构化接入的 Codex 运行方式，例如 no-daemon 或旧版本。
      - 能独立核对该测试终端的输入、执行者和模型工具配置。
    steps:
      - 使用 agent-device 打开不支持接入的原终端辅助页，确认给出返回终端操作的说明，不提供独立会话替代或模拟问题。
      - 返回原终端并手动回答，确认原执行者收到输入并继续，原模型、模式、工具与网络权限不被覆盖；清理自有测试资源。

  - id: TQ-007
    name: 问题连接断开不停止任务或重放答案
    required: true
    description: >
      只断开问题连接时原任务继续存活，恢复只采纳重新核验的当前请求，不重放旧答案。
    preconditions:
      - 自有测试任务使用已验证可连接的执行服务，手机已经打开真实问题并填写未提交答案。
      - 能只断开 Backend 的问题连接，原终端与执行服务可独立观测，不重启它们。
    steps:
      - 断开问题连接，确认旧提交不可继续；原任务与 TUI 未被关闭，未向任务写入答案或审批拒绝结果。
      - 回原终端手动完成回答并让原任务继续，恢复问题连接后确认旧问题保持失效，未自动重放旧答案。
      - 让同一原任务产生下一条真实问题，确认重新核验后可展示新问题且不沿用旧问题 ID 和草稿；清理自有测试资源。

  - id: TQ-008
    name: 问答流程不改变终端草稿附件和队列
    required: true
    description: >
      结构化回答与原终端输入分别保存，打开、关闭及提交问题不能消费终端草稿、附件或队列项。
    preconditions:
      - 测试设备已打开自有 Codex 终端，原任务存在真实待答问题。
      - 原终端输入面板有唯一标记草稿和已上传附件，原任务有可核对的唯一排队标记。
    steps:
      - 使用 agent-device 打开回复辅助，填写答案并反复关闭返回，确认终端草稿逐字一致、附件仍存在、队列内容不变。
      - 提交结构化答案后核对原任务继续，原终端草稿和附件未发送，队列没有新增该答案；队列标记只按原任务自身规则消费。
      - 确认用户仍能按现有输入流程手动发送终端草稿，并清理本轮自有测试资源。
