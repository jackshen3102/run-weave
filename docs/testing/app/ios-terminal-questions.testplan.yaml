version: 1
name: 现有终端任务的手机结构化问答
description: >
  验收合同：验证手机回答既有 Codex 任务的真实问题，原执行者继续运行；
  不创建独立规划任务，不从历史摘要猜题，不改变原任务权限。格式校验不代表业务验收通过。首版仅显式 Unix remote 运行方式支持；TQ-009 至 TQ-014 是通知接力的候选实现验收。
cases:
  - id: TQ-001
    name: 第二客户端回答后原执行者继续
    required: true
    description: >
      证明既有终端的活动请求可通过原执行服务交付第二客户端，答案使原任务继续而非另建任务。
    preconditions:
      - 已准备本轮独占的 Runweave 测试终端，能记录 terminal、panel、tmux pane、TUI PID 和执行服务身份。
      - 本机 Codex 已登录，测试需求包含真实用户决策，可观测脱敏协议方法与关联 ID。
    steps:
      - 用平时的终端启动入口发送该需求，取得真实结构化问题并记录 thread、turn、item 与请求 ID；不另起只读规划进程。
      - 第二客户端连接同一执行服务并加入该活动线程，确认收到原问题且没有 thread/start、turn/start、thread/fork 或配置覆盖。
      - 从第二客户端回答一次，确认原请求收到 JSON-RPC result 和 serverRequest/resolved，原任务使用该答案继续输出，执行者及 thread、turn 没有替换。
      - 断开第二客户端，确认原终端仍可继续操作，没有取消任务、关闭共享服务或自动拒绝其他审批；结束后只清理本轮自有测试资源。

  - id: TQ-002
    name: 手机在原终端入口完成真实问题回答
    required: true
    description: >
      手机表单只展示当前原任务的真实问题，明确提交后等待协议确认，原任务接收答案并继续。
    preconditions:
      - 候选 iOS App 已通过 agent-device 连接本轮测试设备，并登录专用 Backend。
      - 自有终端使用已验证的可连接执行服务，正在等待真实结构化问题；可核对原任务与协议证据。
    steps:
      - 使用 agent-device 打开该原终端的回复辅助，确认问题、选项和全部关联 ID 对应原活动请求，没有 Home 独立会话创建流程。
      - 选择选项并编辑自由回答，确认选项点击仅修改草稿；点击提交后先显示待确认，确认请求解决后显示问题已处理，不断言手机答案在并发中获胜。
      - 核对原任务收到所填答案并继续，终端未被注入正文或 Enter，没有将答案新增为排队提示；保存真实设备界面证据并清理自有测试资源。

  - id: TQ-003
    name: 回答不能跨终端面板或线程
    required: true
    description: >
      目标变更后旧问题不再可提交，草稿不能影响另一个任务。
    preconditions:
      - 测试设备已登录专用 Backend，准备两个归属明确且各有真实问题的 Codex 任务。
      - 可观测目标 ID，并切换自己的 panel 或 thread。
    steps:
      - 使用 agent-device 为两个任务填写不同答案草稿，切换目标确认分别保留且不自动发送。
      - 在旧问题页保持未提交草稿，改变原目标的 panel 或 thread；提交旧关联载荷应返回 409，不能写入另一任务。
      - 确认新目标的问题草稿与回答仍只属于新目标；清理本轮自有测试资源。

  - id: TQ-004
    name: 切换 Backend 后迟到结果不能污染新连接
    required: true
    description: >
      切换连接会清除旧问题上下文，迟到 HTTP 结果不能恢复旧列表、选择或答案。
    preconditions:
      - 测试设备有两个自有 Backend 连接，各自有归属明确的 Codex 测试任务。
      - 能延迟第一个连接的问题 HTTP 响应，且能独立核对两个任务的协议写入。
    steps:
      - 使用 agent-device 在第一个连接打开问题页并保留草稿，让该连接的刷新响应延迟返回。
      - 切换至第二个连接后放行旧响应，确认新连接的问题列表、选择和草稿不被旧结果更新，旧页面已关闭或不可提交。
      - 确认两个任务均没有收到旧答案或额外输入，清理本轮自有测试资源。

  - id: TQ-005
    name: 同一活动问题只能有效回答一次
    required: true
    description: >
      HTTP 重试和电脑手机并发回答不能造成重复答案，已被原终端解决的问题不可继续提交。
    preconditions:
      - 自有原任务有真实待答问题，手机与电脑均可回答，可控制测试 HTTP 响应丢失。
    steps:
      - 手机提交后丢弃该 HTTP 响应，使用同一 operationId 和完全相同答案重试；确认最多一次协议写入，草稿保留至结果可判断。
      - 用同一 operationId 改变答案，确认 409 且无额外写入。
      - 让原任务在同一测试生命周期产生下一条真实问题，电脑先回答，手机再提交旧问题；确认旧问题已失效且未作为新问题的答案，不把请求解决事件误标为手机答案获胜或原任务成功；清理自有测试资源。

  - id: TQ-006
    name: 运行方式不支持时保留原终端操作
    required: true
    description: >
      不支持结构化接入时不启动替代任务或改变权限，普通终端输入仍可使用。
    preconditions:
      - 自有测试终端使用不支持结构化接入的 Codex 运行方式，例如 no-daemon 或旧版本。
      - 能独立核对该测试终端的输入、执行者和模型工具配置。
    steps:
      - 使用 agent-device 打开不支持接入的原终端辅助页，确认给出返回终端操作的说明，不提供独立会话替代或模拟问题。
      - 返回原终端并手动回答，确认原执行者收到输入并继续，原模型、模式、工具与网络权限不被覆盖；清理自有测试资源。

  - id: TQ-007
    name: 问题连接断开不停止任务或重放答案
    required: true
    description: >
      只断开问题连接时原任务继续存活，恢复只采纳重新核验的当前请求，不重放旧答案。
    preconditions:
      - 自有测试任务使用已验证可连接的执行服务，手机已经打开真实问题并填写未提交答案。
      - 能只断开 Backend 的问题连接，原终端与执行服务可独立观测，不重启它们。
    steps:
      - 断开问题连接，确认旧提交不可继续；原任务与 TUI 未被关闭，未向任务写入答案或审批拒绝结果。
      - 回原终端手动完成回答并让原任务继续，恢复问题连接后确认旧问题保持失效，未自动重放旧答案。
      - 让同一原任务产生下一条真实问题，确认重新核验后可展示新问题且不沿用旧问题 ID 和草稿；清理自有测试资源。

  - id: TQ-008
    name: 问答流程不改变终端草稿附件和队列
    required: true
    description: >
      结构化回答与原终端输入分别保存，打开、关闭及提交问题不能消费终端草稿、附件或队列项。
    preconditions:
      - 测试设备已打开自有 Codex 终端，原任务存在真实待答问题。
      - 原终端输入面板有唯一标记草稿和已上传附件，原任务有可核对的唯一排队标记。
    steps:
      - 使用 agent-device 打开回复辅助，填写答案并反复关闭返回，确认终端草稿逐字一致、附件仍存在、队列内容不变。
      - 提交结构化答案后核对原任务继续，原终端草稿和附件未发送，队列没有新增该答案；队列标记只按原任务自身规则消费。
      - 确认用户仍能按现有输入流程手动发送终端草稿，并清理本轮自有测试资源。

  - id: TQ-009
    name: 模拟器通知接力到原问题并继续原轮次
    required: true
    description: >
      验证候选 App 在后台收到由测试环境生成的待答通知后，点击可直达原问题，提交的选项由原任务消费。
    preconditions:
      - 已将当前 Worktree 的候选 App 安装到本轮独占的 iOS 模拟器并登录隔离 Backend。
      - 已配置隔离通知捕获传输及同一安装已确认的待答订阅，能够取得完整通知 JSON。
      - 独占 Codex 终端通过受支持的 Unix 共享执行服务运行，测试问题的两个选项对应不同的输出标记。
    steps:
      - 用 agent-device 将候选 App 切到后台；在隔离终端触发真实结构化问题，确认关联的 terminal、panel、thread、turn 和 item。
      - 从捕获传输取得这条问题的通知，核对目标和事件归属；用租约 UDID 执行 simctl push，确认系统展示对应通知。
      - 使用 agent-device 点击该通知；确认 App 切入原终端的问题，展示与原请求相同的选项。
      - 选择一个有唯一输出标记的选项并提交；确认界面显示问题已处理，原终端同一轮输出对应标记。

  - id: TQ-010
    name: 电脑先答后旧通知显示问题已结束
    required: true
    description: >
      验证通知生成后电脑先解决原问题，手机打开旧通知时显示结束状态并隐藏提交入口。
    preconditions:
      - iOS 模拟器上的候选 App 已登录隔离 Backend，测试安装有已确认的待答订阅。
      - 已有来自当前独占终端且对应真实待答问题的通知，能够在电脑端原生提交答案。
    steps:
      - 捕获并保留待答通知；在电脑原终端完成回答，确认原轮次输出对应标记。
      - 向本轮模拟器注入原通知，用 agent-device 从系统入口点击；确认显示问题已结束，提交入口隐藏。
      - 核对原执行服务日志和原终端后续输出，确认只有电脑答案产生效果。

  - id: TQ-011
    name: 通知打开时失联可重新检查同一问题
    required: true
    description: >
      验证点通知时的连接不可用会显示待核对状态，恢复连接后只恢复对同一待答问题的读取。
    preconditions:
      - 模拟器安装候选 App 并已登录隔离 Backend，可独立中断该模拟器到测试 Backend 的路径。
      - 独占 Codex 原执行服务保持运行，原问题在整个断线阶段持续待答，已有对应的测试通知。
    steps:
      - 注入待答通知后断开模拟器的 Backend 路径；用 agent-device 点击通知，确认显示暂时无法核对，提交入口隐藏。
      - 恢复连接，点击重新检查；确认加载与通知身份相同的待答问题，表单等待用户选择。
      - 核对原执行服务，确认重连和重新检查期间仍未收到答案。

  - id: TQ-012
    name: 通知从另一台电脑导航到原电脑的指定面板
    required: true
    description: >
      验证通知定位按来源电脑和原面板执行，当前展示的另一条问题不能被当作通知目标。
    preconditions:
      - 候选 App 有两个已登录的测试 Backend 连接，每台都有可区分的测试问题。
      - 来源 Backend 的目标终端有多个面板，通知绑定到原终端当前面板，能够独立核对面板身份。
    steps:
      - 使用 agent-device 打开另一台电脑的问题；向模拟器注入原电脑测试通知并点击。
      - 核对当前电脑、终端和面板，确认可回答的只有通知所对应的原问题；保留两条请求的身份记录。

  - id: TQ-013
    name: 同一待答事件每个安装最多生成一份通知
    required: true
    description: >
      验证同一提问重复上报或同一发送意图重试时，隔离通知网关为同一安装只生成一份有效通知。
    preconditions:
      - 隔离 Backend 和通知网关已启用候选机制，具备一个已确认的测试安装以及可统计通知结果的捕获传输。
      - 专用 Codex 终端持有一个真实、仍然待答的原问题，可重复受认证地提交同一测试 Hook。
    steps:
      - 提交同一 Hook 两次并观察异步查找；核对定位引用和发送事件 ID 都保持一致。
      - 在捕获传输令首次发送返回明确可重试结果，再使后续尝试成功；核对同一安装只有一份有效通知且重试载荷一致。

  - id: TQ-014
    name: 其他登录无法读取通知引用指向的原请求
    required: true
    description: >
      验证收到或取得通知引用本身不会授权读取问题，原问题只向具有绑定授权的登录身份可见。
    preconditions:
      - 隔离 Backend 有两个独立的已认证登录，仅其中一个具备该测试通知对应的安装绑定。
      - 目标问题仍待答，已取得该通知的有效 questionRef。
    steps:
      - 用绑定的登录查询该引用，确认响应包含目标待答状态。
      - 用另一个登录查询同一引用，确认返回 404，响应体没有问题、选项和终端定位。

  - id: TQ-015
    name: 无共享执行服务的待确认与提问触发通知并直达目标面板
    required: true
    description: >
      验证未启用 Unix 共享执行服务的普通 Codex 提问、AGY ask_question、Claude 提问或权限请求及 OSC 7501 blocked 会生成待确认推送，手机点击后聚焦目标面板并直达原终端。
    preconditions:
      - 候选 iOS App 已安装到本轮独占模拟器并登录隔离 Backend，具备已确认的 terminal-question 订阅和通知捕获传输。
      - 隔离 Backend 存在多面板测试终端，目标非默认面板未启用 codex --remote。
    steps:
      - 将候选 App 切到后台，在目标面板触发无共享执行服务的待确认事件（如普通 Codex request_user_input 或 AGY ask_question），从捕获传输取得 terminal.question 通知并确认标题为受控通用文案、不包含敏感参数正文。
      - 向本轮租约模拟器执行 simctl push 并通过 agent-device 点击系统通知；确认 App 自动聚焦目标面板并打开对应终端页面，不停留在暂时无法核对页。
      - 清理本轮自有测试终端与模拟器会话。

  - id: TQ-016
    name: 同面板多路阻塞信号合并去重且电脑处理后旧通知显示已结束
    required: true
    description: >
      验证同一面板同时上报结构化工具待确认与 OSC 7501 blocked 时只向同一安装发送一份通知，且电脑端完成工具返回或结束轮次后点击旧通知显示问题已处理或已结束。
    preconditions:
      - 候选 iOS App 已登录隔离 Backend，测试安装有已确认的 terminal-question 订阅及可统计投递次数的捕获传输。
      - 自有测试终端面板处于运行态，可顺序上报待确认 Hook、OSC 7501 blocked 与完成事件。
    steps:
      - 在同一面板触发待确认 Hook 并紧接上报 OSC 7501 blocked；观察稳定窗结束后捕获传输只收到一份有效通知。
      - 在电脑端上报对应 ToolCompleted，随后向模拟器注入前面捕获的通知并用 agent-device 点击；确认显示问题已处理且保留回原终端查看入口，不会自动误跳为待确认状态。
      - 清理本轮自有测试资源。
