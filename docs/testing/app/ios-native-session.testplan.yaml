version: 1
name: iOS 原生认证连接与会话验收
description: >
  验证 Swift 客户端的认证隔离、连接切换、离线保护、事件恢复与资源生命周期。
  每例自行建立测试 Backend、账号、连接和会话，不依赖上一例；原生 UI 实际操作取证，
  故障注入只作用于本例拥有的资源。

cases:
  - id: IOSSESSION-001
    name: 独立登录与重开后认证可用
    required: true
    description: >
      原生 App 使用 App 认证协议并持久化到自己的安全存储，重开后无需重新登录。
    preconditions:
      - 原生 App 有一个自建测试连接和有效账号，当前该连接未登录。
      - 可查看脱敏 HTTP 信息和原生 App 自身存储分布。
    steps:
      - 从原生登录页提交有效凭据；确认使用 X-Auth-Client 为 app 的请求并进入 Home。
      - 确认后续业务使用 Bearer、refresh token 只存独立 Keychain，不出现在 UserDefaults、普通文件和日志。
      - 关闭再打开原生 App；确认原连接能恢复认证并读取 Home，记录新进程信息。

  - id: IOSSESSION-002
    name: 并发读取只执行一次有效刷新
    required: true
    description: >
      access token 过期而 refresh token 有效时，同一连接的并发读取共享刷新结果并收敛。
    preconditions:
      - 原生 App 在专用 Backend 已登录，允许仅令该认证的 access token 过期而保留 refresh token。
      - 已准备两个同时发生的只读请求，可记录该连接刷新次数与响应。
    steps:
      - 使 access token 过期并触发两个并发读取；确认仅有一个在途 refresh，刷新成功后读取最多各重发一次。
      - 确认仍处于登录状态且页面收敛，无刷新风暴；响应丢弃的旧 generation 不得覆盖新认证。

  - id: IOSSESSION-003
    name: 明确认证撤销只清理所属连接
    required: true
    description: >
      refresh 认证明确失效后只要求当前连接重新登录，不影响另一电脑的认证。
    preconditions:
      - 原生 App 已分别登录两个专用 Backend 连接 A 和 B，记录各自会话索引。
      - 当前选择 A，允许只撤销 A 的测试认证。
    steps:
      - 撤销 A 并触发受保护读取，确认刷新明确失败后 A 显示重新登录且清理其安全凭据。
      - 选择 B；确认仍可读取 B 的项目，不出现全局登出或凭据清空。

  - id: IOSSESSION-004
    name: 删除本地连接不清理其他连接
    required: true
    description: >
      删除连接只移除对应本地配置和认证，不等同于删除远端项目或其他 App 数据。
    preconditions:
      - 原生 App 有两个可编辑测试连接 A 和 B，均已登录，A 上存在本例创建的项目。
    steps:
      - 在连接管理中删除 A 并确认；验证 A 配置和凭据被删除，B 保留且可正常访问。
      - 通过独立管理入口只读确认 A 的远端项目和会话仍存在，删除本地连接没有发起远端资源删除。

  - id: IOSSESSION-005
    name: 切换电脑拒绝旧响应和旧终端路由
    required: true
    description: >
      连接切换后旧任务、缓存、终端回调和认证结果不能污染新电脑。
    preconditions:
      - 两个专用 Backend A 和 B 具有相同项目或终端 ID 但不同可识别内容，原生 App 已分别登录。
      - 可延迟 A 的一个读取或刷新响应；当前在 A 的 Terminal 详情。
    steps:
      - 触发 A 的延迟请求后切换到 B；确认返回 B 的 Home，不沿用 A 的 terminalSessionId 自动打开详情。
      - 释放 A 的延迟响应和一次旧终端回调；确认 B 的内容、凭据与状态不变，诊断显示旧 generation 被丢弃。
      - 打开 B 的同 ID 项目内容；确认没有命中 A 缓存，只有 B 的数据。

  - id: IOSSESSION-006
    name: 网络不可达保留认证与已加载内容
    required: true
    description: >
      网络中断和超时只影响设备连通性，不冒充认证失效。
    preconditions:
      - 原生 App 已登录专用 Backend 并加载 Home 和一个终端，已记录安全凭据索引。
      - 可只阻断本原生客户端到测试 Backend 的网络，不终止 Backend。
    steps:
      - 阻断网络并触发读取直到判定 Offline；确认页面保留既有可读内容和登录态，有明确离线提示。
      - 确认凭据未删除，未跳转 Login；记录网络错误类别与 health probe，不产生业务 socket 重连风暴。

  - id: IOSSESSION-007
    name: HTTP 服务错误与权限错误不冒充登出
    required: true
    description: >
      5xx 与 403 都有明确错误分类，不清空有效 refresh token。
    preconditions:
      - 原生 App 已登录专用协议环境，可对同一个只读 API 注入 503 和 403 响应并恢复成功。
    steps:
      - 分别注入 503 和 403 并刷新该页面；确认呈现服务错误或权限错误，不跳转 Login、不删除凭据。
      - 恢复成功响应；确认可重新读取且无需重新登录，记录每类错误与恢复结果。

  - id: IOSSESSION-008
    name: 已删除终端显示资源不存在
    required: true
    description: >
      terminal 404 不触发全局认证清理或无限重连，用户可回到正常 Home。
    preconditions:
      - 原生 App 已登录专用 Backend，已记录一个由本例创建后删除的 terminalSessionId。
    steps:
      - 打开该已删除终端路由，确认显示不存在或已删除，停止对此资源重复获取 ticket。
      - 返回 Home；确认仍可读取其他项目且登录态保持有效。

  - id: IOSSESSION-009
    name: 离线操作不会恢复后自动执行
    required: true
    description: >
      Offline 状态下所有写操作均被阻止，网络恢复不能补发用户在离线时尝试的输入。
    preconditions:
      - 原生 App 在专用 Backend 已登录并打开自建终端，当前通过本例网络阻断进入 Offline。
      - 已准备唯一 marker、测试图片和可恢复网络的手段。
    steps:
      - 尝试发送 marker、快捷键、Stop、图片上传、创建项目或终端以及删除；确认控件禁用或明确失败且没有对应业务写请求。
      - 恢复网络并等待连接可用；确认没有离线写操作自动补发，marker 未出现在远端，资源数量未因离线点击变化。
      - 显式再次发送 marker；确认这次用户操作才产生一次实际输入，保留草稿不等于排队执行。

  - id: IOSSESSION-010
    name: 设备状态与 Agent 状态独立展示
    required: true
    description: >
      设备在线必须有健康业务结果或服务端 connected 证据，不由 raw socket open 或 Agent 状态代替。
    preconditions:
      - 专用环境能控制 health、业务响应和 events connected，具有已知 Agent 状态的测试终端。
    steps:
      - 只建立 raw WebSocket open 而延迟 connected 和健康响应；确认不因此显示 Online。
      - 释放健康响应或服务端 connected；确认设备 Online，并分别呈现后端提供的 agent_running、agent_idle 或 exited。
      - 保持 Agent 状态数据不变而使健康检测失败；确认设备离线不把 Agent 状态篡改成 idle。

  - id: IOSSESSION-011
    name: 同一事件流的重放与去重正确
    required: true
    description: >
      在同一 streamId 下事件游标恢复与重复投递不造成重复列表项或状态回退。
    preconditions:
      - 专用事件环境已建立稳定 streamId，可向真实原生客户端重放带已知 ID 的状态和元数据事件。
      - 原生 App 已有该环境的 Home 数据，fixture 的事件 ID 为不透明字符串。
    steps:
      - 投递状态和元数据事件，再重复相同 ID；确认每个事件只生效一次，Home 无重复项目或终端。
      - 中断并恢复该事件连接，按游标重放相同流内事件；确认收敛到权威状态，未把 cursor 转成有损数值。

  - id: IOSSESSION-012
    name: Backend 重启后的事件流重新同步
    required: true
    description: >
      streamId 改变时客户端放弃旧游标并重新读取权威状态，不沿用旧流造成缺失。
    preconditions:
      - 执行者独占可重启的测试 Backend，已建立原生 App 登录和 Home 事件订阅。
      - Backend 的测试数据与认证有已知持久化策略，允许重启后重新发现端点。
    steps:
      - 记录旧 streamId 和 Home，重启该测试 Backend，再取得 fresh endpoint 和健康状态。
      - 让原生 App 重新连接，确认发现新 streamId 后重读 overview，不继续把旧游标当作新流基线。
      - 在新进程创建本例资源并观察事件；确认 Home 与新 Backend 一致，记录重启前后证据。

  - id: IOSSESSION-013
    name: 原生资源创建打开删除形成完整生命周期
    required: true
    description: >
      原生 Home 的项目与终端操作使用现有 API，终端删除经确认且与远端状态一致。
    preconditions:
      - 原生 App 已登录专用 Backend，具备本例临时目录及创建项目/终端权限。
    steps:
      - 从原生 Home 创建指向该临时目录的项目，再在项目中创建终端；确认列表出现一次且可进入新终端详情。
      - 返回 Home 后重新打开该终端，发起删除并先取消；确认会话仍存在。
      - 再次删除并确认；确认后端会话已删除、Home 条目消失，不影响其他项目；只清理本例创建的剩余资源。

  - id: IOSSESSION-014
    name: 原生连接配置独立持久化
    required: true
    description: >
      新增和编辑连接遵循 URL 规则，冷启动后恢复当前选择，不隐式改动其他连接。
    preconditions:
      - 原生 App 有可操作连接管理入口和至少一个独立连接，已记录原配置。
    steps:
      - 新增带路径前缀、query 和 hash 的测试 HTTP 或 HTTPS 地址；确认保留合法路径前缀并移除 query/hash，拒绝非 HTTP 协议。
      - 编辑连接名称及地址，关闭再启动原生 App；确认配置持久化，地址变化后的任务和缓存没有沿用旧目标。
      - 确认本例未编辑的连接配置不变，冷启动后没有隐式迁移、清理或恢复到另一台电脑。

  - id: IOSSESSION-015
    name: 原生网络权限与 TLS 连接结果准确
    required: true
    description: >
      真机能按已配置网络策略访问测试电脑，局域网权限拒绝或证书无效有明确错误，不能通过绕过校验伪造成功。
    preconditions:
      - 真机与专用测试电脑网络可达，有合法 HTTPS 端点以及仅限测试的无效证书端点。
      - 本例设备可控制局域网权限，已确定原生 App 对显式局域网 HTTP 地址的 ATS 配置策略。
    steps:
      - 配置合法 HTTPS 地址并连接；确认 health、认证与 WSS 都连到目标电脑，不将手机 localhost 当电脑地址。
      - 拒绝局域网权限后连接局域网地址；确认展示可解释的权限或连接错误，恢复权限后可重新检测。
      - 连接无效证书端点；确认失败且未跳过信任校验。核对项目无全局放开 ATS，并记录显式局域网 HTTP 地址实际允许或拒绝的结果与既定策略一致。

  - id: IOSSESSION-016
    name: 终端侧边返回手势只关闭当前页面
    required: true
    description: >
      原生终端详情通过系统导航返回 Home，保留草稿和远端会话，纵向滚动不触发返回。
    preconditions:
      - 原生 App 已登录并打开本例创建的专用终端，已记录 session ID 与后端进程。
      - 终端具有可滚动历史且 Composer 有未发送的唯一草稿，执行者独占该测试客户端。
    steps:
      - 在终端中央纵向拖动；确认仍停留终端详情，未发起导航退出或发送草稿。
      - 从屏幕左边缘向右滑动返回；确认进入原 Home，当前客户端连接释放，远端会话仍存在。
      - 重新打开同一终端；确认原草稿保留、实时连接恢复，未创建替代会话或自动发送草稿。
