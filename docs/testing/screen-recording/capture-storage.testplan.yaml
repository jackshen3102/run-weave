version: 1
name: 屏幕记录一期采集与存储
description: >
  验证一期计划定义的独立 Mac 采集、隐私过滤、分段存储、恢复和清理。
  这是待实现合同，不代表功能当前存在。每条独立使用任务归属明确的 Debug 隔离目录，记录构建来源，
  结束后正常停止本任务实例，不破坏正式记录。实际原生操作与媒体核验取证，不用格式校验代替行为验证。
  本期不验证浏览界面、网络、iOS、模型和随记写入。
cases:
  - id: SRC-001
    name: 独立采集不依赖查看窗口
    required: true
    description: 首次不采集，开始后关闭设置窗口仍运行，不依赖 Runweave 或 RemoteDesk 会话。
    preconditions:
      - 当前 Debug App 已构建并使用本用例空白目录，屏幕权限可通过 Mac 原生界面授予。
      - 已记录 Runweave 与 RemoteDesk 状态，验证不需要改变其他任务的运行状态。
    steps:
      - 启动 App，确认未产生媒体；在本机授予屏幕权限并点击开始。
      - 关闭设置窗口并观察至少 30 秒，确认同一进程继续采样且不依赖 Runweave 或远控会话。
      - 正常退出本任务实例，确认进程结束且正常封段，未自动重新启动采集。
  - id: SRC-002
    name: 帧索引与真实画面时间一致
    required: true
    description: 默认采样约 10 秒，ready 段的帧数及实际画面与时间索引一致。
    preconditions:
      - 本用例目录采用默认采集配置，屏幕显示可变的无敏感时间标记。
    steps:
      - 连续采集超过 11 分钟并改变可见标记，记录操作时间，确认至少一个段自动封口。
      - 正常退出后执行 ScreenJournalInspect verify，确认 ready 段全部可解码，帧数与索引一致。
      - 按首、中、尾 capture ID 执行 extract 并实际打开图片，核对标记及采集时间，不以视频播放时间推算实际跨度。
  - id: SRC-003
    name: 活动显示器切换与移除
    required: true
    description: 跟随鼠标目标切换后媒体与 display ID 一致，显示器移除不生成重复旧画面。
    preconditions:
      - 本任务目录启用采集，Mac 有两块显示不同合成标记的屏幕，第二屏可以安全断开并恢复。
    steps:
      - 移动鼠标切换屏幕，等待跟踪防抖和两个采样周期，确认新段使用新的 display ID。
      - 移除当前屏幕，确认刷新到可用目标或明确暂停，没有将旧图重复作为新帧。
      - 停止后抽帧核对各阶段屏幕标记，并恢复本用例改变的显示器连接；缺设备时记录阻塞。
  - id: SRC-004
    name: 前台排除应用只保存占位
    required: true
    description: 被排除应用的前台内容和名称不进入记录，保存通用隐私占位及标记。
    preconditions:
      - 本任务目录启用采集，一个可控应用显示唯一无敏感测试文字。
    steps:
      - 将测试应用加入排除名单，置于前台并等待两个采样周期，记录起止时间。
      - 停止 App 后核验对应记录及抽帧，确认 privacyPlaceholder 标记、通用占位图，且没有测试文字和应用名称。
      - 检查本任务日志，确认不包含被排除画面内容。
  - id: SRC-005
    name: 背景排除窗口及动态规则不会绕过过滤
    required: true
    description: 背景可见的排除窗口不入库，新规则生效后旧策略的迟到结果不提交。
    preconditions:
      - 本用例目录启用采集，两个可控应用窗口并排可见，分别显示不同合成标记。
    steps:
      - 保持允许应用在前台，将另一应用加入排除名单，反复新开其窗口并保持背景可见。
      - 采样期间更新名单，记录规则版本和生效时刻，确认旧代际返回被丢弃或按新规则重新采样。
      - 停止后检查生效后的媒体，确认允许内容可见、排除标记不可见，没有未过滤全屏回退。
  - id: SRC-006
    name: 锁屏恢复尊重手动暂停
    required: true
    description: 锁屏停止画面采集，解锁仅恢复用户仍希望启用的记录。
    preconditions:
      - 本任务独立实例运行，执行者能在真实 Mac 安全锁屏解锁。
    steps:
      - 运行时锁屏超过两个采样周期后解锁，核验锁屏区间没有真实画面且恢复后产生新帧。
      - 手动暂停后再锁屏解锁，确认保持停止且无新采样。
      - 退出后核对状态事件及实际采集时间，不只检查状态文案。
  - id: SRC-007
    name: 休眠唤醒恢复单条采集链路
    required: true
    description: 休眠封段并暂停，唤醒重新核验系统状态，不残留重复采集任务。
    preconditions:
      - 本任务实例采集，Mac 可以安全休眠且不会中断其他任务；条件不足记录阻塞。
    steps:
      - 记录采样计数，令 Mac 休眠并唤醒，确认按延迟和权限条件恢复。
      - 观察至少一分钟，确认无重复队列、重复序号及休眠期间的伪造帧。
      - 正常退出后执行 verify，确认休眠前已提交段保全且新段可读。
  - id: SRC-008
    name: 屏幕权限撤销后明确停止
    required: true
    description: 权限撤销后不继续采集或循环弹窗，恢复需遵循系统实际授权结果。
    preconditions:
      - 本任务 App 在独立目录采集，执行者能通过 macOS 系统设置管理其权限，不操作系统权限数据库。
    steps:
      - 通过系统设置撤权，核对进入权限阻塞且采样停止，无循环授权提示。
      - 本机恢复权限，按系统要求重启或在 App 恢复，确认新采样在重新授权后产生。
      - 留存实际系统操作和缺口原因；无法完成授权时记录阻塞。
  - id: SRC-009
    name: 暂停不被迟到采集回调覆盖
    required: true
    description: 暂停失效旧代际，在途结果不能重新开段或继续写入。
    preconditions:
      - 本用例实例采集且诊断可观察代际、在途任务及计数。
    steps:
      - 在采样期间通过原生控制开始和暂停至少十次，记录暂停生效时间及代际。
      - 最终暂停保持超过两个采样周期，确认没有旧回调重开 writer 或追加记录。
      - 正常退出后 verify，确认无重复 frame index 或旧代际提交。
  - id: SRC-010
    name: 异常退出保全已提交段
    required: true
    description: 异常终止后 ready 段不丢失，未封口段恢复成功或明确报告损失。
    preconditions:
      - 专属 Debug 实例已有 ready 段且正在写新段，已记录本任务 PID、目录和 ready 媒体校验值。
      - 目录只含本用例材料，可以安全终止该明确归属的进程。
    steps:
      - 仅异常终止本任务进程，再启动同一目录并取得新 PID 和真实状态。
      - 确认先恢复再采集，ready 校验值不变，未封口段补交或标明不可恢复，不冒充成功。
      - 正常退出并 verify、抽帧，报告实际损失时间范围，不删除其他已提交段。
  - id: SRC-011
    name: 按保留期限清理整段
    required: true
    description: 过期和跨边界段按约定删除，完全未过期的段保留，不修改系统时钟。
    preconditions:
      - fixture 工具在本用例空白目录生成过期、跨边界及未过期的可解码段与一致索引，清单已保存。
    steps:
      - 启动本任务实例执行清理，确认过期及跨边界段删除，完全未过期段保留。
      - 停止并 verify，确认被删段索引清理、剩余原 ID 可抽帧。
      - 记录边界处提前删除范围，确认不超过一个段的计划语义。
  - id: SRC-012
    name: 容量清理释放真实磁盘空间
    required: true
    description: 超预算时先删最早已提交段，活动 writer 不被直接删除也不长期绕过上限。
    preconditions:
      - 本用例 fixture 目录有多个可解码段，Debug 设置显式小容量预算，真实卷空间充足。
    steps:
      - 启动后核对最早段优先清理，用实际文件字节数确认预算覆盖媒体、数据库、日志和临时文件。
      - 继续采集触及预算，确认必要时暂停并安全封段再清理，不删除仍被 writer 使用的文件。
      - 停止后 verify，确认剩余索引可读；无法满足预算时保持明确存储阻塞，不谎报清理成功。
  - id: SRC-013
    name: 低空间保护不越界删除
    required: true
    description: 空间低于保护线停止采样，不无限写入或删除其他目录。
    preconditions:
      - 本用例使用 Debug 隔离目录及 --validation-free-bytes 注入低空间，状态明确标明注入。
    steps:
      - 注入低于 1 GiB 的剩余空间并请求采集，确认存储阻塞且无持续媒体增长。
      - 正常退出，去掉注入重新启动并核对真实空间，确认只在条件满足且用户仍希望记录时恢复。
      - 核查文件操作无目录外删除；记录本项仅为低空间注入验证，没有实际填满系统卷。
  - id: SRC-014
    name: 清理中断恢复幂等
    required: true
    description: deleting 状态无论文件仍在或已删除都可收敛，失败文件不从实际用量中隐去。
    preconditions:
      - 本用例 fixture 包含文件仍在及文件已删除的 deleting 段，以及未受影响 ready 段的校验值。
    steps:
      - 启动并正常退出，确认清理完成或报告具体失败，ready 段内容不变。
      - 再次启动退出同一目录，确认重复恢复不产生额外删除或重复记录。
      - verify 并核对磁盘统计，确认索引状态与真实残留一致。
  - id: SRC-015
    name: 无输入保留实际画面及空闲元数据
    required: true
    description: 普通无输入不停止采样，不把阅读直接当作没有工作或生成模型结果。
    preconditions:
      - 本用例目录启用采集，可以保持屏幕未锁定且无输入三分钟，不修改长期电源配置。
    steps:
      - 显示无敏感阅读或播放内容并停止键鼠输入三分钟，确认采样继续增长。
      - 恢复一次输入后停止 App，核对空闲秒数先增长再回落，采集失败的空闲读数为 null。
      - 抽帧确认该区间有真实内容，未自动生成语义事项或调用模型。
  - id: SRC-016
    name: 只读抽帧遵守记录可用性
    required: true
    description: 停止态的只读诊断不修改数据，未提交、过期和不存在记录不能导出为有效图片。
    preconditions:
      - 本用例专属停止态 fixture 目录有 ready、未提交和过期记录，没有启动写入者，原始校验值已记录。
    steps:
      - 导出 ready 记录并实际打开图片，确认与 fixture 清单内容一致。
      - 对同目录中未提交、过期及不存在 ID 导出，确认分别返回明确错误。
      - 导出到已有目标文件时确认不覆盖，核对原始数据库业务内容及媒体未改变。
  - id: SRC-017
    name: 八小时真实采集资源和覆盖达标
    required: true
    description: 默认配置连续八小时，采样覆盖与资源符合计划，全部已提交媒体可验证。
    preconditions:
      - 已获准在真实工作时段采集，当前构建使用专属目录及默认参数，能记录 CPU 时间、RSS、磁盘与状态。
      - 有至少八小时的实际观测窗口；不足时记录未完成，不用短跑、fixture 或模拟器替代。
    steps:
      - 连续运行至少八小时，每分钟留存资源采样，分别统计启用时段及手动暂停、锁屏和休眠。
      - 对有效时段计算应有 tick，成功不少于 99%；忙碌跳过及失败计入缺失，所有缺口有原因。
      - 按进程树累计 CPU 时间计算单核占比，平均不高于 5%，每分钟采样的 RSS 峰值不高于 300 MiB；超标留证并判失败。
      - 正常退出后 verify 并抽取早中晚图片，记录实际增长、缺口及资源结论，不宣称完成手机验收。
  - id: SRC-018
    name: 更高 schema 拒绝旧版本写入
    required: true
    description: 不兼容格式明确阻塞，不清空、降级或重建用户数据库。
    preconditions:
      - 本用例 fixture 有高于当前支持版本的 schema 和已知媒体，已记录数据库及媒体校验值。
    steps:
      - 启动本任务 App 指向该目录，确认采集前拒绝写入并提示版本不兼容。
      - 退出后核对版本、记录数和媒体，确认没有降级、清空或新采样写入。
  - id: SRC-019
    name: 同目录始终只有一个写入者
    required: true
    description: 同一目录的第二实例不能并发写入，首个实例停止后锁正常释放。
    preconditions:
      - 本用例独立目录已有本任务实例采集，原 PID、采样计数及锁归属已记录。
    steps:
      - 用同一目录启动第二实例，确认其拒绝运行且原实例继续采样，没有并行 writer。
      - 正常退出原实例后再次启动同一目录，确认新实例能获得锁，前一实例不再写入。
      - 正常退出新实例并 verify，确认切换期间没有重复序号或损坏已提交段。
  - id: SRC-020
    name: 活动写入期间诊断只读状态不解码
    required: true
    description: verify 和 extract 在写入者存活时拒绝，status 标明快照时效且不会把陈旧 PID 当作运行证明。
    preconditions:
      - 本任务在独立目录采集，有可用 capture ID 并能取得进程及状态快照。
    steps:
      - 运行时请求 verify 和 extract，确认拒绝并提示停止写入者，原采集继续且未被诊断封段。
      - 请求 status，核对返回 PID、快照更新时间与实际进程，确认是带时效的状态信息。
      - 正常退出本任务实例后再次 status，确认不因旧状态文件存在就报告正在采集。
