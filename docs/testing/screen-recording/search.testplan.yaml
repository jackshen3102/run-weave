version: 1
name: 屏幕事项关键词搜索
description: >
  行为合同，只验证当前设备最近事项的标题和摘要检索，不包含向量或 OCR 搜索。
  每例自建独立 Debug fixture 与可清理目录，禁止改正式库或读取个人画面。
  数据与服务归本例所有，结束后释放本例资源；格式通过不代表行为通过。
cases:
  - id: SRS-001
    name: 关键词只匹配标题和摘要
    required: true
    description: 中文子串、ASCII 大小写及多词 AND 规则确定，符号按字面量匹配。
    preconditions:
      - 本例隔离事项含标题命中、摘要命中、跨字段多词命中，以及只在 detail 或证据中命中的反例。
      - fixture 还包含百分号、下划线、斜杠、引号、反斜杠和中英混合文字，manifest 给出每个查询的预期 ID。
    steps:
      - 通过真实 owner analysisSearch 依次查询登录、登录 刷新、Runweave 及符号样本，核对结果 ID 与命中字段。
      - 确认 detail 和证据中的单独命中不返回，多词少一个不返回，百分号和下划线不充当通配符。
      - 查询空白、超过一百 Unicode 标量、超过八词及 NUL 输入，确认 INVALID_ARGUMENT，不退化为全部记录。
  - id: SRS-002
    name: 日期与顺序依据实际事项时间
    required: true
    description: 上海自然日起止包含，按实际末次发生时间排序，不能使用更新时刻代替。
    preconditions:
      - 本例 fixture 有上海零点前后、同日多时间片、相同末时刻及旧事项晚更新样本，执行时钟固定。
    steps:
      - 查询指定起止日，确认只返回 day 在范围内的事项，零点边界与上海日期一致。
      - 比对 firstStartMs、lastEndMs、spanCount 和结果顺序，确认旧事项晚更新没有提前，同末时刻按 cardID 稳定排序。
      - 查询反向范围、虚构日期、未来日及超过最近三十自然日的范围，确认拒绝而非静默裁剪。
  - id: SRS-003
    name: 结果上限明确且不产生搜索副本
    required: true
    description: 最多返回请求上限并正确标 hasMore，无匹配与错误有区别，搜索不生成导出或媒体。
    preconditions:
      - 本例独立库有超过一百条匹配记录，已记录 cards、export_snapshots、媒体与模型调用计数。
    steps:
      - 分别请求小 limit 和默认 limit，确认返回数量、稳定顺序及 hasMore 正确，响应不带 detail、证据全文或图片。
      - 查询不存在的词，确认成功空数组且 hasMore 为 false；使来源不可达后再查，确认明确错误而非成功空集合。
      - 核对搜索前后数据库与文件计数，确认没有增加导出快照、媒体副本或模型调用。
  - id: SRS-004
    name: 修订与清理后不返回过时事项
    required: true
    description: 搜索读取当前 cards，旧 revision 不参与匹配，清理后无法借搜索找回删除内容。
    preconditions:
      - 本例隔离 owner 有可修订的事项、其旧 revision、文字已到期但尚未清理的事项和仅图片到期的事项。
    steps:
      - 修改当前标题摘要并重新搜索，确认新词命中、仅旧 revision 有的词不命中。
      - 查询文字到期与图片到期的两类事项，确认前者不返回、后者仍返回文字；执行本例清理后重复查询结果一致。
      - 查询后删除或替换该卡，再按 day/cardID 读取详情，确认不按相似标题替换目标，旧来源不能复活。
  - id: SRS-005
    name: HTTP 查询沿用鉴权且正确编码文本
    required: true
    description: 搜索词可以包含普通标点但不能绕过参数与身份边界，HTTP 与本地结果一致。
    preconditions:
      - 本例 Backend 连接隔离 owner，具有有效、无效及错误连接标识的测试请求，fixture 包含带斜杠和加号的标题。
    steps:
      - 用 URL 编码后的中文、斜杠、加号、百分号查询，确认结果与本地 owner 一致，不被 ID 专用规则误拒。
      - 分别移除认证、使用无效认证和错误 connection 标识，确认请求拒绝且无事项内容；请求数组型参数和非法 limit 同样拒绝。
      - 检查成功响应 no-store，查询不会进入新增遥测或日志字段；返回前令牌失效时不释放结果。
  - id: SRS-006
    name: Mac 搜索到详情及过期证据
    required: true
    description: 原生交互完成搜索、查看详情及返回，证据过期保留文字并明确提示。
    preconditions:
      - 本例 Debug Mac App 有已整理事项、有效证据及过期证据，CUA 可操作原生窗口。
    steps:
      - 使用 CUA 打开搜索事项，输入但不提交，确认没有请求；提交后核对结果和日期范围。
      - 点击结果打开正确详情及有效画面证据，再返回搜索，确认关键词、日期与列表位置保留。
      - 打开仅证据过期的事项，确认文字可读且证据明确不可用；检查多段时间不被标成工作时长。
  - id: SRS-007
    name: iOS 模拟器搜索复用原生详情
    required: true
    description: 手机通过当前认证连接完成关键词检索及证据导航，无匹配、超过上限和不支持能力有明确文案。
    preconditions:
      - 本例已租用独占模拟器并安装对应 Runweave，连接有标注搜索数据的隔离 Backend。
      - 本例服务支持在保持同一测试连接的情况下提供能力缺失响应，不依赖真实个人记录。
    steps:
      - 使用 toolkit:agent-device 搜索并调整日期，确认只在提交时请求，点结果进入对应原生详情及画面。
      - 分别查询无匹配和超过一百条的词，确认显示准确提示；关闭能力声明后确认提示更新而非没有记录。
      - 保存模拟器交互证据并释放租约，不报告真机通过。
  - id: SRS-008
    name: 手机旧查询和旧连接不能回填
    required: true
    description: 请求结果只属于发起时的查询及连接，断线后不提供离线搜索资料。
    preconditions:
      - 本例独占模拟器与两个标记不同的测试 Backend 可用，第一连接能延迟响应。
    steps:
      - 使用 toolkit:agent-device 提交查询 A 后改为 B，再释放 A 响应，确认不会显示在 B 下，改回 A 也不接收旧代结果。
      - 重新发起第一连接请求后切换第二连接，再释放旧响应，确认旧事项和详情未进入第二连接。
      - 断开当前连接，确认旧结果与详情清除并显示不可用；恢复后用户重新提交才能查看，最后释放租约。
  - id: SRS-009
    name: 有界查询不阻断采集
    required: true
    description: 日期限定数据量下搜索满足预算，超时有界失败且采集继续。
    preconditions:
      - 本例隔离库有三十天一万条事项，Debug App 正在采集无敏感测试画面，已记录采样与解码计数。
      - 验证入口可延迟本例 SQL 执行并观察进度处理器的注册与移除，不影响其他环境。
    steps:
      - 对有命中、无命中、多词和超过上限各执行至少二十次，记录设备、输入规模、耗时分布及响应字节，确认 owner 查询 p95 不超过三百毫秒、响应不超过一 MiB。
      - 注入 SQL 超时，确认两秒预算内终止查询并返回可重试 BUSY，进度处理器被移除，后续正常查询可成功。
      - 检查新增采样仍在推进且搜索没有触发解码，关闭本例服务后只清理本例目录。
