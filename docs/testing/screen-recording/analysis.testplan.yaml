version: 1
name: 屏幕记录三期增量事项验收
description: >
  三期待实现合同，格式通过不代表功能通过。每例使用独立 Debug 数据目录及本例拥有的服务，
  不读取个人屏幕库、不修改正式配置；结束后只清理本例资源。隔离响应验证协议，真实模型验证语义，
  Mac 与模拟器分别取证，不宣称真机通过。
cases:
  - id: SRA-001
    name: 批次只覆盖已提交的实际采样
    required: true
    description: 分批遵循十五分钟、两分钟缺口和上海日界，短尾与迟到帧不静默丢失。
    preconditions:
      - 独立 fixture 提供已标注的 ready 帧、writing 段、超过两分钟的缺口、跨日短尾和延迟提交段。
      - 本例 worker 使用可记录输入的隔离模型响应，时钟与提交由本例控制。
    steps:
      - 驱动分钟检查，逐项核对冻结 manifest，只包含 ready capture ID，并按真实采样时间和日界切分。
      - 保持当前不足十五分钟的尾部活跃，确认等待；推进到结束或跨日，确认不足五分钟的 ready 尾部也被安排。
      - 提交较早时刻的延迟段，确认新增分析覆盖，而不是被最大时间戳跳过；检查每个应处理 capture ID 的账本归属。
  - id: SRA-002
    name: 同一设备只接受当前租约结果
    required: true
    description: 两个 Backend 竞争同一 owner 时只允许一个有效 claim，旧 generation 不可提交。
    preconditions:
      - 本例一个隔离 owner、两个 worker 和可推进的租约时钟已启动，均不连接正式服务。
    steps:
      - 两个 worker 同时领取同一批，确认只有一个有效 claim，另一个不启动模型。
      - 停止本例持有者续期并推进到过期，让另一 worker 领取，确认 generation 改变。
      - 使用旧 generation 提交，确认拒绝且新卡片版本未改变；新持有者提交可成功，未知进程未被取消。
  - id: SRA-003
    name: 事项修订提交可安全重放
    required: true
    description: 丢失提交响应不会生成重复卡，冲突版本不能覆盖新结果。
    preconditions:
      - 本例独立 owner 已有一张可延长事项和固定输入 manifest，可拦截一次提交响应。
    steps:
      - 提交同事项延长结果并丢弃响应，按 operationId 查询回执并重放相同请求，确认只有一次修订与同一 matterId。
      - 修改内容但复用 operationId，确认拒绝；使用过时 baseRevision 再提交，确认冲突且新版本保留。
      - 比对事项、来源和覆盖账本，确认同一事务生效，不出现已标处理却没有结果的批次。
  - id: SRA-004
    name: 模型材料与运行预算有界
    required: true
    description: 帧数、文本、输出和调用次数受限，图片过期与取消不会留下第二份截图归档。
    preconditions:
      - 本例 worker 使用可延迟和产生超限输出的隔离 provider，fixture 超过二十帧及六十四 KiB 文本。
    steps:
      - 执行批次并检查 provider 输入，确认常规不超过十五帧、补取后总共不超过二十帧、文本分页且未读部分标 partial。
      - 注入超时和超限响应，确认取消并等待本例进程退出，总调用不超过三次，退避及失败缺口可查。
      - 在图片期限到达时确认停止使用到期材料，等待进程退出后检查临时目录没有图片残留，也未复制到长期媒体目录。
  - id: SRA-005
    name: 重启保留分析进度及重试次数
    required: true
    description: worker 重启不重复已完成结果、不归零失败预算、不漏掉未完成批。
    preconditions:
      - 本例独立 owner 有已成功批、已失败两次批和待处理批，已记录 ID、修订及尝试数。
    steps:
      - 正常停止并重启本例 Backend，重新取得 PID、服务端点与 worker 身份。
      - 驱动恢复检查，确认成功批不重复生成、失败批仍只有一次自动调用预算、待处理批仍可领取。
      - 检查恢复后账本与重启前快照，确认没有重复事项或覆盖回退。
  - id: SRA-006
    name: 空闲及缺失材料不会被当作没有工作
    required: true
    description: 无材料不调用模型，输入空闲只描述可观察状态，后台事件和缺口各自保留。
    preconditions:
      - 本例独立 fixture 分别提供空集合、可判定空闲段、空闲但有明确后台事件的段和来源不可达状态。
      - 隔离 provider 记录调用及产物，所有状态可在本例内独立重置。
    steps:
      - 分别执行各输入，确认空集合及可跳过的纯空闲批不调用模型，文字不宣称没有工作。
      - 对有后台事件的空闲段执行分析，确认保留后台事项，不计为本人活动时长。
      - 对不可达来源查询覆盖，确认 unavailable 或 partial，不输出完整空集合。
  - id: SRA-007
    name: 真实模型按事项整理并遵守证据边界
    required: true
    description: 用人工标注材料验证语义，不能用固定响应或 JSON 格式通过替代质量结论。
    preconditions:
      - 本例拥有可用视觉模型配置及不含个人资料的标注样本，模型不可用则单独报告阻塞。
      - 样本覆盖同应用多任务、同任务跨应用、中途继续、并行后台、空闲阅读、伪成功画面和恶意页面指令。
    steps:
      - 逐组运行真实模型，保存模型版本、输入摘要、耗时、帧数和可得用量，与人工标注逐项对照。
      - 确认按目标拆并、继续事项保留身份、后台跨度不算本人工作时长，未观察区间不补写活动。
      - 确认伪成功截图不能产生 verified，页面指令不能触发工具执行或无来源结论；任一错误单独记录而非只报告 schema 通过。
  - id: SRA-008
    name: 分析与导出接口沿用身份和版本边界
    required: true
    description: 未授权访问不能读取或触发重试，冻结导出不得拼接不同修订。
    preconditions:
      - 本例独立 Backend、owner 和两页事项可用，具有有效与无效测试凭据。
    steps:
      - 分别请求 status、cards、detail、export 和 retry，确认无凭据或错误凭据被拒绝，有效请求按合同返回。
      - 读取第一页后修订事项，使用旧 snapshotRevision 继续，确认冲突而不是混合版本。
      - 检查响应不含本地路径、媒体字节或手机令牌，HTTP 不提供任意 claim 或 commit 接口。
  - id: SRA-009
    name: 分析故障不影响原始采集回放
    required: true
    description: 衍生库故障只阻塞分析域，原采集数据库和可读媒体保持可用。
    preconditions:
      - 本例隔离 App 正在采集无敏感测试画面且有可回放 ready 段，分析库可注入不支持的 schema。
    steps:
      - 注入分析库版本错误，确认分析状态明确报错而原采集继续产生新的 ready capture。
      - 读取原有 ready 帧并比对画面标记，确认未因衍生库故障损坏或停止回放。
      - 关闭本例分析开关，确认原始采集和查看仍可使用，旧分析库未被自动删除。
  - id: SRA-010
    name: Mac 原生事项可以定位证据
    required: true
    description: Mac 实际交互可从事项进入对应时间片，过期后保留文字并明确证据不可用。
    preconditions:
      - 本例 Debug Mac App 已装配隔离事项、可解码证据及可控到期时间，CUA 可操作其原生窗口。
    steps:
      - 使用 CUA 打开事项列表和详情，确认标题按事项、后台标记明确，切换原始记录可使用既有回放。
      - 点击证据，核对画面标记及实际采集时间与事项关联一致。
      - 推进本例证据过期后刷新，确认卡片文字保留，证据提示过期，不再展示缓存画面。
  - id: SRA-011
    name: iOS 模拟器原生事项及在线证据回放
    required: true
    description: Runweave 原生页面通过现有连接查看事项并进入真实 Backend 提供的回放。
    preconditions:
      - 本例已申请独占模拟器并安装对应 Runweave，连接本例 Backend 与可读隔离事项，具备有效既有鉴权。
    steps:
      - 使用 toolkit:agent-device 打开屏幕记录事项与详情，确认内容、时间片及后台标记与后端一致。
      - 点击证据进入原生回放，核对画面和时间；切回事项，再切原始记录，确认两种入口均可使用。
      - 保存模拟器交互证据并释放本例设备租约，报告来源为模拟器。
  - id: SRA-012
    name: 手机切换连接不残留旧设备事项
    required: true
    description: 断线及连接切换取消旧请求，不能把第一设备的事项和图片显示到第二连接。
    preconditions:
      - 本例独占模拟器已连接两个归属明确且标记不同的测试 Backend，可延迟第一连接请求。
    steps:
      - 使用 toolkit:agent-device 打开第一连接事项并发起延迟请求，再切换第二连接。
      - 释放第一连接响应，确认列表、详情和图片仍属于第二连接，旧结果未回填。
      - 断开当前连接，确认在线查看不可继续且旧图片按二期合同隐藏；释放本例模拟器租约。
