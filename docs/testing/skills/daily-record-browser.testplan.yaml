version: 1
name: 每日工作记录拒绝旧浏览来源
description: 旧浏览主题写入工作合同已退役；独立浏览采集由 suiji/browse-zhihu.testplan.yaml 验收。
cases:
  - id: DRB-001
    name: 旧浏览配置在材料装配前停止
    required: true
    description: 启用旧 browser 来源时拒绝工作采集，不调用浏览读取器或产生浏览模型输入。
    preconditions:
      - 本例独立工作配置启用 browser，状态无活动批次，浏览读取器为记录调用的探针。
    steps:
      - 运行 job.py prepare；确认提示执行 isolate-work，探针没有调用，未创建可发布批次。

  - id: DRB-002
    name: 旧浏览身份迁移保留工作身份
    required: true
    description: 隔离旧浏览映射并保留独立工作映射、历史配置与状态备份。
    preconditions:
      - 本例独立配置与状态含 browser 来源、浏览 anchors 和独立 Agent anchors，没有活动 Agent。
    steps:
      - 执行 isolate-work dry-run；确认原配置和状态字节不变，保留身份计数符合独立工作映射。
      - 正式执行隔离；确认移除 browser 配置及浏览映射，保留工作映射和备份，要求新工作上下文。

  - id: DRB-003
    name: 旧未知导入只核对回执
    required: true
    description: 已退出 Agent 留下的含浏览冻结请求不能重发工作写入。
    preconditions:
      - 本例隔离服务有原导入回执，本地 pending 请求哈希正确，原 Agent 已退出。
    steps:
      - 执行 isolate-work；确认只调用 get_work_import_receipt，原请求字节与幂等键保留，没有 import_work_records 请求。
      - 检查返回与新状态；确认不输出旧事实正文，旧批次标为 retired-browsing，下一轮需要新上下文。
