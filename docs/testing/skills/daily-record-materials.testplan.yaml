version: 1
name: 每日记录消费随记素材
description: >
  面向待实现的手机素材来源，验证真实读图、版本回执、合并去重、历史补报和既有任务执行。
  每条用例使用独立材料及任务状态，格式通过不代表运行通过。
cases:
  - id: DRMATERIAL-001
    name: 日报只读取实际素材并真实读图
    required: true
    description: 显式素材来源能读取原图，而普通笔记与生成的总结不被循环采集。
    preconditions:
      - 本用例隔离日报生产者已启用 materials 并具备真实图片读取能力。
      - 当前 owner 独立准备纯图素材，其唯一可总结信息只在图内；另准备普通笔记和已有总结。
    steps:
      - 执行既有 prepare、review/read 流程，实际通过附件接口将图片交给执行模型；确认模型描述与图中文字对应。
      - 检查材料清单，确认普通笔记和总结不在素材来源内，截图不能单独生成 verified。
      - 完成 validate、publish 及独立回读；确认事实引用实际素材版本，素材显示已整理。
  - id: DRMATERIAL-002
    name: 图片读取失败不确认整理完成
    required: true
    description: 图片不可读或模型不能接收图片时保留缺口，不根据备注伪造读图成功。
    preconditions:
      - 隔离日报来源开启，本用例有一条图片素材且能使其附件读取确定失败。
    steps:
      - 执行材料采集和阅读；确认该项记录 partial 或失败，回执没有推进 processedVersion。
      - 独立读取素材状态，确认仍待整理；输出不得声称已经覆盖图中内容。
  - id: DRMATERIAL-003
    name: 消费与回执原子且版本匹配
    required: true
    description: 旧版本消费请求不能把已修改素材标记完成，也不能留下半提交事实。
    preconditions:
      - 隔离服务中有独立素材，已冻结针对其当前版本的导入请求但尚未发布。
    steps:
      - 修改素材正文使版本递增，再提交冻结的旧版本请求；确认事务被拒绝，事实和回执均未部分提交。
      - 重新采集当前版本并发布；确认事实与 processedVersion 在同一事务成功，回执本身没有增加正文版本。
  - id: DRMATERIAL-004
    name: 重跑合并已有事项且保护人工修改
    required: true
    description: 同一手机素材和电脑事项合并后重跑不增加重复事实。
    preconditions:
      - 本用例隔离生产者拥有同一事项的电脑证据与手机素材，以及可独立恢复的任务状态目录。
    steps:
      - 完成一次真实阅读、合并、发布和回读；确认同一事项使用稳定 eventKey 并保留两种来源。
      - 人工修改已生成事实的一个字段，再重跑同一来源；确认事实数量与身份稳定，人工字段未被覆盖。
      - 检查素材回执，确认没有通过生成第二条事实来换取已整理状态。
  - id: DRMATERIAL-005
    name: 生效范围内旧日期的新素材触发补报
    required: true
    description: 已确认的历史日报不会使后来上传或改日期的素材被永久跳过。
    preconditions:
      - 隔离任务有来源生效日以后且距今超过七天的已确认日期。
      - 本用例新建一条归属该历史日期的素材。
    steps:
      - 执行增量发现；确认历史日期被重新安排，新增事实归属该日期而非上传当天。
  - id: DRMATERIAL-006
    name: 已整理素材改日期时保持事实身份
    required: true
    description: 改归属日期后处理旧日和新日，不复制事实或移动其他来源的进展。
    preconditions:
      - 本用例隔离生产者拥有一条已整理素材及稳定关联事实，原日另有其他来源证明的独立进展。
      - 目标日期在该素材来源生效范围内，原事实有可回读的 eventKey 和 externalKey。
    steps:
      - 修改该素材归属日期后运行采集和发布；确认旧日和新日均被重新核对，关联事实身份不变，没有复制一条同义事实。
      - 回读原日的其他来源进展；确认它仍在原日，人工修改字段仍被保护，素材当前版本获得处理回执。
  - id: DRMATERIAL-007
    name: 取消分类和回收站阻止后续读取
    required: true
    description: 用户取消或删除素材后不继续采入，已经生成的总结不被暗中删除。
    preconditions:
      - 本用例独立准备两条未整理素材和一条已生成总结的素材，均属于当前 owner。
    steps:
      - 将第一条改成普通想法，将第二条移入回收站；运行变化发现，确认二者不进入后续有效材料。
      - 删除已整理素材；确认操作说明已生成总结会保留，原总结仍存在。
      - 恢复回收站中的素材并重新读取；确认分类和附件仍在，只有有效当前版本才可重新处理。
  - id: DRMATERIAL-008
    name: 既有任务自然到点完成手机来源消费
    required: true
    description: 验证已配置的真实定时执行，手动运行不代替自然调度证据。
    preconditions:
      - 用户已授权正式启用，已部署的服务与 App 支持素材，指定的一个既有日报任务已按原配置迁移来源。
      - 本用例在该任务本次覆盖日期内独立保存一条可识别的手机素材，并确认云端收到。
    steps:
      - 等待既有任务自然到点运行，记录原任务与实际 run 身份；若未到时间或没有运行则记录阻塞，不以手动触发宣称通过。
      - 独立回读素材当前版本的处理回执和对应每日事实；确认内容、归属日期及来源正确且无重复。
