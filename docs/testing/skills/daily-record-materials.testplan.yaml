version: 1
name: 每日工作记录拒绝浏览材料
description: 旧素材工作消费合同已退役；独立浏览与工作隔离统一由 browse-domain.testplan.yaml 验收。
cases:
  - id: DRMATERIAL-ISOLATION-001
    name: 素材不进入工作采集与导入
    required: true
    description: 旧配置与未知请求必须安全迁移，不能恢复旧消费行为。
    preconditions:
      - 独立工作配置含旧 materials 或 browser 来源，并有受保护的旧冻结请求清单。
    steps:
      - 使用 job.py isolate-work 的 dry-run 核对旧批次，确认只查询原回执而不重发工作写入。
      - 完成迁移并使用新工作 Agent 上下文及 work 专属凭据，执行采集和工作检索。
      - 检查模型输入边界与实际导入，确认不包含浏览正文、摘要、附件或引用，工作计数与有效范围一致。
