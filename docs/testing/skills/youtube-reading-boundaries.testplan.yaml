version: 1
name: YouTube 阅读稿音频边界回归
description: 验证相邻 ASR 块不会同时丢弃同一句话，字幕补录不会摄入缺口以外的已覆盖音频。隔离输入只证明算法边界，真实样本另外验证。
cases:
  - id: YTB-001
    name: 时间漂移造成的双重排除能够恢复
    required: true
    description: 两个窗口对同一句的时间估计分处边界两侧时，汇总只保留一句；缓存恢复仍给出同样结果。
    preconditions:
      - 使用独立临时工作目录，通过 runtime 的识别调用边界提供两块确定性输出，不修改实际模型或已有阅读稿。
      - 第一块含前文 0 至 599100 毫秒及目标句 599100 至 600920 毫秒；第二块含相同目标句的全局时间 599060 至 600900 毫秒及后文 600900 至 610000 毫秒。
    steps:
      - 调用 transcribe_audio 处理这两个窗口；确认前文、目标句、后文依次保留，目标句恰好出现一次并记录 boundary_recovery。
      - 在同一工作目录再次调用以命中分块收据；确认不重新调用识别引擎，结果与首次相同，目标句不因缓存再次丢失。
  - id: YTB-002
    name: 字幕补录仅识别缺失音频
    required: true
    description: 已有首尾字幕的情况下，实际传给 ASR 的音频只包含缺口，补入文字保持原始识别时间。
    preconditions:
      - 使用独立临时工作目录与 20 秒可控音频，已有字幕覆盖 0 至 10 秒、15 至 20 秒，仅中间 5 秒缺失。
      - 通过运行时识别边界记录真正传入的 WAV 时长、音频起点和输出，不用替代 fill_gaps 的结果来证明其正确。
    steps:
      - 调用 fill_gaps；确认 ASR 输入恰好是原音频 10 至 15 秒的 5 秒片段，没有原来前后各 2 秒的上下文。
      - 令该片段输出位于自身 0 至 5 秒内的第二句；确认合并为第一句、第二句、第三句，补录全局时间保留识别偏移，没有通过裁时间戳保留额外整句。
