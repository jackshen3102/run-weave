version: 1
name: 每日事实记录采集与归属验收
description: >
  待实现计划的验收合同，当前不代表能力已交付。验证跨机器、跨渠道材料按发生时间完整读取，
  事实保留来源与作者，缺失可解释，补齐与重跑不重复。每条用例使用独立临时目录和自有测试资料，
  不修改真实聊天、会话或待办；真实渠道读取另行取证。

cases:
  - id: DAILY-001
    name: 日期窗口覆盖早先开始的会话
    required: true
    description: >
      按指定时区的消息时间筛选，包含早先开始但当日仍活跃的会话，边界为左闭右开。
    preconditions:
      - 已实现每日记录 CLI，执行者拥有独立临时 provider 目录与输出目录。
      - 目录含早先开始的会话，消息位于目标日零点前、恰好零点、日内与次日零点，另有跨日追加文件。
    steps:
      - 配置 Asia/Shanghai 并采集目标日期；确认恰好零点和日内消息存在，前日及次日零点消息不作为当日事实。
      - 核对跨日会话的源定位和清单；确认文件创建日期与 mtime 不改变消息归属。

  - id: DAILY-002
    name: 原生记录只把新增行为计入事实材料
    required: true
    description: >
      四种 provider 的消息、工具结果、分支和历史替换按原生身份读取，系统注入与 reasoning 不成为事实。
    preconditions:
      - 独立目录包含脱敏的 Codex、Pi、Claude、Trae 真实结构样本及逐项消息清单。
      - 样本含重复消息、压缩回放、系统注入、工具结果、Pi 分支与 Trae append/replace。
    steps:
      - 对独立目录运行采集并对照原生消息 ID；确认新增用户和助手行为可定位，工具结果保留原调用归属。
      - 核对替换与回放记录；确认旧消息没有被重新记为当天发生，reasoning 和系统注入不在事实材料中。

  - id: DAILY-003
    name: 全部分页结束前不得声明完整
    required: true
    description: >
      采集按固定窗口及水位读取全部页，预算耗尽时输出 partial 并能继续，不以单页 total 当全天数量。
    preconditions:
      - 本用例独立接口 fixture 含至少三页固定材料、重复边界记录和可追加的新记录，执行者持有完整 ID 清单。
      - 每日记录适配器允许通过独立配置使用该受控接口，其他真实配置未改动。
    steps:
      - 使用只够一页的预算采集；确认 receipt 为 partial，并持有可继续读取的水位与游标。
      - 追加 fixture 新记录并续读到原水位结束；确认原清单无遗漏或重复，新水位数据只在新查询纳入。

  - id: DAILY-004
    name: 飞书事实保留原作者和真实发生时间
    required: true
    description: >
      本人发言、他人成果、转发旧消息与话题上下文不会被错误归为用户当天完成。
    preconditions:
      - 本用例独立材料包含本人提问、他人报告成果、当天转发的旧消息，以及跨日期的话题回复。
      - 每条材料有已知作者、创建时间、原始消息链接与独立事实答案清单。
    steps:
      - 用每日记录 Skill 整理该包并校验、渲染；确认他人成果保留其作者，转发行为与旧内容分开。
      - 逐条回查事实的 sourceIds；确认窗口外话题只作上下文，不升级为当日发生或完成。

  - id: DAILY-005
    name: 随记旧记录当天新增跟进可以采集
    required: true
    description: >
      增量读取可以发现非当天创建记录中的当天跟进，不能只靠按创建日期列记录。
    preconditions:
      - 执行者拥有独立随记测试服务与账号，其中旧记录已有超过一页跟进，目标日新增一条跟进。
      - 本用例的游标和输出目录独立，测试服务不含真实用户资料。
    steps:
      - 从基线与后续变化采集目标日材料；确认读完相关跟进全部页，并以跟进 createdAt 归档当天内容。
      - 检查源记录创建时间在窗口外时的结果；确认该跟进仍存在且没有复制其他日期跟进为当天事实。

  - id: DAILY-006
    name: 随记状态转换由历史版本证明
    required: true
    description: >
      新增只读变化详情返回对应版本时间与前后状态；当前 done 状态和标签修改不冒充当日完成。
    preconditions:
      - 独立随记服务已实现 get_change，测试账号有旧已完成记录、目标日 open 到 done 记录及仅改标签记录。
      - 执行者持有每次 revision 的时间、状态和 sequence 清单，另有不同 owner 的记录。
    steps:
      - 逐项读取变化详情并生成事实；确认只有指定日期真实 open 到 done 的 revision 支持当天完成陈述。
      - 读取 snapshot、缺前序版本及其他 owner 的 sequence；确认基线和未知状态不被臆造，其他 owner 数据不可读。

  - id: DAILY-007
    name: 离线来源恢复后补齐同一日期
    required: true
    description: >
      来源不可达时明确缺失，恢复后补包更新原日期，重复包不重复生成材料或事实。
    preconditions:
      - 本用例拥有机器 A 的材料包和可置为离线的机器 B 读取 fixture，两者有独立 machineId。
      - 本用例输出目录为空，执行者持有两台机器的材料清单及一条跨机器复制会话。
    steps:
      - 在 B 离线时生成记录；确认 A 的材料保存，B 为 unavailable，日记录说明覆盖缺失。
      - 恢复 B 并导入其材料包两次，重新生成同一日期；确认所有材料可回查，跨机器同原生消息合并来源，旧版本仍在。

  - id: DAILY-008
    name: 每条事实都有可核对的证据与归属
    required: true
    description: >
      缺引用不能通过确定性校验，语义抽查区分 Agent 自述、工具回执和用户事项完成。
    preconditions:
      - 独立材料包含 Agent 完成自述、失败工具结果、成功构建回执和讨论中的计划，并有独立答案清单。
      - 执行者拥有每日记录 Skill 及 validate/render 命令，输出限本用例目录。
    steps:
      - 生成 facts.json 并逐条对照材料；确认自述标为 reported，构建只证明构建，计划不写成已实施。
      - 复制事实文件并移除或篡改一个 sourceIds；运行 validate，确认非零退出且不能发布该版本。

  - id: DAILY-009
    name: 材料包路径和哈希校验失败时保护已有记录
    required: true
    description: >
      导入拒绝越界路径、软链接逃逸或正文哈希不符，不覆盖已成功保存的当日版本。
    preconditions:
      - 本用例独立目录已有一个有效当日版本，执行者持有其 current 指针与文件摘要。
      - 独立输入含分别具有越界路径、目录外软链接及错误哈希的三个包，均不指向真实用户文件。
    steps:
      - 分别导入三个包；确认每次明确拒绝，退出非零，不在输出根目录外创建或读取证据文件。
      - 回查原 current 与日记录摘要；确认原有效版本保持不变。

  - id: DAILY-010
    name: 第二台真实机器能交付可定位材料
    required: true
    description: >
      全渠道验收必须取得第二台实际机器的会话，不能用本机复制的 fixture 或健康状态代替。
    preconditions:
      - 用户所指工作机器身份已经明确，执行者有其本地终端或已授权的实际远端入口。
      - 该机器已安装同版采集工具，执行者有至少一条已知日期的真实会话可作只读对照。
    steps:
      - 在工作机器本地采集已知日期并把包交给汇总端；确认 receipt 的节点、machineId、日期与原会话匹配。
      - 在汇总端导入并读取至少一条事实的原始定位；确认可对应实际远端消息，入口不可用时如实记 blocked。

  - id: DAILY-011
    name: 飞书真实账号的读取范围可以解释
    required: true
    description: >
      真实 user 登录态完成时间查询和话题读取，输出声明的范围与实际分页一致，保留来源链接。
    preconditions:
      - 执行者有可用飞书 user 登录态和可只读核对的一日记录，输出使用独立受保护目录。
      - 本用例不发消息、不修改消息，也不下载与目标事实无关的资源。
    steps:
      - 运行指定日期的 self-related 和 all-visible 查询，分别完成各自分页；确认 receipt 明确区分范围，不以一种范围冒充另一种。
      - 从返回消息选择一个实际话题补读上下文；确认每条被采用事实有消息 ID、作者、时间和可回看的链接。
