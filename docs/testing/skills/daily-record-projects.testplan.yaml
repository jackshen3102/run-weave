version: 1
name: 本地每日记录按项目展示结论
description: >
  通过真实 CLI 和独立临时 Git 仓库验证项目归属、旧材料兼容与默认结论输出，
  最后用现有真实周材料验证保留全部事实；不修改原始会话或已有报告。
cases:
  - id: PROJECT-001
    name: 同仓库 worktree 合并且不同仓库保持独立
    required: true
    description: >
      新采集材料及会话清单记录 Git common directory 身份，同仓库各工作目录使用同一身份，
      同名但不同仓库不合并；非仓库与不可访问目录归为未归类。
    preconditions:
      - 独立临时目录有两个目录同名的真实 Git 仓库，其中一个有提交及额外 worktree 和子目录。
      - 独立 HOME 的 Codex 原生会话分别指向主仓库、子目录、worktree、另一仓库、普通目录及不存在的路径，四种来源根目录均存在。
    steps:
      - 运行 collect 与 review；确认主仓库、子目录和 worktree 的 project.id 相同，另一仓库身份不同，普通目录和不存在路径归为未归类。
      - 核对 materials.jsonl 和 sessions.json 均保存项目字段；移走源仓库后运行 review，确认新材料中的项目身份保持不变。
  - id: PROJECT-002
    name: 项目别名与事实引用保持一致
    required: true
    description: >
      旧材料按 cwd 补齐项目，旧事实可省略项目；显式项目名统一跨日展示，错误项目身份或冲突名称不能通过校验，跨仓库事实归为未归类。
    preconditions:
      - 本用例独立临时目录有两个真实仓库、两天消息及有效材料包，拥有独立事实文件。
      - 已准备一份删去项目字段且重新计算材料摘要的旧格式材料包，原材料包未改动。
    steps:
      - 对旧材料运行 review 与 validate；确认能按 cwd 补齐项目，省略项目的旧事实仍通过。
      - 在一条事实中使用来源项目 id 和可读名称，渲染两天记录；确认同一项目所有日期统一采用该名称，跨仓库引用的事实单列未归类。
      - 分别使用错误项目 id、冲突的同项目名称和多行项目名执行 validate 与 render；确认均退出 1，未生成报告。
  - id: PROJECT-003
    name: 默认报告只含项目结论并如实呈现空日与缺失
    required: true
    description: >
      周记录和日记录按日期、项目及结论分层，不展示或生成来源 Markdown；内部引用保留，完整空日显示没有，不完整日期提示缺失，已有产物保持不变。
    preconditions:
      - 本用例有独立完整材料包和事实文件，覆盖两个项目的一天及一个空日；另有相同事实的 partial 材料包。
      - 输出目录均不存在，执行者持有材料和事实原文清单。
    steps:
      - 渲染完整包并回读；确认两项目分组、全部事实与状态保留，空日为没有，Markdown 没有来源编号、链接或附录，未生成 sources.md 或 coverage.md，内部 JSON 仍保留引用和覆盖。
      - 再次写入相同目录；确认退出 1 且原报告摘要不变。渲染 partial 包到新目录；确认退出 2，非空日和空日均说明读取不完整。
  - id: PROJECT-004
    name: 真实周记录保留全部事项并统一归属项目
    required: true
    description: >
      使用已采集的 2026-10-16 至 2026-10-22 北京时间真实材料与 49 条事实，默认生成按项目组织的七天结论，原始报告不变。
    preconditions:
      - 原本机一周材料包及事实文件可只读访问，已明确其采用来源对应 Runweave 仓库。
      - 使用新的受保护输出目录，执行者拥有原事实、来源引用和原报告摘要。
    steps:
      - 对旧材料及事实运行 review，按来源项目 id 使用 Runweave 名称后 validate 与 render；确认七天、49 条事项完整保留，每天均归入 Runweave。
      - 回读全部日文件与周记录，确认只有日期、项目及结论，无来源编号、说明或附件；内部 92 条引用保留且原报告摘要未变。
