version: 1
name: 长任务监控清理与新旧周期隔离验收
description: >
  验证关闭清理的异步隔离、事务失败及持久化边界。每例使用独立临时 SQLite 和受控事件来源，
  不操作用户终端；后端可在进程内调用真实服务与存储验证，不启动产品 HTTP 服务。
cases:
  - id: TSRST-001
    name: 重新开启后迟到结果不能污染新监控
    required: true
    description: 关闭会删除旧监控；同终端同会话立即重新开启后，旧分类、目标预览与投递响应不能写回新监控。
    preconditions:
      - 本例独立服务有已保存的目标和判断，可控制分类、目标预览或投递回执的完成时间。
      - 已记录旧 watchId、原会话和终端输入计数，具备持久化档案查询能力。
    steps:
      - 在旧工作等待期间关闭监控并立即重新开启；确认新 watchId 不同、额度为零且没有继承目标或判断。
      - 分别释放已挂起的旧分类、目标预览或投递响应，交付关闭前的重复事件及迟到消费确认；确认旧记录没有重建，新监控没有旧判断、错误、待确认提示或额度变化，原终端没有额外监督输入。
      - 产生开启后的有效最终回复，确认新监控正常记录新判断；保存新旧身份、数据库与输入计数，清理本例资源。

  - id: TSRST-002
    name: 删除失败不报告清理成功
    required: true
    description: 删除监控及档案共用一个 SQLite 事务；持久化失败后原记录完整，解除故障后可重新关闭。
    preconditions:
      - 本例独立服务已有目标版本、目标采用记录和判断输入，数据目录可注入可恢复的 SQLite 删除失败。
    steps:
      - 注入删除失败并请求关闭；确认请求失败，内存与数据库中的原监控及档案均未出现部分清理。
      - 解除故障并重新读取最新 revision 后关闭；确认响应为 null、原监控与全部档案均不存在，清理本例资源。

  - id: TSRST-003
    name: 重启后清理结果及旧版关闭状态保持
    required: true
    description: 重启不恢复已清理监控；旧版保存的已关闭记录在加载时清理，仍开启的其他终端及历史保留。
    preconditions:
      - 本例独立 SQLite 同时包含终端 A 的已关闭旧版监控和档案、终端 B 的开启监控和档案。
    steps:
      - 初始化真实服务并核对 A 的发现结果为 null，旧监控、目标版本、目标采用记录和判断输入均已删除；确认 B 的开关、身份及历史保持。
      - 开启 A 并关闭，关闭本例服务后重新加载同一数据库；确认 A 仍无监控和档案，B 仍可读取；清理本例服务与数据目录。
