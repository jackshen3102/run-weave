version: 1
name: 可视化方案生成与元素评审
description: >
  面向两期目标行为的验收合同，本次修订不代表行为通过。一期覆盖新技能生成、电脑入口及原生手机阅读，
  二期覆盖电脑 Web/Electron 文件预览复用既有圈选、评论面板、草稿插入及隔离。
  一期执行 VPR-001、VPR-002、VPR-015 至 VPR-017；二期执行 VPR-003 至 VPR-014。
  手机圈选留待后续；格式校验、桌面窄视口和安装成功均不替代手机真机阅读验收。

cases:
  - id: VPR-001
    name: 新技能从源码生成自包含且边界准确的方案
    required: true
    description: >
      验证 visual-plan-review 实际替换旧入口，Agent 按一个明确需求读取相关源码并生成
      自包含方案；内容可追溯，不把 mock 当成产品事实，也不强制无关模板章节。
    preconditions:
      - 一期技能源码已完成，验收会话明确加载该源码技能，未使用旧插件缓存。
      - 已准备一个涉及现有 UI 与调用链的有界需求，已确认相关源码中的至少三项可核查事实。
      - 产物目录由本案例独占，不覆盖用户已有方案。
    steps:
      - 检查插件可用技能；确认仅有新的可视化方案入口，活跃引用已更新，旧技能不再同时注册。
      - 让 Agent 按该需求生成方案，记录实际读取的代码和输出文件；确认生成同一目录的 index.html 与简短 README。
      - 对照预先核查的源码事实，确认方案区分当前能力、拟议行为与 mock，且说明关键目标、用户路径和验收结果。
      - 检查 HTML 的标记、稳定章节 id、大小和资源引用；确认不超过 1 MiB，CSS/JS/SVG 自包含，不依赖 CDN、fetch JSON 或另起服务。
      - 用普通对话要求修改一处已有方案内容；确认更新同一文件并保留相关稳定 id，没有另建同义产物或提前修改产品代码。

  - id: VPR-002
    name: 一期方案通过现有文件和原型库入口阅读
    required: true
    description: >
      验证一个符合一期合同的方案在既有入口显示同一内容，必要交互生效且刷新能看到更新，
      一期界面不伪装已经提供圈选。
    preconditions:
      - 本案例独占的已登记项目内有 docs/prototypes 下的自包含方案，含可辨识标题、稳定元素 id 和一个本地交互。
      - 测试账号可访问该项目，已按 toolkit:runweave-dev-session 准备目标实例；本案例在一期代码验收，二期合入后不再检查一期没有圈选入口这一条件。
    steps:
      - 使用 toolkit:playwright-cli 附着目标 surface，从终端文件链接或 Files 打开该 index.html；确认 Preview 显示标题与核心内容，Source 能显示原文。
      - 操作方案内的必要交互；确认目标 DOM 状态变化，页面无本次功能导致的 console error。
      - 通过当前真实的 Prototypes 路由选择同一项目和 slug；确认阅读的是同一文件，未复用其他项目同 slug 内容。
      - 更新方案中一段可辨识文字并使用现有刷新动作；确认新内容出现，未承诺自动刷新，也没有一期不可用的圈选入口。

  - id: VPR-003
    name: Web 圈选评论只加入明确的 Agent 输入框
    required: true
    description: >
      验证 Web 终端内复用已有圈选交互，从选择 DOM、添加与编辑评论到输入框实际插入的完整主链，
      保留原草稿且不自动发送；用户发送后 Agent 能依据反馈更新方案。
    preconditions:
      - 二期代码已完成，真实 Web surface 已登录独占测试项目，存在可用的 Agent 终端和明确 pane。
      - 项目内有符合一期合同的自包含 HTML，含两个可辨识且有稳定 id 的元素。
      - 目标输入框已有一段可辨识草稿，方案文件没有未保存修改。
    steps:
      - 使用 toolkit:playwright-cli 在该终端的 HTML 文件预览开启评审，选择第一个元素；确认高亮与摘要对应实际 DOM。
      - 使用复用的评论编辑器填写意见，再选择第二个元素添加评论；确认高亮和编号标记对应评论。编辑一条并删除另一条，确认宿主列表与页面定位一致。
      - 点击加入输入框并等待实际消费；确认原草稿仍在，新文本含所评文件、原文摘录和用户意见，且只进入该 terminal/pane。
      - 在未编辑评论时再次查看加入按钮；确认不会重复插入，列表仍可用于复核，没有自动触发发送或 TUI Enter。
      - 用户检查并通过现有发送按钮提交反馈；确认 Agent 修改同一方案的指定内容，刷新后可从文件正文及目标 DOM 核对修改，而非仅凭 Agent 声称完成。

  - id: VPR-004
    name: Electron 宿主复用同一文件评审链路
    required: true
    description: >
      验证 Electron 的实际 Terminal 文件预览可以完成一次元素评论与输入框插入，
      不依赖 Electron 专属采集接口完成本次文件评审。
    preconditions:
      - 二期源码已运行在独占 Dev Session 的 Electron surface，已确认实例与本工作树一致。
      - 有可用 Agent 终端和符合一期合同的自包含方案。
    steps:
      - 使用 toolkit:playwright-cli 附着该 desktop surface，在文件 Preview 开启评审并完成一次元素选择与评论。
      - 加入输入框；确认正文进入明确 pane 的草稿，没有依赖 Electron executeJavaScript 或截图接口才能完成新评审。

  - id: VPR-005
    name: 评审 iframe 不取得宿主权限
    required: true
    description: >
      验证 srcDoc 在用户脚本之前生效的 CSP 与沙箱隔离不可信 HTML；
      页面不能读取父页面或凭据、访问网络、写文件或调用鉴权 API。
    preconditions:
      - 二期 Web 文件评审可用，本案例使用独占方案与已登录宿主。
      - 受控方案脚本包含可观察的父页面读取与网络请求尝试，外部接收地址由本案例控制且不含用户数据。
    steps:
      - 使用 toolkit:playwright-cli 打开受控方案进入评审；检查 sandbox 仅允许 scripts，CSP 在用户脚本之前生效且禁止网络、嵌套 frame、表单与宿主同源访问。
      - 记录页面脚本的实际尝试和浏览器结果；确认不能读取父页面状态或凭据，受控网络请求被策略阻止，未发生鉴权请求或文件写入。
      - 操作方案内的本地交互；确认只改变自身文档，不是通过禁用全部页面脚本冒充隔离通过。

  - id: VPR-006
    name: 文件正文变化使原评审反馈失效
    required: true
    description: >
      验证加入输入框前核对实际完整正文，不能因文件大小或 mtime 相同而把旧评论当成
      当前版本。
    preconditions:
      - 二期 Web 文件评审可用，已有一个方案、固定目标 pane 和一条未加入的评论。
      - 本案例能在执行主机上修改独占方案，并恢复其大小和 mtime；该操作不触及用户文件。
    steps:
      - 使用 toolkit:playwright-cli 保持原评审快照，在执行主机将正文改成等长的另一内容并恢复 mtime。
      - 点击加入输入框；确认宿主重新读取正文后提示版本变化，输入框不变，原评论保留且未自动重贴到新 DOM。
      - 刷新并明确重新开始评审；确认展示新正文，旧评论的丢弃经过明确动作，重新选择后可正常加入。

  - id: VPR-007
    name: 评审目标变化不转投其他会话或 pane
    required: true
    description: >
      验证评审开始时固定的目标不随全局激活会话或 pane 改变，返回原目标前不能把同批
      评论加入别人的输入框，也不能把排队当成成功。
    preconditions:
      - 二期 Web surface 有两个可辨识 Agent 会话，原会话内另有第二个 pane。
      - 原会话的 HTML 评审已有一条评论，各输入框均有可辨识草稿。
    steps:
      - 使用 toolkit:playwright-cli 在原目标开始评审后切换到第二个 pane；确认加入被禁用或明确拒绝，两个草稿均不变，评论未清空。
      - 返回原 pane，再切换到另一会话；确认旧评审不能使用新的全局 activeSession 作为接收者。
      - 返回原目标并明确恢复有效评审后加入；确认仅原 pane 收到一次反馈，其他草稿不变。

  - id: VPR-008
    name: 插入消费拒绝不会冒充成功
    required: true
    description: >
      验证新调用者的进程内结果回调来自真实消费，目标失配返回非成功结果；
      不以模拟回调或后端 inputAccepted 替代实际草稿后置状态。
    preconditions:
      - 二期代码含可选插入结果回调，独占 Web 终端与评审页均已打开。
      - 验收者能通过浏览器调试能力控制真实插入队列的消费时机；不新增生产调试 API。
    steps:
      - 使用 toolkit:playwright-cli 和浏览器调试能力在真实加入请求已排队但尚未消费时改变目标 pane，再恢复消费；确认得到 target-changed，任何 pane 均未插入，评论保留且可显式重试。

  - id: VPR-009
    name: 退出和刷新按当前评审生命周期释放通道
    required: true
    description: >
      验证同一预览中的评审退出和重新进入能释放旧监听、port 与高亮；有未处理评论时
      先明确处理丢弃，不把旧 DOM 的反馈延续到新文档。
    preconditions:
      - 二期 Web HTML 评审已打开，当前方案已有一条未处理评论；复用的页面评论编辑器没有尚未保存的内容。
      - 本案例能够观察当前 iframe 的消息通道与页面 DOM，不依赖应用进程重启。
    steps:
      - 使用 toolkit:playwright-cli 退出评审，先取消丢弃提示；确认列表和当前评审保留。
      - 再次退出并确认丢弃；确认高亮、选择拦截和专用通道已释放，普通页面交互恢复。
      - 重新进入并刷新当前文件，再次开启评审；确认获得新 generation，旧 port 消息不会增加评论或改变新选择。
      - 切到 Source；确认评审 guest 已卸载，没有后台轮询继续请求或修改输入框。
      - 在本案例重新开启评审，使用浏览器调试能力在加入请求已排队且未消费时退出并确认丢弃；确认请求取消且结果至多一次。再进入新 generation 后，旧 port 或迟到回执不得插入草稿或改写新列表。

  - id: VPR-010
    name: 不满足自包含评审合同时保持普通阅读
    required: true
    description: >
      验证评审的自包含边界不破坏原阅读功能：外部资源依赖不能静默进入残缺评审，
      独立原型库也不能凭文件标记推测会话目标。
    preconditions:
      - 二期 Web surface 可访问一个自包含方案和一个依赖相对 CSS/JS 的旧 HTML。
      - 本案例拥有可独占访问的源文件，且可打开当前 Prototypes 路由。
    steps:
      - 使用 toolkit:playwright-cli 打开旧多文件 HTML；确认原票据阅读与资源仍可用，不能开启受支持的自包含评审或有明确原因提示。
      - 从独立 Prototypes 页面阅读同一方案；确认仍为阅读入口，没有推测生成者或选取全局当前 Agent 的发送动作。

  - id: VPR-011
    name: 只有当前 iframe 的有界选择消息进入宿主
    required: true
    description: >
      验证临时 MessageChannel 和 generation 过滤旧 iframe、其他窗口及越界载荷，
      guest 不能把选择、评论状态或页面内提交事件提升为目标选择或用户发送指令。
    preconditions:
      - 二期 Web 评审已打开，有独占方案和另一个受控 iframe。
      - 本案例能通过浏览器调试能力保存旧 generation 并构造边界消息，不含真实凭据。
    steps:
      - 使用 toolkit:playwright-cli 通过真实点选取得一条合法选择；确认宿主显示正确摘要。
      - 从其他 iframe、旧 generation 及当前 guest 发送无效 kind、超长字段或伪造 terminal/path；确认宿主拒绝或仅作为不可信证据处理，反馈目标不变。
      - 不点击宿主加入按钮，单靠页面事件和消息尝试提交；确认输入框及终端均不出现请求。
      - 再执行一次合法选择；确认合法通道仍可用，未把整体禁用当成消息隔离通过。

  - id: VPR-012
    name: 未保存的 HTML 源码不能与磁盘评审混用
    required: true
    description: >
      验证评审始终基于已保存正文，不能将编辑器未保存的草稿渲染成磁盘版本或提交依据。
    preconditions:
      - 二期 Web 文件预览已打开独占自包含方案，目标 Agent 输入框可用。
    steps:
      - 使用 toolkit:playwright-cli 切到 Source 修改一段可辨识文字但不保存，再进入 Preview；确认评审不可开启且原因指向未保存修改。
      - 放弃修改后进入评审；确认所见 DOM 与磁盘内容一致。
      - 退出评审，在 Source 修改并实际保存，再开启评审；确认所见正文和生成反馈均使用新保存内容。

  - id: VPR-013
    name: 正文复读失败时不加入且保留评论
    required: true
    description: >
      验证加入前的正文读取不可用时保持评论与草稿，不将读取错误降级成跳过版本核对。
    preconditions:
      - 二期 Web 文件评审已有一条评论，固定 Agent 输入框含可辨识草稿。
      - 本案例可以临时阻断实际正文读取请求，随后恢复同一请求路径。
    steps:
      - 使用 toolkit:playwright-cli 阻断正文复读后点击加入输入框；确认显示读取错误，草稿不变，评论保留且没有成功回执。
      - 恢复请求并显式重试；确认重新读取相同正文后只插入一次，不存在后台自动重试。

  - id: VPR-014
    name: 缺少有效 Agent 输入框时不寻找替代目标
    required: true
    description: >
      验证反馈加入资格受明确终端与 pane 的可用性约束；不能为发送评论创建终端、启动
      Agent 或写入另一个全局激活会话，方案阅读仍可用。
    preconditions:
      - 二期 Web 项目内有可阅读方案，当前目标没有受支持的有效 Agent 输入框。
      - 同一实例中另有一个可辨识的有效 Agent 会话供检查误投。
    steps:
      - 使用 toolkit:playwright-cli 阅读当前方案并查看反馈入口；确认阅读不受影响，加入明确禁用或拒绝并显示原因。
      - 检查终端列表和另一会话草稿；确认没有自动新建终端、启动 Agent 或向替代会话插入内容。

  - id: VPR-015
    name: 原生手机在默认缩放下完整阅读同一方案
    required: true
    description: >
      验证一期方案在真实 iPhone 的 Runweave 文件预览中可读，正文自适应且宽内容只局部滚动；
      不靠整页缩小或另生成手机版掩盖布局问题。
    preconditions:
      - 一期技能与模板已完成，真实 iPhone 的 Runweave 已连接有权访问的目标项目，已记录设备与客户端版本。
      - 独占方案包含可辨识标题、长正文、宽表格或流程图，且是电脑已可读取的同一文件。
    steps:
      - 使用 toolkit:agent-device 从手机现有项目文件入口打开方案；核对标题、文件归属和可辨识正文与电脑版本一致。
      - 在竖屏默认缩放下阅读正文并滚动至末尾；确认文字无需捏合放大即可阅读、自然换行，未被导航或预览容器遮挡，整页没有横向溢出。
      - 横向滚动宽表格或流程图区域；确认能看全内容，只有该区域移动，正文宽度与页面纵向滚动仍正常。记录实际阅读截图，不以桌面窄视口代替。

  - id: VPR-016
    name: 原生手机通过触摸完成方案导航与必要交互
    required: true
    description: >
      验证手机上的章节导航、折叠或状态切换实际生效，不依赖鼠标 hover，
      页内导航不被 WKWebView 策略误拦，也不因此放开任意外部导航。
    preconditions:
      - 真实 iPhone 的 Runweave 已连接有权访问的目标项目，已记录设备与客户端版本。
      - 独占自包含方案有两个相距超过一屏的章节、目录跳转和一个必需交互；另有指向受控外部地址的链接供导航边界检查。
    steps:
      - 使用 toolkit:agent-device 在手机文件预览打开方案，点击目录跳转到下方章节，再返回顶部章节；确认对应正文进入视口且可继续滚动阅读。
      - 触摸操作折叠、标签或状态切换；确认目标内容发生预期变化，不需要 hover 或触发桌面圈选。
      - 点击受控外部链接；确认不会在文件预览中任意导航到外部页面，原方案仍可阅读。记录交互前后状态。

  - id: VPR-017
    name: 原生手机重新读取同一方案的已保存修改
    required: true
    description: >
      验证电脑端保存方案后，手机可以通过现有重新打开或刷新路径读到新内容，
      不依赖自动刷新，也不长期停留在旧票据或缓存版本。
    preconditions:
      - 真实 iPhone 的 Runweave 已连接有权访问的目标项目，已记录设备与客户端版本。
      - 独占方案含明确版本文字且可在执行主机修改，手机当前已打开这份方案；不触及用户文件。
    steps:
      - 使用 toolkit:agent-device 记录手机当前版本文字；在执行主机修改同一 HTML 的版本文字和一段正文并保存，确认实际文件内容已变。
      - 在手机通过现有刷新动作，或关闭文件预览后从同一路径重新打开；确认新版本文字及正文出现，仍是同一项目文件，记录实际采用的重读路径。
      - 继续阅读更新部分；确认无需生成新的手机版文件、重装应用或使用圈选功能即可看到修改。
