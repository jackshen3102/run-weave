version: 1
name: 跨 Agent 与跨 Worktree 有预算上下文交接验收
description: >
  验证从 Codex、Claude Code、Pi 或 TraeX 会话发起跨 Agent 或跨 Worktree 交接时，48 KiB 裁剪器准确保留初始目标与最近净问答、
  用户新指令完整不截断、受管附件安全注入新终端，且来源终端零写入、零中断。

cases:
  - id: HANDOFF-001
    name: 超长历史按 48 KiB 硬预算保留首条任务与末尾问答且永不截断新指令
    required: true
    description: >
      验证来源会话净可见正文超过 48 KiB 时，生成的受管交接文件严格不超过 49,152 UTF-8 字节，包含首条用户任务、省略区间标记和最近轮次，同时附加长新指令仍逐字完整。
    preconditions:
      - 隔离测试环境准备了一个可见对话超过 80 KiB（含首轮明确任务约束、中间 30 轮问答、末尾 5 轮最新进展，以及 thinking 和大工具输出）的会话源。
    steps:
      - 调用 `GET /handoff-preview` 并随后执行 `POST /handoff`（附带一段 4 KiB 的新 `prompt`）；检查生成的受管交接文件字节数与内容。
      - 确认受管交接文件字节数 `<= 49152`、文件权限为 `0600`、不包含 thinking 与原始工具大输出，第 1 条用户请求与最后几轮回复完整保留，中间包含准确的省略轮次计数与原 `threadId` 指引，且送达新终端的用户新 `prompt` 4 KiB 逐字未少。

  - id: HANDOFF-002
    name: 跨 Provider 交接在新终端启动目标 CLI 且来源终端零副作用
    required: true
    description: >
      验证从非 Codex 会话（如 Claude Code）交接到另一家 CLI（如 Codex 或 Pi）时，新终端成功启动目标 CLI 并接收受管上下文引用，原终端不收到任何输入或状态扰动。
    preconditions:
      - 隔离测试 Backend 运行一个已有真实多轮问答记录的 Claude Code（或受控会话源）终端，并记录原终端的缓冲区快照、草稿与运行状态。
    steps:
      - 使用 `$toolkit:playwright-cli` 从桌面终端菜单打开「交接到新终端」，选择另一个目标 Agent 并填写新指令后提交。
      - 确认新终端被创建、目标 CLI 启动并收到交接附件路径与新指令；核对原终端的显示缓冲、未发草稿、进程 PID 与会话状态均未发生任何变化，项目 Git 工作区未出现交接临时文件。

  - id: HANDOFF-003
    name: 跨 Worktree 交接将新终端准确落入同父项目下的目标子目录
    required: true
    description: >
      验证在主目录完成方案讨论后选择同父项目下的子 Worktree 交接时，新终端归属子 projectId 并在子目录运行，同时拒绝跨不同父项目的越权目录请求。
    preconditions:
      - 隔离测试环境存在父项目 A（含主目录会话与可用子 Worktree `wt-impl`）及另一个独立父项目 B。
    steps:
      - 从父项目 A 主目录终端发起交接，目标选择 `wt-impl`；确认返回的新终端 `projectId` 为 `wt-impl` 规范子 ID，实际 `cwd` 位于 `.worktree/wt-impl`。
      - 构造请求尝试将父项目 A 的会话交接到父项目 B 的 `projectId`；确认接口返回 403 或 404 且未创建新终端。

  - id: HANDOFF-004
    name: 同目录空闲 Codex 默认保留原生无损 thread/fork 快路径
    required: true
    description: >
      验证当来源为空闲 Codex 且目标仍选同目录 Codex 时，可走原生无损分叉快路径，且既有 `/agent/fork` 接口兼容性保持不变。
    preconditions:
      - 隔离测试 Backend 拥有处于 `agent_idle` 的 Codex 终端会话。
    steps:
      - 在交接预览中核对 `canNativeCodexFork=true`，以 `mode="native_fork"` 提交；确认新终端通过 `codex resume <forkedThreadId>` 启动并绑定新 `threadId`。

  - id: HANDOFF-005
    name: 来源版本变化冲突与幂等未知结果严格禁止重复建终端
    required: true
    description: >
      验证预览后来源会话新增回复时拒绝旧 `expectedSourceRevision` 提交，相同 `operationId` 重放幂等复用同一结果。
    preconditions:
      - 隔离测试终端已获取一份 `handoff-preview` 的 `sourceRevision`。
    steps:
      - 让来源会话新增一轮可见问答使源记录更新，再使用旧 `expectedSourceRevision` 提交 `POST /handoff`；确认返回 `409 handoff_source_changed` 且未创建新终端。
      - 刷新取得新 `sourceRevision` 后使用固定 `operationId` 连续提交两次相同请求；确认只创建一个新终端并返回相同 `terminalSessionId`，换用不同参数复用该 `operationId` 返回 409。

  - id: HANDOFF-006
    name: 原生 iOS 支持预览交接预算并发起跨 Agent 新终端交接
    required: true
    description: >
      验证原生 iOS 可从终端操作入口查看预算占用、选择目标 Agent 与同项目 Worktree 并成功打开交接后的新终端。
    preconditions:
      - iOS 模拟器运行候选 Debug App 并登录隔离测试 Backend，存在一个含多轮对话的终端与可用子 Worktree。
    steps:
      - 使用 `$toolkit:agent-device` 打开目标终端的交接面板；确认显示来源会话轮次与字节预算占用，选择目标 Agent 与子 Worktree 后提交，确认自动进入新建的目标终端页。

  - id: HANDOFF-007
    name: 同工作区空闲 tmux 面板支持原位切换 Agent 且保留终端 Tab 与关联状态
    required: true
    description: >
      验证桌面端通过顶栏显式「换 Agent」入口选择「原位替换当前面板」后，在同一 terminalSessionId 与同一 panelId 内启动目标原生 CLI 并送达受管交接上下文与附加指令，Tab 数量及终端关联状态保持不变。
    preconditions:
      - 隔离测试 Backend 运行一个采用持久交互式 Shell 的 tmux 终端，当前活跃面板运行一个处于 agent_idle 且已有真实多轮问答的来源会话（如 Claude Code 或 Codex），并记录其 terminalSessionId、panelId 与 Tab 总数。
    steps:
      - 使用 `$toolkit:playwright-cli` 在桌面终端顶栏点击「换 Agent」按钮；确认弹窗显示来源轮次与 48 KiB 预算占用，默认选中「原位替换当前面板」并预选与来源不同的目标 Agent。
      - 填写附加指令并提交；确认未新增终端 Tab，页面停留在同一 terminalSessionId 与 panelId，且旧 Agent 的运行态字段已清空。
      - 确认目标 CLI 在同一面板启动就绪并收到权限为 `0600` 的受管交接附件路径与完整附加指令，终端显示干净无上一任 CLI 残留画面，项目 Git 工作区未出现交接临时文件。

  - id: HANDOFF-008
    name: 运行中面板或非 tmux 终端拒绝原位切换且零副作用
    required: true
    description: >
      验证当来源面板正在执行（agent_running）或会话不是 tmux 运行时，预览明确标示不可原位切换，强制提交 placement="in_place" 返回 409 且不重启、不中断原面板进程。
    preconditions:
      - 隔离测试环境存在一个处于 agent_running 状态（或非 tmux 运行时）且已有可读取会话记录的终端，并记录原面板进程 PID 与缓冲内容。
    steps:
      - 调用 `GET /handoff-preview`；确认返回 `canInPlaceHandoff=false` 且 `inPlaceUnavailableReason` 为非空可读提示。
      - 携带该预览的 `sourceRevision` 构造 `POST /handoff`（`placement="in_place"`、`mode="portable_handoff"`）；确认接口返回 `409`，且原面板进程 PID、运行状态与终端缓冲均未受影响。

  - id: HANDOFF-009
    name: 跨 Worktree 与 native_fork 互斥原位切换且缺省 placement 保持旧协议兼容
    required: true
    description: >
      验证原位切换仅限同工作区便携交接：非法组合返回 409 且不破坏来源面板，UI 选择跨 Worktree 时自动切换为「交接到新终端」，省略 placement 字段的旧格式请求仍默认新建终端。
    preconditions:
      - 隔离测试环境存在包含主目录会话（处于 agent_idle，含可原生 Fork 的 Codex 或便携会话）与同父项目可用子 Worktree `wt-impl` 的终端环境。
    steps:
      - 调用 `GET /handoff-preview` 取得最新 `sourceRevision` 后，分别向 `POST /handoff` 发送「`placement="in_place"` + 目标为 `wt-impl`」以及「`placement="in_place"` + `mode="native_fork"`」；确认两次请求均返回 `409` 且来源面板未被重启。
      - 使用 `$toolkit:playwright-cli` 打开「换 Agent」弹窗并将目标工作区切至 `wt-impl`；确认切换方式自动切回「交接到新终端」且「原位替换当前面板」处于不可选状态。
      - 构造省略 `placement` 字段的旧版 `POST /handoff` 请求提交；确认接口按 `placement="new_terminal"` 正常创建新终端并返回新 `terminalSessionId`。

  - id: HANDOFF-010
    name: 原项目目录生成计划后支持自动识别计划文件并以精简计划上下文交接执行
    required: true
    description: >
      验证在原项目目录生成 docs/plans/*.md 计划文件后，预览可自动探测该文件，选择 plan_focused 与执行预设提交后目标 CLI 在原目录直接收到计划路径与执行指令，且越出项目目录的非法计划路径被拒绝。
    preconditions:
      - 隔离测试环境存在处于 agent_idle 的 tmux 会话，其多轮对话末段生成并提及了原项目目录内的计划文件 `docs/plans/sample-exec-plan.md`（实际文件存在于该目录）。
    steps:
      - 使用 `$toolkit:playwright-cli` 打开桌面终端顶栏「换 Agent」弹窗；确认 `detectedPlanFiles` 列出 `docs/plans/sample-exec-plan.md` 且默认勾选、默认选中「仅带计划与目标（精简上下文）」并预填执行指令。
      - 在原项目目录提交原位切换（或同目录新终端交接）；核对生成的 `0600` 受管交接文档字节数 `<= 49152`、包含该计划文件的相对路径与绝对路径及原始目标，不含中间冗长讨论轮次，且目标 CLI 收到执行指令开始工作。
      - 构造包含目录穿越路径（如 `../outside.md`）的 `planFilePaths` 调用 `POST /handoff`；确认接口返回 `400` 或 `403` 且不执行原位重启或创建新终端。
