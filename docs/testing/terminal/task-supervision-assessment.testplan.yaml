version: 1
name: 长任务证据核对与续接进展验收
description: >
  实现验收合同，行为是否通过须另行取证。沿用当前模型，验证报告层完成条件核对、暂缓动作和已消费续接的进展比较。
  每例使用自有隔离资源，不操作用户任务；所有新判定都使用证据核对策略，无需配置开关。
  格式通过不代表行为通过，本计划不将模型评分或原会话接收视为实际完成证明。
cases:
  - id: TSA-001
    name: 已完成报告逐项覆盖原授权而不新增任务
    required: true
    description: 全部必要条件有报告支持时接受完成，研究回答本身可为交付，来源可追溯。
    preconditions:
      - 本例独立任务包含预先冻结的用户条件与完整 final，配置当前真实模型。
      - 完成语料包含解释任务和已报告完成必要验证的实现任务，均无后续矛盾。
    steps:
      - 经真实分类入口分别判定，确认条件表只覆盖授权范围，各条件标为 reported_done 且引用有效，disposition 为 apply、outcome 为 completed，不产生续接。
      - 读取详情确认文案为据报告完成，不声称监督器独立验收；保存输入输出并清理本例资源。

  - id: TSA-002
    name: 用户取消的条件不再进入剩余工作
    required: true
    description: 当前用户范围覆盖旧目标，模型不得恢复取消义务或新增建议工作。
    preconditions:
      - 本例独立任务含初始实现与设备验证要求，随后用户明确取消设备验证，当前 final 报告其余完成。
      - 本例使用真实当前模型，输入保留取消来源和当前目标版本。
    steps:
      - 判定当前 final，确认取消项为 waived，完成范围正确且没有因设备条件产生 blocked、hold 或额外续接。
      - 对照来源与输出保存证据，清理独立任务。

  - id: TSA-003
    name: 局部未知不阻断已授权独立下一步
    required: true
    description: 必要工作部分未知时仍能推进明确独立事项，未知不自动要求用户介入。
    preconditions:
      - 本例独立任务有两项必要工作，其中一项需要设备信息，另一项明确获准且有可执行下一步。
      - 使用当前真实模型，原面板空闲无草稿，可观察投递和消费。
    steps:
      - 触发 final 分类，确认 continue 的 guidance 指向独立步骤及真实授权，局部 unknown 不使整体 hold 或 blocked。
      - 确认只向本例原面板投递一次并消费，保留局部依赖说明，清理资源。

  - id: TSA-004
    name: 相近评分和精确并列不成为明确业务结论
    required: true
    description: 新策略的分差门禁控制动作，候选结果不会变成已完成记录或自动投递。
    preconditions:
      - 本例隔离监听使用可控合法分类结果，阈值取已冻结值，完成条件和来源均有效。
      - 每组响应使用独立轮次，包含完成为 0.34 的近均分、继续为 0.34 的近均分和精确并列。
    steps:
      - 逐组经生产处理入口提交，确认 disposition 为 hold、原因 ambiguous_scores，watch.outcome 为 null，状态 watching，额度不变且无终端投递。
      - 读取档案确认候选结果仍可见且标明未采用，候选完成没有加入 completedReplyIds；清理本例资源。

  - id: TSA-005
    name: 高评分不能覆盖缺失或矛盾的完成条件
    required: true
    description: 结构化条件不支持完成时，即使 completed 评分很高也不采用完成候选。
    preconditions:
      - 本例独立有效轮次有可控响应，completed 为 0.99，至少一项必要条件 unknown 或 contradicted。
      - 来源 ID 均合法，但没有资料支持独立下一步，覆盖语义已预先固定。
    steps:
      - 通过处理入口提交，确认 hold 且原因 evidence_gap，不写完成引用、不消耗额度、不把资料不足当作用户独有依赖。
      - 核对详情明确列出具体缺口而非泛化索要确认，清理本例资源。

  - id: TSA-006
    name: 有新结果的已消费续接被识别为报告层进展
    required: true
    description: 原执行器产生与上轮必要动作相关的新结果时可继续处理剩余工作。
    preconditions:
      - 本例自有真实执行器已消费一次获准续接，当前任务要求创建临时文件并读回后再整理结果。
      - 本例可独立读回文件，后续 final 明确报告新增结果，原目标和处理轮次均未改变。
    steps:
      - 令原执行器执行并报告，分类确认 previousContinuation 正确且 progress 为 advanced，引用本轮报告而非旧评分。
      - 分别保存实际文件读回、observed 与后续报告，确认接收不是完成依据，不重复已完成步骤；清理文件和执行器。

  - id: TSA-007
    name: 两次明确无进展且无新路径停止自动追问
    required: true
    description: 连续已消费续接后的报告仍未推进时进入正常暂缓，保持监控和已有额度事实。
    preconditions:
      - 本例独立执行器与可控分类响应可以建立同任务两次 observed 续接及对应后续 final。
      - 两次报告明确未执行必要动作，第二次没有有据替代路径，累计续接未超过三次。
    steps:
      - 顺序提交两轮无进展报告，确认计数只依据有效 observed 链，第二轮 disposition 为 hold、原因 no_progress，没有第三次泛化追问。
      - 确认监控仍开启，历史接收记录和已使用额度保留，不标 completed 或 blocked；清理本例资源。

  - id: TSA-008
    name: 未接收或信息不足不累计为无进展
    required: true
    description: offered、unknown 投递和缺少执行信息的报告不能证明原 Agent 没有推进。
    preconditions:
      - 本例有独立轮次，分别含未 observed 的续接或已 observed 但报告不足的续接。
      - 分类接收器可捕获 previousContinuation 与进展输出，所有来源保留。
    steps:
      - 触发各轮判定，确认未消费资料不进入有效比较链，资料不足为 progress unknown 并清零连续无进展计数，不回退已用额度且不据此 hold 或 blocked。
      - 确认没有重放未知投递，保存输入和计数后清理资源。

  - id: TSA-009
    name: 身份或目标变化隔离进展比较并拒绝迟到提交
    required: true
    description: 比较链仅在当前任务身份范围生效，旧判断不能污染新轮次。
    preconditions:
      - 本例独立监听已建立上一轮 observed 续接，新分类可以暂停在提交前。
      - 可分别在独立子轮次注入用户新输入、目标版本更新、thread 切换或源版本变化。
    steps:
      - 暂停分类后变更对应身份，再释放结果，确认旧结果不提交、不投递；新轮次不继承旧无进展计数。
      - 对照档案确认旧历史保留，新源版本不复用旧比较依据；清理本例监听。

  - id: TSA-010
    name: 核对表归档与回复消费保持同一事务
    required: true
    description: 保存核对表失败不能提前消费 final 或预占额度。
    preconditions:
      - 本例独立 SQLite 副本和监听可在判定归档事务中注入一次写入失败。
      - 当前 final 与候选 continue 均有效，允许重新交付相同完成事件。
    steps:
      - 注入失败并触发处理，确认判定、assessment、游标、额度和 watch 均回滚，原面板未收到输入。
      - 解除故障并再次交付相同事件，确认只成功保存一次并至多投递一次；清理副本和面板。

  - id: TSA-011
    name: 加列升级和重启保留新旧判断且不重放
    required: true
    description: 存储升级是无回填的可重复操作，暂缓记录和未知投递跨重启保持原语义。
    preconditions:
      - 本例独立旧 schema 数据库副本含旧判定，临时服务能创建一条新 hold 和一条 unknown 投递记录。
      - 副本已记录原行数及摘要指纹，可通过独立连接检查列与记录。
    steps:
      - 启动新版完成加列，确认旧记录原文不变、assessment 为 null，新判定详情与摘要分别完整和有界。
      - 重启同一临时服务并重新发现 fresh endpoint，确认不重复加列、hold 不转为完成、unknown 不重放；核对原数据后清理副本。

  - id: TSA-012
    name: 核对数据受容量约束且分页不读取全文
    required: true
    description: 条件数量、完整核对表和前次动作输入不会破坏现有热状态与分页预算。
    preconditions:
      - 本例独立数据库含足量有核对表的历史记录，可捕获 SQL 及接口响应大小。
      - 独立输入覆盖 24 条条件边界、超出条件上限以及 180000 字节必要输入超限。
    steps:
      - 读取多页与单条详情，确认列表 SQL 不读 input 或 assessment 正文，分页无漏重、单 watch 不超过 64 KiB、详情受 24 KiB 核对表预算约束。
      - 提交超限输入，确认条件超限为 partial 加 hold，必要输入超限明确报错，均不静默截断后判完成；清理数据。

  - id: TSA-013
    name: Web 当前状态与历史清楚区分候选和已采用
    required: true
    description: 用户在真实 Web 页面能看到暂缓原因及按需加载的核对表。
    preconditions:
      - 本例自有隔离 Backend 和 Web 页面含当前 hold、旧版判定及新核对表判定，已正确附着浏览器。
      - 页面使用自有测试终端，接口访问可观察，不操作用户任务。
    steps:
      - 使用 toolkit:playwright-cli 操作真实状态条与监控面板，确认当前为判断待核对，候选 completed 不显示任务已完成，候选 continue 不提供投递重试入口。
      - 打开历史及单条详情，确认完整表仅在详情请求后加载，旧记录注明旧策略且来源可追溯；保存截图与请求证据并清理资源。

  - id: TSA-014
    name: 原生 iOS 使用 Backend 的同一核对结果
    required: true
    description: 原生状态条和详情正确展示暂缓及旧档案，没有手机独立分类或额度计算。
    preconditions:
      - 本例已申请的模拟器或指定 DEV 设备运行对应源码构建，连接本例独立 Backend。
      - 自有监听含当前 hold、旧记录和新的完整核对表，设备会话和清理责任明确。
    steps:
      - 使用 toolkit:agent-device 打开原生监控入口与判定详情，确认候选结果未被当作已采用，原因、条件状态和额度与 Backend 回读一致。
      - 浏览旧记录确认可选字段解码成功且未补造依据，保存设备来源截图与回读证据，结束设备会话。

  - id: TSA-015
    name: 始终核对且策略配置变化使旧计算失效
    required: true
    description: 没有策略开关时仍始终输出核对表，模型时间预算的配置变化使在途分类失效，旧暂缓指令不可投递。
    preconditions:
      - 本例独立实例未设置任何核对策略开关，已保存候选 continue 的 hold 记录，下一次分类可暂停在提交前。
      - 可通过当前配置入口修改 classificationTimeoutMs 并 reload，原模型和时间预算有基线回读。
    steps:
      - 核对字段目录中不存在策略开关，暂停分类并修改时间预算，再释放结果，确认旧配置代次的结果不提交或投递；恢复原预算后有效 final 仍产生 assessment。
      - 对已保存 hold 调用 retry-continuation，确认 Backend 拒绝且额度不变、无输入发送，保存配置前后对照并清理本例资源。

  - id: TSA-016
    name: 冻结回放与历史基线如实报告收益和代价
    required: true
    description: 当前策略回放只做分类，旧策略只读历史结果，不提供运行时切换路径。
    preconditions:
      - 已冻结 120 条带来源和预期动作的语料，40 条校准和 80 条留出分组隔离，16 条重复难例已固定。
      - 语料指纹匹配的历史目录含 manifest.json 和 results.jsonl，包含 152 条旧策略判断，模型配置可用，结果目录位于本机非跟踪目录。
    steps:
      - 只读导入历史基线，以现有生产阈值执行当前策略的 152 次调用，确认基线指纹不匹配、缺失或重号时在模型调用前失败，所有失败和难例波动均保留。
      - 核对四类动作错误、配对差异、区间及延迟，并明确历史基线不是同时同版本模型的对照；不由此声称当前时延因果收益或真实任务完成率，确认没有配置、watch 或终端投递，保存去敏指标并清理资源。

  - id: TSA-017
    name: 加列失败保留旧库并允许解除故障后恢复
    required: true
    description: 新核对表列迁移失败必须停止初始化，不能损坏旧档案或提前记录迁移成功。
    preconditions:
      - 本例独立旧 schema 数据库副本已记录行数、摘要指纹和表结构，不使用生产数据库。
      - 本例临时服务可以仅对升级加列事务注入失败，故障可以解除，数据库仍可独立只读检查。
    steps:
      - 注入加列失败后启动服务，确认初始化明确失败，未启动监控调度或投递，旧记录及列结构未被部分改写。
      - 解除故障后重新启动同一副本并取得 fresh endpoint，确认加列成功、旧档案保持原样，没有旧续接重放；保存前后对照并清理副本。

  - id: TSA-018
    name: 监控模型和推理强度可配置且默认 Astra High
    required: true
    description: 目标整理和最终判断显式使用同一组配置；默认、覆盖、恢复默认及非法值具有一致的保存和生效语义。
    preconditions:
      - 本例独立 Backend 的模型和强度未设置，实例配置可通过真实页面管理；当前 CLI 模型目录包含 gpt-6-astra 和 high。
      - 本例有来源完整的目标整理与完成判断输入，能记录独立 CLI 调用参数，所有写入仅影响本例实例。
    steps:
      - 使用 toolkit:playwright-cli 打开电脑配置中的长任务监控，确认模型和推理强度的默认及采用值为 gpt-6-astra、high；在同一页面保存有效覆盖值，回读确认该域已生效。
      - 分别触发目标整理和最终判断，核对两个调用均显式传入所保存的 model 和 model_reasoning_effort；恢复默认并保存后，后续两个调用均恢复 Astra High；用默认值取得一次真实判断结果。
      - 提交空白模型名或非法强度，确认拒绝且不改写原配置；保存去敏页面、参数和回读证据并清理本例环境。
