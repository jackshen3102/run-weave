version: 1
name: 长任务监控历史保留与有界决策上下文验收
description: >
  行为验收合同：历史可追溯，当前决策仅依赖当前 thread 和任务的有界资料。
  每例使用独立隔离服务、配置和可清理数据，不操作真实终端或生产 journal。
  格式校验不代表行为通过；替身只验证合同，语义案例使用真实 Codex。
cases:
  - id: TBC-001
    name: 历史增长不改变当前输入或日常读取量
    required: true
    description: 档案规模不进入活跃状态、模型输入或空闲轮询成本。
    preconditions:
      - 本例三组独立存储有完全相同的当前任务和来源，分别另有 0、1000、10000 条无关历史决策。
      - 本例可捕获实际模型输入、存储查询、会话读取字节和活跃接口响应，模型由确定性接收器代替。
    steps:
      - 分别触发同一当前回复，确认输入哈希相同且各不超过 32 KiB，活跃对象和响应各不超过 64 KiB，不内嵌完整历史，只保留当前最新摘要。
      - 各等待两次既定空闲轮询，确认没有历史正文查询、原始会话扫描或新增分类调用；保存计数和字节数，不能只比较耗时。
      - 删除本例隔离实例和合成历史，保存脱敏测量结果。

  - id: TBC-002
    name: thread 切换隔离状态并拒绝迟到结果
    required: true
    description: 同终端更换 thread 后，旧分类结果丢弃，已提交决策的迟到投递失败只更新原档案，不能污染新任务。
    preconditions:
      - 本例独立终端在 thread A 开启监听，已有任务摘要、已占用额度及待确认投递；旧分类可延迟返回。
      - 本例已创建同终端的 thread B，投递接收器可记录目标和调用数，历史查询可用。
    steps:
      - 切换并提交 thread B 的新请求，确认开关保留，但活跃摘要、来源、额度、pending 和错误均按新作用域初始化。
      - 释放 A 的分类结果和投递回执，确认 B 的状态与输入不含 A 内容，未向任一 thread 新发送旧继续指令。
      - 查询 A 的历史，确认原始决策仍在且迟到回执只影响 A 的档案，然后清理本例资源。

  - id: TBC-003
    name: 同 thread 的范围判断不破坏既有任务状态
    required: true
    description: 新请求可以成为当前判断重点，但模型任务标签不能清空未完成事实或扩大授权。
    preconditions:
      - 本例使用真实 Codex 和独立合成会话，执行前固定二十四组中文输入及人工预期，继续、插问、新目标、取消范围、完成后失败和长计划各四组，包含 Agent 建议额外部署。
      - 每组独立建立初始任务和原文来源，保存模型版本、当前作用域与当前额度；不依赖其他组产物。
    steps:
      - 对每组提交用户变更并产生下一条 final，仅进行一次分类调用，保存实际输入、输出与状态变化；使用相同来源对照既有实现结果。
      - 对照人工预期，确认新请求优先、已取消范围不恢复、插问不清空未完事实，模型标签不新建 taskEpoch、不额外重置额度，也不把 Agent 建议当成授权。
      - 对明确替换目标组确认无关旧任务退出本轮输入，旧来源仍能在档案追溯；不能把保留历史误实现为永久保留全部旧目标作为当前义务。
      - 二十四组必须零越权、零必要范围丢失、零错误重开；记录误判数、跳过次数和耗时差异。失败不能更改预期或选择性重试掩盖，修复后需全套重跑并保留失败记录。
      - 清理会话和监听，保留脱敏语料、基线与新实现结果。

  - id: TBC-004
    name: 完成证据移出最近消息后不重新开启旧工作
    required: true
    description: 有来源的任务事实可跨短消息窗口保持，历史评分不能替代原始证据。
    preconditions:
      - 本例独立真实 Codex 会话先明确要求 rebase，随后有带稳定来源 ID 的完成报告，再有至少六条无关讨论消息。
      - 本例活跃证据引用指向该完成报告原文，用户没有重新要求 rebase，投递接收器只记录而不操作真实终端。
    steps:
      - 对最新回复触发分类，确认输入包含回读的完成报告原文及来源，标识为 Agent 报告而非系统独立验收，且没有生成式摘要、整段历史判定或历史评分。
      - 确认不会以没有看到完成证据为理由继续 rebase，记录实际结论和零 rebase 投递；失败时保留完整输入，不选择性重试。
      - 清理本例会话、监听和接收器。

  - id: TBC-005
    name: 大原始文件中的必要文本可增量读取
    required: true
    description: 原始文件超过 64 MiB 或单行包含巨大图片不阻止语义读取，也不引起整行内存膨胀。
    preconditions:
      - 本例独立合成 Codex rollout 大于 80 MiB，包含超过 64 MiB 的单行图片字段，以及首中尾有标记的必要用户文本与 final。
      - 本例语义索引初始为空，可测原始读取范围、进程基线及峰值内存；不调用模型。
    steps:
      - 请求语义端点并按构建状态等待，确认单次扫描不超过 4 MiB，期间返回 indexing，最后必要文本与来源完整且无图片或工具正文。
      - 确认提取器峰值增量内存不超过 64 MiB，保存冷启动总扫描量及内存证据；不得用预建索引冒充冷启动通过。
      - 追加新轮次并再次读取，确认只处理新增字节，没有全文件重扫，随后清理源文件和索引。

  - id: TBC-006
    name: 源替换后拒绝复用旧来源身份
    required: true
    description: sourceVersion 与 thread 身份防止把同一偏移的新内容当成旧证据。
    preconditions:
      - 本例隔离环境有已索引的 thread A、合法与未认证客户端，活跃 watch 保存 A 的 sourceVersion。
      - 本例能替换或截断 A 的合成源，并构造指向外部文件的符号链接。
    steps:
      - 替换 A 的源并读取当前上下文，确认索引重建且 Backend 拒绝复用旧 sourceVersion，不混合新旧消息。
      - 未认证请求及符号链接来源读取必须拒绝，客户端不能提交任意文件路径。
      - 清理本例源、索引和客户端状态。

  - id: TBC-007
    name: 优化目标不阻断正常任务而硬边界仍然有效
    required: true
    description: 超过 32 KiB 优化目标不会自行停顿，只有无法容纳必要资料的硬边界才阻止本次自动继续。
    preconditions:
      - 本例两组独立任务的必要原文分别为约 48 KiB 和超过 180000 字节，首中尾有不同授权边界标记；超限组无法去除更多无关或重复内容。
      - 本例可捕获分类及投递次数，初始 outcome 为空，监听开启，模型由协议接收器代替。
    steps:
      - 分别触发两组处理，确认 48 KiB 组保留全部必要标记并正常分类，不弹出补充请求；硬超限组显示具体缺口且分类和自动投递次数均为零。
      - 确认超限组没有静默截断或伪造业务结论，监听仍开启、原 Agent 不被暂停，空闲轮询不重复调用模型或弹出补充请求；后续有效新消息可自动触发处理，无需重新开关监听。
      - 清理本例资源并保留输入字节、调用计数与状态证据。

  - id: TBC-008
    name: 无 final 的模型容量错误进入有界续接且按轮去重
    required: true
    description: 临时模型容量错误保留原生原因，经判断恢复已授权任务，不伪造 final 或重复消耗额度。
    preconditions:
      - 本例独立会话有明确未完成的用户任务；错误组分别为 server_overloaded 与 agent_error 加 Selected model is at capacity 提示，均无 final，native 与 hook 报告同一 turn。
      - 本例有 lifecycle 到 Backend 的真实连接，分类替身固定为有效 continue，投递接收器能记录并确认原会话消费监督输入。
    steps:
      - 分别发送各组的两路结束事件，确认仅创建一个判定和一次原会话续接，currentReply.role 为 runtime_error，保留原生错误且未生成空 final 或 completed 结论。
      - 同一任务后续轮次持续产生容量错误并确认消费续接，确认最多发送三次，随后以 continuation_limit 暂停；真实会话来源回读不会请求 runtime-error 证据 ID，没有自动切模型。
      - 保存错误、原会话输入、判定与额度记录，然后清理本例资源。

  - id: TBC-009
    name: 启动迁移完整保留档案且可重复恢复
    required: true
    description: 新版在启动调度器前一次性导入；事务中断与重复启动不丢失或重复历史。
    preconditions:
      - 本例独立 v1 journal 含多个 watch、多个 thread、完整输入及各种投递状态，已生成逐条内容摘要。
      - 本例各故障副本使用独立目录，能在初始化事务提交前及提交后终止进程。
    steps:
      - 启动新版，核对原文件与 SHA-256 命名备份保持原样，全部历史输入和判定与迁移前逐条一致。
      - 分别在事务提交前后中断并重启，确认数量一致且只初始化一次；成功后写入新记录，再重启仍能读取新旧档案。
      - 确认 offered 恢复为 unknown 且不自动补发，当前 watch 仅保留最新摘要；清理隔离数据并保留校验结果。

  - id: TBC-010
    name: 分类提交与回复去重保持事务一致
    required: true
    description: 分类错误不消费回复游标，成功提交不会在重启后重复占额度或创建多条决策。
    preconditions:
      - 本例独立 watch 有一个有效 final，可对存储事务提交前后注入进程终止，并捕获分类、决策及额度变化。
      - 本例的分类协议错误组和成功提交组使用独立数据副本，自动投递由隔离接收器处理。
    steps:
      - 对错误组返回非法来源 ID 或超过既有 128000 字节调用输出上限的结果，确认没有推进回复游标、占用继续额度或写入成功业务结论；另用符合原协议但超过 8 KiB 优化目标的合法响应确认不会因此被拒绝。
      - 对成功组在事务提交前后分别中断并恢复同一事件，确认最终只有一个已处理回复键和对应决策，额度只预占一次。
      - 保存事务与去重证据并清理本例副本。

  - id: TBC-011
    name: 重启不重放未知投递且不扫描旧投递历史
    required: true
    description: 恢复只处理当前 pending，历史 unknown 不成为持续轮询负担或新的自动输入。
    preconditions:
      - 本例独立库含当前 pending unknown 及一千条旧 thread 的 unknown 档案，投递接收器已记录一次当前发送尝试。
      - 本例可重启 Backend 并观察读取的 thread、查询正文数量及实际投递次数。
    steps:
      - 重启并等待两个恢复周期，确认原 unknown 没有重放，自动输入次数未增加。
      - 确认恢复只核对当前 pending 的有限来源，没有遍历一千个旧 thread；历史 unknown 原样可查，然后清理本例资源。

  - id: TBC-012
    name: 历史分页完整稳定且详情遵守授权
    required: true
    description: 分页摘要不带完整 input，并发新增记录不让既有分页链丢失或重复记录。
    preconditions:
      - 本例独立 watch A 有一百二十条带唯一 ID 的大输入决策，另有 watch B。
      - 本例可使用合法 A 客户端、未认证客户端发起历史请求。
    steps:
      - 获取 A 第一页后追加新决策，再沿游标读完，确认原分页快照的 ID 各出现一次，每页不超过 50 条和 64 KiB 且无完整 input。
      - 用合法身份读取一条详情，确认与归档实际输入相同；跨 watch 的 decisionId 及未认证请求均不能读取列表或详情。
      - 清理本例档案和身份资源，保存分页及权限响应。

  - id: TBC-013
    name: Web 当前状态与历史详情按需读取
    required: true
    description: Web 日常轮询只读活跃摘要，旧 thread 的历史明确归属且不会覆盖当前错误或结果。
    preconditions:
      - 本例独立 Dev 服务实现 新版，当前任务与旧 thread 有不同结果和可识别输入，浏览器已登录。
      - 本例可检查网络请求，页面操作使用 toolkit:playwright-cli，环境生命周期遵循 runweave-dev-session 技能。
    steps:
      - 打开监控并等待两个轮询周期，确认仅请求当前状态，未请求历史列表或输入详情，当前任务身份与服务一致。
      - 打开历史并展开一条旧记录，确认依次请求摘要页和单条详情，界面标识旧 thread 与时间，返回当前页仍显示当前结果。
      - 保存网络证据与必要截图，关闭本例页面并清理隔离数据。

  - id: TBC-014
    name: iOS 当前状态与历史详情按需读取
    required: true
    description: 原生 iOS 对照 新版 合同，历史仅在用户访问时加载，不能用编译通过替代交互证据。
    preconditions:
      - 本例有已安装待验收构建的获授权模拟器或设备，连接独立 新版 Backend，账号内有当前及旧 thread 的决策。
      - 本例使用 toolkit:agent-device 操作，可在 Backend 观察该客户端请求，记录具体设备来源。
    steps:
      - 打开终端监控并等待两个轮询周期，确认显示当前任务且没有历史详情读取。
      - 打开历史、展开旧决策并返回当前状态，确认按需取页和详情，旧 thread 归属清楚且不覆盖当前结果。
      - 保存操作与请求证据，注明模拟器或真机，清理本例数据并释放设备会话。

  - id: TBC-015
    name: 统一新版组件使用有界合同
    required: true
    description: 用户明确取消旧版本兼容，全部客户端与服务使用新版，不提供全历史回退路径。
    preconditions:
      - 本例独立环境的 App Server、Backend、Web 和 iOS 均为待验收源码构建。
      - 本例可记录监控请求和实际输入读取路径。
    steps:
      - 查询活跃 watch，确认最多一条当前摘要且不含 input；历史页和单条详情经独立接口读取。
      - 触发 Codex 监控，确认调用 supervision-context；模拟该端点不存在，确认明确失败且不回退全量 conversation。
      - 保存请求和错误证据，清理本例环境。

  - id: TBC-016
    name: 新存储重启保留已提交状态
    required: true
    description: 新版成功迁移后始终读取同一 SQLite，旧 JSON 不再作为主存储。
    preconditions:
      - 本例独立库已迁移，随后新增决策、已处理回复键、续接次数及一个 unknown，保存校验值。
      - 本例能重启同一新版服务，投递接收器只计数。
    steps:
      - 重启服务并读取分页与详情，确认迁移后新增记录仍在，原 JSON 保持不变且没有重新灌入。
      - 确认当前游标、额度及投递状态不回滚，已处理回复与 unknown 均不重放。
      - 保存前后状态和请求计数，清理本例环境。

  - id: TBC-017
    name: 决策使用原文且允许新证据纠正旧完成报告
    required: true
    description: 模型摘要不能替代来源事实，新失败原文可以修正同任务的旧完成判断。
    preconditions:
      - 本例独立真实 Codex 会话有先报告完成后报告验收失败的同一任务，两个报告都有稳定来源，用户未额外要求重新打开任务。
      - 本例显示摘要被写入与原文冲突的唯一标记，模型请求可捕获，自动投递由隔离接收器记录。
    steps:
      - 触发最新 final 的分类，确认请求回读并包含两份报告原文，不含被污染的显示摘要标记，不将旧完成结论视为不可更改。
      - 确认实际判断反映已授权任务仍有验收失败，旧报告仍在档案且未被篡改，任何继续只针对原授权范围。
      - 保存真实输入与输出，失败不得选择性重试掩盖，随后清理本例资源。

  - id: TBC-018
    name: 回收语义缓存不影响档案或来源追溯
    required: true
    description: 缓存和临时构建文件有总预算，淘汰后可以从原始记录重建必要文本。
    preconditions:
      - 本例独立 profile 有多个合成 thread，其可缓存语义文本总量超过 256 MiB，原始记录与决策档案均有预先校验值。
      - 本例可观察缓存和临时文件总量，活跃证据引用包含即将被淘汰缓存中的一个来源。
    steps:
      - 依次请求各 thread 并触发缓存回收，确认缓存与临时文件总量不超过预算，原始记录和档案校验值不变。
      - 回读被淘汰来源，确认可通过原生来源定位重建相同文本，不因缓存路径消失而丢证据；满预算时有界流式路径仍可读取。
      - 保存容量与回读证据，清理本例 profile。

  - id: TBC-019
    name: 启动迁移失败保留原数据并可重试
    required: true
    description: 不再并行运行旧版；导入失败明确阻止新版启动，不写成功标记或删除原档案。
    preconditions:
      - 本例两个独立旧 journal 副本分别注入非法记录和新库写入失败，不修改正式数据。
      - 本例记录原始文件与备份哈希，可恢复故障条件并重新启动。
    steps:
      - 启动后确认失败可见、没有启动自动投递，原 JSON 及备份不变，新库没有部分已提交历史或成功标记。
      - 恢复故障条件并重启，确认原档案完整导入且只出现一次，不自动重放 unknown。
      - 保存错误与校验结果，清理本例副本。

  - id: TBC-020
    name: 冷读取完成后自动处理仍有效的待判定事件
    required: true
    description: 索引构建只延迟判定，不丢事件、不要求用户重开监听，也不处理已经过期的作用域。
    preconditions:
      - 本例两个独立 watch 的语义缓存均为空，原始合成记录需要多个构建分片，已收到各自有效 final。
      - 本例可延迟构建完成并观察监听状态、分类次数与作用域，两个 watch 的分类使用接收器。
    steps:
      - 开始构建后保持第一个 watch 不变，对第二个 watch 提交新 thread 的用户请求，确认两者监听始终开启且构建中不分类。
      - 释放构建结果，确认第一个 watch 的有效 final 自动分类恰好一次，第二个 watch 的旧 final 不分类或投递，未要求用户重新开启监听。
      - 保存构建与事件处理证据，清理本例源、缓存和监听。
