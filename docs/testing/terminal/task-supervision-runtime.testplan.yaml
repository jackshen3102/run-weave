version: 1
name: 当前终端长任务监听与原任务续接验收
description: >
  长任务监控的行为验收合同。验证用户手动开启、三分类结果与续接、终端开关和回复身份、并发与重启恢复。
  每例创建并清理自有隔离 Backend、Codex 会话和分类替身，不使用用户工作终端。
  涉及浏览器时通过 toolkit:playwright-cli 附着正确页面；启动环境遵循 toolkit:runweave-dev-session。
  分类替身用于稳定触发状态分支，不能替代另一份分类计划中的真实 Codex 语义验证。
cases:
  - id: TSR-001
    name: 开关只控制处理且关闭页面不停止监听
    required: true
    description: 打开面板不自动开启；所有终端始终采集事件，关闭页面不影响 Backend 监听。
    preconditions:
      - 本例有自有 Agent 终端和独立 Dev Session，事件中心、监控记录与分类调用可观察。
    steps:
      - 使用 toolkit:playwright-cli 打开监控面板但不开启，完成一轮；确认普通完成事件存在，但没有分类或续接。
      - 点击终端监控开关，关闭本例页面，再完成一轮；确认 Backend 处理最终回复且 enabled 仍为 true。
      - 重新打开页面并关闭开关，再完成一轮；确认事件仍采集，监控判断与续接计数不增加，清理自有资源。

  - id: TSR-002
    name: completed 保持终端监听且不执行替代验收
    required: true
    description: 已完成只终止当前轮自动续接，终端开关保持开启。
    preconditions:
      - 本例自有终端监控已开启，分类结果固定为 completed，原任务输入计数可观察。
    steps:
      - 完成本轮最终回复；确认 outcome 为 completed、status 为 watching、enabled 为 true，没有监督追问。
      - 确认没有新增执行或验收任务；提交独立新任务并完成，确认继续分类，清理本例资源。

  - id: TSR-003
    name: blocked 保持监听且不会代审批
    required: true
    description: 依赖用户的阻塞不自动续接或批准，但不关闭终端开关。
    preconditions:
      - 本例自有任务包含待用户批准的操作，最终阻塞报告可使分类结果为 blocked。
    steps:
      - 真实审批待处理且无 final 时，确认等待提示，没有伪造 final 或自动批准。
      - 输出最终阻塞报告；确认 outcome 为 blocked、enabled 为 true、status 为 watching，没有追问或代审批，清理本例资源。

  - id: TSR-004
    name: continue 能在同一原任务连续推进三轮
    required: true
    description: 多轮续接复用原终端输入，completed 停止当前任务续接但保留监听。
    preconditions:
      - 本例独立原 Agent 能上报最终回复，thread、面板和现有执行器身份可核对。
      - 本例分类替身依次返回 continue、continue、continue、completed，原任务有可逐轮推进的四步工作。
    steps:
      - 手动启动监听，观察四轮 Stop，确认前三轮各有一个带 decisionId 的监督追问，第四轮正常停止。
      - 确认四轮执行均属于同一原 thread 和执行器，允许独立监听 Codex 分类进程，但没有创建替代执行任务；后三轮没有被重复事件跳过，续接次数依次为 1/3、2/3、3/3。
      - 保存原始轮次、Hook 往返与追问计数，清理本例资源。

  - id: TSR-005
    name: 未提交草稿阻止自动投递且不关闭监控
    required: true
    description: 已存在或分类期间新输入的草稿都不能被监督追问提交、覆盖或清除。
    preconditions:
      - 本例自有终端含 A、B 两个 Agent 面板，监控已开启，A 的任务可产生 continue 最终回复。
    steps:
      - 在 A 执行时向 A 输入唯一草稿但不提交，再在 B 提交并完成普通任务；随后让 A 产生最终回复，确认 A 的 continue 被记录但没有投递，续接额度未增加，enabled 仍为 true。
      - 通过 toolkit:playwright-cli 检查实际 TUI 草稿全文仍在且原会话没有该草稿；清除自有草稿后提交新的普通任务，确认监控继续处理，清理资源。

  - id: TSR-006
    name: 重复 Hook 与完成事件不会重复分类或续接
    required: true
    description: 同一轮次回答与上下文版本最多对应一个判定和一次续接。
    preconditions:
      - 本例独立终端正在处理最终回复，分类替身固定返回 continue。
      - 本例可在隔离事件入口重复投递同一 Hook、普通 completion 和 SubagentStop，均保留原始身份。
    steps:
      - 在首个分类未结束及结束后分别投递重复 Hook、completion 和原生生命周期完成事件，确认该轮只调用一次 Codex 分类且只出现一条监督追问。
      - 投递其他子任务的 SubagentStop，确认不会替代主任务回答或触发主任务续接。
      - 清理本例事件注入器、任务与服务，保存请求及输入计数。

  - id: TSR-007
    name: 用户新输入使计算中的旧决定失效
    required: true
    description: 分类期间用户修改任务后，旧上下文的 continue 不得送入新轮次。
    preconditions:
      - 本例独立原任务已进入分类，替身暂不返回且最终准备返回 continue。
      - 本例用户输入链路能够观察 UserPromptSubmit 和 contextRevision 更新。
    steps:
      - 提交用户范围修改并确认原终端已接收，再释放旧 Codex 分类响应，确认旧决定失效且没有监督追问。
      - 让新轮次产生回答，确认新请求包含范围修改并使用新 revision。
      - 清理本例任务与替身，保存输入和 revision 顺序。

  - id: TSR-008
    name: 用户暂停或中断可撤销待续接决定
    required: true
    description: 显式停止监听或中断原任务之后，不允许迟到结果自动重启执行。
    preconditions:
      - 本例两个独立任务分别用于面板暂停和原生中断，均在等待可控的 continue 分类结果。
      - 本例现有事件链路能观察原生中断，实际轮次与终端输入可核对。
    steps:
      - 对第一个任务点击暂停，对第二个任务执行原生中断，再分别释放分类响应，确认二者均无后续自动轮次。
      - 核对暂停状态保留，原任务不被监听器重启；重复进行响应与中断接近同时发生的交互并保留实际输入顺序。
      - 清理本例两个任务与分类替身。

  - id: TSR-009
    name: 同终端切换 thread 后开关保持且旧决定失效
    required: true
    description: 终端拥有开关；线程和执行器身份仅用于当前回复与投递隔离。
    preconditions:
      - 本例自有终端的任务 A 正在等待 continue 分类结果，A 的 thread、generation 与 watchId 已记录。
    steps:
      - 在同 pane 启动任务 B，再释放 A 的分类结果；确认 B 没有收到 A 的监督输入。
      - 不操作开关，让 B 产生最终回复；确认 watchId 和 enabled 保持，判定上下文来自 B，决策分别记录原 thread，清理本例资源。

  - id: TSR-010
    name: 不确定投递在重启后不会自动重放
    required: true
    description: offered 不等于已消费，恢复时不能凭猜测发送第二次追问。
    preconditions:
      - 本例隔离 Backend 与原 Codex 任务已将 continue 持久化为 offered，可在确认消费前中断链路。
      - 本例服务数据目录独立，能够重启 Backend 并对照原会话输入和 decisionId。
    steps:
      - 在确认消费前中断链路并重启 Backend，确认服务以原会话核对投递，无法确认时保留 unknown 和暂停。
      - 确认恢复过程不重放追问；原会话迟到出现该 decisionId 后只标记 observed，delivery_unknown 自动解除，输入计数不增加。
      - 在同一 thread 提交新的普通任务，再核对旧 unknown 记录，确认旧轮次不会暂停新任务；手动关闭后迟到确认不能重新开启开关。
      - 清理本例服务、持久化目录和原任务。

  - id: TSR-011
    name: Backend 重启恢复终端开关但不重放旧事件
    required: true
    description: 持久化开关不依赖当前 thread；恢复只等待新的最终回复。
    preconditions:
      - 本例有自有隔离 Backend，分别保存开启且已 completed 的终端，以及手动关闭的终端；没有待投递决定。
    steps:
      - 通过 runweave-dev-session 规则重启本例 Backend，重新取得 fresh endpoint 并附着页面；确认两个终端的 enabled、watchId 和历史判断保留。
      - 分别提交新任务并产生最终回复；确认只有开启终端新增判定，没有重放重启前事件，清理资源。

  - id: TSR-012
    name: 当前有 Agent 即可开启且无需已有任务
    required: true
    description: 启动方式、provider、版本、专用监督 Hook 和历史读取不限制开启。
    preconditions:
      - 本例自有隔离环境可运行普通手工启动的 Codex 和 Pi；当前 Agent 身份可通过实际 TUI 核对。
    steps:
      - 分别在首次用户任务之前打开监控并点击开关；确认两种终端均 enabled 为 true，不要求已有 thread、任务起点或目标填写。
      - 暂时令本例历史不可读再读取开关；确认仍可开启，处理异常仅发生在最终回复后，不建立替代执行任务，清理资源。

  - id: TSR-013
    name: 有标记时也只监听最终回复
    required: true
    description: 执行期间的中间消息和静默不会触发分类或续接，最终回复才触发一次。
    preconditions:
      - 本例独立原任务已有有效监控标记，分类替身返回 completed，分类调用和终端输入计数初始均为零。
      - 本例原任务会依次产生 commentary、工具输出、分段流式正文、一次较长静默，最后产生同轮完整 final。
    steps:
      - 在 final 之前逐项观察中间事件，确认分类和自动输入计数始终为零，读取兜底也不触发介入。
      - 产生完整 final 后确认恰好一次分类，输入使用完整最终回复，中间回复不被误当最终回复。
      - 清理本例任务、监控和替身，保存消息类型与调用时间线。

  - id: TSR-014
    name: 最多自动续接三次且恢复不重置次数
    required: true
    description: 原任务持续需要继续时，不发送第四条继续指令；次数耗尽保持未完成语义。
    preconditions:
      - 本例独立原任务已开启监听，续接上限为 3，分类替身对每次最终回复均返回 continue。
      - 本例可观察 decisionId、持久计数、终端输入与最终回复，具备受认证的暂停和恢复入口。
    steps:
      - 产生初始 final 并等待连续续接，在第 2 条监督输入后暂停再恢复，确认计数保持 2/3。
      - 等待第 3 次续接后的 final，确认仍进行分类且 outcome 为 continue，监听 paused 并显示已达续接上限，终端恰好只有三条监督输入。
      - 普通恢复并重复投递末轮 final，确认不重置次数、不发送第四条；不把结果写成 completed 或 blocked。
      - 清理本例任务、监控和替身，保留三个 decisionId 与最终状态。

  - id: TSR-015
    name: 实际页面的开关只绑定终端且开启请求幂等
    required: true
    description: 点击直接开启，无任务选择弹窗；重复同一 requestId 不产生第二个 watch。
    preconditions:
      - 本例有自有 Dev Session 和正在运行 Agent 的终端，尚未开启监控，真实页面和 API 响应可观察。
    steps:
      - 通过 toolkit:playwright-cli 打开任务监控，点击开关；确认没有任务选择弹窗，服务成功后开关 checked，任务尚未产生时仍可成功。
      - 重放相同 requestId 的开启请求；确认只有一个 watch，绑定当前 terminalSessionId。
      - 刷新页面，确认开关保持，读取不再次创建或分类；保存 UI 与 API 对照并清理资源。

  - id: TSR-016
    name: 新用户任务或新会话重置本轮额度但复用开关
    required: true
    description: 自动续接上限属于当前处理轮次，不需要新建终端开关。
    preconditions:
      - 本例自有终端监控已启用且当前任务达到三次续接上限，watchId 和决策历史已记录。
    steps:
      - 通过 toolkit:playwright-cli 核对 3/3 与任务未完成，确认开关仍 checked；关闭再恢复，确认旧任务额度不增加。
      - 提交新的普通用户任务并完成回复；确认沿用同一 watchId，新轮额度重新计数，旧决策保留且不会重放，清理资源。

  - id: TSR-017
    name: 判定详情和活动展示真实快照且不会重新分类
    required: true
    description: 面板从同一次判定记录展示原回答、评分、来源和时间，不能以刷新或展开详情触发额外模型调用。
    preconditions:
      - 本例独立任务已有一次真实分类结果，输入快照、scores、choice、reason、createdAt 和分类调用次数均已记录。
      - 本例可用 toolkit:playwright-cli 连接实际 Web 或 Electron 页面，当前任务输入框中有尚未提交的唯一草稿。
    steps:
      - 查看右侧最新判断，确认三项评分与 API 一致，最高项高亮，文案为模型评分而非正确率；活动时间与真实事件一致。
      - 展开并收起判定详情，确认可见原始 final 全文、来源与当次目标版本；之后的目标修改不改写已有判定快照。
      - 刷新面板数据并切换到任务交接再切回，确认没有重新分类或输入投递，未提交草稿仍完整，任务交接仍可使用。
      - 保存页面与源数据对照，清理本例草稿、watch 和隔离服务。

  - id: TSR-018
    name: 监听异常与旧判断在实际面板中准确区分
    required: true
    description: 最新分类失败不能继续展示成当前任务已完成，也不能将监听异常当作业务受阻。
    preconditions:
      - 本例独立任务已有上一轮 continue 判断，下一轮 provider 会产生可控超时，原终端仍可由用户操作。
      - 本例有实际 Web 或 Electron 页面及正确 CDP，原终端输入计数和旧判定时间已记录。
    steps:
      - 使用 toolkit:playwright-cli 等待下一条 final 后的分类超时，确认面板显示监听异常与原因，保留的旧判断明确标为上次结果。
      - 确认没有显示目标已达成或业务受阻，没有额外继续输入，原终端可正常输入且输入框草稿未被清除。
      - 修复本例 provider 后恢复监听，确认只等待有效新 final，迟到旧响应不会补发；保存截图和源状态后清理本例资源。
