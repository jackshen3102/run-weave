version: 1
name: 当前终端长任务监听与原任务续接验收
description: >
  长任务监控的行为验收合同。验证用户手动开启、三分类终止或续接、目标绑定、并发与重启恢复。
  每例创建并清理自有隔离 Backend、Codex 会话和分类替身，不使用用户工作终端。
  涉及浏览器时通过 toolkit:playwright-cli 附着正确页面；启动环境遵循 toolkit:runweave-dev-session。
  分类替身用于稳定触发状态分支，不能替代另一份分类计划中的真实 Codex 语义验证。
cases:
  - id: TSR-001
    name: 仅手动开启当前任务且关闭页面继续监听
    required: true
    description: 监听由 Backend 持有，打开面板不会自动启动，浏览器关闭不会关闭已经授权的监听。
    preconditions:
      - 本例独立 Codex 终端支持监督 Hook，已有明确原任务起点；分类替身固定返回 completed。
      - 已通过正确浏览器入口打开本例终端，其他终端不属于本例。
    steps:
      - 打开任务面板但不点击开启，令原 Agent 完成一轮，确认没有 Codex 分类请求和自动追问。
      - 手动开启并确认任务起点，关闭本例页面，再令本例原 Agent 完成下一轮，确认 Backend 得到 completed 并结束监听。
      - 重新打开页面确认最终状态，清理本例监听、终端和隔离服务。

  - id: TSR-002
    name: completed 结束监听且不独立执行验收
    required: true
    description: 有效 completed 只记录结果并允许原 Agent 停止。
    preconditions:
      - 本例有独立已开启监听的 Codex 任务，分类替身返回 completed。
      - 本例已记录 Agent 进程、测试执行计数、会话输入计数与当前轮次。
    steps:
      - 触发本轮 Stop，确认监听 ended 且 outcome 为 completed，原任务没有收到监督追问。
      - 确认没有新增验收 Agent、测试命令或替代会话，结果可追溯到本轮原回答。
      - 清理本例终端、监听和分类替身。

  - id: TSR-003
    name: blocked 结束监听且不会代审批
    required: true
    description: 真实依赖用户的阻塞停止续接，权限边界保持原状。
    preconditions:
      - 本例独立 Codex 任务包含需要用户批准的操作，分类替身对最终阻塞报告返回 blocked。
      - 本例可以观察待审批请求和原终端输入计数。
    steps:
      - 在真实审批仍待处理且没有 final 时，确认面板展示等待，没有伪造 final 或自动批准。
      - 令原 Agent 输出阻塞报告并触发 Stop，确认 outcome 为 blocked、监听 ended，既无追问也无批准请求。
      - 清理本例待审批任务与分类替身，不操作用户真实审批。

  - id: TSR-004
    name: continue 能在同一原任务连续推进三轮
    required: true
    description: 多轮续接不因 stop_hook_active 提前退出，最终 completed 才停止。
    preconditions:
      - 本例独立原 Codex 已加载新 Hook，thread、执行器 generation 和进程身份可核对。
      - 本例分类替身依次返回 continue、continue、continue、completed，原任务有可逐轮推进的四步工作。
    steps:
      - 手动启动监听，观察四轮 Stop，确认前三轮各有一个带 decisionId 的监督追问，第四轮正常停止。
      - 确认四轮执行均属于同一原 thread 和执行器，允许独立监听 Codex 分类进程，但没有创建替代执行任务；后三轮没有因 stop_hook_active 被跳过，续接次数依次为 1/3、2/3、3/3。
      - 保存原始轮次、Hook 往返与追问计数，清理本例资源。

  - id: TSR-005
    name: 自动续接不覆盖终端中尚未提交的草稿
    required: true
    description: Hook 续接保持用户编辑区，不通过 C-u 或粘贴替换原草稿。
    preconditions:
      - 本例独立 Codex 终端已开启监听，分类替身返回 continue 且可以延迟响应。
      - 本例原任务正在执行，用户可在 TUI 编辑区输入带唯一标记的未提交草稿。
    steps:
      - 在本轮执行期间输入草稿但不提交，让 Stop 分类和续接发生，确认草稿全文仍在且未被自动发送。
      - 核对本轮仅新增监督追问，不含草稿文本；通过实际 TUI 交互确认，而非仅检查 dispatcher 未调用。
      - 清理本例草稿、任务、监听和替身。

  - id: TSR-006
    name: 重复 Hook 与完成事件不会重复分类或续接
    required: true
    description: 同一轮次回答与上下文版本最多对应一个判定和一次续接。
    preconditions:
      - 本例独立已绑定任务正在 Stop 请求中，分类替身固定返回 continue。
      - 本例可在隔离事件入口重复投递同一 Hook、普通 completion 和 SubagentStop，均保留原始身份。
    steps:
      - 在首个 Hook 未结束及结束后分别投递重复事件，确认该轮只调用一次 Codex 分类且只出现一条监督追问。
      - 投递其他子任务的 SubagentStop，确认不会替代主任务回答或触发主任务续接。
      - 清理本例事件注入器、任务与服务，保存请求及输入计数。

  - id: TSR-007
    name: 用户新输入使计算中的旧决定失效
    required: true
    description: 分类期间用户修改任务后，旧上下文的 continue 不得送入新轮次。
    preconditions:
      - 本例独立原任务已进入分类，替身暂不返回且最终准备返回 continue。
      - 本例用户输入链路能够观察 UserPromptSubmit 和 contextRevision 更新。
    steps:
      - 提交用户范围修改并确认原终端已接收，再释放旧 Codex 分类响应，确认旧决定失效且没有监督追问。
      - 让新轮次产生回答，确认新请求包含范围修改并使用新 revision。
      - 清理本例任务与替身，保存输入和 revision 顺序。

  - id: TSR-008
    name: 用户暂停或中断可撤销待续接决定
    required: true
    description: 显式停止监听或中断原任务之后，不允许迟到结果自动重启执行。
    preconditions:
      - 本例两个独立任务分别用于面板暂停和原生中断，均在等待可控的 continue 分类结果。
      - 本例能力组合已声明支持中断失效，Hook 输出与实际轮次可观察。
    steps:
      - 对第一个任务点击暂停，对第二个任务执行原生中断，再分别释放分类响应，确认二者均无后续自动轮次。
      - 核对暂停状态保留，原任务不被监听器重启；重复进行响应与中断接近同时发生的交互并保留实际输入顺序。
      - 清理本例两个任务与分类替身。

  - id: TSR-009
    name: 同 pane 更换 thread 或执行器后旧结果不能串任务
    required: true
    description: 目标绑定包含线程与执行器代次，显示位置相同不代表同一任务。
    preconditions:
      - 本例独立 pane 中任务 A 正在等待 continue 分类结果，已记录 A 的 thread 与 generation。
      - 本例可安全关闭 A 并在同 pane 启动独立任务 B，B 有自己的输入计数。
    steps:
      - 将 pane 绑定到 B 后释放 A 的分类结果，确认 B 未收到任何监督输入且未被赋予 A 的判定。
      - 核对 A 的旧绑定进入失效或暂停，并且只能为 B 手动建立新绑定。
      - 清理本例 A、B 及分类替身。

  - id: TSR-010
    name: 不确定投递在重启后不会自动重放
    required: true
    description: offered 不等于已消费，恢复时不能凭猜测发送第二次追问。
    preconditions:
      - 本例隔离 Backend 与原 Codex 任务已将 continue 持久化为 offered，可在确认消费前中断链路。
      - 本例服务数据目录独立，能够重启 Backend 并对照原会话输入和 decisionId。
    steps:
      - 在确认消费前中断链路并重启 Backend，确认服务以原会话核对投递，无法确认时保留 unknown 和暂停。
      - 确认恢复过程不重放追问；若原会话已含该 decisionId，只标记 observed，输入计数不增加。
      - 清理本例服务、持久化目录和原任务。

  - id: TSR-011
    name: 重启仅恢复身份一致的等待监听
    required: true
    description: listening 生命周期恢复不能复活已暂停或已结束的任务。
    preconditions:
      - 本例隔离服务持有三个自有任务，分别 watching 且无待投递、paused、ended，身份、状态及续接次数（分别为 1、2、3）已持久化。
      - 三个原 Codex 会话在 Backend 重启期间保持原 thread 和执行器身份。
    steps:
      - 重启 Backend，确认 watching 绑定核对身份后等待新事件，paused 与 ended 保持原状态，三任务续接计数分别仍为 1、2、3。
      - 分别令三任务产生新 Stop，确认只有 watching 任务触发分类，其他任务无监督输入。
      - 清理本例三个任务、分类替身与服务目录。

  - id: TSR-012
    name: 未加载能力或存在续接冲突时拒绝启动
    required: true
    description: 启动前确认原执行器能力，不能静默迁移任务或叠加自动续接来源。
    preconditions:
      - 本例有独立旧 Hook Codex 终端、不支持的 provider 终端，以及启用其他自动续接来源的 Codex 终端。
      - 三个终端的会话身份和原配置均已记录，本例不会操作用户真实任务。
    steps:
      - 分别尝试开启监听，确认给出具体能力缺口或冲突原因，不创建替代会话，也不自动关闭原有续接来源。
      - 核对其他非 Codex 和非 Stop Hook 上报保持原行为，未输出监督 JSON 或新增自动输入。
      - 清理本例终端和隔离配置。

  - id: TSR-013
    name: 有标记时也只监听最终回复
    required: true
    description: 执行期间的中间消息和静默不会触发分类或续接，最终回复才触发一次。
    preconditions:
      - 本例独立原任务已有有效监控标记，分类替身返回 completed，分类调用和终端输入计数初始均为零。
      - 本例原任务会依次产生 commentary、工具输出、分段流式正文、一次较长静默，最后产生同轮完整 final。
    steps:
      - 在 final 之前逐项观察中间事件，确认分类和自动输入计数始终为零，读取兜底也不触发介入。
      - 产生完整 final 后确认恰好一次分类，输入使用完整最终回复，中间回复不被误当最终回复。
      - 清理本例任务、监控和替身，保存消息类型与调用时间线。

  - id: TSR-014
    name: 最多自动续接三次且恢复不重置次数
    required: true
    description: 原任务持续需要继续时，不发送第四条继续指令；次数耗尽保持未完成语义。
    preconditions:
      - 本例独立原任务已开启监听，续接上限为 3，分类替身对每次最终回复均返回 continue。
      - 本例可观察 decisionId、持久计数、终端输入与最终回复，具备受认证的暂停和恢复入口。
    steps:
      - 产生初始 final 并等待连续续接，在第 2 条监督输入后暂停再恢复，确认计数保持 2/3。
      - 等待第 3 次续接后的 final，确认仍进行分类且 outcome 为 continue，监听 paused 并显示已达续接上限，终端恰好只有三条监督输入。
      - 普通恢复并重复投递末轮 final，确认不重置次数、不发送第四条；不把结果写成 completed 或 blocked。
      - 清理本例任务、监控和替身，保留三个 decisionId 与最终状态。

  - id: TSR-015
    name: 原型开启弹窗将编辑目标绑定到当前真实任务
    required: true
    description: 取消没有副作用，确认只创建一个绑定正确目标的 watch，界面在服务端成功后进入监听。
    preconditions:
      - 本例有独立 Dev Session 和支持监督 Hook 的 Codex 终端，任务起点和计划均可读取，尚未开启监控。
      - 本例已取得实际 Web 或 Electron 页面入口、对应 CDP 和认证请求观察能力，不使用静态原型页面。
    steps:
      - 使用 toolkit:playwright-cli 打开当前终端右侧任务监控，点击开启，确认弹窗包含可编辑目标、仅最终回复和 3 次上限；编辑目标后取消，确认 Backend 没有创建 watch。
      - 再次开启，编辑为本例唯一目标并确认，观察提交期间按钮禁用；重放相同 requestId 的本例请求，确认只有一个 watch、同一响应身份和 0/3 计数。
      - 核对持久记录与 UI 中目标、terminal、panel、thread、任务起点一致；刷新页面仍显示该绑定，普通读取没有再次创建或分类。
      - 保存实际页面与 API 对照，清理本例 watch、终端和 Dev Session。

  - id: TSR-016
    name: 达到上限后只有明确重新开启才能得到新额度
    required: true
    description: 新一轮确认原子替换旧 watch，取消不改次数，旧决定不能作用于新一轮。
    preconditions:
      - 本例独立原任务已经通过三次真实续接达到上限，当前 outcome 为 continue 且 watch 暂停，旧 watch 身份和计数已记录。
      - 本例有实际 Web 或 Electron 页面及正确 CDP，可对本例请求响应进行读取和重复投递。
    steps:
      - 使用 toolkit:playwright-cli 查看上限状态，确认橙色提示、3/3 和任务未完成；点击重新开启后取消，确认 watch 身份与次数不变。
      - 再次点击并确认，核对新 watch 为 0/3、原任务 thread 不变、旧 watch 已失效；以相同 requestId 重复本次请求仍返回同一个新 watch。
      - 投递旧 watch 的迟到继续决定，确认不会发给原任务，也不会占用新一轮额度；新 watch 只等待其有效的新 final。
      - 保存替换前后记录和截图，清理本例任务、监听与隔离服务。

  - id: TSR-017
    name: 判定详情和活动展示真实快照且不会重新分类
    required: true
    description: 面板从同一次判定记录展示原回答、评分、来源和时间，不能以刷新或展开详情触发额外模型调用。
    preconditions:
      - 本例独立任务已有一次真实分类结果，输入快照、scores、choice、reason、createdAt 和分类调用次数均已记录。
      - 本例可用 toolkit:playwright-cli 连接实际 Web 或 Electron 页面，当前任务输入框中有尚未提交的唯一草稿。
    steps:
      - 查看右侧最新判断，确认三项评分与 API 一致，最高项高亮，文案为模型评分而非正确率；活动时间与真实事件一致。
      - 展开并收起判定详情，确认可见原始 final 全文、来源与当次目标版本；之后的目标修改不改写已有判定快照。
      - 刷新面板数据并切换到任务交接再切回，确认没有重新分类或输入投递，未提交草稿仍完整，任务交接仍可使用。
      - 保存页面与源数据对照，清理本例草稿、watch 和隔离服务。

  - id: TSR-018
    name: 监听异常与旧判断在实际面板中准确区分
    required: true
    description: 最新分类失败不能继续展示成当前任务已完成，也不能将监听异常当作业务受阻。
    preconditions:
      - 本例独立任务已有上一轮 continue 判断，下一轮 provider 会产生可控超时，原终端仍可由用户操作。
      - 本例有实际 Web 或 Electron 页面及正确 CDP，原终端输入计数和旧判定时间已记录。
    steps:
      - 使用 toolkit:playwright-cli 等待下一条 final 后的分类超时，确认面板显示监听异常与原因，保留的旧判断明确标为上次结果。
      - 确认没有显示目标已达成或业务受阻，没有额外继续输入，原终端可正常输入且输入框草稿未被清除。
      - 修复本例 provider 后恢复监听，确认只等待有效新 final，迟到旧响应不会补发；保存截图和源状态后清理本例资源。
