version: 1
name: 飞书集中 Bridge V1 验收
description: >
  待实现合同的验收计划，只覆盖本机通知建立的话题及已有话题回复。
  使用隔离状态和授权测试终端，不操作用户正在执行的任务；格式通过不代表功能已实现。
cases:
  - id: FCB-001
    name: 三台机器的通知和话题回复回到各自终端
    required: true
    description: 验证一个机器人服务三个 Backend，话题绑定决定目标，输入和回答不串机。
    preconditions:
      - 已实现并部署一个 hub 和三台 node，使用同一授权测试群和三个不同的持久 identityId。
      - 每台机器均有本用例创建的测试 Agent 终端，已具备生成符合现有通知政策的回答及观察输入次数的能力。
      - 已授权本用例向测试群发送消息和回复，旧 Bridge 接收进程已经停止。
    steps:
      - 分别让三个终端完成符合通知政策的任务；确认机器人自动建立或复用三个来源明确的话题，持久绑定分别含正确 backendId 与 Terminal ID。
      - 依次在三个已有话题回复不同的唯一文本；确认仅对应终端当前活动 Panel 收到一次 prompt_replace 提交，其他两台输入计数不变。
      - 确认每条消息只有在目标返回 inputAccepted 和 inputEnqueued 后出现 DONE，后续回答分别回到原话题；不需要选机器或手动建话题。

  - id: FCB-002
    name: 只有授权的已绑定话题文本能够执行
    required: true
    description: 验证现有过滤边界保留，不因集中化扩大执行入口。
    preconditions:
      - 本用例具有一个运行中的隔离 hub、三个受控 node、已持久化的话题和可记录终端输入的受控适配器。
      - 可以通过真实消息处理器注入受控飞书事件，不向真实群发送测试噪声。
    steps:
      - 分别注入群顶层消息、未知 root、缺失或错误 thread、非授权用户、错误群及非 text 事件；确认三台终端均无输入，hub 未新建话题或选择目标。
      - 为三个 node 使用相同 Terminal ID 和不同 root，分别注入合法回复；确认每个话题只命中自身 backendId，输入合同仍为 feishu 消息 ID、prompt_replace 和 submit=true。
      - 重复注入同一个合法 message_id；确认持久去重阻止第二次输入。

  - id: FCB-003
    name: 连接身份不能被冒用或抢占
    required: true
    description: 验证中心按独立凭据绑定 backendId，越权连接不能污染在线路由。
    preconditions:
      - 本用例具有启用真实 upgrade 鉴权的隔离 hub，以及 A、B 两个不同身份与独立测试 token。
      - A 已连接且可接收受控请求，可建立额外受控 WS 客户端。
    steps:
      - 使用无 token、错误 token 及 A 的 token 声称 B 身份建立连接；确认全部在 upgrade 阶段拒绝，在线 Map 不变化。
      - 使用 A 的合法凭据建立第二条连接；确认新连接被拒绝，A 原连接仍能接收请求。
      - 从合法 A 连接发送包含伪造 backendId 或未知协议字段的通知；确认校验拒绝，未写入 B 的话题或调用飞书接口。
      - 检查配置输出与日志；确认测试 token、飞书密钥和输入正文均未泄露。

  - id: FCB-004
    name: 输入发送前离线只等待原目标且遵守期限
    required: true
    description: 验证断连前未尝试的输入可以恢复，过期输入不会执行或改投其他机器。
    preconditions:
      - 本用例已启动隔离 hub、A 与 B 两个 connector，使用独立状态目录、受控消息源与输入计数器。
      - 已有绑定 A 的话题，能够仅断开 A 的连接且保持 hub 与 B 运行。
    steps:
      - 断开 A，注入合法话题回复；确认记录等待且 B 未收到输入。
      - 在消息创建后 120 秒内恢复 A；确认输入只送达 A 一次，并收到接收回执。
      - 再断开 A，以新 message_id 注入回复并等待超过其 120 秒期限；确认原话题出现失败回执，恢复 A 后该条没有执行，B 输入数仍为零。

  - id: FCB-005
    name: 输入已尝试但回执丢失时不自动重发
    required: true
    description: 验证 unknown 与未发送失败严格区分，避免用户指令重复执行。
    preconditions:
      - 本用例具备独立运行的 hub 与受控 node，话题已绑定，输入可计数并能在执行后截断返回帧。
    steps:
      - 注入合法回复，让 node 接收并执行输入后立即断开连接、丢弃结果；确认中心记录 unknown，原话题提示先检查终端且未添加成功表情。
      - 恢复连接并重复投递相同飞书事件；确认输入计数仍为一次，不因重连或飞书重推再次执行。

  - id: FCB-006
    name: 中心重启保持绑定与保守恢复规则
    required: true
    description: 验证单份持久状态在中心重启后仍决定目标，只有未尝试且未过期输入允许续投。
    preconditions:
      - 本用例使用独立持久目录启动 hub 和受控 node，具有自己的已绑定话题和输入计数器。
      - 可分别建立未尝试未过期、未尝试已过期、已尝试无结果和已成功的投递记录。
    steps:
      - 保存重启前的话题、状态和输入计数，停止本用例 hub 后使用同一目录重启；重新取得新监听地址并等待 node 重新认证。
      - 确认 root 与 backendId、Terminal ID 绑定不变；仅未尝试未过期记录续投一次，已过期记录失败，已尝试记录转 unknown，已成功记录不再执行。
      - 对原话题注入新的合法回复；确认仍进入原机器，其他机器输入数不变。

  - id: FCB-007
    name: 角色切换保留同应用话题并隔离旧状态
    required: true
    description: 验证离线迁移和回滚不会错认应用归属、破坏源文件或丢失已尝试消息去重记录。
    preconditions:
      - 使用本用例独立配置与状态副本，已标明每份旧状态的应用、群与 backendId，无生产进程读取这些副本。
      - 已提供实现配套的转换脚本，准备同应用正常数据、冲突数据和另一应用数据。
    steps:
      - 执行转换；确认源文件字节不变，同应用 root/thread 保留并补对 backendId，另一应用记录不被导入。
      - 对冲突或归属不明输入执行转换；确认失败并输出脱敏原因，没有覆盖有效目标文件。
      - 在转换后的隔离 hub 中建立一条新绑定及一条 attempted 无结果记录，再停止并执行回滚转换；确认可归属绑定被保留，attempted 转 unknown，旧格式可读且不会重复投递。

  - id: FCB-008
    name: 节点连接生命周期不影响本地 Backend
    required: true
    description: 验证 node 无飞书密钥也能启动，中心故障只影响飞书链路，关闭时回收自身资源。
    preconditions:
      - 本用例已启动隔离 node Backend，只有中心 URL 和独立 token，未配置飞书 appId 或 appSecret。
      - 拥有本用例测试终端及可停止的 hub，能够检查重连定时器、连接和在途请求回收。
    steps:
      - 中心在线时检查节点注册与运行状态；确认连接已认证且状态未依赖远端 Backend HTTP 登录。
      - 停止 hub；确认原终端仍能本地输入，飞书连接状态转为断连或恢复中，新的通知返回失败而非 sent=true。
      - 停止本用例 Backend；确认停止重连、所有等待请求已结束、连接释放，无遗留定时器或孤儿进程。
