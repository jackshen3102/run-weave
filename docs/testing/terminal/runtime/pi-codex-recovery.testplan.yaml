version: 1
name: Pi Codex 扩展恢复验收
description: >
  待实现的折中恢复合同。使用独立配置、真实 Pi TUI 和本地故障服务验证；格式通过不代表行为通过。
  不修改活动终端、全局安装或全机网络，不执行真实外部副作用工具。
cases:
  - id: PCR-001
    name: 普通 WS 失败耗尽后才降级且总预算有界
    required: true
    description: 验证唯一控制器的两个阶段预算，不叠加 Pi 或 HTTP 库重试。
    preconditions:
      - 独立 Pi 0.85.1 TUI 已加载候选扩展，专用配置关闭外层重试。
      - 本地服务可持续返回普通可重试 WS 握手失败及 SSE 5xx，并记录所有请求时间。
    steps:
      - 发起请求；确认依次只有 6 次 WS 尝试和 6 次 SSE 尝试，无预热或隐藏的额外请求。
      - 对照每个阶段的五次等待记录；确认基准为 200 至 3200 ms 指数退避并处于约 ±10% 抖动区间，服务开销单独记录。
      - 等待结束；确认仅一个最终失败、无继续请求且没有成功完成提示。
  - id: PCR-002
    name: 短暂 WS 故障恢复后继续使用 WS
    required: true
    description: 验证同传输恢复成功不会提前粘滞降级。
    preconditions:
      - 独立候选 Pi 会话连接本地服务，前两次 WS 尝试失败、第三次返回完整成功响应。
    steps:
      - 发起请求并等待完成；确认 3 次 WS 尝试、0 次 SSE，最终回答完整。
      - 同一会话再次请求；确认仍使用 WS，普通重试计数已重置。
  - id: PCR-003
    name: 协议不支持时立即降级且会话隔离
    required: true
    description: 验证 426 降级及后续传输状态只属于对应会话。
    preconditions:
      - 同一个独立 Pi TUI 进程可新建会话，本地服务对 WS 返回 426、SSE 返回成功。
    steps:
      - 在会话 A 请求；确认一次 WS 握手后立即 SSE，第二轮直接 SSE。
      - 在同一进程新建会话 B 后请求；确认 B 重新尝试 WS，未继承 A 的降级状态。
  - id: PCR-004
    name: 部分文字断流后完整替换且不提交失败工具
    required: true
    description: 验证重试后的文字和工具属于最后成功尝试，无拼接或废弃工具卡片。
    preconditions:
      - 独立真实 Pi TUI 的本地服务首次返回旧文字和完整工具调用后断流，第二次返回不同文字及另一工具调用后成功。
      - 工具是仅修改临时计数文件的本地 fixture，可按 call ID 记录执行次数。
    steps:
      - 观察首次文字和恢复提示；确认新文字替换旧文字，没有两次输出拼成一个回答。
      - 等待结束；确认首次工具执行为 0 次，成功尝试工具执行为 1 次，TUI 无失败尝试的悬空工具卡片。
      - 读取正式模型历史；确认不包含被放弃的旧文字和旧工具调用。
  - id: PCR-005
    name: 后续请求恢复保留已完成工具结果
    required: true
    description: 验证恢复控制器不会主动重放先前已经完成的工具。
    preconditions:
      - 独立 Pi 的本地服务先完成一次工具响应，工具只增加临时文件计数；下一次模型调用先断流再成功且不再请求该工具。
    steps:
      - 执行完整场景；确认临时计数最终为 1，后续请求保留原工具 call ID 与结果。
      - 检查恢复记录；确认重试仅发生于后续模型调用，没有重跑前一成功轮次。
  - id: PCR-006
    name: 网络等待恢复或到期后结束
    required: true
    description: 验证结构化连接失败的独立计数、5 分钟期限及到期终止。
    preconditions:
      - 独立 Pi 使用默认等待配置，目标本地端口拒绝连接，可记录真实时间和全部尝试。
    steps:
      - 发起请求并持续拒绝连接；确认等待依次为 5、10、20、40、60 秒后封顶，普通流计数不被消耗。
      - 保持故障至第一次进入网络等待后 5 分钟；确认剩余期限限制等待和活动连接，到期产生最终错误且不再重试。
      - 在同一 fixture 发起新请求并于等待期间恢复服务；确认成功结束且不继承上一次到期状态。
  - id: PCR-007
    name: 取消停止连接读取和等待
    required: true
    description: 验证取消在各个传输阶段均终止当前调用且不会启动下一次尝试。
    preconditions:
      - 独立真实 Pi TUI 与本地服务可分别稳定进入握手、读流、普通退避和网络等待阶段。
    steps:
      - 对每个阶段使用新的独立请求并按 Escape；确认发出一次 aborted、清除等待提示，停止当前活动连接。
      - 在取消后继续观察服务记录；确认没有启动新尝试，已执行工具不因取消被重放，也没有成功完成提示。
  - id: PCR-008
    name: 鉴权额度与限速按原因处理
    required: true
    description: 验证不可恢复错误不会进入网络循环，临时限速等待遵循服务指示。
    preconditions:
      - 独立候选 Pi 的本地服务可分别返回 401、403、明确额度耗尽、非法请求及带等待时间的临时限速。
    steps:
      - 使用独立请求逐项注入不可恢复错误；确认直接交回对应错误语义，无网络等待或重复请求，401 给出现有登录指引。
      - 注入等待 2 秒后恢复的临时限速；确认不早于服务指定时间重试并成功。
      - 注入要求等待超过 60 秒的临时限速；确认结束并保留可再次尝试的说明，未提前发送请求。
  - id: PCR-009
    name: 专用配置守卫和普通 Pi 隔离
    required: true
    description: 验证候选扩展不能在重试叠加或未支持模式下静默运行。
    preconditions:
      - 已记录普通 Pi 配置的校验值，候选配置目录独立，具备本地请求计数服务。
    steps:
      - 在候选配置启用外层重试后启动候选扩展；确认提示配置错误且无模型请求，配置内容未被扩展改写。
      - 在非专用目录或非 TUI 模式加载扩展；确认明确拒绝候选模型请求。
      - 恢复候选专用配置并使用普通 Pi 原入口；确认普通配置校验值未改变，原 provider 可加载，原会话可读。
  - id: PCR-010
    name: 压缩模型调用也有恢复且不提前 settled
    required: true
    description: 验证禁用 Pi 外层重试后压缩调用没有失去候选 provider 的恢复能力。
    preconditions:
      - 独立候选 Pi 的确定性历史可触发一次压缩，本地服务对压缩模型调用首次断流、下次成功。
      - 可以记录压缩事件、provider 尝试以及 agent_settled。
    steps:
      - 触发压缩并等待后续运行完成；确认压缩模型请求经过候选恢复控制器并成功，压缩历史可读。
      - 确认恢复期间没有提前发出最终 settled，最终活动只结束一次。
  - id: PCR-011
    name: 诊断只记录脱敏恢复元数据
    required: true
    description: 验证诊断不泄露凭据或模型正文，未知错误仍保持有限重试。
    preconditions:
      - 独立本地 fixture 使用可搜索的假凭据和假正文标记，并可返回无结构化 cause 的 fetch failed。
    steps:
      - 触发失败和恢复后检查诊断文件；确认只包含阶段、次数、时间及允许的错误摘要，假凭据和正文标记不存在。
      - 注入未知 fetch failed 并持续失败；确认走有限普通预算，不进入独立网络等待。
