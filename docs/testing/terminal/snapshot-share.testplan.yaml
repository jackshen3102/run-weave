version: 1
name: 统一公网终端快照分享验收
description: 仅验证当前集中托管合同：业务 Backend 捕获并上传，Host 独占存储与读取。计划不是通过证据；所有破坏性 fixture 仅限自有隔离环境。
cases:
  - id: TSS-001
    name: 捕获只使用显式 Panel
    required: true
    description: 请求目标不随焦点变化，返回正文不混入其他 Panel。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 同一 Session 中有两个不同文本标记的 Panel。
    steps:
      - 令 A 活跃，认证请求指定 B 创建分享；确认 201、shareUrl 为配置的 HTTPS Host，期限差为 86400000 毫秒。
      - 匿名读取 shareUrl，确认只有 B 的标记与历史；清理自有资源。
  - id: TSS-002
    name: 所有 Backend 只发布到统一 Host
    required: true
    description: 不同机器与同机 Backend 都不保存快照或签名密钥。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 可建立第二个独立 Backend，并令其与 Host 同机，两个 Backend 使用同一个 Host。
    steps:
      - 分别从两个 Backend 创建快照，确认 URL 均指向统一 Host，正文分别对应各自 Panel。
      - 检查两个源 profile 均没有新快照目录或 .signing-key；仅 Host 出现对应持久化记录，清理自有资源。
  - id: TSS-003
    name: 源 Backend 退出不影响读取
    required: true
    description: 上传成功后的内容不依赖源进程或源终端。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
    steps:
      - 创建并保存正文摘要，停止本 Case 源 Backend 并确认源端口关闭。
      - 从独立 HTTP 客户端读取公网链接，确认 200 且正文摘要不变；清理自有 Host 数据。
  - id: TSS-004
    name: Host 重启保留有效链接
    required: true
    description: 同一存储和密钥重启后已发布链接继续有效。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 本 Case 独占 Host 启停权和数据目录。
    steps:
      - 创建快照，记录正文及密钥摘要，不输出密钥值。
      - 停止并重新启动 Host，重新取得 fresh endpoint；确认原签名链接 200、正文和密钥摘要未变，清理自有资源。
  - id: TSS-005
    name: 未配置发布时明确拒绝
    required: true
    description: 普通 Backend 无配置仍可运行，但不能退回本地分享。
    preconditions:
      - 本 Case 的隔离 Backend 未配置任何公网发布变量，并拥有自有终端。
    steps:
      - 请求分享，确认 503 和 SNAPSHOT_PUBLISH_NOT_CONFIGURED，无 shareUrl 或本地快照文件。
      - 使用 $toolkit:playwright-cli 在真实 UI 点击分享，确认显示公网服务未配置，未复制链接；清理自有资源。
  - id: TSS-006
    name: 上传失败不产生本地链接
    required: true
    description: 上游不可用或凭据错误时不降级、不静默重试。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 本 Case 可以更改自有发送端配置或停止自有 Host。
    steps:
      - 分别使用错误上传凭据和不可连接的 HTTPS Host 请求分享，确认返回 SNAPSHOT_PUBLISH_FAILED，不返回成功链接。
      - 确认源端没有落盘快照或签名密钥，恢复配置后再创建应成功；清理自有资源。
  - id: TSS-007
    name: 上传凭据隔离
    required: true
    description: 只有专用上传凭据允许创建 Host 记录。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
    steps:
      - 用无凭据、错误凭据和一份只读分享签名 POST Host 上传接口，确认 401，记录数量不变。
      - 用正确上传凭据上传纯文本，确认 201；尝试附加 html 字段或畸形 JSON，确认 400 且没有新记录，清理自有资源。
  - id: TSS-008
    name: 无效目标不得回退
    required: true
    description: 不存在或不属于 Session 的 Panel 不能抓取其他终端。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
    steps:
      - 请求不存在的 Session、其他 Session 的 Panel 和已删除 Panel，确认 404，无新 Host 记录。
      - 确认其他 Panel 未收到输入或中断，清理自有资源。
  - id: TSS-009
    name: 正文安全且初始响应完整
    required: true
    description: HTML 初始响应含完整转义正文，脚本和链接文本不执行。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 自有 Panel 包含 Unicode、缩进、空行和脚本样式样例文本。
    steps:
      - 匿名 GET，确认 text/html、no-store、CSP 且无 ETag，初始响应含全部转义文本。
      - 使用 $toolkit:playwright-cli 打开真实分享页，确认脚本文字可见且未执行，没有登录页或外部资源请求；清理自有资源。
  - id: TSS-010
    name: 签名严格绑定只读记录
    required: true
    description: 缺失、篡改、跨记录移用或非规范参数均不能读取。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
    steps:
      - 创建 A、B 两份快照，正常 GET/HEAD 为 200。
      - 依次移除签名、修改期限、交换参数顺序、重复或添加参数、将 A 签名移到 B；GET/HEAD 均为 404。
      - POST 只读链接返回 405，业务 Backend 的 /share/terminal 返回 404；清理自有资源。
  - id: TSS-011
    name: 有效签名到期立即失效
    required: true
    description: 到期拒绝不依赖定时清理或条件缓存。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 本 Case 可读写自有 Host 记录与密钥，只为此 fixture 制作过期签名，不修改系统时间。
    steps:
      - 创建快照后将自有记录时间整体移至过去，保持 24 小时间隔，生成匹配的新签名。
      - 立即 GET、HEAD 和条件请求，确认均 404、无正文、无 304；清理自有记录，不声称经过自然 24 小时等待。
  - id: TSS-012
    name: 容量满不驱逐有效快照
    required: true
    description: 达到固定记录或字节限额后明确失败，保留已有内容。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 本 Case 独占 Host 配额和数据目录。
    steps:
      - 通过真实上传填满 100 份或 100 MiB 配额，再创建应返回 507。
      - 读取原有效记录核对摘要未变；只清理自有配额数据。
  - id: TSS-013
    name: 单份超限不截断
    required: true
    description: 10 MiB UTF-8 正文上限同时约束发送端和 Host。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
    steps:
      - 用自有 tmux fixture 准备超限文本并创建，确认 413 且无成功链接。
      - 直接上传超限正文到 Host，确认 413 且不生成记录；清理自有资源。
  - id: TSS-014
    name: 分享操作冻结目标
    required: true
    description: 创建中切换焦点或连接不改变请求目标和公网结果。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 真实 UI 有两个不同标记 Panel，可延迟实际请求但不替换响应。
    steps:
      - 使用 $toolkit:playwright-cli 点击分享后切换 Panel/连接，确认请求仍携带点击时目标。
      - 进行中重复点击不增加请求，最终链接对应原标记且为 Host origin，不使用新连接地址；清理自有资源。
  - id: TSS-015
    name: 剪贴板失败保留链接
    required: true
    description: 复制失败不自动重建快照或谎报复制成功。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 真实浏览器可以拒绝剪贴板写入。
    steps:
      - 使用 $toolkit:playwright-cli 拒绝剪贴板后创建，确认 201 且通知保留手动复制或打开链接入口。
      - 确认未发送第二次创建请求、未显示已复制；恢复权限并清理自有资源。
  - id: TSS-016
    name: 行范围引用可恢复
    required: true
    description: 行高亮只增强引用，不隐藏正文或改变逻辑行号。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 自有快照至少 40 行，包含空行和长行。
    steps:
      - "使用 $toolkit:playwright-cli 点击第 25 行并 Shift 点击第 28 行，确认 4 行高亮和 #L25-L28。"
      - 刷新后高亮恢复；改为 390px 宽度仍保持逻辑行号；无效 hash 清除高亮且保留全文，清理自有资源。
  - id: TSS-017
    name: 损坏记录封闭拒绝
    required: true
    description: 一份损坏记录不会泄露文件或影响其他快照。
    preconditions:
      - 本 Case 拥有独立源 Backend、已配置专用 HTTPS Host 和上传凭据、自有 tmux Panel；所有数据与进程均隔离于生产环境。
      - 本 Case 可修改自有 Host 的记录文件。
    steps:
      - 创建两份快照并损坏其中一份 JSON，确认对应链接不返回 200 或部分正文。
      - 请求路径遍历或非法 ID，确认无其他文件；未损坏快照仍可读，清理自有资源。
