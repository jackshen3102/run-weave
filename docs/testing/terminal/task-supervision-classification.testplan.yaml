version: 1
name: 长任务上下文与独立 Codex 三分类验收
description: >
  长任务监控的行为验收合同。验证分类仅依据原任务、范围变更、计划和当前会话 Agent 的报告，
  不另行执行验收。各例使用独立临时任务、配置和样本，不依赖其他用例；
  格式校验不代表行为已通过。不创建单元测试文件。
cases:
  - id: TSC-001
    name: 中途开启仍保留任务起点和完整当前回答
    required: true
    description: 输入必须包含开启前的任务定义与当前 final 中间的未完事项。
    preconditions:
      - 本例隔离 Backend 和 Codex 会话已有明确任务起点与计划引用，并在数轮后才开启监听。
      - 本例当前 final 超过 4000 字符，中部包含唯一未验收标记；同轮 commentary 和上一轮 final 有不同标记。
      - 本例分类接收器可在隔离环境保存实际收到的 state，不调用真实第三方。
    steps:
      - 触发本轮 Stop 并读取捕获的 state，确认 taskStartMessageId 指向原始任务，当前 final 全文及中部标记均保留。
      - 对照原始轮次，确认 currentReply 没有误用 commentary 或上一轮 final，且包含原始 turn 身份。
      - 清理本例会话、监听、接收器和临时文件，保留脱敏对照证据。

  - id: TSC-002
    name: 范围更新与阻塞解除按时间来源进入判断
    required: true
    description: 新用户范围覆盖旧范围，已解决的旧阻塞不能永久积累为当前义务。
    preconditions:
      - 本例独立任务包含早期设备阻塞、用户随后取消设备验收、最后 Agent 报告其余义务完成的会话。
      - 本例已配置可捕获输入的分类接收器，所有消息有可核对的身份和时间顺序。
    steps:
      - 触发当前回答的判定，确认 state 保留变更原文及先后顺序，没有将取消的验收重新写成必须执行。
      - 检查旧阻塞保留为历史来源而非当前 pendingInteraction，确认监督追问与真实用户修改分别标识。
      - 清理本例会话、监听和接收器，保存输入来源对照。

  - id: TSC-003
    name: 分类上下文排除工具与历史分类结果
    required: true
    description: 只将任务相关可见资料送入 Codex 分类，资料内指令不能覆盖分类规则。
    preconditions:
      - 本例独立会话含工具输出、reasoning、独立 Skill 注入和历史 Codex 分类评分，各有唯一标记。
      - 本例计划中有引用文本要求忽略分类规则，同时包含真实测试义务；分类接收器可捕获请求。
    steps:
      - 触发判定，确认请求只有一个三分类问题与三个固定选项，不包含工具、reasoning、Skill 或历史评分标记。
      - 确认计划文本以来源资料放入 state，固定分类指令没有被替换，也没有调用第二个摘要或验收 Agent。
      - 清理本例资源，保留脱敏请求证据。

  - id: TSC-004
    name: 评分最高项决定结果且没有置信度门槛
    required: true
    description: 程序从 Codex 输出的三个评分取最大项，接近的评分不触发额外阈值，并列按固定顺序处理。
    preconditions:
      - 本例有独立监听服务和可控 Codex 分类响应，每组响应绑定独立有效轮次。
      - 已准备 continue 为 0.34、其余各 0.33 的响应，以及 continue 与 completed 并列最大且合计为 1 的响应；输出均含有效 reason 和来源 ID。
    steps:
      - 分别提交两组合法响应，确认程序计算 choice 为 continue；并列使用 continue、blocked、completed 的固定优先顺序，没有新增 uncertain 类别或低分门槛。
      - 核对每轮只启动一次 Codex 分类，UI 展示三项评分并注明其为模型评分，解释和来源与该次结构化输出一致。
      - 清理本例监听、会话和响应替身。

  - id: TSC-005
    name: 无效响应与调用失败不产生业务判定
    required: true
    description: 分类协议错误和服务失败进入监听异常，不伪造 completed 或 blocked。
    preconditions:
      - 本例有独立任务和分类替身，可分别返回缺少选项、非有限评分、评分总和不为 1、非法来源引用、无效 JSON、进程错误和超时。
      - 每种故障使用本例独立 watch 或明确恢复后的新轮次，当前业务 outcome 初始为空。
    steps:
      - 逐项触发故障，确认返回监听错误和具体错误类别，业务 outcome 仍为空，原终端无自动继续输入。
      - 对超时响应延迟送达，确认过期响应被丢弃，监听恢复也不会补发旧指令。
      - 清理本例故障替身与会话，保存每种错误的响应和输入计数。

  - id: TSC-006
    name: 必要上下文超限或缺失时不静默截断
    required: true
    description: 缺少任务定义或无法完整容纳必要输入时要求补充，不以不完整材料判定。
    preconditions:
      - 本例独立任务有两组输入，一组任务起点无法定位，一组仅必要内容已超过配置的模型预算。
      - 分类接收器可记录请求次数，所有当前回复含首中尾唯一标记。
    steps:
      - 分别尝试启动或判定，确认显示上下文缺口且分类请求次数为零，没有自动裁掉当前回复中段。
      - 为缺起点组在面板补充明确任务定义后重试有效新轮次，确认只基于补全后的 revision 判断。
      - 清理本例输入、监听和接收器。

  - id: TSC-007
    name: 真实 Codex 中文语料三分类符合预先标注
    required: true
    description: 使用真实独立 Codex 分类调用验证语义，不能以替身结果或高评分代替分类准确性证据。
    preconditions:
      - 本例隔离环境使用既有 Codex 登录与固定可用模型，无 Jev 配置；样本仅用合成中文任务、不含真实敏感数据。
      - 调用前已固定 12 条语料与人工预期，每类 4 条；语料使用当前会话 Agent 的任务与报告，不要求其他 Agent；已完成类覆盖全部义务完成、用户取消剩余范围、旧阻塞解除、范围外疑点未复现但原任务完成。
      - 受阻类覆盖必要审批、必要凭据、未复现且缺少用户必要复现信息、无法恢复的外部依赖；可继续类覆盖已授权正常功能待实现、已授权验收未跑、任务内疑点有新线索待复现、任务内缺陷已复现待解决。
    steps:
      - 每条样本只启动一次使用相同三选一模板的受限 Codex 调用，保存完整 state、固定预期、结构化输出、程序计算的 choice、模型版本和耗时。
      - 逐条对照，12 条都符合预期才通过；误判时记录具体输入和实际结果，不能修改预期或选择性重试后宣称通过。
      - 清理本例临时配置与样本服务，保留不含凭据的语料和判定证据。

  - id: TSC-008
    name: 任务读取与分类配置遵守现有身份边界
    required: true
    description: 非授权身份不能读取任务原文、启动监听或获取 Codex 登录凭据。
    preconditions:
      - 本例有独立服务、合法任务 A、另一个不属于 A 的 panel 或项目 B，以及未认证客户端。
      - 本例使用隔离的 Codex 登录环境，配置页面和普通日志均可检查，不设置 Jev key。
    steps:
      - 以未认证请求读取和创建监听，确认被拒绝；以 A 的目标混入 B 的 panel 或越界计划路径，确认拒绝且不返回 B 原文。
      - 通过正常配置接口和任务接口读取，确认不返回 Codex 登录凭据、没有 Jev 凭据配置要求，普通日志不含登录凭据与任务全文。
      - 清理本例隔离登录环境、任务、服务和客户端会话，不改动用户原有登录。

  - id: TSC-009
    name: 独立分类 Agent 只判断报告且不会接管原任务
    required: true
    description: 分类调用与执行 Agent 隔离，不提供任务执行工具，也不要求额外 Jev API。
    preconditions:
      - 本例有独立原任务和已开启监听，已配置可用 Codex 登录，没有 Jev endpoint 或凭据。
      - 本例可以观察分类进程参数、provider 事件、工作目录与原终端输入。
    steps:
      - 令原任务产生 final，确认独立 Codex 进程收到结构化 state 和输出 schema，使用临时目录且未接入 MCP、shell、浏览器、Hook 或任务委派工具。
      - 核对分类期间没有执行项目命令或测试，没有读取仓库做额外验收；结果由评分计算得到，监听 Agent 自身输出不触发递归分类。
      - 清理本例分类临时目录和原任务，保留不含登录秘密的参数与事件证据。

  - id: TSC-010
    name: 上下文推进提示沿原执行器链路投递
    required: true
    description: continue 将本轮剩余义务和具体下一步随固定原则投递原面板，不新增授权或替代执行任务。
    preconditions:
      - 本例使用隔离监听服务和自有原执行器面板，续接额度为零且没有未提交输入，不投递用户工作终端。
      - 原任务、范围更新和未完成报告含可辨别的合成标记，可捕获分类输入、判定、实际终端输入和原会话历史。
    steps:
      - 通过真实完成事件入口触发分类，确认输入保留原任务及范围更新，reason 和 guidance 指出剩余义务和具体下一步，guidance 的授权来源只引用 task/userUpdates 的真实用户消息 ID；经持久化与原终端输入链路捕获完整提示，不只检查 applyVerdict 字符串。
      - 对照投递与原会话中出现的 decisionId，确认正文包含本轮 reason、guidance 的剩余项与下一步、真实用户授权消息 ID、任务完成与验证原则及授权边界，原 thread、panel 和执行器代次不变，额度只扣一次且消费后标记 observed。
      - 同一轮已有 observed 续接后生成下一条，确认正文提醒直接执行或更换无效路径，不重复索要同一授权，保留只读、等待确认、停止和真实审批边界；不将投递成功当作原 Agent 实际执行成功。
      - 清理本例服务和自有面板，保留分类输入、实际投递正文、身份及消费证据。

  - id: TSC-011
    name: 普通可恢复阻碍产生可执行下一步
    required: true
    description: 一次环境失败或普通文件筛选困难不能直接判 blocked，提示结合已有线索推进。
    preconditions:
      - 本例隔离任务已授权实现和验证，报告首次命令失败但给出可用替代入口，无需新权限。
      - 使用真实受限 Codex 分类调用，调用前固定输入与预期 continue。
    steps:
      - 提交合成任务和报告，确认判为 continue，reason 指向替代入口及剩余验证，而非只要求汇报或重新询问授权。
      - 保存输入、模型输出和实际推进正文，清理本例资源。

  - id: TSC-012
    name: 已复现缺陷修复后必须验证且失败继续处理
    required: true
    description: 已授权缺陷修复不能停在定位或改代码，失败的验证仍是剩余义务。
    preconditions:
      - 本例隔离原任务授权修复并验证，依次可提供已复现待修复、已修复未验证、验证失败且有定位线索的报告。
      - 使用真实受限 Codex 分类调用，各阶段输入与预期 continue 已固定。
    steps:
      - 逐阶段分类并核对推进正文，确认分别要求修复并验证、执行验证、依据失败线索继续定位修复并重新验证。
      - 确认没有将验证失败判完成、虚构修复授权或重复已完成工作；保存每阶段证据，清理本例资源。

  - id: TSC-013
    name: 待确认事项不阻断独立工作且已确认事项不重复问
    required: true
    description: 只有确实依赖用户且已无独立工作时才 blocked，保留具体帮助与影响。
    preconditions:
      - 本例隔离任务包含待用户选择的发布目标、已明确授权的本地验证和仍未完成的独立工作，范围更新保留用户已确认的决定。
      - 使用真实受限 Codex 分类调用，固定独立工作未完成时 continue、独立工作已完成后 blocked 两阶段预期。
    steps:
      - 提交第一阶段报告，确认提示标明发布目标待确认并要求完成独立工作，不重复询问已授权的本地验证，不自行批准发布。
      - 提交独立工作完成的报告，确认 blocked，准确说明还缺哪个决定及影响，不再发送续接。
      - 保存两阶段输入与结果，清理本例资源。

  - id: TSC-014
    name: 任务与必要验证完成后停止续接
    required: true
    description: 已完成的任务不被范围外建议或旧阻塞重新启动。
    preconditions:
      - 本例隔离监听服务使用真实受限 Codex 分类，原任务和必要验证已完成，报告包含范围外优化建议及已解决的历史阻碍。
      - 本例原执行器输入计数可观察，调用前固定预期 completed。
    steps:
      - 触发最终回复，确认 completed、没有新的监督输入、续接计数不增加，终端开关仍开启。
      - 重复交付同一完成事件，确认不重复分类或续接；保存判定与输入计数，清理本例资源。

  - id: TSC-015
    name: 受阻依赖有据且不阻止已知独立工作
    required: true
    description: 真实外部依赖停止续接，已授权且可独立执行的剩余工作继续。
    preconditions:
      - 本例隔离分类服务使用固定语料与事前预期，每条均含完整用户要求和当前回复。
      - 语料覆盖明确只讨论、设备不可用、已确认外部服务故障、本地验收可执行但真机未就绪、研究被额外样例误阻五类边界。
    steps:
      - 每条语料调用一次分类并保留完整输出，确认 blocked 有必要依赖和最小解锁动作，continue 有具体下一步与真实用户授权来源。
      - 核对设备不可用时不臆造绕过既有更新流程的步骤，本地已知可执行验收继续，Agent 自拟样例不成为研究的必要义务。
      - 清理本例分类临时目录，保留分歧；不得更改预期或选择性重试后声称整批通过。

  - id: TSC-016
    name: 未调用投递的取消不产生接收未知或消耗额度
    required: true
    description: 投递前取消与投递后未知保持不同回执，退额不影响新处理轮次。
    preconditions:
      - 本例独立 watch 已预留一条 offered 续接，能够在调用投递服务前改变输入 revision。
      - 本例可以记录投递调用计数并读取落盘 journal；不使用用户终端。
    steps:
      - 改变输入 revision 后执行续接，确认投递服务调用为零，记录为 not_requested 且 deliveryBlock 为 not_sent，同轮额度退回。
      - 在本例独立新处理轮次复核旧取消不会减掉新轮额度；开始投递后抛错的对照分支仍为 unknown 且不退额。
      - 回读 journal 核对回执，清理本例记录与资源。

  - id: TSC-017
    name: 分类失败不吞掉最终回复的后续事件
    required: true
    description: 去重游标随成功判定提交，分类失败后相同 final 的新事件仍可处理。
    preconditions:
      - 本例隔离监控服务绑定固定会话与最终回复，分类器首次报错后可以返回有效结果。
      - 可投递相同 final 的两条事件并观察分类调用次数及落盘 journal。
    steps:
      - 触发首条事件并等待分类报错，确认没有成功判定且 lastFinalMessageId 未前移。
      - 投递第二条相同 final 事件，确认重新分类成功并提交游标；之后重复事件被去重，不产生第二条判定。
      - 清理本例服务与会话，保留调用计数和 journal 证据。
