version: 1
name: Windows 终端传输与输入压力
description: 在独立 Windows 实例逐项验证实际 ConPTY、Host 管道、Backend WebSocket 和持久化的有界负载；输出窗口外只要求合同规定的快照恢复。
cases:
  - id: WTTS-001
    name: 连续输出逐档增加吞吐
    required: true
    description: 每档持续 30 秒，目标 64 KiB/s、256 KiB/s、1 MiB/s、4 MiB/s；记录实际吞吐，活跃消费者的序号不得缺失、重复或乱序，明确背压后应能恢复同一 PTY。
    preconditions:
      - 独立 Windows 实例已启动，负载终端和输出消费者均属于本 case。
    steps:
      - 使用带运行标识和连续序号的输出执行四档负载，逐档记录目标及实际吞吐、断开原因和 Host 身份。
      - 正常连接核对序号；发生明确背压时重新取快照并发送探测输入，确认原 PID 存活且响应可见。
  - id: WTTS-002
    name: 突发输出超过各层队列上限
    required: true
    description: 分别输出 512 KiB、4 MiB、16 MiB、64 MiB；已连接消费者完整收到输出或获得明确可恢复的背压，不能无提示丢失末尾标识。
    preconditions:
      - 独立实例中已建立一个专用终端和正常读取的 WebSocket。
    steps:
      - 逐档输出带长度和摘要的块，等待末尾标识并核对消费者数据或明确的背压关闭原因。
      - 每档结束重新连接并发送唯一输入，确认仍为原进程且输出恢复。
  - id: WTTS-003
    name: 慢读和停读仅影响对应消费者
    required: true
    description: 同一终端同时连接正常与慢速消费者，慢读及停读 10 秒后应明确背压或正常恢复，正常消费者和另一个终端继续响应。
    preconditions:
      - 独立实例有两个专用终端，其中一个终端有正常和慢速两个消费者。
    steps:
      - 在持续输出期间把慢消费者限速至 1 KiB/s，随后完全停读 10 秒；记录关闭原因和队列行为。
      - 正常消费者持续核对序号，并向另一个终端发送唯一输入，确认没有连带断开或失去响应。
      - 恢复慢消费者读取或重新连接，确认取得同一 PTY 的快照并可继续输入。
  - id: WTTS-004
    name: 多终端并发输出保持会话隔离
    required: true
    description: 以 1、4、8、16 个终端逐档并发，每个终端 64 KiB/s 持续 30 秒；运行标识、序号、输入响应和关闭事件不得串到其他会话。
    preconditions:
      - 独立实例具备创建 16 个专用终端的资源，生产终端基线已记录。
    steps:
      - 逐档创建带不同标识的终端并持续输出，同时每秒发送一条可确认的输入。
      - 对每个消费者核对所属标识和序号，记录输入响应 p50、p95、p99 及超时；结束后删除全部专用终端。
  - id: WTTS-005
    name: 输入洪峰明确接受或拒绝且不重复执行
    required: true
    description: 逐档并发提交 1、32、128、129 个操作及接近 1 MiB 的文本，已接受操作只执行一次，超出队列或单操作限制时明确拒绝并能继续使用。
    preconditions:
      - 独立终端运行记录每条输入运行标识及执行次数的探测进程。
    steps:
      - 分档发送输入并记录每条 operationId、确认结果和探测进程执行次数，不自动重发不确定输入。
      - 同一 operationId 同内容重试，确认不增加执行次数；同 ID 不同内容应明确拒绝。
      - 拒绝或排空后发送新标识，确认新输入可执行且进程未替换。
  - id: WTTS-006
    name: UTF8 与终端控制流在分块边界保持正确
    required: true
    description: 使用中文、emoji、组合字符、ANSI 颜色、光标移动和替代屏幕，随机分块连续输出 30 秒；实时字节不损坏，恢复屏幕符合当前状态。
    preconditions:
      - 独立终端的负载生成器记录准确原始字节和最终屏幕标识。
    steps:
      - 在字符和控制序列边界拆分输出，实时核对原始字节并在替代屏幕往返后检查最终标识。
      - 重新连接取得当前快照，确认无替换字符、跨终端混入或残留的替代屏幕状态。
  - id: WTTS-007
    name: 超长行与大量行恢复遵守字节边界
    required: true
    description: 逐档输出 1 MiB 和 8 MiB 的单行及超过 5000 行的历史；快照遵守 512 KiB 上限，超出保留窗口不冒充完整历史，仍可恢复当前画面和输入。
    preconditions:
      - 独立终端和消费者已记录当前输出游标及进程 PID。
    steps:
      - 分别执行超长行与 10000 行输出，记录快照 UTF8 大小、窗口起止与末尾标识。
      - 使用过期游标和新快照分别连接，确认明确恢复路径，原 PID 不变且新探测输入可见。
  - id: WTTS-008
    name: 网络断开反复重连不重放输入
    required: true
    description: 在持续输出和已确认输入之间断开消费者 100 次，原 PTY 保持不变，窗口内游标恢复不重复，窗口外明确转快照。
    preconditions:
      - 独立终端运行唯一输入计数器，客户端保存已确认操作和输出游标。
    steps:
      - 循环断开并重连 100 次，轮换断开前后输入和输出时序，记录每轮 PID、关闭原因及恢复耗时。
      - 核对每个已接受输入只执行一次，并区分游标连续恢复与窗口外快照恢复。
  - id: WTTS-009
    name: 多消费者连接与退出不泄漏订阅
    required: true
    description: 对同一终端并发连接 1、8、32 个消费者，再累计连接关闭 200 次；其他消费者继续收到输出，断开的消费者资源得到回收。
    preconditions:
      - 独立终端持续输出带序号的数据，记录 Backend 句柄和内存基线。
    steps:
      - 逐档建立消费者，交错关闭及重新连接，核对仍在线消费者数据与原 PID。
      - 全部关闭后等待 10 秒，核对订阅计数、句柄和资源是否回到稳定范围，重复三轮比较趋势。
  - id: WTTS-010
    name: 持续输出期间落盘不断推进
    required: true
    description: 持续 60 秒输出带序号的 UTF8 数据，不等待静默也能看到持久化推进；最终保留窗口内字节顺序和内容准确。
    preconditions:
      - 独立终端的历史文件路径和保留上限已按当前配置确认。
    steps:
      - 连续输出期间每秒观察持久化文件的尾部序号，确认进程仍在输出且磁盘尾部不断前进。
      - 输出停止并完成 flush 后核对保留窗口内原始 UTF8 字节，确认没有重复、缺口或损坏。
  - id: WTTS-011
    name: 空闲后台巡检不阻塞交互终端
    required: true
    description: 独立 Windows 实例在调查 MCP 未安装、经验学习队列为空时，空闲和 64 KiB/s 输出各运行 60 秒；本机回环输入响应 p95 不超过 250 毫秒，最大不超过 1 秒，不能发生管道积压关闭。
    preconditions:
      - 独立完整实例使用默认后台状态轮询，调查 MCP 未安装且经验学习队列为空。
      - 负载客户端与 Backend 在同一 Windows 主机，当前没有构建或其他压力测试干扰。
    steps:
      - 空闲和 64 KiB/s 连续输出分别保持 60 秒，每 100 毫秒发起一次唯一输入，逐条记录到回显的耗时与执行次数。
      - 分别计算响应 p50、p95、p99 和最大值，核对全部输入仅执行一次、无断连并满足本机回环延迟边界。
  - id: WTTS-012
    name: 输入分片不改变字节流或耗尽操作槽
    required: true
    description: 同一条小于 8 KiB 的输入，整体发送与拆为 8 字节及 256 字节帧各重复 30 次，探测进程收到相同字节且仅执行一次，不因帧数超过 128 而断开。
    preconditions:
      - 专用原始输入探测进程能够按运行标识记录实际输入及执行次数。
    steps:
      - 经真实终端 WebSocket 以三个分片档位发送相同结构的唯一输入，包含中文和 emoji；每档重复 30 次并核对完整内容及执行次数。
      - 交错发送原始输入与有 operationId 的结构化输入，核对顺序、无重复和连接仍可用；超大输入仍遵守已有队列及字节上限。
