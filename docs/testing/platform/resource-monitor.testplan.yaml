version: 1
name: 电池与应用资源监控候选方案验收
description: >
  对应 2026-10-01 实施计划，主体闭环已实现；按独立用例取得真实证据，未完成项必须保留。
  每例独立拥有候选 Backend、profile、会话与需要的客户端，不使用其他 case 遗留状态。
  系统实读与注入结果分别标记；只允许在采样、时钟、存储失败和通知传输边界注入，
  领域服务、规则、鉴权、API、持久化和 UI 必须走真实实现。
  不执行 kill、关闭安全服务、改用户电源设置或通知真实用户；只停止本例创建的资源。
cases:
  - id: RESMON-001
    name: 普通 Web 展示目标 Mac 的真实应用排行
    required: true
    description: >
      无 Electron bridge 的普通浏览器从已登录 Backend 取得资源快照，能耗影响、CPU 和 RSS
      具有明确口径；目标是当前连接的电脑，不能把分数标为瓦数。
    preconditions:
      - 本例拥有 macOS 上独立候选 Backend、合法会话和专用普通浏览器页面。
      - 本例使用真实采样源，后台资源监控开启，可同步读取 Backend 公开 libproc 计数器、ps 和电源信息。
    steps:
      - 使用 $toolkit:playwright-cli 附着本例实际页面并打开系统监控，确认电脑名称与当前连接一致且无需 Electron bridge。
      - 同步记录系统命令和候选快照的采样时间，确认应用分组和高占用候选可核对；不要求不同采样时刻的瞬时数值完全相等。
      - 切换能耗影响、CPU、内存排序，确认数值排序正确、未知值末尾；能耗影响无 W 单位，整机 CPU 与单核心 CPU 口径均可读取。
      - 点击一个应用行，确认只在行内展开 PID、进程名、CPU 和 RSS；CPU、内存、Swap、电池四卡保留，没有详情侧栏、趋势图或提醒中心。
      - 确认整轮采样无需 sudo，应用 RSS 标注共享页可能重复计入，未知或预热值未显示为 0。
  - id: RESMON-002
    name: 电池电流符号解码生成可信的放电功率
    required: true
    description: >
      精确整数解析在转浮点前处理有符号与无符号 64 位电流，未知和接电不伪造放电瓦数。
    preconditions:
      - 本例隔离 Backend 可在电源采样边界分别提供明确电流、电压和供电状态，不替换转换逻辑。
    steps:
      - 分别提供电池供电、12605 mV、-1793 mA 以及等价无符号 64 位值 18446744073709549823，确认两者均得到约 22.60 W。
      - 提供 AC 未充电、AC 正在充电、无电池及非法电流，确认放电功率均为 null，百分比和供电语义不被改写。
      - 使用 $toolkit:playwright-cli 查看本例页面，确认显示合理 W 或明确未知文案，不出现巨大电流、负放电 W 或 0 W 代替未知。
  - id: RESMON-003
    name: 多客户端和页面关闭不放大后台采样
    required: true
    description: >
      每台 Backend 只有一份资源采样调度，缓存读取没有系统命令副作用，关闭页面后继续采样。
    preconditions:
      - 本例 Backend 的启动时刻和本轮采样子进程可记录，默认间隔为 60 秒。
      - 本例拥有三个已鉴权客户端，不存在其他使用同一 profile 的 Backend。
    steps:
      - 启动本例 Backend，三客户端重复 GET 并在页面点击刷新，跨越 130 秒后确认只有启动及约 60、120 秒的三轮资源采样。
      - 关闭本例全部客户端页面后再观察 70 秒，确认仍产生下一轮，没有新增客户端专属采样器。
      - 确认采样无重叠子进程、输出有上限，暂停显示不改变 Backend 调度。
  - id: RESMON-004
    name: 持续高能耗窗口只在完整有效观测后触发
    required: true
    description: >
      默认阈值边界为 100，至少六次有效电池样本跨满 300 秒才创建事件，瞬时高峰不够。
    preconditions:
      - 本例 Backend 拥有独立 profile、开启的高能耗规则和可控制采样及单调时钟的边界。
      - 本例只有一个稳定应用身份，通知传输仅记录本例结果，初始没有事件。
    steps:
      - 每 60 秒提供六次 99 的完整电池样本，确认没有事件。
      - 清空本例观察窗口后依次在 0、60、120、180、240 秒提供分数 100，确认 240 秒仍未触发。
      - 在 300 秒提供同一应用分数 100，确认仅创建一条事件，证据包含六次采样、300 秒窗口、阈值和采样均值。
      - 在本例独立观察窗口提供一次高分后持续低分，确认不形成高能耗事件。
  - id: RESMON-005
    name: 缺失和断档观测不满足持续窗口
    required: true
    description: >
      partial、权限缺失、超时和相邻间隔超过 90 秒中断连续观察，缺失数据不被当成零值恢复。
    preconditions:
      - 本例拥有可在采样和时钟边界注入错误的隔离 Backend，规则已开启且应用身份稳定。
    steps:
      - 先建立五次高分观测，依次在本例独立窗口引入 partial、权限缺失、命令失败或 91 秒断档，确认均不能用旧窗口创建事件。
      - 在断档后提供五次有效高分，确认仍需新的第六次且跨满 300 秒才可触发。
      - 对本例已 active 的事件提供缺失样本，确认保留去重状态，没有把缺失值记为已恢复。
  - id: RESMON-006
    name: 接电只暂停高能耗规则并保留事件去重
    required: true
    description: >
      高能耗提醒只使用电池供电事实；短暂接电和再次拔电不能重复同一事件。
    preconditions:
      - 本例 Backend 高能耗规则开启，可独立控制供电和完整高分样本，拥有本例通知记录器。
    steps:
      - 在 AC 供电下提供满窗口高分，确认无高能耗提醒；切到电池后提供完整新窗口，确认一次事件。
      - 改为 AC 并确认未展示高能耗通知取消，再恢复电池供电及高分观测，确认重新积累窗口且已有 episode 不再弹一次。
      - 确认接电前后排行仍更新，原设备电量供电字段保持正确。
  - id: RESMON-007
    name: 恢复阈值与冷却限制重复异常提醒
    required: true
    description: >
      一次 episode 内持续高分不重复，低于阈值 80% 的连续三次观测结束异常，重新异常受 30 分钟冷却约束。
    preconditions:
      - 本例独立 Backend 已自行建立一个 active 高能耗 episode，可控制采样和时间。
    steps:
      - 重复高分和多个客户端 GET，确认 eventId 不变且通知次数仍为一次。
      - 提供两次 79 后一次 85，确认恢复连续计数重置，episode 尚未结束。
      - 再提供三次 79，确认 episode 结束；重新提供完整高分窗口，30 分钟冷却到期前不弹出新提醒。
      - 冷却到期后建立新高分窗口，确认新的 episode 最多提示一次。
  - id: RESMON-008
    name: 高内存提醒独立于能耗与供电
    required: true
    description: >
      RSS 占用较大可独立提示，但低能耗内存大户不会被描述为耗电大户。
    preconditions:
      - 本例 Backend 开启默认 4 GiB、5 分钟内存规则，能耗分数持续低于能耗阈值。
      - 本例采样源可返回同一应用稳定身份、完整 RSS 与 AC 供电信息。
    steps:
      - 提供六次跨 300 秒的 4095 MiB 样本，确认无内存事件；在本例新窗口提供六次 4096 MiB，确认仅一个内存事件。
      - 使用 $toolkit:playwright-cli 查看页面提示并点击查看进程，确认展开对应应用行，文案为内存占用较大，包含共享页与不代表耗电的说明。
      - 确认没有高能耗事件，也没有因 AC 供电取消内存规则。
  - id: RESMON-009
    name: 应用静默只影响指定应用的提醒
    required: true
    description: >
      忽略一小时保留排行并限制该应用通知，不影响另一应用或原低电量能力。
    preconditions:
      - 本例 Backend 有两个不同 appKey 的 active 资源事件，开启内存和能耗规则及本例电量采样。
    steps:
      - 使用 $toolkit:playwright-cli 对应用 A 点击忽略 1 小时，确认 API 和页面返回静默到期时间，A 仍在排行中。
      - 在静默期间让 A 和 B 各自恢复后再次异常，确认 A 不提示、B 仍依规则提示；电量 API 仍可读。
      - 到期后对 A 提供新的有效窗口，确认遵守原 episode 与冷却规则，没有对过期旧值立即补发。
  - id: RESMON-010
    name: 后台监控关闭与设置保存具有真实效果
    required: true
    description: >
      保存后的开关控制调度，非法输入和并发冲突不能悄悄替换设置。
    preconditions:
      - 本例 Backend 和普通浏览器在线，独占测试 profile，有两个独立设置读取者和本例子进程记录。
    steps:
      - 使用 $toolkit:playwright-cli 关闭后台资源监控并保存，确认进行中采样取消、后续资源调度停止，原电量采样仍继续。
      - 确认设置为紧凑弹窗，固定阈值只读；提交非布尔开关或试图覆盖固定阈值，确认 400 且原设置不变；两个读取者用同一旧 revision 保存不同值，确认第二次返回 409。
      - 在存储边界制造本例保存失败，确认 UI 显示失败且原值仍有效；恢复后开启监控，确认重新预热而非沿用旧连续窗口。
  - id: RESMON-011
    name: 通用进程真实身份与 PID 重用不串应用
    required: true
    description: >
      通用 Node 只显示已知应用名和 PID，不伪造项目归属；同一 PID 的新进程不继承旧观察窗口。
    preconditions:
      - 本例隔离 Backend 可在采样边界提供多个 Node 进程的 PID、启动时间与占用，资源快照没有项目归属字段。
    steps:
      - 使用 $toolkit:playwright-cli 打开排行并展开 Node 行，确认显示真实 PID 和进程名，没有添加 browser-viewer 或 backend 等未经映射的项目服务标签。
      - 保持一个 PID 数字不变但替换启动时间，确认旧进程窗口不移交新实例，提示查看进程不指向已结束的旧实例。
      - 检查本例 API，确认没有完整 cwd、argv、环境变量或凭据；缺失项目归属保持缺失，不通过猜测填入。
  - id: RESMON-012
    name: 连接切换丢弃迟到的资源响应
    required: true
    description: >
      目标电脑切换后，旧连接的迟到结果不能覆盖新电脑排行或展示它的提醒。
    preconditions:
      - 本例拥有 A、B 两个不同 hostId 的隔离 Backend、各自合法会话和一个专用浏览器。
      - 本例可在传输边界延迟 A 的资源 GET，不改变实际服务和响应内容。
    steps:
      - 使用 $toolkit:playwright-cli 连接 A 并发起延迟读取，切换 B 后等待 B 成功快照，再释放 A 响应。
      - 确认页面标题、hostId、排行和提醒仍属于 B；没有短暂显示 A 的应用或使用 B 凭据读取 A。
      - 确认切换过程停止 A 的前台请求，B 首次未知不复用 A 的成功数字。
  - id: RESMON-013
    name: Backend 重启保留设置和已提示事件
    required: true
    description: >
      同一 profile 重启保留静默与去重，流代次更新，旧观察窗口不能冒充新鲜观测。
    preconditions:
      - 本例独占候选 Backend 和 profile，已自行建立一条已提示事件及一小时静默设置。
      - 本例可记录当前 hostId、streamId、事件 ID 和已展示次数，并安全重启其进程。
    steps:
      - 保存重启前证据后重启本例 Backend，重新取得实际端口、凭据和 $toolkit:playwright-cli 页面引用。
      - 确认 hostId 保留、streamId 更新，设置和静默保留，观察窗口处于预热而不把磁盘旧值显示为实时。
      - 在重启后提供仍高占用的完整窗口，确认未结束 episode 的事件 ID 和已展示次数不增加；旧流迟到响应被丢弃。
  - id: RESMON-014
    name: 资源 API 与设置遵守鉴权边界
    required: true
    description: >
      未登录或失效会话不能读取资源/提醒或修改设置，公开健康接口不泄露进程信息。
    preconditions:
      - 本例 Backend 开启真实鉴权，拥有本例有效会话、可撤销会话和至少一条资源事件。
    steps:
      - 不带或使用无效凭据调用资源 GET、设置 PUT 和静默 POST，确认拒绝且无资源数据或状态变更。
      - 使用合法会话读取后撤销该会话，再重复请求，确认同样拒绝；公开健康响应没有资源、项目名或提醒。
      - 使用其他 host 的事件 ID 请求本例静默 API，确认 404 而非跨主机操作。
  - id: RESMON-015
    name: 采样失败和旧 Backend 只降低资源能力
    required: true
    description: >
      资源失败保留旧观测真实年龄，旧 Backend 的路由缺失有明确降级，原电量与终端仍可用。
    preconditions:
      - 本例拥有独立候选 Backend、其真实终端和普通浏览器，资源采样边界可提供一次成功后持续错误。
      - 本例传输边界可仅把新增资源路由映射为 404，不替换终端或设备状态服务。
    steps:
      - 使用 $toolkit:playwright-cli 读取一次成功快照后提供资源错误，确认旧数据标记错误且 observedAt 不变。
      - 等待或在时钟边界推进至样本超过 180 秒，确认显示旧记录、不积累新告警，重复 GET 没有刷新观测时间。
      - 对资源路由返回 404，确认提示当前电脑版本不支持，没有反复刷新登录；读取原设备 API 并打开本例终端，确认仍正常。
  - id: RESMON-016
    name: Mac 系统通知在用户授权后每事件最多一次
    required: true
    description: >
      Electron 安装负责通知授权和去重，点击通知只定位当前事件，无终端命令副作用。
    preconditions:
      - 本例独占候选 Electron 实例、Backend 和通知设置，可用 native UI 工具实际操作系统授权。
      - 本例可产生两个隔离资源 episode，并记录系统通知及终端输入，未开启资源 Mac 通知。
    steps:
      - 首次打开监控页并触发本例事件，确认无自动通知权限请求，应用内事件可见。
      - 主动点击开启通知并拒绝，确认显示未允许且应用内事件保留；在本例可控制的系统设置授权后再次启用。
      - 触发一个新 episode 并打开两个本例窗口，确认系统通知只有一次；点击后使用 $toolkit:playwright-cli 核对对应电脑监控页及行内展开，终端没有新增输入。
      - 刷新和重新打开窗口，确认相同 alertId 没有重复系统通知，不用传输记录替代真实通知展示证据。
  - id: RESMON-017
    name: 采集自身成本满足低耗电交付预算
    required: true
    description: >
      用实测证明后台采样不积压、不形成明显新增资源负担，无法归因的电池差异必须报告不确定。
    preconditions:
      - 本例拥有候选 Mac Backend 与其全部采样子进程，可维持相同屏幕条件及近似工作负载。
      - 本例只读记录 CPU 时间、常驻内存、电池电压电流和子进程生命周期，不制造 CPU 压力。
    steps:
      - 资源监控关闭与开启各观察 15 分钟，保存原始时序及活动条件，确认每分钟最多一轮且无子进程积压。
      - 对照累计 CPU 时间与新增常驻内存，确认额外 CPU 均值不超过一个核心的 1%、内存不超过 50 MiB。
      - 计算两个窗口电池侧平均放电差值，目标不超过 0.5 W；若自然负载波动无法归因，用交替窗口复核并标记不确定，不宣称已证明省电。
