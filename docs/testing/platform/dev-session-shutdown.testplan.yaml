version: 1
name: Dev Session 进程关闭与 watcher 信号边界验收
description: >
  验证 Dev Session stop、失败启动回滚与 stale cleanup 使用同一有界、身份安全的进程关闭机制。
  真实产品必须从当前 worktree 的 planner 启动，源码 SQLite worker 路径与数据目录隔离；
  测试只能操作 manifest 或本次 fixture 直接记录的进程，不按名称或端口杀进程。
  stopped 或 launcher 退出不是 Backend 优雅退出证据，须检查应用日志、worker、锁和残留进程。
cases:
  - id: DSS-001
    name: 真实 pnpm 和 tsx watcher 只转发一次停止信号
    required: true
    description: >
      有延迟清理的真实子进程收到一次 SIGTERM，完成清理后 launcher 和整个自有进程组才退出。
    preconditions:
      - 已准备使用仓库固定 tsx 的独立 pnpm fixture，子进程记录收到的信号和清理完成事件。
    steps:
      - 通过实际 stopOwnedProcess 向 fixture launcher 停止，比较子进程的信号次数、清理事件与 launcher 退出时间。
      - 确认子进程只收到一次 SIGTERM，没有 Previous process hasn't exited 或 Force killing 提示，stop 在进程组清空后返回。
  - id: DSS-002
    name: 活跃终端通过 dev stop 完成端到端资源回收
    required: true
    description: >
      真实浏览器登录、终端交互后调用 dev:stop，Backend 与 App Server 正常关闭，锁和专属资源得到回收。
    preconditions:
      - 已按 planner 创建当前 worktree 的 Electron Dev Session，数据目录与账号独立。
    steps:
      - 通过 dev:status 和 dev:open 校验身份，再用 playwright-cli 登录、创建临时项目与终端，确认唯一标记命令的真实输出。
      - 保持终端 Session 存活，detach Playwright 后执行指定 Session 的 dev:stop，不手动提前向 Backend child 发信号。
      - 确认 Backend 日志包含 shutdown.completed，SQLite workers 正常退出，Backend 与 App Server owner lock 消失，没有 watcher 强杀日志，专属进程组和端口退出。
      - 重复 dev:stop 与 dev:status 确认幂等 stopped，dev:open 明确拒绝已停止的 surface；其它既有 Session 不受影响。
  - id: DSS-003
    name: 失败启动回滚与 stale owner 恢复复用安全关闭
    required: true
    description: >
      后续服务启动失败或健康身份漂移时，已取得的 launcher 仍按相同关闭规则回收；未知身份不被清理。
    preconditions:
      - 存在隔离的启动失败 fixture 和持有完整 launcher 身份的 stale manifest。
    steps:
      - 在真实 pnpm watcher fixture 上执行 stopSpawnedProcess，确认子进程清理完成且没有重复信号；执行既有 stale-cleanup-retry 集成验证。
      - 对真实 Dev Session 注入后续 Frontend 启动失败，使已启动 Backend 进入启动回滚，确认 Backend 完成关闭且 owner lock 释放。
      - 按 status 返回的 recovery 指引清理本次失败或 stale Session，确认既有 shared 服务与其它 Session 仍可用。
  - id: DSS-004
    name: 进程身份漂移和共享资源禁止发送停止信号
    required: true
    description: >
      launcher 签名不匹配时 fail closed，不发送 SIGTERM 或 SIGKILL；shared-declared 服务不进入自有进程停止路径。
    preconditions:
      - 已准备两个相互独立的真实 fixture 进程及记录完整身份的服务合同。
    steps:
      - 给其中一个 fixture 提供错误签名调用停止，确认明确拒绝且两个 fixture 都仍存活。
      - 将一个 fixture 标为 shared-declared，停止包含另一个 dedicated fixture 的服务集合，确认只有 dedicated 进程退出。
  - id: DSS-005
    name: 超时升级与 launcher 提前退出不会产生假成功
    required: true
    description: >
      忽略 SIGTERM 的 owner 在有界等待后仅在身份再次确认时被强制清理；launcher 提前退出时仍等待组内进程，无法确认的残留不得标记成功。
    preconditions:
      - 已准备忽略 SIGTERM、提前退出而子进程延迟退出、以及留下持续存活子进程的隔离 fixture。
    steps:
      - 停止忽略信号的 fixture，确认先出现 SIGTERM，再在等待窗口结束后强制终止，结果明确记录 forced 且进程组为空。
      - 停止提前退出但子进程会完成的 fixture，确认 stop 等待子进程退出才返回。
      - 对 launcher 已消失而组内仍有无法核验 owner 的 fixture 调用停止和 stale cleanup，确认返回错误且不发送盲目进程组信号，不把 manifest 标记 stopped。
      - 最后按 fixture 原始记录逐一清理本次自有进程，不操作外部进程。
  - id: DSS-006
    name: 生命周期和架构门禁保持兼容
    required: true
    description: >
      现有 Dev Session 的 planner、registry、ownership、stale recovery 和上一轮 Backend 资源生命周期合同无回归。
    preconditions:
      - 实现与测试计划已落盘，仓库依赖可用。
    steps:
      - 运行 pnpm dev:session:verify 与 pnpm backend:verify-lifecycle，确认进程、registry 和真实 SQLite/tmux 集成验证通过。
      - 运行改动脚本的 eslint、架构检查、docs:check 和本测试计划的 testplan:validate，确认全部通过。
  - id: DSS-007
    name: Beta readiness 之前失败仍保留可恢复的责任身份
    required: true
    description: >
      Beta updater 启动前登记控制责任。失败还原不重新启动 Dev Session baseline，
      旧版缺少 PID 的 manifest 仅在 lease 与 desktop 身份共同确认后恢复。
    preconditions:
      - 按 planner 使用隔离 Beta Session；故障只针对本次自有资源，不操作其它槽位。
    steps:
      - 使用仅本次官方 planner/start 环境的 AUTH_ACCESS_TOKEN_TTL_SECONDS=0，使真实 Backend 在 updater 已启动而服务 PID 尚未提交时失败；不得用源码 stub 或低层手工启动绕过产品入口。
      - 确认 starting manifest 在 updater 启动前已记录 Beta control 责任且不含凭据；失败还原后没有异步 relaunch，进程退出后才 reset 和 release。
      - 对历史缺少 PID 的 stale Beta Session 执行 dev:stop --session <id> --cleanup-stale --json；确认匹配 lease owner 和 nonce、desktop Session 和 instance、可执行文件和当前签名后才停止，整个槽位无进程后才释放。
      - 对不匹配 lease、desktop 身份或仍有未知 Backend/App Server 残留的隔离 fixture 重复恢复，确认 fail closed、lease 保留且不盲杀；重复成功停止保持幂等。
  - id: DSS-008
    name: 回滚消费备份后 artifact 指针与显式修复保持一致
    required: true
    description: >
      lease 释放不等于槽位健康。真实备份消费、current/previous 发布和 retention 构成可复核闭环，
      历史指针修复只允许精确绑定已释放 owner 的显式入口。
    preconditions:
      - 使用本次自有 Beta 槽位或既有 verifier 的隔离真实文件系统 fixture，不手工修改实际槽位状态。
    steps:
      - 运行既有 restored-artifact fixture，确认失败更新保留旧 previous 备份，恢复消费新 backup 后 current 内容与 inode 正确，previous 指向实际保留的代际，正常 retention 通过。
      - 验证已接受更新提交后才清理旧代际，随后 standalone-style rollback 消费其 backup 不再引用已删除代际；缺失或身份漂移的备份拒绝恢复。
      - 对官方 TTL 故障启动检查 receipt 不含 retentionFailed，pool 投影为 idle 且 retention healthy，没有 Desktop 或 App Server 重启；不能只凭 releasedLease 判定成功。
      - 在隔离 fixture 中持有 recovery claim 与 Beta update lock，确认同进程及另一进程均不能为该槽位发布 lease，自动分配跳过它；释放 claim 后可分配，已有新 owner lease 时修复拒绝且状态字节不变。
      - 验证缺失或损坏 claim owner 不被视作 dead；真实已退出 owner 可回收。暂停 takeover/release 的真实 rename 后确认 guard 仍排斥 successor，重复旧 release 不得删除新 generation；普通错误释放 guard，中断留下的 guard 不自动删除且 release 有界拒绝。
      - 在隔离 fixture 中执行 repair-retained-state，确认只清空证明失效的 previous App 指针并留下 durable receipt，其他字段和文件不变。
      - 对错误 inode、新 lease、新 failure、错误时间或未知 backup 路径重复修复，确认拒绝且状态字节不变；实际历史槽位仅在 reviewer 通过且 exact Session 与 lastFailure.at 对齐后由所有者调用公共修复命令。
