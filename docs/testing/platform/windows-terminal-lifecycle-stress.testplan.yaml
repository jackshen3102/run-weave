version: 1
name: Windows 终端生命周期与资源压力
description: 在独立实例中验证连接与进程身份、故障恢复、限额和长时间资源占用；不对生产实例注入重启或 Host 故障。
cases:
  - id: WTLS-001
    name: 反复创建与显式关闭回收原生进程
    required: true
    description: 分三轮累计创建关闭 300 个专用终端，关闭后无存活探测进程，句柄不随已关闭会话数无界增长。
    preconditions:
      - 独立实例已记录 Host 与 Backend PID、句柄和内存基线。
    steps:
      - 每轮创建关闭 100 个专用终端，记录创建和关闭耗时，并等待每个原生进程退出。
      - 每轮等待 10 秒后记录 Host 与 Backend 资源，检查运行会话为零，已退出运行时最多保留 256 个且资源趋势可解释。
  - id: WTLS-002
    name: 终端数达到上限后明确拒绝并可恢复
    required: true
    description: 在隔离 Host 创建 64 个空闲终端，第 65 个明确拒绝；关闭一个后可创建新的终端，已有终端身份不变。
    preconditions:
      - 独立 Host 没有其他运行终端，机器可用内存足以执行本 case。
    steps:
      - 逐个创建至 64 个并记录实际 PID，第 65 次创建确认 HOST_BUSY 或等价的明确容量错误。
      - 关闭其中一个后新建终端并确认可输入，其余 63 个进程及绑定未被替换；最后关闭全部专用终端。
  - id: WTLS-003
    name: Backend 重启后保持原 Host 和 PTY
    required: true
    description: 对独立实例执行 10 次正常 Backend 管理重启，终端持续运行，重连取得原进程输出，不重发未确认输入。
    preconditions:
      - 独立完整 Server 管理实例有持续输出的专用终端，记录 Host 与 PTY 的 PID 和创建身份。
    steps:
      - 每轮保存身份和输出游标，正常停止并启动独立 Backend 管理实例，重新获取状态及连接端点。
      - 确认服务健康、Host 与 PTY 身份未变，重新连接可见新输出且输入计数不重复。
  - id: WTLS-004
    name: Backend 异常退出后原进程可重新接管
    required: true
    description: 在独立实例强制退出 Backend 五次，原 Host 和 PTY 不被结束，新管理进程可接管并恢复输出。
    preconditions:
      - 独立完整 Server 的 Backend PID 已确认归属本 case，专用终端持续计数。
    steps:
      - 保存身份后仅强制结束独立 Backend，等待旧管理进程释放，再启动独立管理进程并重新取端点。
      - 每轮核对服务健康、Host 和 PTY 原 PID、快照与后续输入响应，不自动重放状态不明的输入。
  - id: WTLS-005
    name: Host 丢失遵守重建身份和输入边界
    required: true
    description: 独立 Host 故障后，原进程不能被声称保留；交互终端在相同终端记录下按合同重建，已退出终端不重建，一次性命令不自动重跑。
    preconditions:
      - 独立完整实例有交互 shell、一次性命令和已退出终端，已记录终端及会话身份。
    steps:
      - 仅强制结束本 case 的 Host，重启独立管理实例并重新取得状态与端点。
      - 核对交互终端 ID 保留但 Host 和会话身份改变，历史可读；一次性命令执行计数没有增加，已退出终端仍为历史。
  - id: WTLS-006
    name: 陈旧 writer 与错误身份持续拒绝
    required: true
    description: 连续 100 次 writer 接管与陈旧请求，旧代输入、缩放和关闭均被拒绝，只读连接不抢写权限。
    preconditions:
      - 独立 Host 有专用终端，两个写控制连接和只读连接均由本 case 管理。
    steps:
      - 循环接管并向旧代提交输入、缩放及关闭请求，确认明确拒绝且新代仍可用。
      - 使用错误会话身份、Host 身份及凭据分别请求，确认不操作目标进程且输出不泄漏凭据。
  - id: WTLS-007
    name: 控制或输出管道反复断开保持会话隔离
    required: true
    description: 各执行 100 次控制管道和单终端输出管道断开；控制管道不影响已建立输出，单终端管道不影响其他终端，均可重新接管原 PTY。
    preconditions:
      - 独立 Host 有两个持续输出终端和 Backend 实际托管连接，可准确区分控制与输出管道。
    steps:
      - 循环关闭控制管道并重新取得控制连接，确认两个终端输出保持且 PID 不变。
      - 循环关闭一个终端的输出管道并重新附着，确认该终端明确恢复，另一个终端不中断。
  - id: WTLS-008
    name: 持续混合负载资源保持有界
    required: true
    description: 连续 20 分钟运行 8 个终端，每个至少 16 KiB/s 输出，交错输入、重连和缩放；记录实际负载、内存、句柄、CPU 和响应延迟，不能以短时成功替代该时长。
    preconditions:
      - 独立实例已完成前述短时场景，资源采样和输出序号核对均已启动。
    steps:
      - 持续混合负载 20 分钟，每 5 秒记录资源，每分钟记录响应延迟和输出序号完整性。
      - 停止负载、关闭专用终端并等待 30 秒，比较预热后与结束前后的内存、句柄和连接数，解释保留窗口导致的有界增长。
      - 保存完整时间序列；若资源持续单调增长或服务失去响应，保留最小负载和现场并判失败。
  - id: WTLS-009
    name: 自然退出保留末尾输出并回收资源
    required: true
    description: 三轮累计 300 个程序自行退出，交替正常和非零退出码，末尾输出完整；退出后重复关闭不崩溃，预热后原生句柄不持续增长。
    preconditions:
      - 独立 Host 使用最终候选的原生模块，记录 PID、资源和发行身份。
    steps:
      - 每个程序写出至少 64 KiB 输出和唯一末尾标记后自行退出；核对退出码和退出后快照中的标记，再重复关闭两次。
      - 每轮 100 个程序后等待 10 秒，记录 Host 句柄、内存和保留会话数；核对探测 PID 全部退出，第三轮相对第一轮的句柄增长不超过 16。
