version: 1
name: NPM 服务端安装与生命周期验收
description: >
  验证独立 CLI 与 Server 的安装和生命周期合同，未执行的用例不表示行为通过。
  使用最终 npm tarball，在专属 macOS/Linux 测试机器及独立用户下逐条建立 fixture；
  不接管真实 Stable、不改用户已有配置，不依赖前一条用例的遗留状态。
  每条记录版本、平台、进程身份、命令回执并在结束后清理自己创建的服务与数据。
  原生目标分别执行，缺失环境记为未验证；格式校验不代表行为通过。
cases:
  - id: NPMSRV-001
    name: 干净安装产物不依赖仓库或 Electron
    required: true
    description: >
      在支持的目标系统上只凭 Node/npm 和发布产物安装完整服务组件，包内不存在开发机依赖。
    preconditions:
      - 已准备独立 CLI 包、Server 主包、匹配平台资源包及相应 npm 测试 registry；Server 与平台包版本一致。
      - 专属机器具有 Node 22 和 npm，没有项目源码、pnpm、Electron 或旧 Runweave 安装。
    steps:
      - 先单独安装 CLI 并确认 rw 原有命令可运行、server status 报未安装；再安装 Server，从任意非包目录运行 rw server doctor --json，确认原生依赖加载通过且 Server 不注册 rw。
      - 检查 npm pack 清单及安装文件，确认不存在 workspace 依赖、开发机绝对路径和密钥；确认安装没有自动启动或注册服务。
      - 在每个声明支持的平台与架构独立完成本用例并记录证据，未执行目标不得写为通过。
  - id: NPMSRV-002
    name: 不匹配或缺失的原生资源明确阻止启动
    required: true
    description: >
      不支持的 ABI、平台或者缺失平台资源包不能被当成完整安装，不在目标机器静默编译。
    preconditions:
      - 已建立本用例专属安装，可分别准备 Node ABI 不匹配和省略平台可选依赖的独立样本。
    steps:
      - 分别运行 doctor 和 start，确认报出平台、ABI 或缺失资源原因，并给出支持环境或安装指引。
      - 确认没有后台服务残留、没有写入业务数据库、没有触发工具链安装或源码编译。
  - id: NPMSRV-003
    name: 初始化保留配置且区分外部能力缺失
    required: true
    description: >
      init 创建唯一配置并保持重入安全，doctor 能区分服务可运行与终端、Agent 尚未就绪。
    preconditions:
      - 已在专属用户安装支持的包，尚无 Runweave 配置，tmux 和 Agent 工具未安装。
      - 已准备仅该用户可读的测试认证文件，不使用真实模型密钥。
    steps:
      - 执行非交互 init 并记录脱敏配置 revision；确认认证和数据路径在包目录之外，凭据没有出现在输出中。
      - 再次 init，确认不重置账号或覆盖已有配置；冲突输入明确拒绝。
      - 执行 doctor，确认自身组件可用、终端缺 tmux、Agent 未安装或未认证分别可辨，不把全部能力标为 ready。
  - id: NPMSRV-004
    name: 前台组件启动失败清理本轮资源
    required: true
    description: >
      前台启动在任一必需组件启动失败时退出并回收本轮已取得的组件、监听器和锁。
    preconditions:
      - 已初始化本用例专属安装，可占用测试 Backend 端口触发确定性启动失败。
    steps:
      - 占用配置端口后执行 rw server start，确认进程非零退出且报出准确失败组件。
      - 确认本轮 App Server、Backend 和数据库 worker 无残留，释放占用端口后同一安装可以正常前台启动。
      - 停止本用例创建的前台会话，确认资源释放，未停止任何非本用例进程。
  - id: NPMSRV-005
    name: 前台会话具备唯一所有者与明确退出行为
    required: true
    description: >
      前台运行不派生第二套服务，异常不会在前台自动重启，Ctrl-C 能关闭本轮组件。
    preconditions:
      - 已准备初始化完成且外部依赖满足的专属安装，每个退出分支可独立启动自己的前台 fixture。
    steps:
      - 启动服务并记录两个组件 PID 与健康；重复执行 start，确认返回已运行或明确冲突，原 PID 不变。
      - 正常分支向前台会话发送 Ctrl-C，确认该会话退出且其两个组件关闭。
      - 独立异常分支只终止该 fixture 的 Backend，确认前台报错退出并回收自身 App Server，没有自动重启循环。
  - id: NPMSRV-006
    name: 随包网页完成登录和真实终端交互
    required: true
    description: >
      安装态服务在同一入口提供网页、认证及终端 HTTP/WS，不能只以资源 HTTP 200 证明可用。
    preconditions:
      - 已启动专属安装态服务，tmux 可用，具有测试账号及临时项目目录。
      - 已准备可连接该服务的真实浏览器，远程访问时已满足页面 HTTPS 等运行条件。
    steps:
      - 使用 toolkit:playwright-cli 打开本次安装态地址，登录并创建临时项目终端。
      - 输入带唯一标记的 shell 命令，确认页面收到输出，刷新后同一终端仍可继续输入并返回结果。
      - 退出登录后访问受保护业务接口，确认未认证访问被拒绝；保存浏览器来源和实际交互证据。
  - id: NPMSRV-007
    name: 桌面连接现有协议下的安装态服务
    required: true
    description: >
      桌面端通过已有连接功能使用 NPM 服务，不依赖服务机器安装桌面应用。
    preconditions:
      - 专属服务机器只有本次 NPM 服务且已启动，另一台测试机器具有 Runweave 桌面端和有效测试账号。
      - 已取得正确的桌面浏览器自动化入口，连接地址与服务身份已确认。
    steps:
      - 使用 toolkit:playwright-cli 按桌面附着规则操作已有连接界面，添加本次服务并确认连接身份。
      - 在该连接内创建临时终端执行唯一标记命令，确认输出来自服务机器，断开再连接后会话仍可用。
      - 清理本用例添加的连接和测试资源，记录桌面版本及服务版本，不能使用本地内置后台结果代替。
  - id: NPMSRV-008
    name: 系统服务显式启停及注销保持单一所有权
    required: true
    description: >
      service install 注册并启动唯一服务，stop 保持停止，uninstall 保留用户数据。
    preconditions:
      - 专属系统用户已初始化安装，有注册系统服务所需权限，已写入一条可读测试项目记录。
    steps:
      - 执行 service install，读回系统任务、运行用户、绝对 Node 路径和 enabled 状态，确认两个组件健康。
      - 执行 stop 并等待超过自动重启间隔，确认组件保持停止；执行 start 后确认仅一组组件运行。
      - 执行 service uninstall，确认任务已注销、组件停止，原配置和测试项目数据仍存在。
  - id: NPMSRV-009
    name: 系统重启后后台服务无需用户登录即可启动
    required: true
    description: >
      开机启动具有真实重启证据，登录触发的用户任务不能冒充本行为。
    preconditions:
      - 使用允许重启的专属机器，已安装并启用本次系统服务，记录运行用户、数据身份及测试项目。
      - 具备重启后从外部检查服务的网络或管理通道。
    steps:
      - 重启专属机器，在服务用户未交互登录前从外部查询服务健康，确认两个组件已运行。
      - 核对启动用户、配置目录和测试项目，确认与重启前一致，并记录开机与健康时间。
  - id: NPMSRV-010
    name: 后台异常退出恢复且连续失败受限速
    required: true
    description: >
      系统托管能恢复异常组件，持续失败不会形成紧密重启循环，也不遗留另一组组件。
    preconditions:
      - 本用例专属安装已经系统托管，能对自己的组件施加退出和持续启动失败故障。
    steps:
      - 只终止本次 Backend PID，确认系统管理器启动新 PID，health 恢复且只有一组有效组件。
      - 在同一 fixture 注入持续启动失败，记录重试时间与次数，确认遵守已配置的重试间隔及频率限制，status 指出故障。
      - 撤销故障并显式恢复，确认服务可用且旧 worker 无残留，最后清理本次托管。
  - id: NPMSRV-011
    name: 服务重启保留 tmux 中真实运行的进程
    required: true
    description: >
      restart 改变服务 PID，但保留 tmux server、pane 与持续输出任务 PID，不只恢复同名会话。
    preconditions:
      - 已启动本用例专属服务并创建真实 tmux 终端，终端运行持续输出带时间标记的长任务。
      - 已记录 Backend、App Server、tmux server、pane 和任务 PID，不存在服务托管的后台执行。
    steps:
      - 执行 rw server restart，确认没有因普通 Agent 或 shell 任务拒绝重启。
      - 重新取得健康地址与连接，核对服务 PID 已更新、tmux 与任务 PID 不变，持续输出跨越重启时间且可继续输入。
      - 前台和系统托管模式分别使用独立 fixture 执行，最后仅清理各自持久 tmux。
  - id: NPMSRV-012
    name: 更新受影响任务检查与调度领取无竞争
    required: true
    description: >
      维护租约阻止检查后新增服务执行；真正运行的服务执行阻挡更新，普通 tmux 和纯持久化排队记录不阻挡。
    preconditions:
      - 已准备专属旧版安装和兼容新版产物，具有可观测领取边界的真实后台任务执行 fixture。
      - 同时存在一个普通 tmux 任务、一个服务托管长执行及一条尚未领取的持久化排队记录。
    steps:
      - 发起 update 并在维护租约取得期间触发调度，确认没有新的执行跨过暂停边界，更新只列出存活的服务执行并暂缓。
      - 确认拒绝更新后租约释放、调度恢复，旧版本和普通 tmux PID 未改变。
      - 在同一 fixture 结束服务执行、留下纯持久化等待记录后再次更新，确认等待记录本身不阻挡，记录在更新后仍可读。
  - id: NPMSRV-013
    name: 维护租约客户端丢失后自动恢复派发
    required: true
    description: >
      CLI 异常退出或不再续租不能让后台调度永久停止，其他调用方不能释放不属于自己的租约。
    preconditions:
      - 已启动专属服务，有可观测领取和完成的后台任务，具有本用例专属管理客户端。
    steps:
      - 申请租约并确认新任务暂停领取，使用错误 owner 尝试续租或释放，确认拒绝且原租约不变。
      - 结束租约客户端且不续租，等待超过租约期限，确认调度恢复并执行排队任务，原服务没有重启。
  - id: NPMSRV-014
    name: 强制更新准确结束受影响执行并保留 tmux
    required: true
    description: >
      force 只绕过任务保护，后台执行不伪报成功，普通 tmux 任务不被清理。
    preconditions:
      - 已准备专属旧版服务和兼容新版，正在运行一个可观察的服务托管任务及一个独立 tmux 长任务。
    steps:
      - 执行 update --force，确认回执列出受影响 run ID，正常关闭流程结束服务执行后才切换版本。
      - 新版启动后查询原 run，确认体现中断或取消及原因而非成功；确认 tmux 任务 PID 未改变且输出继续。
      - 核对 Backend 和 App Server 均来自新版，更新回执只有在两者健康后才成功。
  - id: NPMSRV-015
    name: Server 更新保留独立 CLI 与原运行模式
    required: true
    description: >
      Server 安装版本、active 指针与运行中版本可核对，更新不替换 CLI 的 rw，也不静默改变运行模式。
    preconditions:
      - 已准备可访问的旧新版产物，版本兼容，无受影响后台执行；每种运行模式使用独立专属安装。
    steps:
      - 先记录 CLI 所有者、版本和 rw 文件哈希；在前台和系统托管模式分别执行 Server update，确认旧 release 文件保持完整且 CLI 的路径、版本和哈希不变。
      - 重新读取 status、组件健康版本及 npm 安装版本，确认目标一致；前台仍受原前台会话控制，后台仍由原管理器控制。
      - 另在停止态 fixture 更新，确认安装与 active 版本更新，但不会凭空启动服务。
  - id: NPMSRV-016
    name: 更新预检失败不停止旧版
    required: true
    description: >
      下载失败、包完整性失败和数据兼容性拒绝均在停机前结束，不被 force 绕过。
    preconditions:
      - 专属旧版服务健康，已记录 PID、版本和数据身份，可提供损坏或声明不兼容的测试产物。
    steps:
      - 分别对不可下载、损坏和不兼容样本执行 update，包括 force 分支，确认明确拒绝且没有切换 current。
      - 核对旧服务 PID 与数据身份未变，业务查询仍可用，日志不包含凭据。
  - id: NPMSRV-017
    name: 新版启动失败可诊断并支持显式兼容版本恢复
    required: true
    description: >
      激活后的启动失败不伪报成功、不自动回退，指定兼容旧版可恢复同一份数据。
    preconditions:
      - 专属旧版已写入测试项目数据，具有兼容旧版产物及仅在激活后启动失败的新版 fixture。
    steps:
      - 执行更新至故障版本，确认回执 failed 且包含失败阶段、实际版本和诊断路径，不自动切回旧版。
      - 核对原数据仍存在，执行 update --version 指定兼容旧版，重新取得健康连接并读回原测试项目。
      - 确认恢复回执反映实际版本，旧失败回执仍可用于诊断。
  - id: NPMSRV-018
    name: 服务管理权限不因普通登录而开放
    required: true
    description: >
      维护接口仅允许本机管理身份，普通网页凭据或远程请求不能冻结调度或取得系统服务管理权限。
    preconditions:
      - 专属安装已启用管理路由，具备本机管理身份、普通网页登录凭据及独立远程测试客户端。
    steps:
      - 使用未认证、普通登录 token 及远程来源分别请求维护接口，确认拒绝且调度状态未改变。
      - 使用本机管理身份申请并释放租约，确认成功；检查输出与日志未泄漏管理令牌。
  - id: NPMSRV-019
    name: 中断更新可以对账且不会并发修改安装态
    required: true
    description: >
      更新管理锁禁止同时操作，helper 中断后状态可解释，下一次显式更新可恢复而不误判成功。
    preconditions:
      - 已准备专属旧版安装和兼容新版，能够观察 staging、installing、activating 回执并只终止本 fixture helper。
    steps:
      - 启动一次更新时并发执行第二次更新，确认第二次返回忙，不另行修改 npm 安装或 current。
      - 分别在关键阶段用独立 fixture 中断 helper，再运行 status，确认真实进程和安装版本与未完成回执被准确呈现。
      - 显式重试更新，确认可以完成或给出明确恢复指引，不损坏用户数据、不遗留永久锁、不自动清理 tmux。

  - id: NPMSRV-020
    name: 源码产物和 NPM 通过同一安装记录交替激活
    required: true
    description: >
      切换 Server 来源始终通过同一任务保护和重启流程，保留同一数据目录、CLI 与前台会话。
    preconditions:
      - 已在本用例专属环境安装独立 CLI 和旧版 Server，初始化测试数据并启动前台服务。
      - 具有数据合同兼容的源码构建 package 及相邻平台包，以及可从测试 registry 下载的另一 Server 版本。
    steps:
      - 记录 CLI 路径和文件哈希、前台 owner、数据目录与测试项目；执行 rw server update --server-package 指向源码 package 的绝对路径。
      - 重新取得健康连接和 status，确认源码版本激活、installation.json 指向该包，原前台 owner、CLI 和测试数据保留。
      - 执行 rw server update --version 指向 registry 版本，再取新健康连接，确认同一实例切回 NPM 来源且 CLI 路径和文件哈希不变。
