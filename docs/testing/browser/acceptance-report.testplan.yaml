version: 1
name: 可视化验收报告生成与阅读
description: >
  验证 acceptance 的版本兼容、验收项与证据边界、Runweave 交付预检和手机阅读。
  生成成功、作者自检、用户验收确认及真实设备可达分别记录，不相互替代。

cases:
  - id: ARP-001
    name: 旧版材料重建且原始证据不变
    required: true
    description: >
      v1 输入仍可生成并由本地服务读取，旧成果不覆盖，素材原字节与来源不丢失。
    preconditions:
      - 已有一份明确允许复用的 v1 报告及其素材，且已准备新的独立输出目录。
    steps:
      - 用当前 gallery.py validate 与 build 处理 v1 输入，确认成功且输出未自动补出通过结论。
      - 逐项比较输入与输出素材 SHA-256，确认原图、文字和来源保留，再次向同一目录 build 应拒绝覆盖。
      - 用当前 serve 打开重建成果，核对 index、reader.css、report.css、viewer.css、reader.js 与素材均可读取，未列入清单或越界路径不能访问。

  - id: ARP-002
    name: 验收项只接受自洽状态和有效证据引用
    required: true
    description: >
      v2 支持明确标准、实际观察和真实或 Mock 执行结果，拒绝无证据通过及错误关联。
    preconditions:
      - 已准备明确标识用途的输入，包含 observed、insufficient、not-run 证据页和不同自检结果。
    steps:
      - 校验并生成包含实际通过、Mock 通过、失败、阻塞和未执行项的合法 v2 输入，确认 execution 与 outcome 原样保留。
      - 分别传入未知版本或字段、重复验收项 ID、不存在或重复的 pageIds，确认失败并指出位置。
      - 分别将未执行项标 pass、将 pass 关联 insufficient 或 not-run 页、令 pass 或 fail 没有 observed 页，确认校验拒绝。
      - 生成没有素材及页面、只有未执行或阻塞项的报告，确认不要求制造证据文件。

  - id: ARP-003
    name: 交付预检拒绝不可预览的成果
    required: true
    description: >
      默认构建检查生成后真实字节，离线模式明确告知限制，申请票据前再次预检。
    preconditions:
      - 可使用独立临时目录构造明确标为 synthetic 的文本或图片边界输入，不将其作为产品证据。
    steps:
      - 生成 HTML 不超过 1 MiB 且各资源不超过 5 MiB 的成果，确认 deliveryCheck.ready 为 true。
      - 使用合法素材令 HTML 超过 1 MiB，或单张图片超过 5 MiB；默认 build 应失败，指出文件及限制，并不留下最终目录或构建锁。
      - 用新目录及 --target portable 构建同一输入，确认输出保留原字节且 deliveryCheck.ready 为 false；preflight 返回非零及对应问题。
      - 对不可交付成果调用 preview.py 并指定不存在的连接配置，确认先报告本地预检问题，不读取凭据、不申请票据；普通超限 HTML 同样被拒绝。
      - 对复制的成果移除清单内文件或令资源符号链接逃逸，确认 preflight 拒绝，而不是只检查 HTML 本体。

  - id: ARP-004
    name: 总览突出缺口且证据跳转和返回可用
    required: true
    description: >
      用户能先看自检结论、执行方式和限制，再核对证据；无图的阻塞不会隐藏。
    preconditions:
      - 已用当前模板生成包含不同结果与多页证据的 v2 报告，并可通过真实入口打开。
      - 已按 toolkit:playwright-cli 解析并附着正确 Runweave 桌面 Profile，保留用户既有标签页。
    steps:
      - 打开报告，确认 scope、关键限制和总览可见；失败、阻塞、未执行先于通过项且默认展开，明确标注自检不代表用户确认。
      - 展开通过项，确认预期、实际、实际或 Mock 执行标签及证据页一致；点击证据链接、返回总览，再翻页与刷新，确认定位和焦点正确。
      - 打开只有未执行项且没有页面的报告，确认总览完整可读、不显示空翻页控件且无脚本错误。
      - 打开旧版重建报告，确认提示缺少结构化验收项但仍能阅读原页，不产生虚假的总通过结果。

  - id: ARP-005
    name: 摘要和原文在窄屏可读且不重复铺开
    required: true
    description: >
      正常正文承载摘要，原文和来源可追溯；手机适配与实际设备验证分别报告。
    preconditions:
      - 当前报告包含文字摘要、长原文、原图、对比图及局部取景，且已附着正确桌面 Browser。
    steps:
      - 在桌面及 390px 窄屏实际阅读报告，确认摘要为正常正文、不出现摘要内部滚动或页面横向溢出；来源区不重复显示同一全文。
      - 点击打开原文，核对完整内容未被摘要替换或截断；关闭后回到原页和触发控件。
      - 打开原图、切换实际尺寸和适应屏幕后关闭；确认对比图窄屏单列、关键图中文字能辨认，不能辨认时记录取景缺口。
      - 检查全部展开、分页恢复与打印预览，确认验收项标题和关键限制没有遗漏，控制台无新增错误。
      - 如未连接真实手机，明确只完成浏览器窄屏验证，不声称 Safari、跨设备网络或真机阅读通过。
