version: 1
name: 经验学习来源采集
description: 验证 Pi 双通道状态与 Activity 内容独立去重，空输出仍能进入完整学习事实，验证长文本完整分段、恢复和证据复核，资源不足时明确报告。
cases:
  - id: EXPLEARN-001
    name: Pi 状态去重不丢失本轮提问
    required: true
    description: 先到达 App Server 的状态与后到达直连入口的内容属于同一 Pi 事件时，内容保存一次，终端状态不重复改变；反向顺序也成立。
    preconditions:
      - 使用独占临时目录中的真实持久会话管理器、Activity SQLite worker 和已认证 HTTP hook 路由。
      - 创建运行中的 Pi 会话及合法 sessionId、instanceId、sequence，使用真实 App Server handler 消费受控 hook 输入。
    steps:
      - 先由 App Server handler 接收 UserPromptSubmit，再经 HTTP 发送相同 Pi 上下文及 query；确认 Activity 有一条用户提问且状态保持不变。
      - 重复同一 activityEventId；确认提问未重复；以新 sequence 先发送 HTTP 再调用 App Server handler，确认正常保存新事件。
      - 分别发送错误 token、错误 panel、同 sequence 不同 runId 和过期 sequence；确认不新增 Activity，也不回退状态。
      - 关闭 HTTP 与 SQLite worker，释放本次会话存储并删除独占目录。
  - id: EXPLEARN-002
    name: 空工具输出仍为有效来源
    required: true
    description: 已保存的空字符串工具输出属于有效来源，不能误报来源丢失，也不能单独证明功能成功。
    preconditions:
      - 独占 Activity 数据库中存在本轮用户提问、匹配工具请求与空字符串结果；Stop 经 App Server 与 HTTP 双通道送达。
      - 所有事实的终端、线程、面板及通道一致，读取使用完成时快照。
    steps:
      - 调用真实学习来源读取器；确认按顺序返回用户提问、工具请求、空字符串结果及回复，不出现 experience_source_unavailable 或边界丢失。
      - 关闭并删除本次独占存储；验收数据不进入 production。
  - id: EXPLEARN-003
    name: 大文本分段保留完整原文
    required: true
    description: 单条超过 40000 字节、整轮超过 160000 字节的来源在资源预算内完整读出，中文与 emoji 不被切坏。
    preconditions:
      - 使用独占真实 Activity 数据库，建立提问和匹配的工具请求与结果，结果包含约 190 KB 的中文和 emoji。
    steps:
      - 读取完成快照并分段；确认拼接各段文本与原文完全一致，每段不超过 6000 字节。
      - 核对分段的源事件 ID、脱敏原文哈希和 UTF-16 起止位置；确认能够定位对应原文。
      - 关闭并删除独占存储。
  - id: EXPLEARN-004
    name: 未完成与格式错误不能冒充完成
    required: true
    description: 不完整摘要不缓存为成功；中途失败后重建分析器，只重做未完成部分。
    preconditions:
      - 独占经验 SQLite 队列中有至少四段的任务；使用受控模型返回不完整摘要，并让另一段连续两次返回无效 JSON。
    steps:
      - 执行任务；确认不完整摘要明确失败，无效 JSON 最多即时重试一次后失败，均未晋级候选。
      - 重试任务并重新创建队列与分析器，随后返回完整内容；确认成功分段只调用一次，失败分段被重新处理。
      - 任务完成后清理检查点；使用旧执行凭据写入检查点，确认被拒绝；关闭并删除独占存储。
  - id: EXPLEARN-005
    name: 取回原文且逐段检查后续反证
    required: true
    description: 摘要只用于定位证据；早期看似成功而末尾失败的任务不能生成被采纳的成功经验。
    preconditions:
      - 在独占存储中建立包含早期工具请求与结果、末尾反证的长任务；受控模型先生成成功候选，再按各段原文返回复核结论。
    steps:
      - 检查提炼输入；确认包含按索引取回的原始工具请求和结果，而不只有摘要。
      - 分批完成逐段原文复核；确认末尾反证导致候选被拒绝，正式经验记录没有增加。
      - 检查归档证据能够追溯原文，每份摘录低于 64 KiB；关闭并删除独占存储。
  - id: EXPLEARN-006
    name: 长任务分批让出队列
    required: true
    description: 长任务每批至多新增两次分段阶段调用，尚未完成时回到队列，允许其他等待任务先执行。
    preconditions:
      - 使用独占经验队列和至少四段的任务，受控模型能够返回合法内容。
    steps:
      - 执行一批后确认任务仍为 queued，原因明确标记部分完成和阶段进度。
      - 放入等待时间更长的另一个任务并领取；确认先取得另一个任务，再恢复长任务。
      - 完成并清理独占存储。
  - id: EXPLEARN-007
    name: 超出预算明确失败
    required: true
    description: 超出源文本、分段数量或模型输入预算时，任务不被记作完整成功或没有经验。
    preconditions:
      - 准备独占来源和队列，分别使用超过 4 MiB 的文本、超过 64 段的事实，以及超过 600000 字节的模型输入。
    steps:
      - 分别执行读取、分段和分析入口；确认返回对应 experience_partial 预算错误，而不产生被采纳的经验。
      - 确认没有静默截断文本，未通过预算检查的模型调用没有发出；关闭并删除独占存储。
