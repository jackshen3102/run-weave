version: 1
name: 随记 M1 服务数据与身份
description: >
  待实现能力的验收合同，不表示当前功能已存在。使用真实随记进程、专用 PostgreSQL 与附件目录，
  验证单所有者身份、记录事务、幂等和文件边界。每条使用独立样例和操作键；
  只在执行者拥有的隔离环境注入故障。证据脱敏，不记录密码、token 或个人正文。

cases:
  - id: SUIJISVC-001
    name: 唯一所有者通过登录取得可验证的身份
    required: true
    description: >
      登录校验凭据并限制连续失败，身份由服务颁发；不存在公开注册入口。
    preconditions:
      - 独立随记服务和专用数据库已启动，唯一所有者已初始化，执行上下文提供受保护的凭据。
      - 已记录该测试部署的 serverId、ownerId 和实际登录限流配置。
    steps:
      - 使用正确凭据登录并调用 verify 和 info；确认 ownerId/serverId 一致，info 返回协议版本与限额。
      - 提交错误密码直至配置阈值；确认先返回认证失败，再返回带 Retry-After 的限流结果，不能取得 token。
      - 更换自行伪造的转发 IP 头再尝试；确认不能绕过该部署的可信代理与限流策略。
      - 请求公开注册入口；确认不能创建第二个账号，数据库唯一所有者未改变；保留脱敏状态码证据。

  - id: SUIJISVC-002
    name: 刷新与退出只影响对应登录会话
    required: true
    description: >
      refresh 轮换凭据，logout 撤销当前 session，另一个有效登录会话仍可使用。
    preconditions:
      - 专用服务提供同一所有者的两个独立登录会话 A 和 B，实际凭据只存执行环境。
      - 执行者能通过受保护的服务会话查询核对哈希存储，不向证据输出 token。
    steps:
      - 使用 A 的 refresh 换取新凭据；确认新凭据可 verify，旧 refresh 不能再次刷新。
      - 退出 A；确认 A 的新 access 和 refresh 均不能继续访问或刷新，B 仍可读取 info。
      - 核对持久化会话字段；确认只有 token 哈希和期限等元数据，没有明文 token。

  - id: SUIJISVC-003
    name: 数据访问只能使用当前认证所有者
    required: true
    description: >
      记录、info、上传与附件下载都受认证保护，客户端不能指定 owner 或访问未知对象。
    preconditions:
      - 专用服务内存在本例创建的记录与附件，执行上下文提供有效会话及不存在的 UUID。
    steps:
      - 无 token 和失效 token 分别访问 info、列表、记录详情、上传与附件内容；确认均为 401 且无私有内容。
      - 使用有效会话读取未知记录与附件 ID；确认返回 404，不泄漏路径或内部查询信息。
      - 在新建或编辑请求中指定 ownerId、createdVia 或服务端时间字段；确认严格拒绝，原有记录和所有者未改变。
      - 查看本例请求的脱敏日志；确认未记录凭据、正文和附件内容。

  - id: SUIJISVC-004
    name: 创建与读取保留原始正文和明确类型
    required: true
    description: >
      笔记和待办都保留完整输入，创建时确定类型和初始状态，不自动摘要或提取标签。
    preconditions:
      - 专用服务和有效会话可用，本例有全新的操作键和包含空格、换行、中文、组合字符及 URL 的样例正文。
    steps:
      - 用不同新键创建 note 和 task；确认返回不同 UUID、version 1、创建来源 app，状态分别为 null 与 open。
      - GET 读取两条记录并比较 Unicode 标量序列；确认正文原样保留，时间为可解析的 UTC 时间。
      - 查看专用数据库版本快照；确认每条恰有版本 1 且内容对应，不存在自动抓取的链接正文。

  - id: SUIJISVC-005
    name: 输入限额与整体非空规则在写入前生效
    required: true
    description: >
      拒绝无内容或超限输入而不截断；纯附件记录可以保存，保留合法正文的空白。
    preconditions:
      - 专用服务返回实际正文限额，本例有一个已上传且未绑定的合法附件。
      - 每次请求使用独立新键，能够查询本例记录与快照数量。
    steps:
      - 提交空字符串和纯空白且附件为空的记录；确认输入错误且没有记录或快照。
      - 提交含 NUL、不合法 Unicode、超出标量上限或未知 kind 的请求；确认明确拒绝，没有截断后的成功记录。
      - 提交恰好达到标量上限的合法正文；确认原样保存，计数不因 emoji 的 UTF-16 长度发生偏差。
      - 以空正文关联本例附件创建记录；确认成功；随后尝试把其正文和附件同时清空，确认拒绝且原版本保留。

  - id: SUIJISVC-006
    name: 待办完成可撤销且不再做保持终态
    required: true
    description: >
      状态机允许 open 到 done 或 archived，以及 done 回到 open；不允许笔记变成待办、archived 恢复或 done 与 archived 互转。
    preconditions:
      - 专用服务中本例已创建两个 open 待办和一条笔记，记录当前版本。
      - 各次状态请求使用新键和请求前读取的版本，避免把版本冲突误判为状态机拒绝。
    steps:
      - 分别把两个 open 待办改为 done 与 archived；确认成功，各递增一次版本并留下完整快照。
      - 将 done 用新键和当前版本恢复为 open；确认 ID、正文、附件、createdAt 保留，版本仅增加一次；同键原样重放仍返回相同结果，独立 GET 版本不再增加。
      - 再次完成该待办；分别对 done 请求 archived 或 done，对 archived 请求 open、done 或 archived；确认非法转换被拒绝且版本不变。
      - 对笔记调用状态接口或尝试通过普通 PATCH 改 kind/status；确认拒绝，笔记仍为 note 且状态 null。

  - id: SUIJISVC-007
    name: 一次编辑原子替换正文与附件并保留记录身份
    required: true
    description: >
      一个 PATCH 同时保存正文和附件，ID、类型、创建时间和待办状态不变；省略字段保持原值。
    preconditions:
      - 本例有已完成待办、现有附件和一个新的未绑定附件，已记录 ID、创建时间、正文与版本。
    steps:
      - 在一个 PATCH 中提供新正文和新 attachmentIds；确认两者同时可读，version 增一，创建时间、类型和 done 状态不变。
      - 仅 PATCH body；确认附件保持；再在非空正文下显式传空附件数组，确认当前关联清空。
      - 使用新键提交与当前值完全相同的编辑；确认成功但不增加版本、更新时间或快照。

  - id: SUIJISVC-008
    name: 两个客户端编辑同一版本时只有一个提交
    required: true
    description: >
      乐观版本检查阻止旧编辑覆盖新内容；失败者获得可比较的当前版本。
    preconditions:
      - 本例有一条专用记录，两个独立认证 HTTP 客户端已读取同一版本。
      - 两个客户端使用不同操作键和可区分的正文，不依赖真实 MCP 实现。
    steps:
      - 同时发送基于该版本的两个 PATCH；确认恰有一个成功，另一个返回 VERSION_CONFLICT 和 currentVersion。
      - 从第三次 GET 与数据库核对；确认正文属于成功者，只新增一次版本和快照，不存在失败者的半提交。

  - id: SUIJISVC-009
    name: 已成功操作的顺序重试返回原结果
    required: true
    description: >
      相同键和请求重放不会再次新建、递增版本或重复改待办状态。
    preconditions:
      - 专用服务可用，本例为创建、编辑和状态改变分别准备独立操作键及合法初始记录。
    steps:
      - 各完成一次创建、编辑和状态改变，记录响应、ID、版本与更新时间。
      - 分别原样重发对应请求两次；确认返回原成功结果，包括已不再满足原 expectedVersion 的编辑和状态操作。
      - 查询记录、快照及幂等结果；确认每个逻辑操作只产生一次副作用。

  - id: SUIJISVC-010
    name: 同一幂等键并发到达时只执行一次
    required: true
    description: >
      数据库唯一约束和事务等待正确处理正在执行的相同意图，不留下永久 processing 占位。
    preconditions:
      - 专用服务可用，本例准备一个全新创建键和完全相同的两个请求。
      - 执行者可在专用数据库短暂持有受控锁，使两次请求确实重叠，并在本例结束释放该锁。
    steps:
      - 在受控重叠窗口发送两个相同请求后释放锁；确认最终均取得同一个记录结果，或可用原键手动重试取得该结果。
      - 查询数据库；确认只有一条记录、一个版本快照及一个完成结果，没有永久占位或重复记录。

  - id: SUIJISVC-011
    name: 提交成功但响应丢失后重试仍返回同一记录
    required: true
    description: >
      以真实已提交数据证明响应丢失不产生第二次创建，不能用请求根本没到服务器代替。
    preconditions:
      - 专用服务前有执行者控制的故障代理，仅本例请求经过代理。
      - 本例新建请求使用全新键，代理能在收到上游成功响应后丢弃下行响应。
    steps:
      - 发送创建请求并丢弃成功响应；确认客户端超时，同时数据库已有对应已提交记录和幂等结果。
      - 关闭本例故障，手动原样重发；确认返回原 ID 和版本，数据库仍只有一条记录。
      - 撤销本例代理规则并保存脱敏请求键摘要、提交证据与最终响应。

  - id: SUIJISVC-012
    name: 相同幂等键不能被用于不同意图
    required: true
    description: >
      操作、目标、版本和 payload 都参与请求身份，键冲突不能产生新的副作用。
    preconditions:
      - 本例已完成一条带全新键的创建请求，并记录其原结果。
    steps:
      - 沿用原键更改正文后创建；确认 IDEMPOTENCY_KEY_REUSED，不生成第二条记录。
      - 将原键用于编辑或另一目标操作；确认相同错误，所有相关记录版本不变。
      - 再原样重放最初创建；确认仍能取得原结果，错误请求没有污染成功结果。

  - id: SUIJISVC-013
    name: 相同正文使用不同键可以形成独立记录
    required: true
    description: >
      幂等针对请求意图，不按正文去重，用户可以重复记录同一件事。
    preconditions:
      - 专用服务可用，本例准备两个全新操作键和完全相同的待办正文。
    steps:
      - 分别使用两个键创建待办；确认两个不同 ID，均为 open 和 version 1。
      - 完成其中一个后读取另一个；确认后者仍为 open，不存在共享状态或自动关联。

  - id: SUIJISVC-014
    name: 事务中途失败不会留下部分记录版本
    required: true
    description: >
      记录、附件关联、快照和幂等结果同成同败，恢复后可使用同一键重试。
    preconditions:
      - 仅限本例专用数据库；已有记录和可替换附件，已保存完整基线。
      - 执行者可临时撤销 API 数据库角色对快照表的 INSERT 权限，使更新后快照写入失败；迁移角色不受影响。
    steps:
      - 撤销指定权限并提交包含正文和附件替换的 PATCH；确认失败，不返回已保存。
      - 用只读管理连接核对基线；确认正文、版本、当前附件和快照全部不变，没有已完成幂等结果。
      - 恢复本例撤销的权限，原键原请求手动重试；确认完整提交一次，清除本例故障设置。

  - id: SUIJISVC-015
    name: 分页固定创建顺序且游标不能跨过滤条件使用
    required: true
    description: >
      创建时间和 ID 决定稳定顺序，编辑不置顶，翻页不混入不匹配条件的记录。
    preconditions:
      - 本例隔离数据集超过两页，包含 note、open、done、archived 及相同创建时间的受控样例。
      - 已记录该数据集按创建时间和 ID 倒序的期望顺序，使用独立时间范围隔离其他数据。
    steps:
      - 以小 limit 读取首屏并保留 cursor，编辑旧记录后继续翻页；确认没有重复或缺失，旧记录未置顶。
      - 使用 kind/taskStatus 和创建时间区间分别查询；确认全部流保留终态，open 查询仅返回未完成，时间区间为左闭右开。
      - 把原 cursor 用到不同过滤条件；确认 400，不能悄悄返回另一集合。

  - id: SUIJISVC-016
    name: 关键词按当前正文的字面内容搜索
    required: true
    description: >
      中文、URL、百分号、下划线和反斜线都按实际字符匹配，附件和历史正文不混入结果。
    preconditions:
      - 本例创建互相可区分的当前正文样例，另有只在附件或旧版本出现关键词的样例。
    steps:
      - 分别查询中文、完整 URL 片段、百分号、下划线和反斜线；确认返回的 ID 与本例字面匹配集合完全相同。
      - 搜索只存在附件或旧版本的词；确认不返回这些记录，不请求 URL 指向的服务器。

  - id: SUIJISVC-017
    name: 上传验证实际类型和字节限额
    required: true
    description: >
      服务只接受实际 JPEG、PNG 与合法 UTF-8 Markdown，不依赖扩展名或客户端声明，不截断文件。
    preconditions:
      - 专用服务、独立附件目录和认证会话可用，info 已返回当前附件字节上限。
      - 本例有合法图片、Markdown、伪装图片、无效 UTF-8、HEIC 原文件及超过上限的文件，记录各自校验和。
    steps:
      - 分别上传合法类型并鉴权下载；确认类型、byteSize 与原字节校验和一致。
      - 上传伪装类型、无效 UTF-8、原始 HEIC 及超限文件；确认明确拒绝，超限为 413，没有可成功关联的就绪附件。
      - 使用带目录穿越的文件名上传合法文件；确认对象仍只位于受控根目录，响应没有主机路径，下载不执行 Markdown 的 HTML。

  - id: SUIJISVC-018
    name: 附件上传重试不会生成第二个逻辑附件
    required: true
    description: >
      附件上传以同一键和同一文件内容重试时返回相同附件 ID，不因 multipart 边界变化被判成新意图。
    preconditions:
      - 本例有合法文件、全新上传键和仅供本例使用的专用存储目录。
    steps:
      - 上传文件并记录附件 ID；用同一键及相同文件内容重新构造 multipart 请求发送，确认返回原 ID。
      - 用原键上传不同内容；确认键复用错误，不覆盖原文件。
      - 查询元数据和下载校验和；确认只有一个逻辑附件且内容未改变。

  - id: SUIJISVC-019
    name: 移除附件关联保留历史对象并拒绝跨记录复用
    required: true
    description: >
      当前附件、历史引用和不可变对象有明确关系；移除关联不物理删除，也不能偷用另一记录的附件。
    preconditions:
      - 本例已有带图片和 Markdown 的非空正文记录 A、另一记录 B，已记录附件 ID、文件校验和及版本快照。
    steps:
      - 尝试在 B 中关联 A 的附件；确认拒绝，A/B 和文件都未改变。
      - 编辑 A 移除当前附件关联；确认当前详情不再列出附件，历史快照保留原引用，存储文件校验和未改变。
      - 核对服务没有因本例移除操作发起删除或后台清理；保留当前关联、历史引用及文件存在证据。

  - id: SUIJISVC-020
    name: 文件落盘失败不会产生可关联的空附件
    required: true
    description: >
      上传必须先有完整不可变文件再登记就绪元数据，磁盘故障不能导致记录引用不存在的文件。
    preconditions:
      - 仅限本例专用服务，附件根目录使用可安全切换写权限的隔离挂载；已有文件均有基线校验和。
      - 本例准备新上传键和合法文件，执行者能恢复该挂载原权限。
    steps:
      - 使新文件写入失败后提交上传；确认明确失败，数据库没有该请求的可关联就绪附件。
      - 恢复原权限后使用同一键和文件重试；确认成功，鉴权下载校验和正确。
      - 核对原有附件未受影响并清除故障设置；允许记录失败遗留文件，但不能出现成功引用缺失对象。
