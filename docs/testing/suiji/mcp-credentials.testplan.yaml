version: 1
name: 随记多设备 MCP 凭据
description: >
  验证多凭据实现。每例使用自有隔离 PostgreSQL、服务与客户端，
  不修改生产配置或真实用户记录；凭据只通过受保护文件传递，证据脱敏。
cases:
  - id: SUIJICRED-001
    name: "旧摘要导入保留原 token"
    required: true
    description: "迁移只登记原摘要和原期限，不要求原文且不使原客户端失效。"
    preconditions:
      - "本例拥有独立 schema 5 服务、旧 token 客户端、受保护旧摘要配置及可迁移数据库。"
    steps:
      - "用旧 token 读取服务身份，记录 ID 与期限；停本例 API，迁移后导入原摘要与期限，移除旧配置并开启新开关，启动新版。"
      - "重新取得本例服务地址并用同一旧 token 读取；确认身份相同、鉴权通过，凭据原期限未延长，服务端未保存原文。"
  - id: SUIJICRED-002
    name: "两台设备独立访问同一 owner"
    required: true
    description: "新增凭据不替换已有凭据，MCP 和上传使用同一认证边界。"
    preconditions:
      - "本例新版服务已开启 MCP，独立客户端 A 已登记，拥有可绑定附件的专用测试记录。"
    steps:
      - "本地生成并登记 B，仅传 registration.json；确认服务进程启动时间未改变。"
      - "分别用 A、B 初始化并读取专用记录，以及向 /mcp/uploads 上传合法 Markdown；确认都成功且 owner 相同。"
  - id: SUIJICRED-003
    name: "撤销只影响目标凭据"
    required: true
    description: "撤销提交后目标凭据的新请求均拒绝，其余设备和 App 会话继续有效。"
    preconditions:
      - "本例独立服务登记 A 和 B，二者均已认证，另有有效 App 会话和专用记录。"
    steps:
      - "撤销 A 后重新发起 A 的读取及上传；确认均为 401，上传无新副作用。"
      - "用 B 读取和上传、App 会话读取 info；确认均成功；重复撤销 A 成功且 revokedAt 不变。"
  - id: SUIJICRED-004
    name: "到期凭据独立失效"
    required: true
    description: "到期边界按数据库时间判断，不因曾初始化而延续。"
    preconditions:
      - "本例服务拥有即将到期的 A、长期有效的 B，两者各自持有 token，不修改系统时钟。"
    steps:
      - "到期前认证 A；等待 expiresAt 后再次请求读取及上传，确认 A 均 401，B 仍成功。"
      - "列举凭据确认 A 为 expired，鉴权过程没有延长期限。"
  - id: SUIJICRED-005
    name: "登记幂等且冲突不覆盖"
    required: true
    description: "唯一 ID 和摘要只对应同一份登记意图，重放不能修改或复活凭据。"
    preconditions:
      - "本例隔离服务与管理员入口可用，已生成一个稳定 ID 的受保护登记文件。"
    steps:
      - "并发提交相同登记文件；确认只有一条记录，重复提交返回 created:false。"
      - "分别保持 ID 改名称或摘要、保持摘要换 ID；确认 CREDENTIAL_CONFLICT 且原字段不变。"
      - "撤销后重放原登记；确认 CREDENTIAL_INACTIVE，原 token 仍 401；以本例独立已过期记录重复验证不可复活。"
  - id: SUIJICRED-006
    name: "登记输入绑定真实服务身份"
    required: true
    description: "错误输入在任何数据库写入前被拒绝。"
    preconditions:
      - "本例隔离服务有确定 serverId 和 ownerId，管理员可查询本例凭据数量。"
    steps:
      - "分别提交错误 serverId、错误 ownerId、未知字段、无效摘要、空名称、超长名称、过期或超过 365 天期限；确认身份错误返回 IDENTITY_MISMATCH，其余 INVALID_INPUT，非零退出且数量不变。"
  - id: SUIJICRED-007
    name: "重启不恢复已撤销旧凭据"
    required: true
    description: "旧摘要导入幂等且不会覆盖撤销墓碑，服务重启也不重新信任旧配置。"
    preconditions:
      - "本例独立服务已导入旧凭据 A 并撤销，B 有效；保留 A 的原摘要导入文件，执行者拥有本例进程。"
    steps:
      - "重复导入 A，确认 revokedAt 保持不变；重启本例服务并重新取得地址，确认 A 为 401、B 可用。"
      - "检查表中 A 只有一条记录，没有因重复导入增加期限或新有效条目。"
  - id: SUIJICRED-008
    name: "开关关闭优先于有效凭据"
    required: true
    description: "全局关闭只控制 MCP 入口，不使 App 服务不可用。"
    preconditions:
      - "本例独立服务数据库已有有效凭据，配置 SUIJI_MCP_ENABLED=false，并持有 App 会话。"
    steps:
      - "分别请求 MCP 和上传，确认 404 MCP_DISABLED；App 读取 info 成功。"
  - id: SUIJICRED-009
    name: "最近使用元数据不暴露秘密"
    required: true
    description: "成功认证更新时间，失败认证不更新；列表不返回原文或摘要。"
    preconditions:
      - "本例独立服务 A 的 lastUsedAt 为空，B 已撤销，具备只读取证连接。"
    steps:
      - "用 A 成功认证并列举；确认 lastUsedAt 非空；一分钟内再次认证，确认不要求每次写库，时间不倒退。"
      - "用 B 和错误 token 认证后列举；确认失败凭据时间不变，输出及日志没有原文或摘要。"
  - id: SUIJICRED-010
    name: "数据库故障时鉴权拒绝放行"
    required: true
    description: "鉴权数据库不可用不回退旧环境摘要，也不处理业务或上传。"
    preconditions:
      - "本例独立服务已开启 MCP，有有效 token，执行者可仅阻断本例 API 的数据库连接并恢复。"
    steps:
      - "阻断本例数据库连接后用有效 token 请求 MCP 和上传；确认通用 503、不含连接信息且无业务写入；恢复本例连接。"
  - id: SUIJICRED-011
    name: "备份恢复保留撤销状态"
    required: true
    description: "同一备份点的凭据状态完整恢复，恢复默认不开放 MCP。"
    preconditions:
      - "本例独立源数据库含有效 A、已撤销 B、已过期 C，以及记录和跟进；有空的隔离恢复目标和独立备份目录。"
    steps:
      - "在静止窗口备份并恢复到空目标，确认凭据数量及稳定字段校验摘要一致，B 的 revokedAt 未消失，所有原文 token 均不在备份内。"
      - "取得恢复目标地址，确认 MCP 默认 404；仅对隔离目标显式开启后验证 A 成功、B/C 为 401，业务记录和跟进完整。"
  - id: SUIJICRED-012
    name: "客户端凭据加载不覆盖其他设备"
    required: true
    description: "显式 env-file 只加载本机凭据，拒绝冲突和不安全文件权限。"
    preconditions:
      - "本例有隔离 HTTPS 随记服务、本机受保护配置和新设备独立 token，另一客户端已配置自己的有效 token。"
    steps:
      - "以 0600 env-file 调用随记脚本 info 并核对身份；确认成功且无 token 输出，另一客户端仍可访问。"
      - "分别使用权限过宽的文件，以及 env-file 与环境变量 token 冲突；确认在联网前拒绝，未改写原文件或其他客户端配置。"
  - id: SUIJICRED-013
    name: "撤销前在途请求的边界明确"
    required: true
    description: "撤销阻止后续鉴权，不承诺取消已通过鉴权的在途请求。"
    preconditions:
      - "本例独立服务已登记 A，使用仅属于本例的可控阻塞点，在认证后业务执行前暂停专用请求。"
    steps:
      - "暂停 A 的已认证请求后提交 revoke，再恢复该请求；允许其完成，确认不会因此恢复 token。"
      - "在撤销提交后发起 A 的新请求；确认 401，移除本例阻塞点。"
