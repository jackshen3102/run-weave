version: 1
name: 随记 M1 独立部署与恢复
description: >
  待实现运维入口的验收合同。仅在专用部署、数据库、持久卷和异机备份目标上执行；
  使用不可变版本产物及真实迁移与文件，不使用空报告证明恢复。
  每条独立准备数据和故障条件；缺少目标事实时记录阻塞，禁止猜测或覆盖生产。

cases:
  - id: SUIJIDEP-001
    name: 干净环境可用独立产物完成首次启动
    required: true
    description: >
      服务只依赖其声明的配置、数据库与附件卷，不依赖仓库源码、桌面或本机终端运行时。
    preconditions:
      - 本例使用空专用 PostgreSQL 数据库、独立附件卷、完整 dev 部署配置和新构建的不可变镜像。
      - 运行目标没有挂载仓库源码，没有 Runweave Backend、App Server 或 Electron 进程。
    steps:
      - 从该产物执行迁移和唯一账号初始化，再启动 API；确认就绪且可登录读取 info。
      - 用真实 API 创建记录并上传、关联、下载一个附件；确认数据库和文件均存在，读取校验和一致。
      - 检查产物依赖和运行进程；确认没有隐式加载 workspace 源文件或启动本机控制面。

  - id: SUIJIDEP-002
    name: 管理账号操作不会重新生成所有者
    required: true
    description: >
      重复初始化不会覆盖账号或数据，主动重设凭据保留 owner/server 身份并撤销旧会话。
    preconditions:
      - 本例专用部署已初始化并有记录与登录会话，已保存 serverId、ownerId、记录 ID 和版本基线。
      - 管理命令从受保护 stdin 接收凭据，不使用命令行密码参数。
    steps:
      - 再次执行 auth:init；确认明确保持已有初始化结果，身份和数据不变，不能悄悄更换密码。
      - 使用明确的管理员重设入口更改账号凭据；确认旧会话失效，新凭据可登录。
      - 读取基线记录；确认 ownerId/serverId、ID 与内容均未变化，操作输出没有密码或 token。

  - id: SUIJIDEP-003
    name: API 进程重启保持持久身份与已提交内容
    required: true
    description: >
      以独立的 API 进程生命周期验证数据、会话和幂等结果不依赖内存。
    preconditions:
      - 本例专用部署已有记录、附件、修订和成功创建键，已记录身份、版本及下载校验和。
      - 登录会话在本例期间未过期，可只重启本例 API，不重启数据库或删除卷。
    steps:
      - 记录旧 API 进程身份并正常停止，再以同版产物和同配置启动新进程；确认新进程就绪。
      - 使用原有效会话读取 info、记录和附件；确认身份、版本与文件校验和一致。
      - 原键原请求重放成功创建；确认仍返回原 ID，没有重复记录，保存新进程及持久化证据。

  - id: SUIJIDEP-004
    name: 兼容迁移升级保持旧数据且重复执行无副作用
    required: true
    description: >
      从明确的旧 schema 升级到下一版本，记录迁移历史与摘要，重复执行不重建或丢失数据。
    preconditions:
      - 本例专用部署运行已知旧镜像和 schema，已有记录、状态、附件、修订及幂等结果基线。
      - 新镜像有一个可审查的兼容追加迁移，部署配置和备份位置完整，允许短暂停写。
    steps:
      - 按发布入口部署新不可变镜像；确认先有有效备份，迁移成功后才切换 API，就绪版本与目标一致。
      - 读取全部基线并下载附件；确认身份、ID、版本、状态、历史引用和文件校验和保持。
      - 再执行同版本迁移；确认没有新的 schema/data 副作用，迁移成功记录和摘要各只有一次。

  - id: SUIJIDEP-005
    name: 迁移失败时停止发布并保留旧服务
    required: true
    description: >
      失败迁移不留下半个 schema，也不继续替换 API 或执行破坏性的自动 down。
    preconditions:
      - 本例专用部署运行旧镜像和已知基线，迁移启用事务，已有可用备份。
      - 本例新产物含一个仅用于隔离验收的追加迁移，在事务中先改 schema 再触发确定失败。
    steps:
      - 通过发布入口尝试升级；确认非零退出并明确失败阶段，没有将新 API 当成成功上线。
      - 核对 schema、迁移历史和摘要；确认本次迁移整体回滚，旧版 API 恢复或保持可用，原数据可读。
      - 检查发布日志和卷；确认未自动 down、删除数据或删除旧产物，本例失败夹具不进入正式迁移集合。

  - id: SUIJIDEP-006
    name: 并发迁移由数据库锁串行化
    required: true
    description: >
      两个迁移进程不能重复执行同一迁移或留下不一致的历史与摘要。
    preconditions:
      - 本例独立数据库位于升级前 schema，准备一个可受控延迟的追加迁移与两个独立迁移进程。
      - 本例可以安全终止和回收两个迁移进程，不影响其他环境。
    steps:
      - 同时启动两个迁移进程并观察重叠窗口；确认一个持有数据库迁移锁，另一个等待或明确退出。
      - 让持锁进程完成，再按需重试另一进程；确认只执行一次迁移，schema、成功历史和摘要一致，没有永久锁。

  - id: SUIJIDEP-007
    name: 已执行迁移被修改后发布预检拒绝继续
    required: true
    description: >
      自定义摘要校验能发现历史文件被改写，不假设迁移工具自动具备此能力。
    preconditions:
      - 本例专用数据库已应用一条迁移并保存其成功摘要，原产物和数据有基线。
      - 本例复制产物并只修改该已执行迁移的内容，绝不修改用户工作区或正式发布文件。
    steps:
      - 用修改后的隔离产物执行迁移或发布；确认在执行新 SQL 或换版前拒绝，并指明发生漂移的迁移。
      - 核对数据库和当前服务；确认成功摘要、schema 和数据不变，原服务仍可读取。

  - id: SUIJIDEP-008
    name: 一致备份可以恢复到隔离空目标并读回附件
    required: true
    description: >
      恢复同时证明数据库和不可变附件可用；备份有异机副本，不能只凭 dump 文件存在判定成功。
    preconditions:
      - 本例源部署有记录、修订、当前与历史附件和成功幂等结果，已保存数据及文件校验和基线。
      - 配置提供明确的异机备份位置、允许暂停窗口、RPO/RTO，以及本例独占的空恢复数据库和空附件目录。
      - 源部署与恢复目标身份、地址和路径已分别记录，执行者确认不覆盖生产或源数据。
    steps:
      - 执行备份；确认阻止新写入并等待在途上传/写操作完成，DB dump 与附件归档来自同一静止窗口，完成后源 API 恢复同版运行。
      - 核对异机副本的清单、schema/应用版本和文件摘要；确认复制确实完成后才报告备份成功。
      - 只向隔离空目标恢复并启动匹配产物；通过新目标 API 读回记录、修订对应数据和附件，确认身份、ID、状态及校验和与基线一致。
      - 原键原请求在恢复目标重放；确认没有重复记录；记录实测恢复耗时并对照声明的 RPO/RTO，源部署内容未被覆盖。

  - id: SUIJIDEP-009
    name: 缺少部署事实或目标非空时拒绝危险操作
    required: true
    description: >
      发布入口必须在变更前验证实际目标和必填配置，不默认猜测生产或覆盖已有恢复目标。
    preconditions:
      - 本例准备缺少目标主机、备份位置或 TLS 字段的配置副本，以及一个有明确哨兵数据的隔离非空恢复目标。
      - 实际可用配置和生产文件保持原样，执行者能比较本例目标的前后数据与进程基线。
    steps:
      - 用缺项配置请求发布；确认只输出缺失字段名并停止，没有远端变更、迁移或秘密回显。
      - 对非空目标请求恢复；确认在覆盖前拒绝，哨兵数据、附件和运行版本全部保持。
