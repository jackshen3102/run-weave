version: 1
name: 随记最多两个标签
description: >
  每条记录允许零至两个标签，桌面与 iOS 能编辑、识别和筛选。
  每例自行准备独立测试数据，运行地址、凭据和设备由执行上下文提供，不使用个人数据。
  格式校验不代表行为通过。
cases:
  - id: SUIJITAG-001
    name: 服务端校验标签数量和名称
    required: true
    description: 创建和编辑共用相同约束，非法输入不改变记录。
    preconditions:
      - 隔离服务已完成标签迁移，可通过认证 HTTP 创建、编辑及读取本例记录。
    steps:
      - 分别创建零、一个和两个标签的记录；确认读回数量及名称正确，名称首尾空白被去除。
      - 分别向创建和编辑接口提交三个标签、去空白后重复的标签、空白名称和二十一个字符的名称；确认返回明确的 4xx 校验错误，未产生新记录或改变已有版本。
      - 提交二十个字符的名称；确认成功，读取结果完整。

  - id: SUIJITAG-002
    name: 旧数据和省略标签的请求保持兼容
    required: true
    description: 迁移保留原记录，旧客户端修改正文不会清除标签。
    preconditions:
      - 本例拥有迁移前的隔离数据库及服务，已建立含正文和附件的旧记录并记下内容与 ID。
    steps:
      - 停止本例服务、执行新增迁移并启动新服务，重新确认端点；读取旧 ID，确认正文和附件不变且 tags 为空数组。
      - 使用省略 tags 的创建请求保存记录；确认正常保存且标签为空。
      - 为本例记录添加两个标签，再以当前版本提交省略 tags 的正文编辑；确认正文更新且标签保留。
      - 以当前版本提交 tags 为空数组；确认标签清空，正文和附件仍保留。

  - id: SUIJITAG-003
    name: 桌面能选择并完整展示最多两个标签
    required: true
    description: 编辑器支持添加、移除和替换，卡片及详情与保存结果一致。
    preconditions:
      - Electron 测试窗口可附着，终端随记抽屉已登录隔离服务，本例已有一个可复用标签。
    steps:
      - 使用 $toolkit:playwright-cli 在抽屉创建记录，选择已有标签并输入一个新名称；确认两个标签均被选中。
      - 尝试添加第三个；确认被阻止且提示最多两个，移除一个后可换成另一标签。
      - 保存后查看卡片和详情；确认完整显示两个最终标签，重新编辑清空并保存后不再显示标签。

  - id: SUIJITAG-004
    name: iOS 能选择并完整展示最多两个标签
    required: true
    description: 原生编辑与展示遵守同一数量限制。
    preconditions:
      - 测试 App 已安装到分配的模拟器或真机并登录隔离服务，本例已有一个可复用标签。
    steps:
      - 使用 $toolkit:agent-device 创建记录，选择已有标签并创建一个新名称；确认两个标签均被选中。
      - 尝试添加第三个；确认提示最多两个，移除后可以替换。
      - 保存并打开卡片及详情；确认完整显示两个最终标签，重新编辑清空并保存后不再显示标签。

  - id: SUIJITAG-005
    name: 桌面标签筛选覆盖分页且可叠加条件
    required: true
    description: 标签筛选查询全部服务端记录，切换或取消不会混入旧结果。
    preconditions:
      - Electron 随记抽屉已登录隔离服务；本例准备超过一页的记录、至少六种标签，以及同标签下不同类型和关键词的记录，已记录各组合预期 ID。
      - 至少一个目标标签仅存在于初始列表尚未加载的记录。
    steps:
      - 使用 $toolkit:playwright-cli 打开更多标签并搜索目标标签；确认能找到并选择，结果仅为该标签对应记录。
      - 切换到拥有超过一页记录的标签，叠加类型及正文关键词并加载更多；确认 ID 与预期交集一致，无重复或遗漏。
      - 点击卡片上的另一标签，再次点击已选筛选标签取消；确认旧分页被清空，取消仅去掉标签条件。

  - id: SUIJITAG-006
    name: iOS 标签筛选覆盖分页且可叠加条件
    required: true
    description: 原生筛选结果遵守标签、类型及关键词的交集。
    preconditions:
      - 测试 App 已登录隔离服务；本例独立准备超过一页的记录、六种标签及类型和关键词组合，记录各组合预期 ID。
      - 一个目标标签仅出现在初始列表尚未加载的记录。
    steps:
      - 使用 $toolkit:agent-device 在更多标签中搜索并选择目标；确认找到对应历史记录。
      - 选择拥有超过一页记录的标签，叠加类型和关键词后加载更多；确认预期 ID 无遗漏、重复或无关记录。
      - 从卡片点击另一标签，再取消标签筛选；确认旧结果不残留，其他条件仍生效。

  - id: SUIJITAG-007
    name: 标签修改能跨端读回
    required: true
    description: 桌面和手机读到同一条记录的最新标签，无需实时推送。
    preconditions:
      - Electron 抽屉与测试 iOS App 已登录同一隔离服务和账号，本例独占一条测试记录。
    steps:
      - 使用 $toolkit:playwright-cli 为记录保存两个标签；使用 $toolkit:agent-device 主动重新读取并打开同一 ID，确认标签一致。
      - 在 iOS 将其中一个标签替换并保存；在桌面重新读取同一 ID，确认替换结果一致，正文未改变。

  - id: SUIJITAG-008
    name: 桌面标签草稿刷新后恢复且不自动上传
    required: true
    description: 标签随本机草稿恢复，只有明确保存才写入服务。
    preconditions:
      - Electron 抽屉已登录隔离服务，本例独占新建编辑器，可观察网络请求及服务记录。
    steps:
      - 使用 $toolkit:playwright-cli 输入唯一正文并选两个标签，等待本机草稿落盘后刷新页面并重新取得页面引用。
      - 重新打开编辑器；确认正文和标签恢复，期间没有记录写请求，服务没有该正文记录。
      - 点击保存；确认服务只新增一条记录且含两个标签。

  - id: SUIJITAG-009
    name: iOS 标签草稿重启后恢复且不自动上传
    required: true
    description: 原生草稿恢复保留标签，重启不会补发业务写入。
    preconditions:
      - 测试 App 已登录隔离服务，本例独占新建草稿，可查询测试服务记录。
    steps:
      - 使用 $toolkit:agent-device 输入唯一正文并选两个标签，等待本机落盘，然后结束并重启本例 App，重新取得设备 UI 状态。
      - 打开编辑器；确认正文和标签恢复，服务尚无该正文记录。
      - 点击保存；确认服务只新增一条记录且含两个标签。

  - id: SUIJITAG-010
    name: 标签目录仅汇总当前用户有效记录
    required: true
    description: 标签目录与记录分页无关，不暴露其他用户或仅在回收站使用的标签。
    preconditions:
      - 两套独立测试服务各有一个 owner 和独有标签；当前测试 owner 另有仅存在于回收站记录的标签。随记每个服务实例只有一个 owner。
    steps:
      - 分别用各服务的身份调用其标签目录；确认只返回各自有效记录的去重标签，回收站专属标签不出现；跨服务使用另一身份的 token 必须被拒绝。
      - 为当前 owner 新增使用已有标签的记录并再次查询；确认不产生重复项，最近使用的标签排在前面。
      - 将当前 owner 某标签的最后一条有效记录移入回收站后重查；确认该标签消失，恢复记录后重新出现。
