version: 1
name: 随记 iOS 共享浏览器接入与宿主隔离
description: >
  这是行为验收合同，不代表所有用例已经通过。验证随记通过独立共享 Swift 浏览器打开正文链接，并保持随记业务现场与宿主边界。
  每例独立准备候选安装、测试身份和受控 HTTPS 页面，使用 $toolkit:agent-device 操作真实原生 UI；
  固定 XCTest 按包入口执行。记录 Bundle ID、源码版本、设备、控件树、截图及必要脱敏请求摘要。
  配套页面预检可用 $toolkit:playwright-cli，但不能替代 WKWebView 证据；缺所需 fixture 或设备记 blocked。
  清理只针对本例测试资源，不操作用户真实记录或网站身份。共享导航与 Runweave 回归范围另见配套实施计划。
cases:
  - id: SUIBROWSER-001
    name: 列表链接打开内置页面且不触发卡片详情
    required: true
    description: 列表正文的链接只产生一次内置导航，普通区域仍能打开详情，原文和业务记录不变。
    preconditions:
      - 候选随记已登录专用测试服务，列表有包含中文标点与带 query、fragment 的完整 HTTPS 链接的专用记录。
      - 受控页面提供可读请求计数与实际地址，执行者已记录该记录正文和版本的只读快照。
    steps:
      - 使用 $toolkit:agent-device 点击正文链接；确认呈现随记内置浏览器，主文档初次加载一次，完整目标未被中文标点污染，没有跳到系统浏览器。
      - 点击回随记；确认仍在原列表而非记录详情，点击同一卡片非链接区域才进入详情。
      - 从测试服务只读核对正文、记录版本和业务写请求；确认没有因打开链接改写正文或提交状态。
  - id: SUIBROWSER-002
    name: 详情链接与文字选择各自生效
    required: true
    description: 详情中明确点击链接进入内置浏览器，文字选择复制不意外导航，返回保持原详情位置。
    preconditions:
      - 候选随记已打开本例专用长正文记录的详情，正文含可达受控 HTTPS 链接与无敏感的可复制文本。
      - 已记录详情滚动位置，本机有用于核对剪贴板的测试文本区域。
    steps:
      - 使用 $toolkit:agent-device 长按选择普通文字并复制；确认选区可调整、剪贴板文本准确且未打开网页。
      - 明确点击正文链接；确认只出现内置网页，不出现系统浏览器或重复呈现。
      - 点击回随记；确认仍为同一记录详情，原阅读位置保留，没有回到首页或新建编辑器。
  - id: SUIBROWSER-003
    name: 同账户收起与恢复保留唯一网页会话
    required: true
    description: 收起、继续浏览与重新点击相同完整 URL 复用同一页面，列表刷新和同账户导航不销毁它。
    preconditions:
      - 候选随记的本例账户列表中有受控表单页面链接；页面显示加载计数且不会自动刷新。
      - 浏览器已从该链接打开，网页已填写唯一未提交文本并滚动到可识别位置。
    steps:
      - 使用 $toolkit:agent-device 回随记，执行列表刷新和同账户 Tab 切换；确认没有自动弹出网页。
      - 点击继续浏览；确认表单、滚动与加载计数保持，不出现第二个网页会话。
      - 再次收起并点击原记录中相同完整 URL；确认直接恢复，不提示替换、不增加加载次数。
  - id: SUIBROWSER-004
    name: 不同目标经确认替换旧会话
    required: true
    description: 用户拒绝替换时保留旧页，明确确认后新页不继承旧会话历史。
    preconditions:
      - 本例账户有两个只在 query 上不同的受控页面 A、B 链接，A 已打开并填写未提交文本后收起。
      - A 曾导航形成后退历史，B 显示独立标题，两个目标都可达。
    steps:
      - 使用 $toolkit:agent-device 点击 B，取消替换确认，再继续浏览；确认仍是 A，未提交文本不变。
      - 回随记再次点击 B 并确认替换；确认出现 B，后退不能回到旧 A，会话恢复入口只有一个。
  - id: SUIBROWSER-005
    name: 关闭网页释放页面但保留网站登录
    required: true
    description: 明确关闭移除恢复入口并卸载页面，再开产生新页面而持久网站 Cookie 保留。
    preconditions:
      - 独占候选随记通过本例受控站点真实登录，站点有有效持久 Cookie、页面加载编号与周期请求记录。
      - 网页已填写未提交文本，随记存在独立的已落盘未提交草稿。
    steps:
      - 使用 $toolkit:agent-device 选择关闭网页并确认；确认回到随记且恢复入口消失，旧页面编号停止周期请求。
      - 显式重开相同链接；确认获得新页面编号和空表单，站点服务端仍认定同一个网站登录身份。
      - 回随记打开本例草稿；确认内容保留，未触发业务保存。
  - id: SUIBROWSER-006
    name: 环境切换阻断旧页面与迟到事件
    required: true
    description: 正式与开发环境切换建立新来源代次，旧页面不能覆盖新环境的 UI 或触发外部动作。
    preconditions:
      - 独占候选随记的正式和开发都指向专用测试身份，记录标题与受控网站页面明显不同。
      - 正式页面可保持延迟响应；开发页面可立即成功，两个 fixture 的请求可分别识别。
    steps:
      - 使用 $toolkit:agent-device 在正式环境打开延迟页面并收起，切到开发环境，再显式打开开发记录的网页。
      - 释放正式页面的延迟响应；确认仍显示开发页面，没有旧标题、错误、授权提示或外部 App 跳转。
      - 回到正式环境；确认没有自动恢复旧网页或旧提示，必须重新主动点击链接。
  - id: SUIBROWSER-007
    name: 登出使浏览器失效且重新登录不复活
    required: true
    description: 登出同步失效旧网页，与是否保留网站 Cookie 无关，重新登录不恢复旧页面运行时。
    preconditions:
      - 独占候选随记已登录本例专用账户，受控网页已打开、填写表单并收起。
      - 该账户已有可识别的持久草稿，执行者有本例登录权限。
    steps:
      - 使用 $toolkit:agent-device 登出当前随记账户；确认登录界面没有继续浏览入口，也不继续呈现旧网页提示。
      - 重新登录同一账户；确认不自动访问旧网页，继续浏览入口仍不存在。
      - 打开既有草稿；确认随记草稿未因浏览器失效被清除，再主动点击原链接只得到新页面。
  - id: SUIBROWSER-008
    name: 身份过期遵守统一浏览器失效边界
    required: true
    description: 服务端拒绝当前随记身份并触发连接重置后，不保留可恢复的旧网页运行时。
    preconditions:
      - 本例独占随记账户有已收起网页及持久草稿，服务端能只撤销本例会话及其认证恢复能力。
      - 撤销后下一次列表请求会真实返回 UNAUTHENTICATED，而不是成功自动刷新身份。
    steps:
      - 撤销本例认证并使用 $toolkit:agent-device 触发列表读取；确认进入身份失效状态且网页恢复入口消失。
      - 等待旧网页预设延迟事件；确认没有重新呈现旧网页、旧提示或外部动作。
      - 重新认证并检查本例草稿；确认保留业务草稿但没有自动恢复旧网页。
  - id: SUIBROWSER-009
    name: 冲突呈现期间不穿透打开或排队重放
    required: true
    description: 随记编辑与系统媒体选择拥有当前呈现时，底层链接和恢复入口不可抢占；取消后不自动打开网页。
    preconditions:
      - 候选随记本例账户已有收起网页与未提交编辑草稿，设备可操作照片选择器。
      - 列表底层有可达网页链接，执行者已记录草稿内容和网站加载计数。
    steps:
      - 使用 $toolkit:agent-device 打开编辑器，再打开系统照片选择器；确认底层链接和继续浏览不可穿透操作，浏览器没有覆盖当前界面。
      - 取消系统选择并收起编辑器；确认草稿保留且网页没有自动出现，加载计数没有新增。
      - 主动点击继续浏览；确认此时才恢复旧网页。
  - id: SUIBROWSER-010
    name: 清除网站数据只影响当前 App 的网站存储
    required: true
    description: 取消清除不改变数据，确认清除卸载网页并清除网站 Cookie/存储，但保留随记账户和草稿。
    preconditions:
      - 独占候选随记有专用业务账户和已落盘草稿；受控网站已登录并写入可读取的 Cookie 与 localStorage 标记。
      - 页面发送带唯一编号的周期请求，网站身份与业务身份分别可只读核对。
    steps:
      - 使用 $toolkit:agent-device 发起清除后取消；确认原网站仍登录、页面现场保持，确认文案说明影响此 App 全部内置网站。
      - 再次清除并确认；确认网页关闭且恢复入口消失，完成提示出现后旧页面不再发送周期请求。
      - 主动重开站点；确认网站要求重新登录且存储标记不存在，随记账户仍可读记录、既有草稿内容不变。
  - id: SUIBROWSER-011
    name: 两个 App 共享实现但网站身份互不串用
    required: true
    description: 同设备两个独立候选 App 的网站 Cookie 各自持有，共享代码不共享登录身份。
    preconditions:
      - 同一独占设备安装了当前源码构建的 Runweave 和随记，Bundle ID 分别为 com.runweave.app.native 与 com.runweave.suiji。
      - 受控 HTTPS 网站有独立测试用户 A、B，两个 App 初始网站数据独立且可通过正式入口打开网站。
    steps:
      - 使用 $toolkit:agent-device 在 Runweave 内置页登录网站 A，在随记内置页访问相同站点；确认随记没有自动获得 A。
      - 在随记内置页登录网站 B，再切回 Runweave 并刷新身份页；确认 Runweave 仍为 A。
      - 再刷新随记身份页；确认仍为 B，两个 App 都没有将业务账户代替网站身份。
  - id: SUIBROWSER-012
    name: 随记业务身份不被授予网页
    required: true
    description: 主请求、子请求、跨域重定向和脚本不能获得随记认证或记录写入能力。
    preconditions:
      - 候选随记已登录本例专用服务；凭据仅在本例受保护环境中用于比较，不输出原文。
      - 两个受控 HTTPS origin 提供请求记录与无破坏的原生桥探测页面，随记服务可读取业务写请求记录。
    steps:
      - 使用 $toolkit:agent-device 从随记正文打开第一站点，加载子资源并导航到第二站点；本地比对确认未携带随记 Bearer、Keychain 凭据、正文或记录 token。
      - 在页面点击无害探测动作，尝试访问认证、记录写入和终端原生桥；确认没有宿主授予的接口，随记服务没有对应写请求。
      - 保存脱敏的比较结果与原生页面证据，确认报告没有输出真实凭据或敏感 query。
  - id: SUIBROWSER-013
    name: 飞书白名单跳转经原生确认后返回随记原页
    required: true
    description: 现有飞书或 Lark 授权交接能力在随记使用相同策略，必须明确确认，提示使用随记名称且保留原网页。
    preconditions:
      - 授权真机装有与测试目标匹配的飞书或 Lark 客户端，当前候选随记可操作，fixture 使用现有白名单中安全的只读 AppLink。
      - 受控 HTTPS 页面可从子 frame 请求该 AppLink，页面已有未提交表单；本例不执行业务写操作或真实授权提交。
    steps:
      - 使用 $toolkit:agent-device 打开 fixture 并触发 AppLink；确认先出现宿主原生确认、显示真实来源，未自动切到外部 App，文案指向返回随记。
      - 取消确认；确认原页表单保留。再次触发并明确确认，确认系统实际打开匹配客户端。
      - 通过系统切回随记并取得新控件树；确认原网页仍可继续，表单与来源未被替换。本例通过仅证明客户端交接，不宣称真实业务 SSO 完成。
  - id: SUIBROWSER-014
    name: 非白名单外部协议不能借共享配置打开 App
    required: true
    description: 非白名单 scheme 与伪造飞书域名被拒绝，不能因接入随记而扩大允许范围。
    preconditions:
      - 候选随记已打开本例受控 HTTPS 页面，页面含未知 scheme、mailto、tel 和仿冒 applink 域名的非白名单 scheme 链接。
      - 所有目标无真实拨号、发信或业务写副作用，fixture 可分别触发普通链接和子 frame 导航。
    steps:
      - 使用 $toolkit:agent-device 逐项触发这些非白名单目标；确认显示拒绝或不支持提示，没有外部 App 被自动启动。
      - 检查页面仍在随记内，原表单可继续操作，没有因拒绝跳转而误清网页或业务数据。
  - id: SUIBROWSER-015
    name: 后台转换使待确认外部动作失效
    required: true
    description: 旧原生授权提示不能在 App 已离开前台后继续确认；重新进入前台不会自动重放。
    preconditions:
      - 授权设备的候选随记已从受控 HTTPS 页面触发飞书白名单原生确认，但尚未确认。
      - 系统允许安全切到另一 App，页面已有可识别的表单内容，后台期间不会终止进程。
    steps:
      - 使用 $toolkit:agent-device 将随记置于后台，再返回并获取新的原生控件树；确认旧确认已取消，未自动切到飞书。
      - 检查原网页表单保持；只有重新从网页触发后才能出现新的原生确认，不复用旧提示执行外部动作。
  - id: SUIBROWSER-016
    name: 冷启动只恢复业务状态而不恢复网页运行时
    required: true
    description: 同一次真实进程重启中保留持久业务草稿和网站 Cookie，但不自动重开网页或恢复未提交网页表单。
    preconditions:
      - 独占候选随记有已落盘业务草稿，受控网站已登录并设置有效持久 Cookie，网页有未提交文本与请求计数。
      - 执行者有权限终止本例 App 进程，网站和业务服务均保持可用。
    steps:
      - 使用 $toolkit:agent-device 保存重启前原生与请求证据，真实终止并重启随记，重新取得进程身份和控件树。
      - 确认业务账户与草稿保持，但没有继续浏览入口或自动网站请求。
      - 主动点击原链接；确认新页面未恢复旧表单，网站服务端仍识别原持久登录身份。
  - id: SUIBROWSER-017
    name: 网站加载失败不丢失随记来源现场
    required: true
    description: 主文档加载失败显示可操作错误，重试成功后仍能返回原随记详情。
    preconditions:
      - 候选随记位于本例专用记录详情；受控 HTTPS 主页面可由本例开关暂时不可达，不影响随记服务。
      - 已记录详情与滚动位置，失败目标包含可识别 query。
    steps:
      - 使主页面不可达并使用 $toolkit:agent-device 点击详情链接；确认在内置页显示加载失败和重试入口，链接菜单仍能识别失败目标。
      - 恢复站点并点击重试；确认加载正确页面，无需重新登录随记。
      - 回随记；确认仍在原详情与阅读位置，没有额外记录写入。
  - id: SUIBROWSER-018
    name: 原生布局在软件键盘和大字号下可完成返回
    required: true
    description: 随记宿主采用共享浏览器默认 UI 时，网页输入、关闭键盘、菜单和返回控件可见可操作，不覆盖业务编辑。
    preconditions:
      - 候选随记在独占设备上打开本例带输入框的受控 HTTPS 页面，执行者已记录原辅助功能字号设置。
      - 本例允许临时调整到最大辅助功能字号，软件键盘可用。
    steps:
      - 使用 $toolkit:agent-device 设置最大辅助功能字号并在网页输入文字；检查原生截图及控件树，确认标题可截断但返回、更多和导航操作没有不可点击的遮挡。
      - 收起键盘，打开并关闭更多菜单，再回随记；确认原列表或详情可交互，没有意外打开业务编辑器。
      - 恢复本例开始前的字号设置，保存恢复结果。
