version: 1
name: 随记 M1 原生记录与草稿
description: >
  待实现的 Swift App 验收合同。通过真实 Simulator 或 iPhone 交互与独立服务的数据取证，
  不用 HTML 原型、静态截图或构建成功代替功能通过。每条使用独立样例、草稿和必要的隔离服务；
  设备、服务地址和脱敏账号由执行上下文提供。仅操作本例拥有的进程、故障代理和数据。

cases:
  - id: SUIJIIOS-001
    name: 首页以真实记录列表开始且新增时才进入输入
    required: true
    description: >
      App 提供列表优先的记录入口，筛选反映真实类型和状态，不混入演示数据。
    preconditions:
      - 新 App 已在指定 Simulator 安装并登录真实测试服务，没有本例之外的新建草稿。
      - 本例服务数据包含笔记及三种状态的待办，记录各 ID；原型仅作为视觉参考。
    steps:
      - 打开记录首页；确认没有键盘，卡片为真实服务记录，创建时间倒序且能区分类型与状态。
      - 切换全部、想法、待办筛选；确认显示集合正确，首页重新读取后隐藏已确认 done，待办页默认只看 open。
      - 从记录入口和待办入口分别打开新增；确认才进入编辑，默认类型分别为笔记和待办，没有标题或标签必填项。

  - id: SUIJIIOS-002
    name: 原生输入保存后从云端读回完整正文
    required: true
    description: >
      保存成功对应真实服务提交，中文、空白和 URL 保持原文，搜索使用服务端当前正文。
    preconditions:
      - App 已登录本例隔离服务，输入样例包含前后空格、空行、中文、emoji 和 URL。
      - 本例可以用独立认证 HTTP 读取数据，证据使用专用样例而非个人内容。
    steps:
      - 在原生编辑器输入样例并保存；确认成功后关闭编辑器，列表出现服务器颁发的记录。
      - 打开详情并用独立 HTTP 读取相同 ID；确认正文标量序列一致，没有自动摘要或链接抓取。
      - 从 App 搜索样例中的中文和 URL 片段；确认找到该 ID，清除搜索后恢复记录流。

  - id: SUIJIIOS-003
    name: 编辑已有记录保留身份和待办终态
    required: true
    description: >
      原生编辑对同一条记录提交一次变更，不通过新建替代编辑，也不改变创建时间或状态。
    preconditions:
      - 本例已完成待办有正文与一个附件，App 能读取，已记录 ID、createdAt、状态和 version。
    steps:
      - 从详情编辑正文并保存；确认附件保留，服务器仍是原 ID 和 done，createdAt 不变，version 增一。
      - 返回列表；确认该记录没有因编辑被置顶，正文更新，详情与独立 GET 一致。

  - id: SUIJIIOS-004
    name: 完成可在原记录上撤销且不再做保持终态
    required: true
    description: >
      原生待办操作与服务状态机一致；误完成可恢复原记录，archived 没有撤销入口。
    preconditions:
      - 本例有两个独立 open 待办，App 与服务都可读取。
    steps:
      - 在首页直接完成一个待办；确认不跳详情、提交时不可重复点击，成功后暂留，点击撤销完成恢复原记录，独立 GET 为 open 且身份、正文和附件不变。
      - 再次完成并刷新首页；确认隐藏，在待办的已完成筛选仍可找到；进入详情恢复为未完成，确认回到 open 列表和首页。
      - 在已完成列表对本例再次完成的记录点击撤销完成；确认不跳详情、从该筛选移除，服务仅新增一次状态版本。
      - 对另一个待办操作不再做；确认独立 GET 为 archived，详情和列表均没有恢复 open 或转为 done 的入口。

  - id: SUIJIIOS-005
    name: 再建待办只预填正文并产生独立记录
    required: true
    description: >
      重新考虑旧任务通过新记录表达，不复制附件或修改旧记录。
    preconditions:
      - 本例有一条 archived 待办及附件，记录原 ID、版本和附件 ID；本地没有新建草稿。
    steps:
      - 在旧待办选择再建一个；确认编辑器只预填正文，类型为待办，附件为空。
      - 保存并读取新旧记录；确认新 ID 为 open，旧记录仍 archived 且版本不变，没有复制附件或关联字段。

  - id: SUIJIIOS-006
    name: 系统选择的附件可以保存并安全阅读
    required: true
    description: >
      图片与 Markdown 经 App 自有文件和认证 API 完成闭环，超限不静默丢失或截断。
    preconditions:
      - 本例 Simulator 或真机相册有 HEIC 图片，文件选择器可选择已知内容的 UTF-8 Markdown 与超限文件。
      - App 登录专用服务；执行者知道 info 限额，可检查本例上传文件和脱敏网络记录。
    steps:
      - 在空正文编辑器选择 HEIC 与 Markdown；确认本地预览可用，图片显示转换后的 JPEG 信息，临时源关闭后仍可读。
      - 保存纯附件记录；确认成功，独立 HTTP 能下载完整 JPEG 和原 Markdown，记录附件列表与 App 一致。
      - 在详情打开附件；确认没有公开文件 URL，Markdown 不执行内嵌 HTML 或请求其中的远程图片。
      - 在另一个本例草稿选择超限文件或已占满的附件类型；确认明确反馈，已有内容不被静默覆盖，草稿仍可编辑。

  - id: SUIJIIOS-007
    name: 已确认写入本机的草稿在进程重启后恢复
    required: true
    description: >
      草稿持久化包含正文、类型与复制后的附件，不能只保留内存或系统临时文件引用。
    preconditions:
      - App 已登录专用服务，本例无新建草稿，准备专用正文、图片与 Markdown。
      - 可以终止并重新启动本例 App 进程；服务仍正常，过程中不提交云保存。
    steps:
      - 输入正文并选择附件，等待明确的草稿已保存在本机反馈；记录此时内容与本地附件完成状态。
      - 终止 App 进程并重新启动，重新取得设备 UI 引用后打开新增；确认类型、正文、附件预览全部恢复。
      - 查看服务端数据和请求；确认重启没有自动上传或新建记录，草稿仍标为本机内容。

  - id: SUIJIIOS-008
    name: 保存失败保留草稿且联网后不自动提交
    required: true
    description: >
      网络可用不是写入授权，失败后的上传和记录提交必须由用户再次操作触发。
    preconditions:
      - App 已登录本例服务，新建草稿已在本机确认保存，包含正文和附件。
      - 执行者可仅阻断本例 App 到服务的网络，并观察脱敏写请求计数，不影响其他服务。
    steps:
      - 阻断网络后点保存；确认明确失败或待确认，正文和附件仍在，界面不显示云端已保存。
      - 恢复网络并切后台再回前台，等待正常读取完成；确认没有自动上传或业务 POST/PATCH。
      - 用户手动重试；确认最终只生成一条完整记录，成功后已确认草稿被移除，附件没有重复绑定。

  - id: SUIJIIOS-009
    name: 响应丢失的创建在重启后沿用原操作确认
    required: true
    description: >
      待确认意图和幂等键跨进程保存，服务器已提交的创建不会因用户重试变成第二条记录。
    preconditions:
      - App 使用本例独占的故障代理，代理能在收到创建成功响应后丢弃下行响应。
      - 本例新建草稿已持久化，可读取专用数据库验证真实提交，可重启 App 进程。
    steps:
      - 保存并丢弃成功响应；确认服务器已有记录，App 显示结果待确认，不能直接改写或丢弃该未确认意图。
      - 终止并重新启动 App，移除故障后获取新 UI 引用；确认待确认状态恢复，没有自动发起创建。
      - 手动重试确认；核对请求沿用原键与完整 payload，App 得到原 ID，服务只有一条记录，随后解除待确认状态。
      - 撤销本例代理设置，保存脱敏请求对应关系与数据库数量证据。

  - id: SUIJIIOS-010
    name: 并发编辑冲突保留本地草稿而不覆盖新版本
    required: true
    description: >
      第二客户端提交后，App 的旧编辑必须让用户看到冲突并显式选择后续编辑。
    preconditions:
      - 本例已有记录；App 已进入编辑并保留本地改动，独立认证 HTTP 客户端能修改同一记录。
    steps:
      - 用第二客户端基于当前版本提交不同正文，再从 App 保存旧编辑；确认提示版本冲突，保留本地内容。
      - 读取服务最新记录；确认仍为第二客户端正文，App 没有自动更换 expectedVersion 覆盖。
      - 在 App 查看最新内容并明确选择基于它继续编辑后保存；确认新版本与用户最终输入一致，原冲突草稿没有被静默清除。

  - id: SUIJIIOS-011
    name: 切换连接后旧响应和草稿不能进入新身份
    required: true
    description: >
      端点、serverId、ownerId 共同隔离数据；注销后私有内容不可见，同身份重新登录才能恢复草稿。
    preconditions:
      - 本例有两个独立测试部署 A 和 B，拥有不同 serverId，App 最初登录 A 且有 A 的持久草稿。
      - 可延迟 A 的一个读取响应；B 中有可区分记录，所有凭据只在执行环境提供。
    steps:
      - 延迟 A 的读取后切地址并登录 B，再释放旧响应；确认列表、凭据和草稿保持 B 的作用域，不出现 A 的内容。
      - 退出 B；确认私有页面和缓存附件不能继续浏览，也不提交任何草稿。
      - 切回 A 并验证原身份；确认 A 草稿恢复，期间 B 没有收到它的上传或记录请求。

  - id: SUIJIIOS-012
    name: 收起和放弃草稿有不同的本地结果
    required: true
    description: >
      普通收起保留输入，明确放弃只清本机草稿，不删除服务器记录。
    preconditions:
      - 本例有一条已保存记录，进入其编辑器后产生已持久化的本地改动，没有在途或待确认写入。
    steps:
      - 收起并重新打开编辑器；确认本地修改恢复，服务器版本尚未改变。
      - 选择放弃草稿，先取消确认；确认草稿仍在；再次操作并确认后，重新进入看到服务器原文。
      - 独立 GET 原记录；确认 ID、版本、正文与附件均未删除或改变。

  - id: SUIJIIOS-013
    name: 竖屏键盘出现后仍能完整编辑和保存
    required: true
    description: >
      在主用 iPhone 尺寸上验证真实焦点和安全区，不能用无键盘截图代替可操作性。
    preconditions:
      - 指定主用 iPhone Simulator 或真机已安装 App，竖屏、默认字号，使用屏幕键盘而非仅硬件键盘。
      - App 登录本例服务且无未确认操作。
    steps:
      - 打开新增，输入多段中文及长 URL，并在末尾修改；确认光标可见，正文可滚动，保存与关闭操作可触达。
      - 收起再唤起键盘并完成保存；确认 sheet、安全区和底部入口不遮挡操作，服务记录与最终输入一致。

  - id: SUIJIIOS-014
    name: 大字号下仍能辨认状态并完成主要操作
    required: true
    description: >
      语义字体和可访问标签保留记录阅读与操作能力，状态不能仅由颜色表达。
    preconditions:
      - 本例设备设置为一个明确记录的辅助功能大字号档位，App 有三种状态的专用待办样例。
      - 本例结束时能够恢复设备原字号设置。
    steps:
      - 查看记录、筛选与详情；确认正文可滚动阅读，状态有文字或可访问名称，主要按钮没有被截断到不可操作。
      - 使用该字号完成一次新增与读取；确认操作可完成，记录与输入一致，然后恢复原字号设置。

  - id: SUIJIIOS-015
    name: 真机能独立于本地 Runweave 节点保存查询
    required: true
    description: >
      云服务独立性以真实网络闭环验证，本地 Mac 或节点不可用不影响手机的在线功能。
    preconditions:
      - 已有合法签名的真机 App 和专用云部署，执行上下文提供 HTTPS 地址与账号。
      - 本例真机使用蜂窝或另一独立网络，本地 Runweave 节点已不可达；不停止他人拥有的运行进程。
    steps:
      - 核对真机无法连接本地节点但能访问随记云服务；在 App 新建带专用正文的记录。
      - 从 App 搜索并读取该记录，再通过独立云 API 读取同一 ID；确认保存与查询均不经过 Mac Backend 或 App Server。

  - id: SUIJIIOS-016
    name: AI 入口显示服务真实能力
    required: true
    description: 服务未启用 AI 时明确不可用，启用后进入真实回顾界面；不得演示回答。
    preconditions:
      - Simulator 安装当前 App，可连接归属明确的独立测试服务。
    steps:
      - 使用原生自动化打开 AI 页面；服务 info 的 AI 能力关闭时确认没有可发送的假输入框。
      - 连接启用已登录 Codex CLI 的本机服务并重新登录，进入 AI 页面；确认显示实际输入和范围选择，未主动发问时没有模型调用。

  - id: SUIJIIOS-017
    name: 状态提交结果未知时不发起第二个冲突操作
    required: true
    description: >
      待办状态写入与正文保存一样遵守幂等和手动确认，不能把超时当成尚未完成。
    preconditions:
      - 本例已有 open 待办，App 使用独占故障代理，可在状态提交成功后丢弃响应。
      - 可用独立 API 核对本例状态和版本，结束时撤销故障规则。
    steps:
      - 操作完成并丢弃成功响应；确认服务已为 done，App 显示待确认并阻止该记录另一个写操作。
      - 恢复网络并回到前台；确认没有自动状态请求；手动重试确认，核对使用原键、原目标和原 expectedVersion。
      - 确认 App 接受原成功结果，版本只增加一次，没有意外恢复 open 或错误的新归档请求；撤销本例代理规则。
