<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="510" viewBox="0 0 1260 510" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">手机经 Devbox 中转控制家中 Mac 的本地 Agent</title><desc id="diagram-desc">Mac 主动向 Devbox 建立反向 SSH 隧道。手机访问 Devbox 内网端口15443，经15444反向端口回到 Mac15445网关，再到5001 Backend和tmux中的Pi Agent。结果沿原链路返回。</desc>
<style><![CDATA[
:root{color-scheme:light;--ink:#162f3d;--muted:#5a7180;--teal:#007d79;--orange:#b4631b;--purple:#7254b3;--line:#d6e1e6}
*{box-sizing:border-box}body{margin:0;background:#f2f5f4;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1360px;margin:auto;padding:36px 38px 28px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700}header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}h1{font-size:38px;line-height:1.25;letter-spacing:-1px;margin:10px 0 12px}header p{margin:0;color:var(--muted);font-size:17px}.stamp{white-space:nowrap;border:1px solid #c5d9d5;border-radius:30px;padding:8px 15px;font-size:12px;color:#476a64;margin-top:8px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 14px}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;color:var(--muted);padding:9px 18px;border-radius:9px;font-size:14px}button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:white}button:focus-visible{outline:3px solid #e0a34f;outline-offset:3px}.board{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px #18393e05}.legend{display:flex;gap:25px;padding:17px 24px 0;font-size:12px;color:var(--muted);flex-wrap:wrap}.legend i{display:inline-block;width:23px;margin-right:7px;vertical-align:middle;border-top:3px solid}.legend .ssh{border-color:var(--orange);border-top-style:dashed}.legend .http{border-color:var(--teal)}.legend .ws{border-color:var(--purple)}svg{display:block;width:100%;height:auto;min-width:780px}.diagram{overflow:auto}svg text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:var(--ink)}.region{fill:#f6f9fa;stroke:#dce5e8}.mac-region{fill:#eef7f4;stroke:#cce1d9}.node{fill:white;stroke:#b5cbd2;stroke-width:1.4}.tag{font-size:11px;letter-spacing:1.2px;fill:#63808d}.region-title{font-size:21px;font-weight:700}.node-title{font-size:17px;font-weight:650}.small{font-size:12px;fill:var(--muted)}.port{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#496477}.tiny{font-size:11px;fill:#71858c}.wire{fill:none;stroke-width:2.5;stroke-linejoin:round}.request{stroke:var(--teal)}.setup{stroke:var(--orange);stroke-dasharray:7 5}.reply{stroke:var(--purple);stroke-dasharray:5 4}.inactive{opacity:.25}.focus-node{stroke:var(--teal);stroke-width:2.5}.route-label{font-size:12px;font-weight:600}.ssh-label{fill:var(--orange)}.request-label{fill:var(--teal)}.reply-label{fill:var(--purple)}.offline-note{display:none}.offline .offline-note{display:block}.offline .phone-link{opacity:.15}.explanation{border-top:1px solid var(--line);padding:20px 25px;display:grid;grid-template-columns:42px 1fr;gap:14px;background:#fbfcfc}.number{width:36px;height:36px;background:#dff0eb;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--teal)}.explanation h2{font-size:19px;line-height:1.4;margin:0 0 5px}.explanation p{margin:0;color:#4c6571;font-size:14px;max-width:1050px}.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:23px;margin:25px 0 19px}.lesson{border-top:2px solid #bbd2ce;padding-top:12px}.lesson b{font-size:16px}.lesson p{margin:5px 0 0;font-size:13px;color:var(--muted)}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;color:var(--teal);font-size:14px;font-weight:600}pre{background:#142e3a;color:#d7f0e9;padding:18px 22px;overflow:auto;border-radius:10px;line-height:1.8;font-size:13px}.ports{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;font-size:13px}.ports b{display:block}.ports span{color:var(--muted)}.evidence{padding:14px 18px;background:#e8f1ed;border-radius:10px;font-size:12px;line-height:1.9;color:#385c53}.evidence strong{font-weight:700}.foot{font-size:11px;color:#74858c;margin-top:12px;display:flex;justify-content:space-between;gap:20px}a{color:var(--teal)}@media(max-width:750px){main{padding:22px 17px}header{display:block}h1{font-size:29px}.stamp{display:inline-block;margin-top:14px}.tabs{gap:6px}.tabs button{padding:8px 11px;font-size:12px}.lessons{grid-template-columns:1fr;gap:15px}.ports{grid-template-columns:1fr 1fr}.foot{display:block}.explanation{padding:17px}.legend{gap:10px;padding:14px 15px 0}.diagram::before{content:'左右滑动查看完整架构 →';display:block;padding:10px 15px 0;font-size:11px;color:#69818b}}@media(prefers-reduced-motion:no-preference){.flowing{stroke-dasharray:9 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-30}}}@media print{body{background:white}main{padding:0}.tabs{display:none}.board{box-shadow:none}details{display:none}svg{min-width:0}.flowing{animation:none}}
]]></style><rect width="1260" height="510" fill="white"/><defs><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007d79"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4631b"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7254b3"/></marker></defs>
<rect class="region" x="25" y="70" width="235" height="410" rx="14"/><rect class="region" x="305" y="70" width="300" height="410" rx="14"/><rect class="mac-region" x="705" y="70" width="530" height="410" rx="14"/>
<text class="tag" x="44" y="32">01 / 随身控制端</text><text class="region-title" x="44" y="59">你的手机</text><text class="tag" x="324" y="32">02 / 可访问的中转站</text><text class="region-title" x="324" y="59">远程 Devbox</text><text class="tag" x="724" y="32">03 / 真正的开发现场</text><text class="region-title" x="724" y="59">家里的 Mac · 无公网 IP</text>
<g id="setup-nodes"><rect class="node" x="325" y="94" width="260" height="71" rx="10"/><text class="node-title" x="345" y="120">SSH 服务端</text><text class="small" x="345" y="145">接收 Mac 主动发起的连接</text><rect class="node" x="725" y="94" width="490" height="71" rx="10"/><text class="node-title" x="747" y="120">Mac 上的 SSH 客户端 · ssh -R</text><text class="small" x="747" y="145">向外建立长连接；launchd 负责退出后的拉起</text></g>
<path id="setup-wire" class="wire setup" d="M725 123 H587" marker-end="url(#arrow-orange)"/><text class="route-label ssh-label" x="603" y="104">主动建连 ←</text>
<rect id="phone-node" class="node" x="45" y="224" width="195" height="101" rx="11"/><text class="node-title" x="63" y="252">Runweave App</text><text class="small" x="63" y="278">登录 Mac 账号 / 输入任务</text><text class="small" x="63" y="302">查看终端 / 读取执行结果</text>
<text class="small" x="45" y="377">外出预期：蜂窝网络 + VPN</text><text class="tiny" x="45" y="398">本次实测：Wi-Fi 下访问中转</text><text class="tiny" x="45" y="417">USB 仅用于手机自动化验收</text>
<rect class="node" x="325" y="224" width="260" height="84" rx="10"/><text class="node-title" x="345" y="250">TCP 中转入口</text><text class="port" x="345" y="277">Devbox 内网 IP :15443</text><text class="tiny" x="345" y="296">Node relay · systemd 管理进程</text>
<rect class="node" x="325" y="369" width="260" height="66" rx="10"/><text class="node-title" x="345" y="395">SSH 反向监听端口</text><text class="port" x="345" y="418">Devbox 127.0.0.1:15444</text>
<rect class="node" x="725" y="224" width="211" height="84" rx="10"/><text class="node-title" x="744" y="250">入口网关</text><text class="port" x="744" y="277">127.0.0.1:15445</text><text class="tiny" x="744" y="296">代理 HTTP / WebSocket</text>
<rect id="backend-node" class="node" x="998" y="224" width="217" height="84" rx="10"/><text class="node-title" x="1016" y="250">Runweave Backend</text><text class="port" x="1016" y="277">127.0.0.1:5001</text><text class="tiny" x="1016" y="296">登录鉴权 / 终端管理</text>
<rect class="node" x="725" y="369" width="211" height="86" rx="10"/><text class="node-title" x="744" y="396">本地项目与工具</text><text class="small" x="744" y="420">代码 / 文件 / 开发环境</text><text class="tiny" x="744" y="441">本轮 Agent 仅做对话验收</text>
<rect id="agent-node" class="node" x="998" y="369" width="217" height="86" rx="10"/><text class="node-title" x="1016" y="396">tmux → Shell → Pi</text><text class="small" x="1016" y="420">Agent 进程运行在 Mac</text><text class="tiny" x="1016" y="441">会话与任务在这里继续</text>
<path class="wire request phone-link" d="M240 252 H323" marker-end="url(#arrow-teal)"/><text class="route-label request-label" x="252" y="236">指令 →</text>
<path class="wire request" d="M455 308 V367" marker-end="url(#arrow-teal)"/><text class="small" x="467" y="342">本机转发</text>
<path class="wire request tunnel-link" d="M585 395 H655 V254 H723" marker-end="url(#arrow-teal)"/><text class="route-label request-label" x="606" y="448">走已有 SSH 隧道</text><text class="tiny" x="608" y="465">请求经加密通道回到 Mac</text>
<path class="wire request" d="M936 252 H996" marker-end="url(#arrow-teal)"/><path class="wire request" d="M1106 308 V367" marker-end="url(#arrow-teal)"/><text class="small" x="1119" y="342">送入终端</text><path class="wire request" d="M998 411 H938" marker-end="url(#arrow-teal)"/>
<path class="wire reply" d="M1089 369 V320 H972 V284 H938" marker-end="url(#arrow-purple)"/><path class="wire reply tunnel-link" d="M725 284 H683 V424 H587" marker-end="url(#arrow-purple)"/><path class="wire reply" d="M430 369 V310" marker-end="url(#arrow-purple)"/><path class="wire reply phone-link" d="M325 291 H242" marker-end="url(#arrow-purple)"/><text class="route-label reply-label" x="251" y="315">← 输出</text>
<text class="small" x="325" y="199">仅中转本次流量；任务不在此执行</text><text class="small" x="725" y="199">公网无需直达 Mac；Mac 能主动连出即可</text>
<g class="offline-note"><circle cx="283" cy="272" r="16" fill="#fff1e8" stroke="#c98447"/><path d="M277 266 L289 278 M289 266 L277 278" stroke="#b4631b" stroke-width="2"/><text class="route-label ssh-label" x="1020" y="355">手机离线，进程继续</text></g>
</svg>