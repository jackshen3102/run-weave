appId: com.runweave.desktop
productName: Runweave
copyright: Copyright © 2024 Runweave contributors

npmRebuild: false
afterPack: scripts/adhoc-sign-mac.js

directories:
  buildResources: resources
  output: release

files:
  - dist/**/*
  - "!dist/companion/**/*"
  - "!dist/backend/**/*"
  - resources/**/*
  - "!resources/icons/raw/**"
  - "!node_modules/**/*"

extraResources:
  - from: dist/cli/node_modules
    to: node_modules
    filter:
      - "**/*"
  - from: dist/companion
    to: companion
    filter:
      - "**/*"
  - from: resources/hooks
    to: runweave-hook-runtime/hooks
    filter:
      - "**/*"
  - from: ../frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  - from: ../backend/node_modules/node-pty
    to: backend/node_modules/node-pty
    filter:
      - "lib/**/*"
      - "prebuilds/darwin-arm64/**/*"
      - "package.json"
      - "LICENSE"
  - from: dist/backend
    to: backend
    filter:
      - "index.cjs"
      - "activity-sqlite-worker.cjs"
      - "evolution-sqlite-worker.cjs"
      - "scheduled-tasks-sqlite-worker.cjs"
      - "activity-sqlite-runtime-manifest.json"
      - "node_modules/**/*"
  - from: .whistle-runtime
    to: whistle-runtime
    filter:
      - "node_modules/**/*"
      - "package.json"
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  identity: null
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
